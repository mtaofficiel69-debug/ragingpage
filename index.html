/* =====================================================================
   DIALOGUE SIMULTANÉ — LA COMMANDE
   ---------------------------------------------------------------------
   Une seule commande, comme dans WriterDuet : on place le curseur dans le
   DEUXIÈME bloc de dialogue (celui qui doit monter à droite) et on
   bascule. Refaire la manœuvre le redescend sous le premier. Rien n'est
   jamais réécrit dans le texte : c'est le drapeau el.dual qu'on pose ou
   qu'on retire, donc l'opération est parfaitement réversible et Ctrl+Z la
   défait comme n'importe quelle autre modification.
===================================================================== */
function toggleDual(){
  if(!S.project) return;
  const line = focusedLine();
  const id = (line && line.dataset.id) || lastFocusedLineId;
  const idx = id ? findIdx(id) : -1;
  if(idx < 0){ toast(L('Place d\u2019abord le curseur dans la réplique concernée.','First place the cursor in the relevant line.')); return; }
  const start = dialogueBlockStart(idx);
  if(start < 0){
    toast(L('Le dialogue simultané s\u2019applique à un bloc de dialogue : place le curseur sur le nom du personnage ou sur sa réplique.','Simultaneous dialogue applies to a dialogue block: place the cursor on the character name or on their line.'));
    return;
  }
  const els = S.project.elements;
  const charEl = els[start];
  // Curseur dans la colonne de GAUCHE d'une paire existante : la commande
  // défait cette paire. Sans ce cas, elle aurait tenté d'accrocher la
  // colonne de gauche au bloc du dessus, et les blocs se seraient empilés
  // en escalier au lieu de revenir à la normale.
  const pair = dualPairRange(start);
  if(pair && !charEl.dual){
    pushUndo();
    delete els[pair.rightStart].dual;
    rebuildEditorAt(id, null);
    scheduleAutosave();
    toast(L('Dialogue simultané retiré : les deux répliques se suivent à nouveau.','Simultaneous dialogue removed: the two lines now follow each other again.'));
    return;
  }
  if(charEl.dual){
    pushUndo();
    delete charEl.dual;
    rebuildEditorAt(id, null);
    scheduleAutosave();
    toast(L('Dialogue remis à la suite de l\u2019autre.','Dialogue put back after the other one.'));
    return;
  }
  const prevStart = start > 0 ? dialogueBlockStart(start - 1) : -1;
  if(prevStart < 0){
    toast(L('Il faut un premier bloc de dialogue juste au-dessus : c\u2019est avec lui que celui-ci sera joué en même temps.','There needs to be a first dialogue block just above: this one will play at the same time as it.'));
    return;
  }
  if(els[prevStart].dual){
    toast(L('Deux colonnes au maximum : ce bloc du dessus est déjà la colonne de droite d\u2019une paire.','Two columns maximum: the block above is already the right-hand column of a pair.'));
    return;
  }
  pushUndo();
  charEl.dual = true;
  rebuildEditorAt(id, null);
  scheduleAutosave();
  toast(L('Dialogue simultané : les deux répliques se jouent en même temps.','Simultaneous dialogue: both lines play at the same time.'));
}
function dualBtnHtml(cls){
  return `<button class="btn ${cls||''}" data-act="toggleDual" title="${L('Dialogue simultané (Ctrl/Cmd+Maj+D) : place les deux répliques côte à côte, comme dans WriterDuet. Curseur dans le deuxième bloc de dialogue.','Simultaneous dialogue (Ctrl/Cmd+Shift+D): places both lines side by side, like in WriterDuet. Cursor in the second dialogue block.')}">${icon('dual')} ${L('Simultané','Simultaneous')}</button>`;
}

/* ---- keyboard behaviour ---- */
function onLineKeydown(e){
  const div = e.target.closest('.line'); if(!div) return;
  const el = findEl(div.dataset.id); if(!el) return;

  // Le menu des extensions est ouvert pour CETTE ligne : il capte ↑/↓,
  // Entrée, Tab et Échap avant tout le reste (sinon Entrée créerait une
  // ligne et Tab changerait le type de la ligne au lieu d'insérer).
  if(S.extMenu && S.extMenu.id === el.id){
    if(e.key === 'ArrowDown'){ e.preventDefault(); moveExtMenu(1); return; }
    if(e.key === 'ArrowUp'){ e.preventDefault(); moveExtMenu(-1); return; }
    if(e.key === 'Enter' || (e.key === 'Tab' && !e.shiftKey)){ e.preventDefault(); acceptExtMenu(); return; }
    if(e.key === 'Escape'){ e.preventDefault(); closeExtMenu(); return; }
  }

  // Une suggestion de complétion (personnage / lieu de scène) est affichée
  // pour CETTE ligne : Tab ou Entrée l'acceptent, avant tout autre
  // traitement de ces touches (le passage « Action → Personnage » habituel
  // pour Tab, et le passage à la ligne suivante pour Entrée, ne doivent pas
  // avoir lieu dans ce cas). Toute autre touche l'annule simplement (elle
  // sera recalculée par updateAutocomplete() si elle s'applique encore).
  if(((e.key==='Tab' && !e.shiftKey) || e.key==='Enter') && S.autocomplete && S.autocomplete.id===el.id){
    e.preventDefault();
    pushUndo();
    el.text = el.text + S.autocomplete.remainder;
    div.textContent = el.text; div.dataset.empty = el.text ? '' : '1';
    hideAutocomplete();
    schedulePaginate();
    focusDiv(div, el.text.length);
    scheduleAutosave();
    return;
  }
  if(S.autocomplete && !['Shift','Control','Alt','Meta','CapsLock'].includes(e.key)){
    hideAutocomplete();
  }

  // (Ctrl/Cmd+number => force type. We read e.code (the physical key)
  // instead of e.key: e.key for a digit depends on keyboard layout (e.g. on
  // French AZERTY, Shift is required just to produce a digit character at
  // all) and, for the separate numeric keypad, on Num Lock state — with Num
  // Lock off, e.key for a numpad digit becomes Home/End/PageUp/etc instead
  // of a digit, which is what let those keystrokes fall through to native
  // browser/editing behaviour. e.code is unaffected by both layout and Num
  // Lock, so we match the physical key from either the top-row digits or
  // the numeric keypad.
  // NOTE: Ctrl/Cmd+1..9 and Ctrl/Cmd+0 are reserved by Chrome/Edge/Safari/
  // Firefox for tab-switching and zoom-reset, and the browser intercepts
  // them before this handler ever runs — no amount of preventDefault() in
  // page JS can override that. In those browsers this shortcut will not
  // fire at all. Left as Ctrl/Cmd+number only, as requested.)
  const digitMatch = /^(?:Digit|Numpad)([0-9])$/.exec(e.code);
  const digit = digitMatch ? digitMatch[1] : null;
  if((e.ctrlKey||e.metaKey) && !e.shiftKey && digit && TYPE_SHORTCUT[digit]){
    e.preventDefault();
    el.type = TYPE_SHORTCUT[digit]; pushUndo(); refreshLineDiv(div, el); renumberScenes();
    showContextPanel(el); scheduleAutosave(); return;
  }
  if((e.ctrlKey||e.metaKey) && !e.shiftKey && digit==='0'){ e.preventDefault(); el.type='text'; pushUndo(); refreshLineDiv(div,el); scheduleAutosave(); return; }

  // Ctrl/Cmd+Maj+D => basculer ce bloc de dialogue en simultané (et retour)
  if((e.ctrlKey||e.metaKey) && e.shiftKey && e.key.toLowerCase()==='d'){
    e.preventDefault();
    toggleDual();
    return;
  }

  // Ctrl/Cmd+Maj+M => ouvrir/modifier le commentaire attaché à cette ligne
  // (fonctionnalité inspirée de WriterDuet, cf. openCommentEditor).
  if((e.ctrlKey||e.metaKey) && e.shiftKey && e.key.toLowerCase()==='m'){
    e.preventDefault();
    openCommentEditor(el.id);
    return;
  }

  // Ctrl/Cmd+A => select the whole script, not just the current line.
  // Each line is its own separate contentEditable element, so the browser's
  // native "select all" only grabs the line currently focused. We build our
  // own Range covering every line in #page so Ctrl+C afterwards copies the
  // full text of the page being written.
  if((e.ctrlKey||e.metaKey) && !e.shiftKey && e.key.toLowerCase()==='a'){
    e.preventDefault();
    // v11 : même mécanisme que l'accolade « tout le scénario » (lignes
    // verrouillées le temps de la sélection) — Ctrl+A puis Ctrl+C copiait
    // parfois du vide parce que le navigateur rabotait la sélection posée
    // sur des lignes encore éditables.
    selectWholeScript(true);
    return;
  }

  // Une sélection qui traverse plusieurs lignes est traitée par nous, quelle
  // que soit la touche : c'est ce qui manquait pour que supprimer un passage
  // surligné fasse ce qu'on attend.
  if(e.key==='Enter' || e.key==='Backspace' || e.key==='Delete'){
    const span = selectionSpan();
    if(span && span.multi){
      e.preventDefault();
      applyRangeEdit(span, e.key==='Enter' ? '\n' : '');
      return;
    }
  }
  if(e.key==='Enter' && e.shiftKey && el.type==='card'){
    // Retour à la ligne DANS le carton (un carton peut tenir sur plusieurs lignes).
    // On réécrit le texte de la ligne d'un bloc plutôt que d'insérer un nœud : le
    // curseur se place alors toujours APRÈS le saut de ligne, même en fin de texte.
    e.preventDefault();
    const sel = window.getSelection();
    if(sel.rangeCount){
      pushUndo();
      const r = sel.getRangeAt(0);
      const pre = r.cloneRange(); pre.selectNodeContents(div); pre.setEnd(r.startContainer, r.startOffset);
      const start = pre.toString().length, end = start + r.toString().length;
      const full = lineText(div).replace(/\n$/, '');
      let t = full.slice(0, start) + '\n' + full.slice(end);
      // Un « \n » tout à la fin ne crée pas de ligne visible : on en garde un second
      // derrière le curseur (retiré du texte enregistré, voir onLineInput).
      if(t.slice(start + 1) === '') t += '\n';
      div.textContent = t;
      el.text = t.replace(/\n$/, ''); div.dataset.empty = el.text ? '' : '1';
      focusDiv(div, start + 1);
      schedulePaginate(); scheduleAutosave();
    }
    return;
  }
  if(e.key==='Enter'){
    e.preventDefault();
    pushUndo();
    // caret at end assumption: split text at caret
    const sel = window.getSelection();
    const range = sel.rangeCount ? sel.getRangeAt(0) : null;
    const full = lineText(div);
    const caretOffset = range ? getCaretOffset(div, range) : full.length;
    const before = full.slice(0, caretOffset);
    const after = full.slice(caretOffset);
    el.text = before;
    let nextType = ENTER_MAP[el.type] || 'action';
    if(el.type==='dialogue' && before.trim()==='' ){ nextType='action'; }
    const idx = findIdx(el.id);
    let insertAt = idx + 1;
    // ENTRÉE DANS UN DIALOGUE SIMULTANÉ. Sans cette règle, la ligne créée
    // après une réplique était un nouveau PERSONNAGE glissé entre les deux
    // colonnes : il devenait aussitôt la colonne de gauche d'une nouvelle
    // paire, et l'on voyait le bloc se dédoubler en escalier à chaque
    // Entrée. Comportement repris de WriterDuet :
    //   • on scinde une réplique en deux → la suite reste du dialogue,
    //     dans la MÊME colonne ;
    //   • on valide en bout de réplique (ou on passe à autre chose
    //     qu'un dialogue) → on SORT de la paire : la nouvelle ligne se
    //     pose sous le bloc simultané, sur toute la largeur.
    if(inDualWrap(div)){
      const pair = dualPairRange(idx);
      if(pair){
        if(nextType === 'character'){
          if(after.trim() !== '') nextType = 'dialogue';
          else insertAt = pair.end;
        } else if(nextType !== 'dialogue' && nextType !== 'parenthetical'){
          insertAt = pair.end;
        }
      }
    }
    const newEl = newElement(nextType, after);
    S.project.elements.splice(insertAt,0,newEl);
    div.textContent = before; div.dataset.empty = before?'':'1';
    if(el.type==='scene') renumberScenes();
    if(inDualWrap(div)){
      // Dans une colonne de dialogue simultané : le nœud voisin n'est pas
      // forcément la ligne suivante du scénario, on refait le montage.
      rebuildEditorAt(newEl.id, 0);
      scheduleAutosave();
      return;
    }
    const newDiv = buildLineDiv(newEl, sceneNumbers());
    div.after(newDiv);
    repaginateNow();
    focusDiv(newDiv, 0);
    scheduleAutosave();
    return;
  }
  if(e.key==='Tab'){
    e.preventDefault();
    pushUndo();
    if(e.shiftKey){
      if(el.type==='character') el.type='action';
      else if(el.type==='dialogue') el.type='character';
      else if(el.type==='parenthetical') el.type='character';
      else el.type='action';
    } else {
      if(TOWARD_CHAR.has(el.type)) el.type='character';
      else if(TOWARD_ACTION.has(el.type)) el.type='action';
    }
    refreshLineDiv(div, el); renumberScenes(); showContextPanel(el); scheduleAutosave();
    return;
  }
  if(e.key==='Backspace'){
    const sel = window.getSelection();
    const range = sel.rangeCount? sel.getRangeAt(0): null;
    const caretOffset = range? getCaretOffset(div, range) : 0;
    if(caretOffset===0 && !sel.toString()){
      // DÉFAIRE PLUTÔT QUE FUSIONNER. Retour arrière au tout début du nom
      // du personnage de droite : on redescend d'abord le bloc sous
      // l'autre (le simultané se retire), au lieu de coller ce nom à la
      // fin de la réplique d'à côté — c'est ce qui rendait un bloc
      // simultané si pénible à défaire ou à supprimer. Une deuxième
      // pression fusionne ensuite normalement, comme partout ailleurs.
      if(el.type === 'character' && el.dual){
        e.preventDefault(); pushUndo();
        delete el.dual;
        rebuildEditorAt(el.id, 0);
        scheduleAutosave();
        toast(L('Dialogue simultané retiré : les deux répliques se suivent à nouveau.','Simultaneous dialogue removed: the two lines now follow each other again.'));
        return;
      }
      const idx = findIdx(el.id);
      if(idx>0){
        e.preventDefault(); pushUndo();
        const prevEl = S.project.elements[idx-1];
        const wasDual = inDualWrap(div) || inDualWrap(document.querySelector('#page [data-id="'+prevEl.id+'"]'));
        const prevDiv = neighborLineDiv(el, -1);
        const mergedAt = prevEl.text.length;
        prevEl.text = prevEl.text + el.text;
        S.project.elements.splice(idx,1);
        div.remove();
        if(el.type==='scene' || prevEl.type==='scene') renumberScenes();
        if(wasDual){ rebuildEditorAt(prevEl.id, mergedAt); scheduleAutosave(); return; }
        repaginateNow();
        if(prevDiv){ prevDiv.textContent = prevEl.text; prevDiv.dataset.empty = prevEl.text?'':'1'; focusDiv(prevDiv, mergedAt); }
        scheduleAutosave();
      }
    }
    return;
  }
  if(e.key==='Delete'){
    const sel = window.getSelection();
    const range = sel.rangeCount ? sel.getRangeAt(0) : null;
    if(range && !sel.toString() && getCaretOffset(div, range) >= lineText(div).length){
      const idx = findIdx(el.id);
      if(idx >= 0 && idx < S.project.elements.length-1){
        e.preventDefault(); pushUndo();
        const nextEl = S.project.elements[idx+1];
        const nextDiv = neighborLineDiv(el, 1);
        const wasDual = inDualWrap(div) || inDualWrap(nextDiv);
        const at = el.text.length;
        el.text = el.text + nextEl.text;
        S.project.elements.splice(idx+1, 1);
        if(nextDiv) nextDiv.remove();
        div.textContent = el.text; div.dataset.empty = el.text?'':'1';
        if(el.type==='scene' || nextEl.type==='scene') renumberScenes();
        if(wasDual){ rebuildEditorAt(el.id, at); scheduleAutosave(); return; }
        repaginateNow();
        focusDiv(div, at);
        scheduleAutosave();
      }
    }
    return;
  }
  if(e.key==='ArrowUp' && !e.shiftKey){
    const sel=window.getSelection(); const r=sel.rangeCount?sel.getRangeAt(0):null;
    if(r && getCaretOffset(div,r)===0){
      const prev = neighborLineDiv(el, -1);
      if(prev){ e.preventDefault(); focusDiv(prev, prev.textContent.length); }
    }
  }
  if(e.key==='ArrowDown' && !e.shiftKey){
    const sel=window.getSelection(); const r=sel.rangeCount?sel.getRangeAt(0):null;
    if(r && getCaretOffset(div,r)>=lineText(div).length){
      const next = neighborLineDiv(el, 1);
      if(next){ e.preventDefault(); focusDiv(next, 0); }
    }
  }
}
/* =====================================================================
   ÉDITION PORTANT SUR PLUSIEURS LIGNES
   ---------------------------------------------------------------------
   Chaque ligne est un contentEditable séparé. Une sélection qui court sur
   plusieurs lignes est donc ingérable par le navigateur : selon le cas il
   n'efface qu'une partie de ce qui est surligné, ou au contraire il arrache
   des lignes entières du DOM sans que le modèle le sache — et c'est ainsi
   qu'un passage entier pouvait sembler « disparaître ». On intercepte donc
   nous-mêmes toute frappe, suppression, coupe ou collage qui traverse une
   frontière de ligne, et on l'applique au modèle ET au DOM.
===================================================================== */
function offsetInLine(line, node, off){
  try{
    const pre = document.createRange();
    pre.selectNodeContents(line);
    pre.setEnd(node, off);
    return pre.toString().length;
  }catch(err){ return 0; }
}
function selectionSpan(){
  const page = document.getElementById('page');
  const sel = window.getSelection();
  if(!page || !sel || !sel.rangeCount) return null;
  const r = sel.getRangeAt(0);
  if(!page.contains(r.startContainer) || !page.contains(r.endContainer)) return null;
  let a = lineOf(r.startContainer), b = lineOf(r.endContainer);
  let aOff, bOff;
  // Cas du « tout sélectionner » : la sélection porte sur #page lui-même,
  // ses extrémités ne sont donc dans aucune ligne. On les ramène sur la
  // première et la dernière ligne concernées.
  const kids = pageLineDivs();
  if(!a && r.startContainer === page && kids.length){
    a = stBoundaryLine(page, r.startOffset, false) || kids[Math.min(r.startOffset, kids.length - 1)]; aOff = 0;
  }
  if(!b && r.endContainer === page && kids.length){
    b = stBoundaryLine(page, r.endOffset, true) || kids[Math.min(Math.max(r.endOffset - 1, 0), kids.length - 1)];
    bOff = (b.textContent || '').length;
  }
  if(!a || !b) return null;
  if(aOff == null) aOff = offsetInLine(a, r.startContainer, r.startOffset);
  if(bOff == null) bOff = offsetInLine(b, r.endContainer, r.endOffset);
  return { a, b, aOff, bOff, multi: a !== b };
}
/* Remplace tout ce qui est sélectionné (d'une ligne à l'autre si besoin)
   par `insertText`. Un texte contenant des retours à la ligne crée autant
   d'éléments — c'est ce qui rend le collage d'un bloc entier propre. */
function applyRangeEdit(span, insertText){
  const ai = findIdx(span.a.dataset.id);
  const bi = findIdx(span.b.dataset.id);
  if(ai < 0 || bi < 0 || bi < ai) return false;
  pushUndo();
  const aEl = S.project.elements[ai], bEl = S.project.elements[bi];
  const head = (aEl.text || '').slice(0, span.aOff);
  const tail = (bEl.text || '').slice(span.bOff);

  // lignes entièrement ou partiellement prises entre le début et la fin
  // On repère les lignes à retirer par le MODÈLE (et non en suivant les
  // voisins dans le DOM) : une sélection qui traverse un dialogue
  // simultané ne se parcourt pas de proche en proche, les deux colonnes
  // étant imbriquées dans un conteneur.
  const touchesDual = inDualWrap(span.a) || inDualWrap(span.b);
  if(span.a !== span.b){          // sélection sur une seule ligne : rien à retirer
    const doomed = S.project.elements.slice(ai + 1, bi + 1)
      .map(el => document.querySelector('#page [data-id="' + el.id + '"]'))
      .filter(Boolean);
    S.project.elements.splice(ai + 1, bi - ai);
    doomed.forEach(d => d.remove());
  }

  const parts = String(insertText == null ? '' : insertText).split(/\r?\n/);
  aEl.text = head + parts[0] + (parts.length === 1 ? tail : '');
  span.a.textContent = aEl.text;
  span.a.dataset.empty = aEl.text ? '' : '1';

  let lastDiv = span.a, caret = (head + parts[0]).length;
  for(let i = 1; i < parts.length; i++){
    const txt = parts[i] + (i === parts.length - 1 ? tail : '');
    const el = newElement(aEl.type === 'scene' ? 'action' : aEl.type, txt);
    S.project.elements.splice(findIdx(lastDiv.dataset.id) + 1, 0, el);
    const div = buildLineDiv(el, sceneNumbers());
    lastDiv.after(div);
    lastDiv = div; caret = parts[i].length;
  }
  if(!S.project.elements.length){
    const el = newElement('action','');
    S.project.elements.push(el);
    const div = buildLineDiv(el, sceneNumbers());
    document.getElementById('page').appendChild(div);
    lastDiv = div; caret = 0;
  }
  renumberScenes();
  if(touchesDual){
    // Les colonnes ont bougé : on refait le montage à partir du modèle,
    // qui, lui, est juste.
    rebuildEditorAt(lastDiv.dataset.id, caret);
    scheduleAutosave();
    return true;
  }
  repaginateNow();
  focusDiv(lastDiv, caret);
  scheduleAutosave();
  return true;
}
function onBeforeInput(e){
  const span = selectionSpan();
  if(!span || !span.multi) return;          // une seule ligne : le navigateur gère très bien
  const t = e.inputType || '';
  if(t.indexOf('delete') === 0){
    e.preventDefault(); applyRangeEdit(span, '');
  } else if(t.indexOf('insert') === 0){
    let data = e.data;
    if(data == null && e.dataTransfer) data = e.dataTransfer.getData('text/plain');
    e.preventDefault(); applyRangeEdit(span, data || '');
  }
}
/* Collage : toujours en texte brut, sinon le HTML du presse-papiers
   s'installe dans la ligne et corrompt le document. */
function onPagePaste(e){
  const cd = e.clipboardData || window.clipboardData;
  if(!cd) return;
  const span = selectionSpan();
  if(!span) return;
  e.preventDefault();
  applyRangeEdit(span, cd.getData('text/plain'));
}
function onPageCut(e){
  const span = selectionSpan();
  if(!span || !e.clipboardData) return;
  let txt = window.getSelection().toString();
  if(!txt.trim()) txt = stSpanText(span) || txt;   // filet : texte relu dans le modèle
  e.clipboardData.setData('text/plain', txt);
  e.preventDefault();
  applyRangeEdit(span, '');
}
/* Filet de sécurité : si le DOM et le modèle ne coïncident plus (un
   navigateur a supprimé ou inséré un nœud dans notre dos), on réaligne le
   modèle sur ce que l'utilisateur a réellement sous les yeux, plutôt que de
   laisser les deux diverger en silence. */
function syncFromDOM(){
  const page = document.getElementById('page');
  if(!page) return;
  const kept = [];
  // Une paire simultanée est un conteneur : ce sont les lignes DANS ses
  // deux colonnes qui portent le texte et les identifiants. On les
  // remonte donc à plat, dans l'ordre du modèle (gauche puis droite).
  const flat = [];
  Array.from(page.children).forEach(node=>{
    if(node.classList && node.classList.contains('dual-wrap')){
      node.querySelectorAll('.line[data-id]').forEach(n=> flat.push(n));
    } else flat.push(node);
  });
  flat.forEach(node=>{
    if(!node.classList || !node.classList.contains('line')){
      const el = newElement('action', node.textContent || '');
      const div = buildLineDiv(el, {});
      node.replaceWith(div);
      kept.push(el);
      return;
    }
    const el = findEl(node.dataset.id);
    if(el){ el.text = node.textContent; el.type = node.dataset.type || el.type; kept.push(el); }
    else{
      const n = newElement(node.dataset.type || 'action', node.textContent || '');
      node.dataset.id = n.id; kept.push(n);
    }
  });
  if(!kept.length){
    const el = newElement('action','');
    kept.push(el);
    page.appendChild(buildLineDiv(el, {}));
  }
  S.project.elements = kept;
  renumberScenes();
  scheduleAutosave();
}

function getCaretOffset(div, range){
  const pre = range.cloneRange(); pre.selectNodeContents(div); pre.setEnd(range.endContainer, range.endOffset);
  return pre.toString().length;
}
function focusDiv(div, offset){
  div.focus();
  const sel = window.getSelection(); const range = document.createRange();
  let node = div.firstChild;
  if(!node){ node = document.createTextNode(''); div.appendChild(node); }
  if(node.nodeType!==3){ div.appendChild(document.createTextNode('')); node = div.lastChild; }
  const off = Math.min(offset, node.textContent.length);
  range.setStart(node, off); range.collapse(true);
  sel.removeAllRanges(); sel.addRange(range);
  // `focusin` s'est déclenché sur div.focus(), donc AVANT que la sélection
  // n'existe : à ce moment-là on ne pouvait caler la vue que sur le bloc
  // entier. Maintenant que le curseur est réellement posé, on affine.
  ensureCaretVisible();
  updatePageIndicator();
}

/* ---- mouse drag-to-select across lines ----
   Each script line is its own separate contentEditable element (needed so
   Enter/Backspace/type-switching can treat lines independently). Browsers
   confine a live mouse-drag selection to the editable element it started
   in, so dragging from one line into the next normally stops dead at that
   line's border. We let the browser handle the drag as usual (so a normal
   click, or a drag that stays inside one line, is untouched) and only step
   in on mouseup: if the drag crossed into a different line, we rebuild a
   single Range from where the drag started to where it was released and
   apply it — the same technique used for Ctrl+A, just between two exact
   points instead of the whole page. */
let dragStartPoint = null;
function caretFromPoint(x, y){
  if(document.caretRangeFromPoint){
    const r = document.caretRangeFromPoint(x, y);
    return r ? {node:r.startContainer, offset:r.startOffset} : null;
  }
  if(document.caretPositionFromPoint){
    const p = document.caretPositionFromPoint(x, y);
    return p ? {node:p.offsetNode, offset:p.offset} : null;
  }
  return null;
}
function lineOf(node){
  const el = node && node.nodeType===1 ? node : (node && node.parentElement);
  return el ? el.closest('.line') : null;
}
function edgePoint(line, atStart){
  let node = line.firstChild;
  if(!node) return {node:line, offset:0};
  return atStart ? {node, offset:0} : {node, offset:(node.textContent||'').length};
}
function onPageMouseDown(e){
  const line = e.target.closest('.line');
  dragStartPoint = line ? (caretFromPoint(e.clientX, e.clientY) || edgePoint(line, true)) : null;
}
/* Build the cross-line Range between the fixed drag-start point and
   whatever point the pointer is currently over. Shared by the live
   mousemove preview and the mouseup finalizer so both agree on exactly
   the same selection. Returns null if a range can't be built, or an
   object with the range plus the start/end lines (so the caller can tell
   whether the drag actually left its starting line). */
function buildCrossLineRange(startPoint, clientX, clientY){
  const page = document.getElementById('page'); if(!page) return null;
  let endPoint = caretFromPoint(clientX, clientY);
  if(!endPoint){
    // pointer is outside any text (page margin, above/below the sheet):
    // snap to the start or end of the whole script, like dragging past
    // the edge of a page in a real word processor keeps extending the
    // selection.
    // [data-id] : on veut les lignes de texte réelles, pas le conteneur
    // d'une paire de dialogue simultané (qui porte lui aussi .line).
    const lines = pageLineDivs();
    if(!lines.length) return null;
    const pageRect = page.getBoundingClientRect();
    endPoint = clientY < pageRect.top ? edgePoint(lines[0], true) : edgePoint(lines[lines.length-1], false);
  }
  const startLine = lineOf(startPoint.node), endLine = lineOf(endPoint.node);
  if(!startLine || !endLine) return null;
  const probe = document.createRange();
  probe.setStart(startPoint.node, startPoint.offset); probe.collapse(true);
  const reversed = probe.comparePoint(endPoint.node, endPoint.offset) < 0;
  const a = reversed ? endPoint : startPoint, b = reversed ? startPoint : endPoint;
  const range = document.createRange();
  try{ range.setStart(a.node, a.offset); range.setEnd(b.node, b.offset); } catch(err){ return null; }
  return { range, startLine, endLine };
}
/* Live preview: while the mouse button is down and the drag has crossed
   into a different line, keep rebuilding and applying the selection on
   every pointer move so the highlight visibly follows the drag in real
   time — instead of the browser's native per-line selection freezing at
   the line border and only being corrected once the mouse is released. */
let dragRafPending = false;
function onDocMouseMove(e){
  if(!dragStartPoint) return; // not dragging from inside a line
  if(dragRafPending) return;
  dragRafPending = true;
  const clientX = e.clientX, clientY = e.clientY;
  requestAnimationFrame(()=>{
    dragRafPending = false;
    if(!dragStartPoint) return; // drag ended while this frame was pending
    const built = buildCrossLineRange(dragStartPoint, clientX, clientY);
    if(!built || built.startLine===built.endLine) return; // still inside the starting line: let native selection handle it
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(built.range);
  });
}
function onDocMouseUp(e){
  const startPoint = dragStartPoint; dragStartPoint = null;
  if(!startPoint) return;
  const sel = window.getSelection();
  if(!sel || sel.isCollapsed) return; // plain click: leave native caret placement alone
  const built = buildCrossLineRange(startPoint, e.clientX, e.clientY);
  if(!built || built.startLine===built.endLine) return; // single-line drag: native selection already got it right
  sel.removeAllRanges(); sel.addRange(built.range);
}

function onDocKeydown(e){
  if((e.ctrlKey||e.metaKey) && 'zy'.includes(e.key.toLowerCase()) && e.key.length===1 && e.target && e.target.closest && e.target.closest('#tpPreviewShell')) return;   // page de titre : Ctrl+Z annule la saisie du texte, pas tout le scénario
  if((e.ctrlKey||e.metaKey) && !e.shiftKey && e.key.toLowerCase()==='z'){ e.preventDefault(); doUndo(); }
  else if((e.ctrlKey||e.metaKey) && e.shiftKey && e.key.toLowerCase()==='z'){ e.preventDefault(); doRedo(); }
  else if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s'){ e.preventDefault(); manualSave(); }
  else if((e.ctrlKey||e.metaKey) && e.shiftKey && e.key.toLowerCase()==='f'){ e.preventDefault(); toggleFocusMode(); }
  else if((e.ctrlKey||e.metaKey) && e.shiftKey && e.key.toLowerCase()==='l'){ e.preventDefault(); if(S.tab==='editor') speakScene(); }
  else if((e.ctrlKey||e.metaKey) && e.shiftKey && e.key.toLowerCase()==='v' && !e.altKey){ e.preventDefault(); if(S.tab==='editor') toggleDictation(); }
  else if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='f'){ e.preventDefault(); const si=document.getElementById('searchInput'); if(si){ si.focus(); si.select(); } }
  else if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); if(S.tab==='editor') openJumpScene(); }
  else if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='h'){ e.preventDefault(); if(S.tab==='editor') openReplace(); }
  else if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='g'){ e.preventDefault(); if(S.tab==='editor') goToPage(); }
}
async function manualSave(){
  await doAutosave();
  toast(L('Scénario sauvegardé.','Screenplay saved.'));
}

/* =====================================================================
   SEARCH
===================================================================== */
function onSearchInput(e){ runSearch(e.target.value); }
function onSearchKeydown(e){
  if(e.key==='Enter'){ e.preventDefault(); gotoMatch(e.shiftKey ? -1 : 1); }
}
function runSearch(q, silent){
  S.search.query = q;
  const cnt = document.getElementById('searchCount');
  document.querySelectorAll('#page .line.hl').forEach(d=>d.classList.remove('hl'));
  if(!q){ S.search.matches=[]; S.search.idx=-1; if(cnt) cnt.textContent=''; return; }
  S.search.matches = S.project.elements.filter(e=>e.text.toLowerCase().includes(q.toLowerCase())).map(e=>e.id);
  S.search.idx = S.search.matches.length? 0 : -1;
  if(cnt) cnt.textContent = S.search.matches.length ? (S.search.idx+1)+'/'+S.search.matches.length : L('Aucun résultat','No results');
  if(!silent && S.search.idx>=0) scrollToMatch();
}
function gotoMatch(dir){
  if(!S.search.matches.length) return;
  S.search.idx = (S.search.idx + dir + S.search.matches.length) % S.search.matches.length;
  document.getElementById('searchCount').textContent = (S.search.idx+1)+'/'+S.search.matches.length;
  scrollToMatch();
}
/* =====================================================================
   ALLER À LA SCÈNE (Ctrl+K)
   -----------------------------------------------------------------
   Fonctionnalité de WriterDuet absente de Raging Page : jusqu'ici, atteindre
   une scène précise obligeait à passer par l'onglet Cartes (donc à QUITTER
   l'éditeur) ou à faire défiler à la main. Ici : une liste filtrable de
   toutes les entêtes, avec leur numéro et leur page, ↑/↓ pour choisir,
   Entrée pour y sauter — le curseur est posé directement dans l'entête,
   prêt à écrire. Réutilise getSceneBlocks(), sceneNumbers() et la
   pagination déjà calculée : aucune nouvelle donnée à maintenir.
===================================================================== */
let jumpSel = 0, jumpList = [];
function jumpScenes(q){
  const numbers = sceneNumbers();
  const needle = (q||'').trim().toLowerCase();
  return getSceneBlocks().filter(b=>b.sceneId).map(b=>({
    id: b.sceneId,
    num: numbers[b.sceneId] || '',
    text: b.elements[0].text || L('(scène sans titre)','(untitled scene)'),
    page: S.pagination.pageOf[b.sceneId] || ''
  })).filter(x=> !needle || x.text.toLowerCase().includes(needle) || String(x.num)===needle);
}
function openJumpScene(){
  if(S.tab!=='editor' || !S.project) return;
  if(document.getElementById('jumpBackdrop')) return;
  const html = `<div class="modal-backdrop" id="jumpBackdrop" data-act="closeJumpSceneBg">
    <div class="modal jump-modal" data-stop="1" style="align-self:flex-start;margin-top:8vh;">
      <input type="text" id="jumpInput" class="jump-input" placeholder="${L('Aller à la scène… (titre, lieu ou numéro)','Go to scene… (title, location or number)')}" autocomplete="off">
      <div class="jump-list" id="jumpList"></div>
    </div></div>`;
  document.body.insertAdjacentHTML('beforeend', html);
  jumpSel = 0;
  renderJumpList('');
  const inp = document.getElementById('jumpInput');
  inp.addEventListener('input', e=>{ jumpSel = 0; renderJumpList(e.target.value); });
  inp.addEventListener('keydown', onJumpKeydown);
  inp.focus();
}
function renderJumpList(q){
  jumpList = jumpScenes(q);
  if(jumpSel >= jumpList.length) jumpSel = Math.max(0, jumpList.length-1);
  const box = document.getElementById('jumpList');
  if(!box) return;
  box.innerHTML = jumpList.length ? jumpList.map((x,i)=>`
    <div class="jump-item${i===jumpSel?' sel':''}" data-act="jumpToScene" data-id="${x.id}">
      <span class="jump-num">${x.num}</span>
      <span class="jump-head">${esc(x.text)}</span>
      ${x.page?`<span class="jump-page">${L('p.','p.')} ${x.page}</span>`:''}
    </div>`).join('') : `<div class="jump-empty">${L('Aucune scène ne correspond.','No scene matches.')}</div>`;
  const sel = box.querySelector('.jump-item.sel');
  if(sel) sel.scrollIntoView({block:'nearest'});
}
function onJumpKeydown(e){
  if(e.key==='ArrowDown'){ e.preventDefault(); if(jumpList.length){ jumpSel=(jumpSel+1)%jumpList.length; renderJumpList(e.target.value); } }
  else if(e.key==='ArrowUp'){ e.preventDefault(); if(jumpList.length){ jumpSel=(jumpSel-1+jumpList.length)%jumpList.length; renderJumpList(e.target.value); } }
  else if(e.key==='Enter'){ e.preventDefault(); if(jumpList[jumpSel]) jumpToScene(jumpList[jumpSel].id); }
  else if(e.key==='Escape'){ e.preventDefault(); closeJumpScene(); }
}
function closeJumpScene(){ const b=document.getElementById('jumpBackdrop'); if(b) b.remove(); }
function jumpToScene(id){
  closeJumpScene();
  const div = document.querySelector('#page [data-id="'+id+'"]');
  if(!div) return;
  div.focus();
  const r = document.createRange();
  r.selectNodeContents(div); r.collapse(true);
  const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
  div.scrollIntoView({block:'center', behavior:'smooth'});
  div.style.outline='2px solid #1F6FA0'; setTimeout(()=>{ div.style.outline=''; }, 900);
}

/* =====================================================================
   RECHERCHER & REMPLACER (Ctrl+H)
   -----------------------------------------------------------------
   Fonctionnalité de WriterDuet absente de Raging Page : la recherche
   existante savait TROUVER mais pas REMPLACER, alors que c'est l'outil
   qu'on utilise le plus souvent sur un scénario — rebaptiser un
   personnage ou un lieu d'un coup dans tout le texte.
   Deux détails qui comptent ici :
   • la casse est respectée automatiquement : si l'occurrence trouvée est
     tout en majuscules (un nom de personnage sur sa ligne, un lieu dans
     une entête de scène), le remplacement est mis en majuscules lui
     aussi — sinon renommer JEAN en "Paul" cassait toutes les entêtes ;
   • un seul pushUndo() avant l'opération : Ctrl+Z annule TOUT le
     remplacement d'un coup, jamais mot par mot.
===================================================================== */
function escapeRegExp(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function replaceCount(find){
  if(!find || !S.project) return 0;
  const re = new RegExp(escapeRegExp(find),'gi');
  return S.project.elements.reduce((n,el)=> n + ((el.text||'').match(re)||[]).length, 0);
}
function openReplace(){
  if(S.tab!=='editor' || !S.project) return;
  const pre = esc(S.search.query||'');
  const html = `<div class="modal-backdrop" id="replaceBackdrop" data-act="closeReplaceBg">
    <div class="modal" style="max-width:420px;" data-stop="1">
      <h2>${L('Rechercher &amp; remplacer','Find &amp; replace')}</h2>
      <p style="font-size:13.5px;color:var(--ink-soft);margin:-8px 0 14px;">${L('Remplace dans tout le scénario. Les occurrences écrites en majuscules (noms de personnages, entêtes de scène) restent en majuscules. Ctrl+Z annule l\u2019ensemble.','Replaces throughout the whole screenplay. Occurrences written in capitals (character names, scene headings) stay in capitals. Ctrl+Z undoes the whole replacement.')}</p>
      <div class="field"><label>${L('Rechercher','Find')}</label><input type="text" id="replFind" value="${pre}" placeholder="${L('Texte à trouver…','Text to find…')}"></div>
      <div class="field"><label>${L('Remplacer par','Replace with')}</label><input type="text" id="replWith" placeholder="${L('Nouveau texte…','New text…')}"></div>
      <div id="replCount" style="font-size:13px;color:var(--ink-soft);min-height:16px;"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-act="closeReplace">${L('Annuler','Cancel')}</button>
        <button class="btn btn-primary" data-act="doReplaceAll">${L('Remplacer tout','Replace all')}</button>
      </div>
    </div></div>`;
  document.body.insertAdjacentHTML('beforeend', html);
  const f = document.getElementById('replFind');
  const refresh = ()=>{
    const n = replaceCount(document.getElementById('replFind').value);
    const c = document.getElementById('replCount');
    if(c) c.textContent = !document.getElementById('replFind').value ? ''
      : (n ? n + ' ' + L(n>1?'occurrences trouvées':'occurrence trouvée', n>1?'matches found':'match found') : L('Aucune occurrence','No matches'));
  };
  if(f){ f.addEventListener('input', refresh); f.focus(); f.select(); refresh(); }
  const w = document.getElementById('replWith');
  if(w) w.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); doReplaceAll(); } });
}
function closeReplace(){ const b=document.getElementById('replaceBackdrop'); if(b) b.remove(); }
function doReplaceAll(){
  const fi = document.getElementById('replFind'), wi = document.getElementById('replWith');
  if(!fi) return;
  const find = fi.value, with_ = wi ? wi.value : '';
  if(!find) return;
  const re = new RegExp(escapeRegExp(find),'gi');
  let n = 0;
  pushUndo();
  S.project.elements.forEach(el=>{
    if(!el.text || !re.test(el.text)){ re.lastIndex = 0; return; }
    re.lastIndex = 0;
    el.text = el.text.replace(re, m=>{
      n++;
      // occurrence tout en majuscules -> on majuscule aussi le remplacement
      return (m === m.toUpperCase() && m !== m.toLowerCase()) ? with_.toUpperCase() : with_;
    });
  });
  closeReplace();
  if(!n){ toast(L('Aucune occurrence trouvée.','No matches found.')); return; }
  scheduleAutosave();
  renderEditorTab();
  if(S.search.query) runSearch(S.search.query, true);
  toast(n>1 ? n+' '+L('occurrences remplacées.','matches replaced.') : L('1 occurrence remplacée.','1 match replaced.'));
}

function scrollToMatch(){
  const id = S.search.matches[S.search.idx];
  const div = document.querySelector('#page [data-id="'+id+'"]');
  if(div){ div.scrollIntoView({block:'center', behavior:'smooth'}); div.classList.add('hl'); div.style.outline='2px solid #1F6FA0'; setTimeout(()=>{ div.style.outline=''; },1200); }
}

/* =====================================================================
   CARDS
===================================================================== */
let dragSceneId=null;
function renderCards(){
  const blocks = getSceneBlocks().filter(b=>b.sceneId);
  const numbers = sceneNumbers();
  const lens = sceneLengths();
  const cards = blocks.map(b=>{
    const headingEl = b.elements[0];
    const meta = sceneMeta(b.sceneId);
    const synopsis = meta.outline || (b.elements.find(e=>e.type==='action')||{}).text || '';
    const chars = [...new Set(b.elements.filter(e=>e.type==='character').map(e=>characterBaseName(e.text)).filter(Boolean))];
    const tagsHtml = meta.tags.map(t=>`<span class="tag-chip">#${esc(t)}</span>`).join('');
    const len = lens[b.sceneId];
    return `<div class="card" ${meta.color?`style="--sc-color:${meta.color};"`:''} draggable="true" tabindex="0" data-scene="${b.sceneId}" data-act="focusSceneFromCard" data-id="${b.sceneId}">
      <div class="card-head"><span class="card-num">${numbers[b.sceneId]}</span><span class="card-heading">${esc(headingEl.text)||L('(scène sans titre)','(untitled scene)')}</span>${len?`<span class="scene-len" title="${L('Longueur de la scène, en huitièmes de page','Scene length, in eighths of a page')}">${eighthsLabel(len)}</span>`:''}</div>
      <div class="card-syn">${esc(synopsis)||`<span style='color:#bbb'>${L('Pas d\u2019outline','No outline')}</span>`}</div>
      ${chars.length?`<div class="card-chars">${esc(chars.join(', '))}</div>`:''}
      ${tagsHtml?`<div class="card-tags">${tagsHtml}</div>`:''}
      <div class="card-foot"><button class="btn btn-sm btn-ghost" data-act="duplicateScene" data-id="${b.sceneId}" data-stop="1">${L('Dupliquer','Duplicate')}</button><button class="btn btn-sm btn-ghost" data-act="deleteScene" data-id="${b.sceneId}" data-stop="1">${L('Supprimer','Delete')}</button></div>
    </div>`;
  }).join('');
  return `
    <div class="cards-toolbar"><div class="pane-title" style="margin:0;">${L('Vue Cartes','Card View')} — ${blocks.length} ${L(blocks.length===1?'scène':'scènes', blocks.length===1?'scene':'scenes')}</div>
      <button class="btn btn-sm" data-act="switchTab" data-id="editor">${L('Retour à l\u2019éditeur','Back to the editor')}</button></div>
    <div class="cards-hint">${L('Glisse une carte pour réorganiser les scènes (un trait indique où elle ira) · au clavier : Alt + flèches · Ctrl+Z annule.','Drag a card to reorder scenes (a line shows where it will land) · keyboard: Alt + arrows · Ctrl+Z undoes.')}</div>
    <div class="cards-grid" id="cardsGrid">${cards || `<p style="color:var(--ink-soft);padding:20px;">${L('Aucune scène pour l\u2019instant. Ajoute une ligne de type Scène dans l\u2019éditeur.','No scene yet. Add a Scene-type line in the editor.')}</p>`}</div>`;
}
function cardsScrollParent(el){
  let n = el.parentElement;
  while(n && n !== document.body){
    const o = getComputedStyle(n).overflowY;
    if(o === 'auto' || o === 'scroll') return n;
    n = n.parentElement;
  }
  return null;   // la page elle-même
}
function attachCardsDnD(){
  const grid = document.getElementById('cardsGrid'); if(!grid) return;
  const sp = cardsScrollParent(grid);
  let drop = null, auto = 0, raf = 0;

  const clearMarks = ()=>{
    grid.querySelectorAll('.drop-before,.drop-after,.drop-h').forEach(c=>c.classList.remove('drop-before','drop-after','drop-h'));
    drop = null;
  };
  const tick = ()=>{
    if(!auto){ raf = 0; return; }
    if(sp) sp.scrollTop += auto; else window.scrollBy(0, auto);
    raf = requestAnimationFrame(tick);
  };
  const edge = y=>{
    const r = sp ? sp.getBoundingClientRect() : {top:0, bottom:window.innerHeight};
    const top = Math.max(r.top, 0), bot = Math.min(r.bottom, window.innerHeight), z = 80;
    auto = y < top + z ? -Math.min(22, Math.ceil((top + z - y)/5))
         : y > bot - z ?  Math.min(22, Math.ceil((y - (bot - z))/5)) : 0;
    if(auto && !raf) raf = requestAnimationFrame(tick);
  };
  const nearest = (x,y)=>{
    let best = null, bd = Infinity;
    grid.querySelectorAll('.card').forEach(c=>{
      const r = c.getBoundingClientRect();
      const dx = x < r.left ? r.left - x : x > r.right ? x - r.right : 0;
      const dy = y < r.top ? r.top - y : y > r.bottom ? y - r.bottom : 0;
      const d = dx*dx + dy*dy;
      if(d < bd){ bd = d; best = c; }
    });
    return best;
  };
  const finish = ()=>{
    auto = 0; clearMarks(); dragSceneId = null;
    grid.querySelectorAll('.dragging').forEach(c=>c.classList.remove('dragging'));
  };
  // Déplace une scène, redessine en gardant la position de défilement, puis
  // fait « atterrir » la carte (éclat bref) et rend le focus au clavier.
  const move = (fromId, toId, after, focus)=>{
    const top = sp ? sp.scrollTop : window.scrollY;
    pushUndo();
    reorderScenes(fromId, toId, after);
    renderTabBody();
    const g2 = document.getElementById('cardsGrid');
    const sp2 = g2 ? cardsScrollParent(g2) : null;
    if(sp2) sp2.scrollTop = top; else window.scrollTo(0, top);
    const c = g2 && g2.querySelector('.card[data-scene="'+fromId+'"]');
    if(c){
      c.classList.add('just-moved');
      if(focus){ c.focus({preventScroll:true}); c.scrollIntoView({block:'nearest'}); }
    }
    const n = sceneNumbers()[fromId];
    toast(L('Scène déplacée','Scene moved') + (n ? ' — n° '+n : '') + ' · ' + L('Ctrl+Z pour annuler','Ctrl+Z to undo'));
  };

  grid.addEventListener('dragstart', e=>{
    const card = e.target.closest && e.target.closest('.card');
    if(!card || e.target.closest('[data-stop]')) return;
    dragSceneId = card.dataset.scene;
    if(e.dataTransfer){ e.dataTransfer.effectAllowed = 'move'; try{ e.dataTransfer.setData('text/plain', dragSceneId); }catch(err){} }
    setTimeout(()=>card.classList.add('dragging'), 0);   // après la capture de l'image fantôme
  });
  grid.addEventListener('dragover', e=>{
    if(!dragSceneId) return;
    e.preventDefault();
    if(e.dataTransfer) e.dataTransfer.dropEffect = 'move';
    edge(e.clientY);
    clearMarks();
    const t = nearest(e.clientX, e.clientY); if(!t) return;
    const r = t.getBoundingClientRect();
    const single = t.offsetWidth > grid.clientWidth * 0.6;          // une seule colonne : on repère à la verticale
    const after = single ? e.clientY > r.top + r.height/2 : e.clientX > r.left + r.width/2;
    const ids = [...grid.querySelectorAll('.card')].map(c=>c.dataset.scene);
    const di = ids.indexOf(dragSceneId), ti = ids.indexOf(t.dataset.scene);
    const p = ti + (after ? 1 : 0);
    if(di < 0 || p === di || p === di + 1) return;                  // ça ne changerait rien : pas de repère
    t.classList.add(after ? 'drop-after' : 'drop-before');
    if(single) t.classList.add('drop-h');
    drop = { id: t.dataset.scene, after };
  });
  grid.addEventListener('dragleave', e=>{
    if(!e.relatedTarget || !grid.contains(e.relatedTarget)){ auto = 0; clearMarks(); }
  });
  grid.addEventListener('drop', e=>{
    if(!dragSceneId) return;
    e.preventDefault();
    const d = drop, from = dragSceneId;
    finish();
    if(d && d.id !== from) move(from, d.id, d.after, false);
  });
  grid.addEventListener('dragend', finish);

  // Clavier : Alt + flèches déplacent la carte active ; Entrée l'ouvre.
  grid.addEventListener('keydown', e=>{
    const card = e.target.closest && e.target.closest('.card');
    if(!card || e.target !== card) return;
    if(e.key === 'Enter'){ e.preventDefault(); focusSceneFromCard(card.dataset.scene, e); return; }
    if(!e.altKey || e.ctrlKey || e.metaKey) return;
    const prev = e.key === 'ArrowLeft' || e.key === 'ArrowUp';
    const next = e.key === 'ArrowRight' || e.key === 'ArrowDown';
    if(!prev && !next) return;
    e.preventDefault();
    const cards = [...grid.querySelectorAll('.card')];
    const i = cards.indexOf(card), j = i + (next ? 1 : -1);
    if(j < 0 || j >= cards.length) return;
    move(card.dataset.scene, cards[j].dataset.scene, next, true);
  });
}
function reorderScenes(fromId, toId, after){
  const blocks = getSceneBlocks();
  const pre = blocks[0] && !blocks[0].sceneId ? blocks.shift() : null;
  const fromIdx = blocks.findIndex(b=>b.sceneId===fromId);
  if(fromIdx<0 || !blocks.some(b=>b.sceneId===toId)) return;
  const [moved] = blocks.splice(fromIdx,1);
  const toIdx = blocks.findIndex(b=>b.sceneId===toId);
  blocks.splice(toIdx + (after ? 1 : 0), 0, moved);
  S.project.elements = (pre?pre.elements:[]).concat(...blocks.map(b=>b.elements));
  scheduleAutosave();
}
function focusSceneFromCard(id, e){
  if(e.target.closest('[data-stop]')) return;
  S.tab='editor'; renderTabBody(); syncRailActive('editor');
  setTimeout(()=>{ const div = document.querySelector('#page [data-id="'+id+'"]'); if(div){ div.scrollIntoView({block:'center'}); div.focus(); } }, 30);
}
function duplicateScene(id){
  const blocks = getSceneBlocks(); const b = blocks.find(x=>x.sceneId===id); if(!b) return;
  pushUndo();
  const idx = findIdx(id);
  const clones = b.elements.map(e=>{
    const c = newElement(e.type, e.text);
    if(e.dual) c.dual = true;         // une scène dupliquée garde ses simultanés
    if(e.card) c.card = JSON.parse(JSON.stringify(e.card));   // et le style de ses cartons
    return c;
  });
  S.project.elements.splice(idx + b.elements.length, 0, ...clones);
  const oldMeta = sceneMeta(id);
  sceneMeta(clones[0].id).tags = [...oldMeta.tags]; sceneMeta(clones[0].id).outline = oldMeta.outline;
  scheduleAutosave(); renderTabBody();
}
async function deleteScene(id, e){
  if(e && e.stopPropagation) e.stopPropagation();
  const blocks = getSceneBlocks(); const b = blocks.find(x=>x.sceneId===id); if(!b) return;
  if(!await mmConfirm(L('Tu pourras la restaurer depuis la corbeille.','You can restore it from the trash.'),
    {title:L('Déplacer cette scène vers la corbeille ?','Move this scene to the trash?'), ok:L('Déplacer','Move')})) return;
  pushUndo();
  const idx = findIdx(id);
  S.project.elements.splice(idx, b.elements.length);

/* Ajoute les jalons du gabarit choisi À LA SUITE de la structure existante
   — jamais en remplacement : un squelette déjà commencé n'est jamais
   écrasé silencieusement par un gabarit. */
async function applyStructureTemplate(key){
  const tpl = STRUCTURE_TEMPLATES[key]; if(!tpl) return;
  const beats = ensureStructure(S.project).beats;
  const already = beats.length > 0;
  if(already && !await mmConfirm(L('Les jalons du gabarit seront ajoutés après ceux que tu as déjà. Rien n\u2019est écrasé.','The template milestones will be added after the ones you already have. Nothing is overwritten.'),
    {title:L('Ajouter ces jalons à ta structure ?','Add these milestones to your structure?'), ok:L('Ajouter','Add')})) return;
  tpl.beats().forEach(([title, note], i)=>{
    beats.push({ id: uid('beat'), title, note, color: STRUCTURE_COLORS[(beats.length+i) % STRUCTURE_COLORS.length], sceneId:null });
  });
  scheduleAutosave(); renderTabBody();
  toast(L('Gabarit ajouté.','Template added.'));

/* Fait naître une vraie scène (entête + note d'action) dans le scénario, à
   la toute fin, à partir d'une fiche de structure. La fiche elle-même
   reste en place — grisée, avec un lien vers la scène créée — pour servir
   de repère pendant l'écriture plutôt que de disparaître. */
function convertBeatToScene(id){
  const b = findBeat(id); if(!b) return;
  pushUndo();
  const sceneEl = newElement('scene', b.title || '');
  const actionEl = newElement('action', b.note || '');
  S.project.elements.push(sceneEl, actionEl);
  b.sceneId = sceneEl.id;
  const meta = sceneMeta(sceneEl.id);
  meta.outline = b.note || '';
  meta.color = b.color || '';
  scheduleAutosave();
  S.tab='editor'; renderTabBody(); syncRailActive('editor');
  setTimeout(()=>{ const div = document.querySelector('#page [data-id="'+sceneEl.id+'"]'); if(div){ div.scrollIntoView({block:'center'}); div.focus(); } }, 30);
  toast(L('Scène créée à la fin du scénario.','Scene created at the end of the script.'));
}
function openStructureScene(id){
  const b = findBeat(id); if(!b || !b.sceneId) return;
  focusSceneFromCard(b.sceneId, {target:document.createElement('span')});
}
/* Glisser-déposer VERTICAL, un seul flux : on lâche une carte au-dessus ou
   en dessous de la ligne médiane de la carte survolée pour s'y placer
   avant ou après — pas de colonnes, juste l'ordre haut → bas. */
function attachStructureDnD(){
  const list = document.getElementById('structureList'); if(!list) return;
  list.querySelectorAll('.structure-card').forEach(card=>{
    card.addEventListener('dragstart', e=>{
      // Ne pas déclencher le drag depuis un champ de texte (sélection de
      // texte) : seule la carte elle-même (poignée) doit pouvoir glisser.
      if(e.target.closest('input,textarea,button')){ e.preventDefault(); return; }
      dragBeatId = card.dataset.beat; card.classList.add('dragging');
    });
    card.addEventListener('dragend', ()=>{
      dragBeatId = null; card.classList.remove('dragging');
      list.querySelectorAll('.structure-card').forEach(c=>c.classList.remove('drop-before','drop-after'));
    });
    card.addEventListener('dragover', e=>{
      e.preventDefault();
      if(!dragBeatId || dragBeatId===card.dataset.beat) return;
      const r = card.getBoundingClientRect();
      const before = (e.clientY - r.top) < r.height/2;
      card.classList.toggle('drop-before', before);
      card.classList.toggle('drop-after', !before);
    });
    card.addEventListener('dragleave', ()=> card.classList.remove('drop-before','drop-after'));
    card.addEventListener('drop', e=>{
      e.preventDefault();
      const before = card.classList.contains('drop-before');
      card.classList.remove('drop-before','drop-after');
      if(!dragBeatId || dragBeatId===card.dataset.beat) return;
      const beats = ensureStructure(S.project).beats;
      const fromIdx = beats.findIndex(x=>x.id===dragBeatId);
      if(fromIdx<0) return;
      const [moved] = beats.splice(fromIdx,1);
      let toIdx = beats.findIndex(x=>x.id===card.dataset.beat);
      if(toIdx<0) toIdx = beats.length;
      beats.splice(before?toIdx:toIdx+1, 0, moved);
      dragBeatId = null;
      scheduleAutosave(); renderTabBody();
    });
  });
}

    const design = ensureTPDesign(p);

    canvas.addEventListener('mousedown', tpPenDown);
    canvas.addEventListener('mousemove', tpPenMove);

    canvas.addEventListener('mouseleave', tpPenUp);
    canvas.addEventListener('touchstart', tpPenDown, {passive:false});
    canvas.addEventListener('touchmove', tpPenMove, {passive:false});
    canvas.addEventListener('touchend', tpPenUp, {passive:false});
  }
}

function tpCanvasPoint(e){
  const rect = tpCanvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return { x:(clientX-rect.left)*(tpCanvas.width/rect.width), y:(clientY-rect.top)*(tpCanvas.height/rect.height) };
}
function tpPenDown(e){ e.preventDefault(); tpPenDownFlag = true; const pt = tpCanvasPoint(e); tpCtx.beginPath(); tpCtx.moveTo(pt.x, pt.y); }

  tpCtx.lineTo(pt.x, pt.y); tpCtx.stroke();
}

/* =====================================================================
   v79 — IMAGE LIBRE SUR LA PAGE DE TITRE
   Une image (n'importe quel format que le navigateur sait lire) posée à la place du titre : on la glisse où on veut,
   on l'agrandit / la rétrécit avec les poignées. Position et taille sont enregistrées en % de la page, donc identiques
   à l'écran, à l'impression et dans le PDF. L'image est convertie en PNG (JPEG gardé en JPEG) à l'import : le PDF
   n'accepte nativement que ces deux formats.
===================================================================== */
let tpFreeSel = false;
function tpFreeImgLoad(file){
  const done = src => new Promise(res=>{ const im = new Image(); im.onload = ()=>res(im); im.onerror = ()=>res(null); im.src = src; });
  const reader = new FileReader();
  reader.onerror = ()=>toast(L('Impossible de lire cette image.','Couldn\u2019t read this image.'));
  reader.onload = async ()=>{
    const im = await done(reader.result);
    if(!im){ toast(L('Format d\u2019image non reconnu par le navigateur.','Image format not recognised by the browser.')); return; }
    let w = im.naturalWidth || im.width, h = im.naturalHeight || im.height;
    if(!w || !h){ w = 1000; h = 1000; }   // SVG sans dimensions
    const MAX = 3000, k = Math.min(1, MAX / Math.max(w, h));
    const cw = Math.max(1, Math.round(w*k)), ch = Math.max(1, Math.round(h*k));
    const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
    const ctx = cv.getContext('2d');
    const isJpg = /jpe?g/i.test(file.type || '');
    if(isJpg){ ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,cw,ch); }
    ctx.drawImage(im, 0, 0, cw, ch);
    let url;
    try{ url = isJpg ? cv.toDataURL('image/jpeg', 0.92) : cv.toDataURL('image/png'); }
    catch(err){ toast(L('Impossible de convertir cette image.','Couldn\u2019t convert this image.')); return; }
    const d = ensureTPDesign(S.project);
    const tpEl0 = document.querySelector('#tpPreviewShell .titlepage');
    const pageR = tpEl0 && tpEl0.offsetHeight ? tpEl0.offsetWidth / tpEl0.offsetHeight : (S.project.format==='us' ? 8.5/11 : 21/29.7);
    const wPct = 50, hPct = wPct * (ch/cw) * pageR;
    d.freeImg = { src:url, x:50 - wPct/2, y:Math.max(0, Math.min(100 - hPct, 40 - hPct/2)), w:wPct, h:hPct, ar:ch/cw };
    d.titleHidden = true;   // l'image prend la place du titre
    tpFreeSel = true;
    scheduleAutosave(); refreshTPPreview(); tpRebuildControls();
  };
  reader.readAsDataURL(file);
}
function tpFreeImgApply(){
  const d = ensureTPDesign(S.project), f = d.freeImg;
  const n = document.querySelector('#tpPreviewShell .tp-free-img'); if(!n || !f) return;
  n.style.left = f.x+'%'; n.style.top = f.y+'%'; n.style.width = f.w+'%'; n.style.height = f.h+'%';
}
function tpFreeImgDecorate(shell, tp){
  const n = tp.querySelector('.tp-free-img'); if(!n) return;
  tp.classList.toggle('tp-drawing-on', !!S.tpDrawMode);
  if(S.tpDrawMode) return;
  n.classList.toggle('tp-sel', tpFreeSel);
  if(tpFreeSel){
    ['nw','n','ne','e','se','s','sw','w'].forEach(h=>{ const g = document.createElement('div'); g.className = 'tp-free-h'; g.dataset.h = h; n.appendChild(g); });
  }
  if(!n._tpBound){
    n._tpBound = true;
    n.addEventListener('pointerdown', e=>tpFreeImgDown(e, n, tp));
  }
}
function tpFreeImgDown(e, n, tp){
  if(S.tpDrawMode || (e.button!==undefined && e.button!==0)) return;
  e.preventDefault(); e.stopPropagation();
  const d = ensureTPDesign(S.project), f = d.freeImg; if(!f) return;
  const hEl = e.target.closest ? e.target.closest('.tp-free-h') : null;
  const handle = hEl ? hEl.dataset.h : null;
  const a = document.activeElement; if(a && a!==document.body && a.blur) a.blur();
  if(!tpFreeSel){
    tpFreeSel = true; tpSelect('none');
    tp.querySelectorAll('.tp-free-h').forEach(x=>x.remove());
    n.classList.add('tp-sel');
    ['nw','n','ne','e','se','s','sw','w'].forEach(h=>{ const g = document.createElement('div'); g.className = 'tp-free-h'; g.dataset.h = h; n.appendChild(g); });
  }
  const rect = tp.getBoundingClientRect();
  const sx = e.clientX, sy = e.clientY, o = { x:f.x, y:f.y, w:f.w, h:f.h };
  const pageR = rect.width / rect.height;     // largeur / hauteur de la page
  const ar = o.h / o.w;                       // proportions de départ (en % de page)
  try{ n.setPointerCapture(e.pointerId); }catch(err){}
  const move = ev=>{
    const dx = (ev.clientX - sx) / rect.width * 100, dy = (ev.clientY - sy) / rect.height * 100;
    let x = o.x, y = o.y, w = o.w, h = o.h;
    if(!handle){ x = o.x + dx; y = o.y + dy; }
    else{
      const MIN = 3;
      const L_ = handle.includes('w'), R_ = handle.includes('e'), T_ = handle.includes('n'), B_ = handle.includes('s');
      const corner = handle.length === 2;
      if(L_){ w = o.w - dx; x = o.x + dx; } if(R_){ w = o.w + dx; }
      if(T_){ h = o.h - dy; y = o.y + dy; } if(B_){ h = o.h + dy; }
      if(corner && !ev.shiftKey){
        // coins : proportions gardées (Maj = étirement libre)
        const wFromH = h / ar;
        const useW = Math.abs(w - o.w) * 1 >= Math.abs(wFromH - o.w) * 1;
        if(useW){ h = w * ar; } else { w = wFromH; }
        if(L_) x = o.x + o.w - w; if(T_) y = o.y + o.h - h;
      }
      if(w < MIN){ w = MIN; if(L_) x = o.x + o.w - w; }
      if(h < MIN){ h = MIN; if(T_) y = o.y + o.h - h; }
    }
    f.x = x; f.y = y; f.w = w; f.h = h;
    tpFreeImgApply();
    const sl = document.getElementById('tpFreeImgW'); if(sl){ sl.value = Math.round(f.w); const v = document.getElementById('tpFreeImgWVal'); if(v) v.textContent = Math.round(f.w)+'%'; }
  };
  const up = ()=>{
    n.removeEventListener('pointermove', move); n.removeEventListener('pointerup', up); n.removeEventListener('pointercancel', up);
    try{ n.releasePointerCapture(e.pointerId); }catch(err){}
    scheduleAutosave();
  };
  n.addEventListener('pointermove', move); n.addEventListener('pointerup', up); n.addEventListener('pointercancel', up);
}
function tpFreeImgDeselect(){
  if(!tpFreeSel) return;
  tpFreeSel = false;
  document.querySelectorAll('#tpPreviewShell .tp-free-h').forEach(x=>x.remove());
  document.querySelectorAll('#tpPreviewShell .tp-free-img').forEach(x=>x.classList.remove('tp-sel'));
}
/* cliquer ailleurs que sur l'image la désélectionne */
document.addEventListener('pointerdown', e=>{
  if(!tpFreeSel) return;
  const t = e.target; if(t && t.closest && t.closest('.tp-free-img, #tpFreeImgInput, #tpFreeImgW, [data-act^="tpFreeImg"]')) return;
  tpFreeImgDeselect();
}, true);
function tpFreeImgCenter(){
  const f = ensureTPDesign(S.project).freeImg; if(!f) return;
  f.x = 50 - f.w/2; f.y = Math.max(0, Math.min(100 - f.h, 40 - f.h/2));
  tpFreeImgApply(); scheduleAutosave();
}
function tpFreeImgRatio(){
  const f = ensureTPDesign(S.project).freeImg; if(!f || !f.ar) return;
  const tp = document.querySelector('#tpPreviewShell .titlepage');
  const pageR = tp && tp.offsetHeight ? tp.offsetWidth / tp.offsetHeight : (S.project.format==='us' ? 8.5/11 : 21/29.7);
  const cx = f.x + f.w/2, cy = f.y + f.h/2;
  f.h = f.w * f.ar * pageR; f.x = cx - f.w/2; f.y = cy - f.h/2;
  tpFreeImgApply(); scheduleAutosave();
}
function tpFreeImgRemove(){
  const d = ensureTPDesign(S.project); d.freeImg = null; tpFreeSel = false;
  scheduleAutosave(); refreshTPPreview(); tpRebuildControls();
}
function onTPTabAttach(rebindOnly){
  if(S.tab!=='titlepage') return;
  if(!rebindOnly){ tpCloseMenus(); refreshTPPreview(); tpRenderToolbar(); tpFitPreview(); requestAnimationFrame(tpFitPreview); }
  const bind = (id, evt, fn) => { const el=document.getElementById(id); if(el) el.addEventListener(evt, fn); };
  // Renommer le projet depuis la page de titre. Même effet que le champ
  // « Titre » des Paramètres : on écrit dans le projet, l'aperçu se
  // rafraîchit, et la sauvegarde automatique répercute le nouveau nom dans
  // l'index du portfolio. Un titre entièrement vide est refusé au moment
  // de quitter le champ (un scénario sans nom devient introuvable).
  bind('tpProjectTitle','input', e=>{
    S.project.title = e.target.value;
    scheduleAutosave();
    refreshTPPreview();
    const rail = document.querySelector('.rail-project');
    if(rail) rail.textContent = S.project.title;
  });
  bind('tpProjectTitle','blur', e=>{
    if(!e.target.value.trim()){
      S.project.title = L('Sans titre','Untitled');
      e.target.value = S.project.title;
      scheduleAutosave(); refreshTPPreview();
      const rail = document.querySelector('.rail-project');
      if(rail) rail.textContent = S.project.title;
    }
  });
  bind('tpExtraText','input', e=>{
    S.project.titlePageExtra = e.target.value;
    scheduleAutosave();
    const wrap = document.querySelector('#tpPreviewShell .titlepage .tp-extra-wrap');
    if(wrap){ wrap.innerHTML = tpExtraLinesHtml(e.target.value); tpDecoratePreview(document.getElementById('tpPreviewShell'), document.querySelector('#tpPreviewShell .titlepage')); }
  });
  // Modifier l'auteur depuis la page de titre. Même champ que celui des
  // Paramètres et de la création du projet : on écrit dans le projet, on
  // rafraîchit l'aperçu, et on met à jour le nom retenu par défaut pour la
  // prochaine création (comme le font les traitements de texte pro).
  bind('tpAuthorText','input', e=>{
    S.project.author = e.target.value;
    scheduleAutosave();
    const wrap = document.querySelector('#tpPreviewShell .titlepage .tp-author');
    if(wrap){ wrap.innerHTML = tpAuthorInnerHtml(e.target.value); tpDecoratePreview(document.getElementById('tpPreviewShell'), document.querySelector('#tpPreviewShell .titlepage')); }
  });
  bind('tpAuthorText','blur', e=>{
    if(e.target.value.trim()) setDefaultAuthor(e.target.value.trim());
  });
  bind('tpTitleSize','input', e=>{ ensureTPDesign(S.project).titleSize=+e.target.value; document.getElementById('tpTitleSizeVal').textContent=e.target.value+'pt'; afterTPChangeLight(); });
  bind('tpSubSize','input', e=>{ ensureTPDesign(S.project).subSize=+e.target.value; document.getElementById('tpSubSizeVal').textContent=e.target.value+'pt'; afterTPChangeLight(); });
  bind('tpAuthorSize','input', e=>{ ensureTPDesign(S.project).authorSize=+e.target.value; document.getElementById('tpAuthorSizeVal').textContent=e.target.value+'pt'; afterTPChangeLight(); });
  bind('tpFootSize','input', e=>{ ensureTPDesign(S.project).footSize=+e.target.value; document.getElementById('tpFootSizeVal').textContent=e.target.value+'pt'; afterTPChangeLight(); });
  bind('tpImgOpacity','input', e=>{ ensureTPDesign(S.project).bgImageOpacity=+e.target.value; document.getElementById('tpImgOpacityVal').textContent=Math.round(e.target.value*100)+'%'; afterTPChangeLight(); });
  bind('tpColorPicker','input', e=>{ ensureTPDesign(S.project).color=e.target.value; afterTPChangeLight(); });
  bind('tpFreeImgInput','change', e=>{
    const file = e.target.files && e.target.files[0]; if(!file) return;
    tpFreeImgLoad(file); e.target.value = '';
  });
  bind('tpTitleHidden','change', e=>{
    ensureTPDesign(S.project).titleHidden = !!e.target.checked;
    scheduleAutosave(); refreshTPPreview();
  });
  bind('tpFreeImgW','input', e=>{
    const d = ensureTPDesign(S.project), f = d.freeImg; if(!f) return;
    const ratio = f.h / f.w, cx = f.x + f.w/2, cy = f.y + f.h/2;
    f.w = +e.target.value; f.h = f.w * ratio;
    f.x = cx - f.w/2; f.y = cy - f.h/2;
    const v = document.getElementById('tpFreeImgWVal'); if(v) v.textContent = Math.round(f.w)+'%';
    tpFreeImgApply(); scheduleAutosave();
  });
  bind('tpImageInput','change', e=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{ ensureTPDesign(S.project).bgImage = reader.result; scheduleAutosave(); refreshTPPreview();
      const controls = document.getElementById('tpControlsCol'); if(controls) tpRebuildControls(); };
    reader.readAsDataURL(file);
  });
}

function restoreScene(id){
  const idx = S.project.graveyard.findIndex(x=>x.id===id); if(idx<0) return;
  pushUndo();
  const item = S.project.graveyard[idx];
  S.project.elements.push(...item.elements);
  if(item.meta) S.project.sceneMeta[item.sceneId] = item.meta;
  S.project.graveyard.splice(idx,1);
  scheduleAutosave(); renderTabBody();
  toast(L('Scène restaurée à la fin du scénario.','Scene restored at the end of the screenplay.'));
}
async function purgeScene(id){
  if(!await mmConfirm(L('La scène sera supprimée pour de bon. Cette action est irréversible.','The scene will be deleted for good. This can\u2019t be undone.'),
    {title:L('Supprimer définitivement ?','Delete permanently?'), ok:L('Supprimer','Delete'), danger:true})) return;
  const gone = S.project.graveyard.find(x=>x.id===id);
  if(gone && gone.meta && gone.meta.lockedNum && S.project.settings.numbersLocked){
    if(!S.project.omittedNums) S.project.omittedNums = [];
    if(!S.project.omittedNums.includes(String(gone.meta.lockedNum))) S.project.omittedNums.push(String(gone.meta.lockedNum));
  }
  S.project.graveyard = S.project.graveyard.filter(x=>x.id!==id);
  scheduleAutosave(); renderTabBody();
}

/* CORRECTIF I18N. Le nom par défaut d'une version ("Version du 18/09/2026"
   côté français, "Version of 9/18/2026" côté anglais) était écrit une fois
   pour toutes dans la langue active à l'enregistrement, puis stocké tel
   quel : changer de langue ensuite laissait « Version du » affiché en
   pleine interface anglaise, exactement comme les indicatifs de ligne.
   On ne fige donc plus ce texte quand c'est le nom par défaut, repéré via
   ver.auto : versionLabel() le régénère à l'affichage, dans la langue
   courante. Un nom choisi par l'utilisateur (ver.auto === false) reste lui
   affiché tel quel — c'est du contenu qu'il a écrit, pas un libellé
   d'interface, et il n'y a pas de raison de le traduire. */
function versionDefaultLabel(ts){
  const en = getLang()==='en';
  return (en?'Version of ':'Version du ')+new Date(ts).toLocaleDateString(en?'en-US':'fr-FR');
}
function versionLabel(ver){ return ver.auto ? versionDefaultLabel(ver.timestamp) : ver.label; }
async function createVersion(){
  const ts = Date.now();
  const suggested = versionDefaultLabel(ts);
  const label = await mmPrompt(L('Nom de cette version','Name for this version'), suggested, {title:L('Enregistrer une version','Save a version'), ok:L('Enregistrer','Save')});
  if(label===null) return;
  const trimmed = label.trim();
  const auto = trimmed === suggested.trim();
  S.project.versions.push({
    id: uid('ver'), label: auto ? suggested : (trimmed || L('Sans nom','Untitled')),
    auto, timestamp: ts, elements: snapshot()
  });
  if(S.project.versions.length>25) S.project.versions.shift();
  scheduleAutosave(); renderTabBody();
  toast(L('Version enregistrée.','Version saved.'));
}
async function restoreVersion(id){
  const ver = S.project.versions.find(v=>v.id===id); if(!ver) return;
  if(!await mmConfirm(L('Le scénario actuel sera remplacé par cette version. Ton état actuel restera disponible via Annuler.','The current screenplay will be replaced by this version. Your current state will stay available via Undo.'),
    {title:L('Restaurer cette version ?','Restore this version?'), ok:L('Restaurer','Restore')})) return;
  pushUndo();
  S.project.elements = JSON.parse(JSON.stringify(ver.elements));
  S.diffVerId = null;
  scheduleAutosave(); renderTabBody();
}

/* =====================================================================
   POLICE DU SCÉNARIO
   Un réglage par projet (settings.scriptFont), appliqué via la variable CSS
   --script-font posée sur <html> : la feuille, la mesure de pagination, la
   zone d'impression et les cartons « machine » la lisent toutes. Changer de
   police ne touche pas au texte, seulement à son habillage ; la pagination
   est refaite aussitôt (et à nouveau quand la police est réellement chargée).
===================================================================== */
const SCRIPT_FONTS = [
  {id:'courier-prime', label:'Courier Prime', family:"'Courier Prime','Courier New',monospace"},
  {id:'courier-new',   label:'Courier New',   family:"'Courier New',Courier,monospace"},
  {id:'special-elite', label:'Special Elite (vintage)', family:"'Special Elite','Courier New',monospace"},
  {id:'times',         label:'Times New Roman', family:"'Times New Roman',Tinos,Times,serif"},
  {id:'arial',         label:'Arial', family:"Arial,Arimo,Helvetica,sans-serif"}
];
function scriptFontOf(p){
  const id = p && p.settings && p.settings.scriptFont;
  return SCRIPT_FONTS.find(f => f.id === id) || SCRIPT_FONTS[0];
}
function applyScriptFont(p){
  document.documentElement.style.setProperty('--script-font', scriptFontOf(p).family);
}
function scriptFontSelectHtml(cls){
  const cur = scriptFontOf(S.project).id;
  return `<select class="${cls}" data-scriptfont="1" title="${L('Police du scénario','Screenplay font')}">${
    SCRIPT_FONTS.map(f=>`<option value="${f.id}" ${f.id===cur?'selected':''}>${esc(f.label)}</option>`).join('')}</select>`;
}
function setScriptFont(id){
  const p = S.project; if(!p) return;
  const f = SCRIPT_FONTS.find(x => x.id === id) || SCRIPT_FONTS[0];
  ensureSettings(p).scriptFont = f.id;
  p.updatedAt = Date.now();
  applyScriptFont(p);
  document.querySelectorAll('[data-scriptfont]').forEach(s => { s.value = f.id; });
  repaginateNow();
  if(document.fonts && document.fonts.load){
    document.fonts.load('12pt ' + f.family.split(',')[0]).then(()=>repaginateNow()).catch(()=>{});
  }
  scheduleAutosave();
}
document.addEventListener('change', e=>{
  const t = e.target;
  if(t && t.dataset && t.dataset.scriptfont){ setScriptFont(t.value); t.blur(); closeMoreMenu(); }
});
function setFormat(_, e){ S.project.format = e.target.closest('[data-fmt]').dataset.fmt; renderTabBody(); scheduleAutosave(); }
function saveSettings(){
  const p = S.project;
  p.title = document.getElementById('setTitle').value.trim() || p.title;
  p.author = document.getElementById('setAuthor').value;
  p.kind = document.getElementById('setKind').value;   // '' = rien sur la page de titre
  p.contact = document.getElementById('setContact').value;
  p.version = document.getElementById('setVersion').value;
  p.date = document.getElementById('setDate').value;
  p.settings.titlePageEnabled = document.getElementById('setTitlePage').checked;
  p.settings.showSceneNumbers = document.getElementById('setSceneNum').checked;
  p.settings.numberStart = parseInt(document.getElementById('setNumStart').value,10) || 1;
  const nowLocked = document.getElementById('setNumLock').checked;
  if(nowLocked && !p.settings.numbersLocked) lockCurrentSceneNumbers();
  else if(!nowLocked && p.settings.numbersLocked) unlockSceneNumbers();
  p.settings.numbersLocked = nowLocked;
  p.settings.showPageNumbers = document.getElementById('setPageNum').checked;
  p.settings.numberFirstPage = document.getElementById('setPageNumFirst').checked;
  p.settings.showContinued = document.getElementById('setContinued').checked;
  p.settings.autoContd = document.getElementById('setAutoContd').checked;
  const contdMarkEl = document.getElementById('setContdMark');
  p.settings.contdMark = contdMarkEl ? contdMarkEl.value : 'auto';
  p.settings.pageNumberStart = parseInt(document.getElementById('setPageStart').value,10) || 1;
  const lsEl = document.getElementById('setLineSpacing');
  if(lsEl){ p.settings.lineSpacing = lsEl.value === 'comfort' ? 'comfort' : 'standard'; applyLineSpacing(p); }
  const wmEl = document.getElementById('setWatermark');
  p.settings.watermarkText = wmEl ? wmEl.value.trim() : '';
  if(p.seriesId){
    const snEl = document.getElementById('setSeriesName');
    const ssEl = document.getElementById('setSeason');
    const seEl = document.getElementById('setEpisode');
    const snaEl = document.getElementById('setSeasonName');
    const newSeriesName = (snEl ? snEl.value.trim() : '') || p.seriesName;
    p.season = Math.max(1, parseInt(ssEl && ssEl.value, 10) || 1);
    p.episode = Math.max(1, parseInt(seEl && seEl.value, 10) || 1);
    p.seasonName = snaEl ? snaEl.value.trim() : (p.seasonName||'');
    if(newSeriesName !== p.seriesName){
      // Le nom de la série est partagé par tous les épisodes : on le
      // répercute sur les autres entrées de l'index et leurs projets.
      p.seriesName = newSeriesName;
      seriesEntries(p.seriesId).forEach(async entry=>{
        if(entry.id === p.id) return;
        entry.seriesName = newSeriesName;
        const full = await storGet(proj_key(entry.id));
        if(full){ full.seriesName = newSeriesName; await storSet(proj_key(entry.id), full); }
      });
    }
    // Le nom de saison est partagé par tous les épisodes de la même saison :
    // on le répercute de la même façon, une fois cet épisode sauvegardé.
    applySeasonName(p.seriesId, p.season, p.seasonName).then(saveIndex);
  }
  scheduleAutosave();
  toast(L('Paramètres enregistrés.','Settings saved.'));
  renderTabBody();
}

/* =====================================================================
   COMMENTAIRES DE LIGNE
   -----------------------------------------------------------------
   Fonctionnalité empruntée à WriterDuet (et absente de Raging Page jusqu'ici) :
   attacher une remarque à une ligne précise du script — repère visuel
   discret dans la marge, jamais dans le texte, jamais dans les exports
   (PDF/TXT/Fountain), exactement comme les commentaires en marge d'un
   traitement de texte collaboratif. Stockés à part (S.project.comments,
   indexé par id de ligne), donc totalement invisibles à tout le code
   existant qui ne lit que el.text. */
function commentsMap(){
  if(!S.project.comments) S.project.comments = {};
  return S.project.comments;
}
function openCommentEditor(id){
  const el = findEl(id); if(!el) return;
  const current = commentsMap()[id] || '';
  const html = `<div class="modal-backdrop" id="commentBackdrop" data-act="closeCommentEditor">
    <div class="modal" style="max-width:420px;" data-stop="1">
      <h2>${L('Commentaire','Comment')}</h2>
      <p style="font-size:13.5px;color:var(--ink-soft);margin:-8px 0 14px;">${L('Visible uniquement dans l\u2019éditeur (petit repère 💬 dans la marge), n\u2019apparaîtra jamais dans les exports.','Visible only in the editor (a small 💬 marker in the margin), will never appear in exports.')}</p>
      <div class="field"><textarea id="commentText" rows="4" placeholder="${L('Écris ta remarque ici…','Write your note here…')}">${esc(current)}</textarea></div>
      <div class="modal-actions">
        ${current ? `<button class="btn btn-danger" data-act="deleteCommentEditor" data-id="${id}">${L('Supprimer','Delete')}</button>` : ''}
        <button class="btn btn-ghost" data-act="closeCommentEditor">${L('Annuler','Cancel')}</button>
        <button class="btn btn-primary" data-act="saveCommentEditor" data-id="${id}">${L('Enregistrer','Save')}</button>
      </div>
    </div></div>`;
  document.body.insertAdjacentHTML('beforeend', html);
  const ta = document.getElementById('commentText');
  if(ta){ ta.focus(); ta.selectionStart = ta.selectionEnd = ta.value.length; }
}
function closeCommentEditor(){ const b=document.getElementById('commentBackdrop'); if(b) b.remove(); }
function refreshCommentMarker(id){
  const div = document.querySelector('#page [data-id="'+id+'"]');
  if(!div) return;
  const text = commentsMap()[id];
  if(text){ div.dataset.comment='1'; div.title = L('Commentaire : ','Comment: ') + text; }
  else { delete div.dataset.comment; div.removeAttribute('title'); }
}
function saveCommentEditor(id){
  const ta = document.getElementById('commentText');
  const text = ta ? ta.value.trim() : '';
  const map = commentsMap();
  if(text) map[id] = text; else delete map[id];
  closeCommentEditor();
  refreshCommentMarker(id);
  scheduleAutosave();
}
function deleteCommentEditor(id){
  delete commentsMap()[id];
  closeCommentEditor();
  refreshCommentMarker(id);
  scheduleAutosave();
}
