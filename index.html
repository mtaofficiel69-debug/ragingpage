}
function attachSeriesExportSeasonToggles(){
  document.querySelectorAll('.expSeasonChk').forEach(cb=>{
    cb.addEventListener('change', e=>{
      const group = e.target.closest('.expSeasonGroup');
      if(group) group.querySelectorAll('.expChk').forEach(x=> x.checked = e.target.checked);
    });
  });
}
function seriesExportSelectAll(val){
  const checked = val === '1';
  document.querySelectorAll('#seriesExportBackdrop .expChk, #seriesExportBackdrop .expSeasonChk').forEach(x=> x.checked = checked);
}
function closeSeriesExportMenu(){ const b=document.getElementById('seriesExportBackdrop'); if(b) b.remove(); }
async function doSeriesExport(seriesId, e){
  const btn = e.target.closest('[data-act]');
  const mode = btn ? btn.dataset.mode : null;
  const checkedIds = Array.from(document.querySelectorAll('#seriesExportBackdrop .expChk:checked')).map(x=>x.dataset.id);
  if(!checkedIds.length){ toast(L('Sélectionne au moins un épisode.','Select at least one episode.')); return; }
  const entries = seriesEntries(seriesId).filter(e=>checkedIds.includes(e.id));
  closeSeriesExportMenu();
  if(mode==='pdfMerged') await exportSeriesPDFMerged(entries);
  else if(mode==='pdfSeparate') await exportSeriesPDFSeparate(entries);
  else if(mode==='txt') await exportSeriesTXT(entries);
  else if(mode==='fountain') await exportSeriesFountain(entries);
  else if(mode==='fdx') await exportSeriesFDX(entries);
}
async function exportSeriesPDFMerged(entries){
  toast(L('Génération du PDF de la série…','Generating the series PDF…'));
  try{
    const jsPDF = await loadJsPdf();
    const allPages = [];
    for(const entry of entries){
      const p = await storGet(proj_key(entry.id));
      if(!p) continue;
      const pages = await buildEpisodePagesForPDF(p);
      pages.forEach(pg=> allPages.push(pg));
    }
    if(!allPages.length) throw new Error('rien à exporter');
    const doc = new jsPDF({ unit:'pt', orientation:'portrait', format:[allPages[0].wPt, allPages[0].hPt], compress:true });
    allPages.forEach((page, i)=>{
      if(i>0) doc.addPage([page.wPt, page.hPt], 'portrait');
      pdfPaintPage(doc, page);
    });
    const seriesName = entries.find(e=>e.seriesName)?.seriesName || L('Série','Series');
    doc.setProperties({ title: seriesName });
    const filename = (seriesName.replace(/[\\/:*?"<>|]+/g,' ').trim() || 'serie') + '.pdf';
    const blob = doc.output('blob');
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
    toast(L('PDF téléchargé (','PDF downloaded (') + entries.length + ' ' + L('épisode'+(entries.length>1?'s':'')+' fusionnés).','episode'+(entries.length>1?'s':'')+' merged).'));
    setTimeout(()=>{ try{ URL.revokeObjectURL(url); }catch(e){} }, 180000);
  }catch(err){
    console.error(err);
    toast(L('Impossible de générer le PDF (','Couldn’t generate the PDF (') + (err && err.message ? err.message : L('erreur inconnue','unknown error')) + ').');
  }
}
async function exportSeriesPDFSeparate(entries){
  toast(L('Génération des PDF…','Generating the PDFs…'));
  try{
    const jsPDF = await loadJsPdf();
    for(let i=0;i<entries.length;i++){
      const p = await storGet(proj_key(entries[i].id));
      if(!p) continue;
      const pages = await buildEpisodePagesForPDF(p);
      if(!pages.length) continue;
      const doc = new jsPDF({ unit:'pt', orientation:'portrait', format:[pages[0].wPt, pages[0].hPt], compress:true });
      pages.forEach((page, k)=>{ if(k>0) doc.addPage([page.wPt, page.hPt], 'portrait'); pdfPaintPage(doc, page); });
      doc.setProperties({ title:p.title || 'Épisode', author:p.author||'' });
      const label = 'S' + (p.season||1) + 'E' + (p.episode||1);
      const filename = ((p.seriesName||'Série') + ' - ' + label + ' - ' + (p.title||'Episode'))
        .replace(/[\\/:*?"<>|]+/g,' ').trim() + '.pdf';
      const blob = doc.output('blob');
      const url = URL.createObjectURL(blob);
      // Un léger délai entre chaque téléchargement : plusieurs navigateurs
      // bloquent ou avalent les téléchargements déclenchés en rafale.
      await new Promise(res=>{
        setTimeout(()=>{
          const a = document.createElement('a'); a.href=url; a.download=filename;
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(()=>{ try{ URL.revokeObjectURL(url); }catch(e){} }, 180000);
          res();
        }, i===0 ? 0 : 500);
      });
    }
    toast(entries.length + ' ' + L('PDF téléchargés (un par épisode).','PDFs downloaded (one per episode).'));
  }catch(err){
    console.error(err);
    toast(L('Impossible de générer les PDF (','Couldn’t generate the PDFs (') + (err && err.message ? err.message : L('erreur inconnue','unknown error')) + ').');
  }
}
async function exportSeriesFountain(entries){
  let out = '', first = null;
  for(const entry of entries){
    const p = await storGet(proj_key(entry.id));
    if(!p) continue;
    if(!p.tagDefs) p.tagDefs = {};
    if(!first) first = p;
    const head = (p.seriesName || 'Série') + ' · S' + (p.season||1) + 'E' + (p.episode||1) + (p.title ? (' · ' + p.title) : '');
    await withSwappedProject(p, ()=>{
      ensureSettings(p);
      const lg = revLegendText(p);
      out += (out ? '\n===\n\n' : '') + '# ' + head + '\n\n' + (lg ? '[[' + lg.replace(/\n+/g, ' — ') + ']]\n\n' : '') + elementsToText(visibleElements(), true) + '\n';
    });
  }
  if(!out) return;
  const seriesName = entries.find(e=>e.seriesName)?.seriesName || L('Série','Series');
  downloadBlob((seriesName.replace(/[\\/:*?"<>|]+/g,' ').trim() || 'serie') + '.fountain', 'Title: ' + seriesName + '\nAuthor: ' + ((first && first.author) || '') + '\n\n' + out, 'text/plain');
}
/* Final Draft : un script = un épisode, donc un .fdx par épisode. */
async function exportSeriesFDX(entries){
  let n = 0;
  for(const entry of entries){
    const p = await storGet(proj_key(entry.id));
    if(!p) continue;
    if(!p.tagDefs) p.tagDefs = {};
    let xml = '';
    await withSwappedProject(p, ()=>{ ensureSettings(p); xml = fdxDocument(p); });
    const nm = ((p.seriesName || 'Serie') + ' S' + (p.season||1) + 'E' + (p.episode||1) + (p.title ? ' ' + p.title : '')).replace(/[\\/:*?"<>|]+/g,' ').trim();
    downloadBlob(nm + '.fdx', xml, 'application/xml');
    if(++n < entries.length) await new Promise(r=>setTimeout(r, 400));   // laisse le navigateur accepter plusieurs téléchargements
  }
}
async function exportSeriesTXT(entries){
  let out = '';
  for(const entry of entries){
    const p = await storGet(proj_key(entry.id));
    if(!p) continue;
    if(!p.tagDefs) p.tagDefs = {};
    out += (p.seriesName || 'Série') + ' · S' + (p.season||1) + 'E' + (p.episode||1) + (p.title ? (' · ' + p.title) : '') + '\n';
    out += '='.repeat(44) + '\n\n';
    await withSwappedProject(p, ()=>{ const lg = revLegendText(p); if(lg) out += lg + '\n\n'; out += elementsToText(visibleElements(), false); });
    out += '\n\n';
  }
  const seriesName = entries.find(e=>e.seriesName)?.seriesName || L('Série','Series');
  downloadBlob((seriesName.replace(/[\\/:*?"<>|]+/g,' ').trim() || 'serie') + '.txt', out, 'text/plain');
}

/* =====================================================================
   IMPORT (txt / fountain / pdf)
   ---------------------------------------------------------------------
   Un seul classifieur de lignes est partagé par les trois formats. Pour
   .txt et .fountain on ne dispose que du texte ; pour .pdf on dispose EN
   PLUS de la position horizontale de chaque ligne, un signal bien plus
   fiable pour distinguer PERSONNAGE / DIALOGUE que la seule casse du texte
   (une police d'export PDF respecte toujours l'indentation standard du
   scénario, même quand la casse a été perdue en aval).
===================================================================== */

/* Une ligne est une en-tête de scène si elle commence par un indicatif
   standard (INT./EXT./INT.-EXT./EST.), OU — cas des scripts français —
   par un mot-clé de montage qui joue le même rôle d'en-tête de séquence
   sans indicatif (« SÉRIE DE PLANS », « MONTAGE »…). Les deux formes sont
   utilisées par les logiciels professionnels comme repères de haut niveau
   au même titre qu'un INT./EXT. */
function isSceneHeading(t){
  if(/^(INT|EXT|INT\.\/EXT|EXT\.\/INT|EST)[.\s]/i.test(t)) return true;
  if(/^(S[ÉE]RIE DE PLANS|SUITE DE PLANS|ENCHA[ÎI]NEMENT DE PLANS|MONTAGE)\b/i.test(t)) return true;
  return false;
}

/* Une ligne de TRANSITION (« COUPE À :», « CUT TO: », « FONDU AU NOIR »…)
   est courte, tout en majuscules, et se termine presque toujours par
   « À/A/SUR/TO » ou reprend un des quelques mots-clés standard du métier —
   côté français comme côté anglo-saxon. Avant ce correctif, seule la forme
   anglaise « ... TO: » était reconnue : toute transition française (très
   courante dans un scénario français) retombait sur la règle générale des
   lignes courtes en capitales et finissait classée PERSONNAGE, d'où des
   « COUPE À : » qui polluaient la liste des personnages. */
const TRANSITION_WORDS = new Set([
  'CUT','CUT TO','SMASH CUT TO','MATCH CUT TO','JUMP CUT TO','TIME CUT TO','QUICK CUT TO',
  'HARD CUT TO','DISSOLVE TO','WIPE TO','IRIS IN','IRIS OUT','FADE IN','FADE OUT',
  'FADE TO','FADE TO BLACK','FADE TO WHITE','BLACKOUT','BLACK','THE END','END',
  'COUPE','COUPE A','COUPE À','COUPE SUR','COUPE FRANCHE','CUT A','CUT À',
  'ENCHAINEMENT','ENCHAÎNEMENT','RACCORD','FONDU','FONDU AU NOIR','FONDU AU BLANC',
  'FONDU ENCHAINE','FONDU ENCHAÎNÉ',"FONDU D'OUVERTURE",'OUVERTURE EN FONDU',
  'FERMETURE EN FONDU','ECRAN NOIR','ÉCRAN NOIR','NOIR','GENERIQUE','GÉNÉRIQUE',
  'GENERIQUE DE DEBUT','GÉNÉRIQUE DE DÉBUT','GENERIQUE DE FIN','GÉNÉRIQUE DE FIN','FIN'
]);
function isTransitionLine(t){
  const raw = t.trim();
  const hadColon = /:\s*$/.test(raw);
  const s = raw.replace(/[.:]+$/,'').trim().toUpperCase();
  if(!s || s.length>40) return false;
  if(TRANSITION_WORDS.has(s)) return true;
  // Filet générique : une ligne qui finit par TO / A / À / SUR n'est fiable
  // comme repère de transition QUE si elle se termine par « : » dans le
  // texte d'origine — c'est la convention universelle des transitions
  // (« CUT TO: », « COUPE À : »). Sans ce garde-fou, un simple prénom de
  // personnage en capitales se terminant par A (SARA, ANNA, LISA…) aurait
  // été pris pour une transition.
  return hadColon && /^[A-ZÀ-Ý' ]+(TO|A|À|SUR)$/.test(s) && s.split(' ').length<=4;
}

/* Classifie UNE ligne de texte déjà nettoyée (jamais vide, jamais bordée
   d'espaces). `indentBucket` vaut null (texte seul, .txt/.fountain) ou
   'baseline' / 'dialogue' / 'character' / 'indented' (indentation connue
   mais document à un seul niveau de retrait, ambiguë sans le texte).
   Renvoie { type, text, expect } où `expect` indique si la ligne SUIVANTE
   doit être traitée comme un dialogue par défaut. */
function classifyScreenplayLine(t, indentBucket, expectDialogue){
  // Convention Fountain : « JEANNE ^ » = réplique jouée en même temps que
  // la précédente. On retire la marque du texte et on la remonte comme
  // drapeau, sans quoi le ^ finirait imprimé dans le nom du personnage.
  const caret = /^(.*\S)\s*\^\s*$/.exec(t);
  if(caret){
    const name = caret[1];
    if(name === name.toUpperCase() && /[A-ZÀ-Ý]/.test(name))
      return { type:'character', text:name, expect:true, dual:true };
  }
  // CORRECTIF. Beaucoup de scripts (dont les exports PDF) collent le
  // numéro de scène devant l'indicatif : « 1 INT. TAXI - NUIT ». Comme
  // Raging Page numérote déjà les scènes tout seul, on retire ce numéro s'il
  // précède bien une vraie en-tête de scène — jamais sinon, pour ne pas
  // amputer une ligne d'action qui commencerait légitimement par un chiffre.
  const numberedMatch = t.match(/^\d+[A-Za-z]?\.?\s+(.+)$/);
  if(numberedMatch && isSceneHeading(numberedMatch[1]))
    return { type:'scene', text:numberedMatch[1], expect:false };
  if(isSceneHeading(t))
    return { type:'scene', text:t, expect:false };
  // « > Texte » force une transition quel que soit le texte (convention
  // Fountain) ; sinon on retombe sur la détection par mots-clés/casse.
  if(/^>.*<\s*$/.test(t))
    return { type:'card', text:t.replace(/^>\s*/,'').replace(/\s*<\s*$/,''), expect:false };
  if(t.startsWith('>'))
    return { type:'transition', text:t.replace(/^>\s*/,''), expect:false };
  if(isTransitionLine(t) && t === t.toUpperCase())
    return { type:'transition', text:t, expect:false };
  if(t.startsWith('('))
    return { type:'parenthetical', text:t, expect:expectDialogue };

  const allCapsShort = t === t.toUpperCase() && t.length < 40 && /[A-ZÀ-Ý]/.test(t) && !/[a-zà-ÿ]/.test(t);

  if(indentBucket === 'character') return { type:'character', text:t, expect:true };
  if(indentBucket === 'dialogue')
    return { type: (expectDialogue || !allCapsShort) ? 'dialogue' : 'character', text:t, expect:true };
  if(indentBucket === 'indented'){
    // Un seul niveau de retrait détecté dans tout le document : on ne peut
    // pas distinguer géométriquement personnage et dialogue, on retombe
    // sur la casse — comme pour .txt/.fountain.
    if(allCapsShort) return { type:'character', text:t, expect:true };
    if(expectDialogue) return { type:'dialogue', text:t, expect:true };
    return { type:'action', text:t, expect:false };
  }
  if(indentBucket === 'baseline'){
    // CORRECTIF. Position réellement mesurée, et cette ligne est au ras de
    // la marge de gauche : dans une mise en page standard, le dialogue est
    // TOUJOURS retrait — jamais à la marge. Contrairement au cas 'indented'
    // ci-dessus, on ne doit donc jamais retomber sur `expectDialogue` ici :
    // sinon une simple ligne d'action juste après une réplique (sans ligne
    // vide franche entre les deux) était prise pour la suite du dialogue.
    return allCapsShort ? { type:'character', text:t, expect:true } : { type:'action', text:t, expect:false };
  }
  // indentBucket vaut null : aucune information de position (.txt/.fountain,
  // ou PDF dont tout le texte partage la même colonne — mise en page trop
  // inhabituelle pour qu'on en tire quoi que ce soit). On retombe sur la
  // seule casse, comme le faisait l'importeur .txt d'origine.
  if(allCapsShort) return { type:'character', text:t, expect:true };
  if(expectDialogue) return { type:'dialogue', text:t, expect:true };
  return { type:'action', text:t, expect:false };
}

/* Termine un import commun aux trois formats : crée le projet, l'enregistre,
   bascule dans l'éditeur. */
async function finishImport(elements, title, warning, author, extra){
  if(!elements.length) elements.push(newElement('action',''));
  // Rien sous le titre : le type de projet est inconnu à l'import, et il est
  // modifiable à tout moment dans les réglages du projet.
  const p = newProject(title, 'fr', '');
  p.elements = elements;
  if(author) p.author = author;
  if(typeof extra === 'function'){ try{ extra(p); }catch(e){} }
  S.project = p;
  S.projectsIndex.push({ id:p.id, title:p.title, format:p.format, updatedAt:p.updatedAt });
  await saveIndex(); await storSet(proj_key(p.id), p);
  S.view='editor'; S.tab='editor'; S.undoStack=[]; S.redoStack=[];
  render();
  toast(warning || 'Import terminé, vérifie les types de lignes détectés.');
}

function onImportFile(e){
  const file = e.target.files[0]; if(!file) return;
  const ext = (file.name.match(/\.([a-z0-9]+)$/i) || [,''])[1].toLowerCase();
  e.target.value = '';
  if(ext === 'pdf') importPdfFile(file);
  else if(ext === 'fdx') importFDXFile(file);
  else if(ext === 'smmproj' || ext === 'json') importBackupFile(file);
  else importTextFile(file);
}

/* ---------------------------------------------------------------------
   Import Final Draft (.fdx)
   ---------------------------------------------------------------------
   Raging Page savait déjà ÉCRIRE du .fdx (exportFDX) mais pas le relire, ce
   qui rendait l'échange à sens unique : impossible de récupérer un
   scénario venu de Final Draft, WriterDuet, Fade In, Celtx… alors que tous
   exportent ce format.

   Un .fdx est du XML, pas du texte libre : chaque paragraphe y porte déjà
   son type (<Paragraph Type="Character">). Il n'y a donc RIEN à deviner —
   contrairement à l'import .txt ou .pdf, qui doivent classer les lignes à
   l'aveugle. C'est l'import le plus fiable de l'application, et le mapping
   est exactement l'inverse de fdxParagraphType().
--------------------------------------------------------------------- */
function fdxTypeToElement(type){
  switch(String(type||'').trim().toLowerCase()){
    case 'scene heading': return 'scene';
    case 'character':     return 'character';
    case 'parenthetical': return 'parenthetical';
    case 'dialogue':      return 'dialogue';
    case 'transition':    return 'transition';
    case 'shot':          return 'shot';
    case 'general':       return 'text';
    case 'action':        return 'action';
    default:              return 'action';
  }
}
/* Le texte d'un paragraphe FDX est découpé en plusieurs <Text> dès qu'il
   change de style (gras, italique, souligné…). On les recolle bout à bout :
   Raging Page stocke du texte brut par ligne, le style ne se perd donc pas
   « à moitié », il ne suit simplement pas — comme pour les autres imports. */
function fdxParagraphText(par){
  const runs = par.getElementsByTagName('Text');
  let t = '';
  if(runs.length){ for(let i=0;i<runs.length;i++) t += runs[i].textContent || ''; }
  else t = par.textContent || '';
  return t.replace(/\s+/g,' ').trim();
}
function importFDXFile(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    let doc = null;
    try{ doc = new DOMParser().parseFromString(String(reader.result), 'application/xml'); }catch(e){ doc = null; }
    // parseFromString ne lève pas d'exception sur un XML cassé : il renvoie
    // un document contenant <parsererror>. C'est le seul test fiable.
    if(!doc || doc.getElementsByTagName('parsererror').length || !doc.getElementsByTagName('FinalDraft').length){
      toast(L('Ce fichier .fdx n\u2019a pas pu être lu : il est peut-être endommagé.','This .fdx file couldn\u2019t be read: it may be damaged.'));
      return;
    }
    // On ne prend QUE les paragraphes du <Content> principal du script :
    // ceux d'un éventuel <TitlePage> servent au titre/à l'auteur, pas au
    // corps du scénario (sinon la page de titre se retrouve collée en tête
    // du texte, comme une scène).
    const titlePage = doc.getElementsByTagName('TitlePage')[0] || null;
    const inTitlePage = node => { let n = node; while(n){ if(n === titlePage) return true; n = n.parentNode; } return false; };

    const pars = Array.prototype.filter.call(doc.getElementsByTagName('Paragraph'), p=> !inTitlePage(p));
    const elements = [], revIds = [];
    // Dialogue simultané : Final Draft enferme les deux blocs dans un
    // <DualDialogue>. Le DEUXIÈME personnage rencontré à l'intérieur est
    // celui qui porte le drapeau chez nous (colonne de droite).
    const dualBoxOf = node => { let n = node; while(n){ if(n.nodeName === 'DualDialogue') return n; n = n.parentNode; } return null; };
    let curBox = null, charsInBox = 0;
    pars.forEach(par=>{
      const txt = fdxParagraphText(par);
      if(!txt) return;                     // lignes vides d'aération du .fdx
      const type = fdxTypeToElement(par.getAttribute('Type'));
      const box = dualBoxOf(par);
      if(box !== curBox){ curBox = box; charsInBox = 0; }
      const el = newElement(type, txt);
      if(box && type === 'character' && ++charsInBox >= 2) el.dual = true;
      elements.push(el);
      // Révisions : on garde le plus grand RevisionID porté par le paragraphe.
      let rv = 0;
      Array.prototype.forEach.call(par.getElementsByTagName('Text'), t=>{ rv = Math.max(rv, parseInt(t.getAttribute('RevisionID'), 10) || 0); });
      revIds.push(rv);
    });

    // Révisions Final Draft → révisions colorées (dates inconnues : date d'import).
    const revExtra = (()=>{
      const used = Array.from(new Set(revIds.filter(x=>x>0))).sort((a,b)=>a-b);
      if(!used.length) return null;
      const decl = {};
      Array.prototype.forEach.call(doc.getElementsByTagName('Revision'), r=>{ decl[parseInt(r.getAttribute('ID'),10)] = r.getAttribute('Name') || ''; });
      const ids = Array.from(new Set(used.concat(Object.keys(decl).map(Number).filter(x=>x>0)))).sort((a,b)=>a-b);
      return p=>{
        const rounds = ids.map((id, j)=>{
          const nm = String(decl[id] || '').toLowerCase();
          const c = REV_COLORS.find(c=> nm.indexOf(c.en.toLowerCase()) === 0) || REV_COLORS[j % REV_COLORS.length];
          return { color:c.id, date:Date.now(), base:{} };
        });
        const rIdx = {}; ids.forEach((id, j)=>{ rIdx[id] = j; });
        // Une ligne portant la révision j est absente de la photo j (donc marquée j) et présente dans les suivantes.
        p.elements.forEach((el, i)=>{
          const own = revIds[i] > 0 ? rIdx[revIds[i]] : -1;
          rounds.forEach((rd, j)=>{ if(own < j) rd.base[el.id] = el.text; });
        });
        p.rev = { rounds, show:true, inExport:true, paper:true, inText:true, manual:{}, hidden:{} };
      };
    })();

    // Titre et auteur depuis la page de titre du .fdx quand elle existe,
    // sinon le nom du fichier (comme les autres imports).
    let title = file.name.replace(/\.fdx$/i,'');
    let author = '';
    if(titlePage){
      const tp = Array.prototype.map.call(titlePage.getElementsByTagName('Paragraph'), fdxParagraphText).filter(Boolean);
      if(tp.length){
        title = tp[0];
        const a = tp.find(l=>/^(written by|écrit par|by|de)\b/i.test(l));
        if(a) author = a.replace(/^(written by|écrit par|by|de)\s*/i,'').trim();
        else if(tp[1] && tp[1].length < 60) author = tp[1];
      }
    }
    if(!elements.length){
      toast(L('Aucun texte trouvé dans ce .fdx.','No text found in this .fdx.'));
      return;
    }
    finishImport(elements, title, 'Import Final Draft terminé : les types de lignes viennent du fichier, rien n\u2019a été deviné.' + (revExtra ? ' Les révisions ont été reconstituées (dates = jour d\u2019import).' : ''), author, revExtra);
  };
  reader.readAsText(file);
}

/* ---------------------------------------------------------------------
   Sauvegarde complète du projet (.smmproj)
   ---------------------------------------------------------------------
   POURQUOI C'EST ESSENTIEL : tout Raging Page vit dans le localStorage de CE
   navigateur. Vider les données du navigateur, changer d'ordinateur, passer
   en navigation privée, ou une simple mise à jour agressive du navigateur —
   et les scénarios disparaissent, sans copie nulle part. C'est la seule
   chose que WriterDuet fait et que Raging Page ne faisait pas du tout : garder
   le travail ailleurs que dans le navigateur.

   Les exports existants (PDF, txt, Fountain, fdx) ne remplacent PAS une
   sauvegarde : ils ne contiennent que le texte du scénario. Les notes, les
   outlines, les tags, les scènes au cimetière, les versions, le design de
   la page de titre — tout cela n'existe dans aucun d'eux. Le .smmproj est
   simplement le projet entier tel qu'il est stocké, dans un fichier.
--------------------------------------------------------------------- */
/* =====================================================================
   SAUVEGARDE AUTOMATIQUE PÉRIODIQUE
   ---------------------------------------------------------------------
   Sans compte ni cloud, l'unique exemplaire d'un scénario en cours
   d'écriture vit dans ce navigateur. Toutes les AUTO_BACKUP_INTERVAL_MS
   d'écriture active — et juste avant de quitter l'onglet — Raging Page
   télécharge discrètement une sauvegarde .smmproj du scénario ouvert :
   le même fichier que "Exporter > Sauvegarde complète", en automatique.
   Ne se déclenche que s'il y a eu du changement depuis la dernière
   sauvegarde, pour ne jamais empiler des fichiers identiques. Réglage
   coupable à tout moment dans Paramètres.
===================================================================== */
/* Niveaux de protection : l'ancien réglage (un fichier toutes les 20 min)
   en faisait beaucoup trop. Par défaut : « discrète » (au plus un fichier
   toutes les 4 h d'écriture). Chacun peut monter, baisser ou couper. */
const AUTO_BACKUP_LEVELS = { low: 4*60*60*1000, normal: 60*60*1000, high: 20*60*1000 };
const AUTO_BACKUP_LEVEL_KEY = 'scriptmm_auto_backup_level';
const AUTO_BACKUP_INTERVAL_MS = AUTO_BACKUP_LEVELS.low;
function backupLevel(){
  try{
    const v = localStorage.getItem(AUTO_BACKUP_LEVEL_KEY);
    if(v === 'off' || AUTO_BACKUP_LEVELS[v]) return v;
    if(localStorage.getItem(AUTO_BACKUP_PREF_KEY) === '0') return 'off'; // ancien réglage « désactivé » respecté
  }catch(e){}
  return 'low';
}
function setBackupLevel(_, e){
  const el = e && e.target && e.target.closest && e.target.closest('[data-lvl]');
  if(!el) return;
  const v = el.dataset.lvl;
  try{ localStorage.setItem(AUTO_BACKUP_LEVEL_KEY, v); localStorage.setItem(AUTO_BACKUP_PREF_KEY, v === 'off' ? '0' : '1'); }catch(err){}
  if(S.view==='editor' && S.tab==='settings') renderTabBody();
}
const LAST_BACKUP_KEY = 'scriptmm_last_backup_at';
const AUTO_BACKUP_PREF_KEY = 'scriptmm_auto_backup_enabled';
function getLastBackupAt(){
  try{ return parseInt(localStorage.getItem(LAST_BACKUP_KEY), 10) || 0; }catch(e){ return 0; }
}
function setLastBackupAt(ts){ try{ localStorage.setItem(LAST_BACKUP_KEY, String(ts)); }catch(e){} }
function isAutoBackupEnabled(){
  return backupLevel() !== 'off';
}
function setAutoBackupEnabled(on){ try{ localStorage.setItem(AUTO_BACKUP_LEVEL_KEY, on ? (backupLevel()==='off' ? 'low' : backupLevel()) : 'off'); localStorage.setItem(AUTO_BACKUP_PREF_KEY, on?'1':'0'); }catch(e){} }
function toggleAutoBackup(){
  setAutoBackupEnabled(!isAutoBackupEnabled());
  if(S.view==='editor' && S.tab==='settings') renderTabBody();
}
function dueForBackup(){
  if(!S.project || !isAutoBackupEnabled()) return false;
  const last = getLastBackupAt();
  if(Date.now() - last < (AUTO_BACKUP_LEVELS[backupLevel()] || AUTO_BACKUP_INTERVAL_MS)) return false;
  return (S.project.updatedAt||0) > last; // modifié depuis la dernière sauvegarde fichier
}
function downloadProjectBackup(p, silent){
  const payload = { app:'Raging Page', kind:'project-backup', version:1, savedAt:Date.now(), project:p };
  const name = (p.title||'scenario').replace(/[\\/:*?"<>|]/g,'-');
  downloadBlob(name + '.smmproj', JSON.stringify(payload), 'application/json');
  setLastBackupAt(Date.now());
  toast(silent ? (L('Sauvegarde automatique : ','Automatic backup: ')+name+L('.smmproj téléchargé.','.smmproj downloaded.')) : L('Sauvegarde enregistrée : garde ce fichier hors du navigateur.','Backup saved: keep this file outside the browser.'));
}
function runAutoBackupIfDue(){
  if(!dueForBackup()) return;
  flushAutosave();
  downloadProjectBackup(S.project, true);
}
function onVisibilityChangeAutoBackup(){
  if(document.hidden) runAutoBackupIfDue();
}
function exportBackup(){
  closeExportMenu();
  flushAutosave();
  downloadProjectBackup(S.project, false);
}
function importBackupFile(file){
  const reader = new FileReader();
  reader.onload = async ()=>{
    let data = null;
    try{ data = JSON.parse(String(reader.result)); }catch(e){ data = null; }
    const src = data && data.project ? data.project : null;
    if(!src || !Array.isArray(src.elements)){
      toast(L('Ce fichier n\u2019est pas une sauvegarde Raging Page.','This file isn\u2019t a Raging Page backup.'));
      return;
    }
    // On RESTAURE TOUJOURS SOUS UN NOUVEL IDENTIFIANT. Sans cela, restaurer
    // une vieille sauvegarde écraserait silencieusement la version en cours
    // du même projet — exactement l'accident qu'une sauvegarde doit éviter.
    // Le scénario restauré arrive donc à côté, jamais à la place.
    const p = JSON.parse(JSON.stringify(src));
    p.id = uid('proj');
    p.updatedAt = Date.now();
    // Un épisode restauré rejoint sa série si elle est encore là ; sinon il
    // redevient un scénario autonome plutôt qu'un épisode orphelin
    // rattaché à une série qui n'existe plus.
    if(p.seriesId && !S.projectsIndex.some(e=>e.seriesId===p.seriesId)){
      p.seriesId = null; p.season = null; p.episode = null;
    }
    ensureSettings(p); ensureTPDesign(p); ensureStructure(p);
    if(!p.sceneMeta) p.sceneMeta = {};
    if(!p.tagDefs) p.tagDefs = {};
    if(!Array.isArray(p.graveyard)) p.graveyard = [];
    if(!Array.isArray(p.versions)) p.versions = [];
    S.project = p;
    S.projectsIndex.push(indexEntryFor(p));
    await saveIndex(); await storSet(proj_key(p.id), p);
    S.view='editor'; S.tab='editor'; S.undoStack=[]; S.redoStack=[];
    render();
    toast(L('Sauvegarde restaurée : ouverte comme un nouveau scénario, l\u2019existant n\u2019a pas été touché.','Backup restored: opened as a new screenplay, the existing one was left untouched.'));
  };
  reader.readAsText(file);
}

function importTextFile(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    const lines = String(reader.result).split(/\r?\n/);
    const elements = [];
    let expectDialogue = false;
    lines.forEach(raw=>{
      const t = raw.trim();
      if(!t){ expectDialogue = false; return; }
      const c = classifyScreenplayLine(t, null, expectDialogue);
      const el = newElement(c.type, c.text);
      if(c.dual) el.dual = true;
      elements.push(el);
      expectDialogue = c.expect;
    });
    const title = file.name.replace(/\.(txt|fountain)$/i,'');
    finishImport(elements, title);
  };
  reader.readAsText(file);
}

/* ---------------------------------------------------------------------
   Import PDF.
   Le PDF n'a pas de notion de "ligne" ou de "paragraphe" : c'est un nuage
   de fragments de texte positionnés au point près. Extraire un scénario
   exploitable demande donc de reconstituer les lignes nous-mêmes à partir
   des coordonnées, puis de s'en servir comme indice de mise en forme
   (indentation) en plus du texte.

   AVERTISSEMENT HONNÊTE : cette extraction dépend de la bibliothèque
   pdf.js, chargée depuis un CDN au moment de l'import (elle n'est pas
   embarquée dans le fichier, sinon il aurait fallu multiplier sa taille
   par dix). Elle a été testée ici sur des données simulées reproduisant
   la structure que pdf.js renvoie, mais pas sur un vrai PDF de logiciel
   de scénario (Final Draft, Fade In, l'export PDF de Raging Page lui-même,
   etc.) faute de connexion internet pendant son écriture. Si un import
   donne un résultat manifestement faux, dites-moi lequel : la classification
   se corrige facilement une fois qu'on sait ce qui a été mal détecté.
--------------------------------------------------------------------- */

let __pdfjsLoading = null;
function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(__pdfjsLoading) return __pdfjsLoading;
  const sources = [
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
    'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js',
    'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js'
  ];
  const workerFor = src => src.replace(/pdf\.min\.js$/, 'pdf.worker.min.js');
  __pdfjsLoading = (async ()=>{
    let lastErr = null;
    for(const src of sources){
      try{
        await new Promise((resolve, reject)=>{
          const s = document.createElement('script');
          s.src = src; s.onload = resolve; s.onerror = ()=>reject(new Error('échec de chargement: '+src));
          document.head.appendChild(s);
        });
        if(window.pdfjsLib){
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = workerFor(src);
          return window.pdfjsLib;
        }
      }catch(err){ lastErr = err; }
    }
    throw lastErr || new Error('pdf.js indisponible');
  })();
  return __pdfjsLoading;
}

/* Regroupe les fragments de texte d'une page en lignes, en se fiant à leur
   position verticale plutôt qu'à leur ordre d'apparition dans le flux PDF
   (qui ne suit pas toujours l'ordre de lecture). */
function pdfPageToLines(items){
  const rows = [];
  for(const it of items){
    const s = it.str;
    if(!s) continue;
    const tr = it.transform;                    // [a,b,c,d,e,f] ; e,f = x,y
    const x = tr[4], y = tr[5];
    const h = it.height || Math.hypot(tr[2], tr[3]) || 10;
    const row = rows[rows.length - 1];
    if(row && Math.abs(row.y - y) <= Math.max(2, h * 0.4)){
      row.items.push({ x, s, w: it.width || 0 });
    } else {
      rows.push({ y, items:[{ x, s, w: it.width || 0 }] });
    }
  }
  // CORRECTIF. La passe ci-dessus ne compare qu'à la DERNIÈRE ligne en
  // cours : deux fragments à la même hauteur mais séparés dans le flux du
  // PDF (le cas le plus courant : le titre à gauche et le numéro de page à
  // droite d'un en-tête, souvent écrits à des moments différents du flux)
  // atterrissaient dans deux lignes distinctes. On les refusionne ici.
  for(let i = 0; i < rows.length; i++){
    if(!rows[i]) continue;
    for(let j = i + 1; j < rows.length; j++){
      if(!rows[j]) continue;
      const h = 10;
      if(Math.abs(rows[i].y - rows[j].y) <= Math.max(2, h * 0.4)){
        rows[i].items.push(...rows[j].items);
        rows[j] = null;
      }
    }
  }
  const merged = rows.filter(Boolean);
  merged.sort((a, b) => b.y - a.y);   // l'axe Y du PDF monte : le haut de page a le plus grand y
  return merged.map(r=>{
    r.items.sort((a, b) => a.x - b.x);
    let text = '', prevEnd = null;
    for(const it of r.items){
      if(prevEnd != null){
        const gap = it.x - prevEnd;
        if(gap > 2 && !/\s$/.test(text) && !/^\s/.test(it.s)) text += ' ';
      }
      text += it.s; prevEnd = it.x + it.w;
    }
    return { text: text.replace(/[ \t]+/g,' ').trim(), x: r.items[0].x, y: r.y };
  }).filter(l => l.text);
}

/* Regroupe les positions horizontales voisines (à quelques points près) et
   renvoie leurs centres, triés du moins indenté au plus indenté. */
function clusterIndents(xs){
  const sorted = xs.slice().sort((a, b) => a - b);
  const clusters = [];
  for(const x of sorted){
    const last = clusters[clusters.length - 1];
    if(last && x - last.max <= 6){ last.max = x; last.sum += x; last.n++; }
    else clusters.push({ max:x, sum:x, n:1 });
  }
  return clusters.map(c => c.sum / c.n);
}

/* Repère une éventuelle page de titre en tête du PDF — page 1 sans la
   moindre en-tête de scène, alors que le reste du document en contient —
   et en extrait au passage un auteur probable (« Un scénario de… »,
   « Écrit par… », « Written by… »). Une page de titre n'a rien à faire
   dans le corps du texte : mise en page libre, souvent des fragments
   décoratifs (filets, encadrés) qui n'ont pas de sens hors contexte et
   qui, mélangés aux vraies lignes du scénario, produisaient un texte qui
   semblait "désordonné". On ne retire la page que si on est sûr qu'elle
   n'est pas la scène d'ouverture elle-même (garde-fou : le reste du
   document doit contenir au moins une vraie scène). */
function stripTitlePage(pages){
  if(pages.length < 2) return { pages, titleInfo:null };
  const hasHeading = pl => pl.some(l=>{
    const m = l.text.match(/^\d+[A-Za-z]?\.?\s+(.+)$/);
    return isSceneHeading(l.text) || (m && isSceneHeading(m[1]));
  });
  if(hasHeading(pages[0])) return { pages, titleInfo:null };
  if(!pages.slice(1).some(hasHeading)) return { pages, titleInfo:null };

  // NB. On extrait volontairement l'auteur mais pas le titre : les pages
  // de titre mettent souvent le titre en forme avec des éléments décoratifs
  // (cadres, filets) dont le rendu texte est peu fiable selon la police —
  // testé sur un vrai PDF, ça produisait un titre dédoublé et truffé de
  // parasites. Le nom du fichier reste une base plus sûre pour le titre ;
  // l'utilisateur peut de toute façon le corriger dans les réglages du
  // projet. La détection de l'auteur, elle, s'appuie sur un motif de texte
  // précis et n'a pas ce problème.
  const lines = pages[0].map(l => l.text.trim()).filter(Boolean);
  const authorPattern = /^(un\s+sc[ée]nario\s+de|un\s+film\s+de|[ée]crit\s+par|written\s+by)\s*:?\s*(.*)$/i;
  let author = null;
  for(let i = 0; i < lines.length; i++){
    const m = lines[i].match(authorPattern);
    if(m){ author = (m[2] && m[2].trim()) || (lines[i+1] || '').trim() || null; break; }
  }
  return { pages: pages.slice(1), titleInfo: author ? { author } : null };
}

/* Transforme les pages déjà extraites (tableau de tableaux de {text,x,y})
   en une liste d'éléments de scénario. Séparé de l'extraction elle-même
   pour pouvoir être testé sans PDF réel. */
function pdfPagesToElements(pages){
  const titlePage = stripTitlePage(pages);
  pages = titlePage.pages;
  const norm = s => s.replace(/\d+/g,'#').replace(/\s+/g,' ').trim().toLowerCase();

  // CORRECTIF. Un en-tête/pied de page se reconnaît à sa position RELATIVE
  // À SA PROPRE PAGE (les toutes premières / toutes dernières lignes),
  // jamais à une fraction fixe de la hauteur : une scène commence parfois
  // à quelques points seulement de la marge du haut, trop près d'un seuil
  // fixe pour l'en distinguer de façon fiable. Un seuil fixe avait aussi
  // pour effet pervers de supprimer une réplique récurrente du CORPS du
  // texte (un running gag, par exemple) sous prétexte qu'elle revenait
  // souvent — la voilà maintenant protégée dès qu'elle n'est pas au tout
  // début ou à la toute fin d'une page.
  // CORRECTIF. Un en-tête/pied de page se reconnaît à l'écart vertical
  // INHABITUEL qui le sépare du corps du texte, jamais à un rang fixe
  // (« les 2 premières lignes ») : une scène commence parfois tout près de
  // la marge, et un rang fixe la happait par erreur. On cherche, dans le
  // premier tiers puis le dernier tiers de chaque page, le plus grand saut
  // vertical ; s'il dépasse nettement l'interligne habituel de la page,
  // tout ce qui est au-delà de ce saut (vers le bord) est candidat à la
  // détection de répétition ci-dessous — jamais supprimé sur ce seul
  // critère, seulement s'il revient sur plus de 4 pages sur 10.
  function markEdgeLines(pl){
    if(pl.length < 5) return;   // trop peu de lignes pour distinguer quoi que ce soit
    const byY = pl.slice().sort((a, b) => b.y - a.y);
    const gaps = [];
    for(let i = 0; i < byY.length - 1; i++) gaps.push(byY[i].y - byY[i+1].y);
    const sortedGaps = gaps.slice().sort((a, b) => a - b);
    const typical = sortedGaps[Math.floor(sortedGaps.length / 2)] || 14;
    const zone = Math.max(1, Math.floor(byY.length / 3));

    let cut = -1, cutGap = 0;
    for(let i = 0; i < zone; i++) if(gaps[i] > cutGap){ cutGap = gaps[i]; cut = i; }
    if(cut >= 0 && cutGap > typical * 1.7) for(let i = 0; i <= cut; i++) byY[i]._edge = true;

    cut = -1; cutGap = 0;
    const n = gaps.length;
    for(let i = n - 1; i >= n - zone && i >= 0; i--) if(gaps[i] > cutGap){ cutGap = gaps[i]; cut = i; }
    if(cut >= 0 && cutGap > typical * 1.7) for(let i = cut + 1; i < byY.length; i++) byY[i]._edge = true;
  }
  pages.forEach(markEdgeLines);

  // 1) Titre/numéro de page répété sur beaucoup de pages, EN BORD DE PAGE.
  const freqText = new Map();
  pages.forEach(pl => pl.forEach(l=>{
    if(!l._edge) return;
    const n = norm(l.text); if(n.length < 3) return;
    freqText.set(n, (freqText.get(n) || 0) + 1);
  }));
  const total = pages.length;
  const isNoise = l=>{
    const t = l.text.trim();
    if(/^[ivxlcdm0-9]{1,5}\.?$/i.test(t)) return true;                          // numéro de page seul
    if(/^\(?\s*(more|cont'?d\.?|continued)\.?\)?\s*:?\s*$/i.test(t)) return true; // (MORE) / (CONT'D)
    if(!l._edge) return false;
    const n = norm(t);
    return total >= 3 && (freqText.get(n) || 0) / total > 0.4 && t.length < 60; // en-tête/pied répété
  };

  // 2) Ligne de base (marge action/scène = position la plus fréquente) et
  //    niveaux d'indentation au-dessus, pour distinguer dialogue/personnage.
  const freqX = new Map();
  pages.forEach(pl => pl.forEach(l=>{
    if(isNoise(l)) return;
    const rx = Math.round(l.x / 2) * 2;
    freqX.set(rx, (freqX.get(rx) || 0) + 1);
  }));
  // CORRECTIF. La position la plus fréquente n'est pas forcément la marge
  // d'action/scène : dans une scène très dialoguée, les répliques sont
  // souvent plus nombreuses que les lignes d'action, et l'ancienne règle
  // ("la plus fréquente = la marge") prenait alors la colonne du dialogue
  // pour la marge de base — ce qui faisait basculer aussi bien l'action
  // QUE le dialogue dans le même panier, tout classé "action" ensuite. La
  // vraie marge de base est toujours la colonne exploitée la plus à
  // GAUCHE parmi celles qui reviennent assez souvent pour être une
  // colonne à part entière (et non le numéro de scène isolé, rare, collé
  // tout à gauche).
  const totalKept = [...freqX.values()].reduce((a, b) => a + b, 0);
  const significant = [...freqX.entries()].filter(([, c]) => c >= Math.max(2, totalKept * 0.1));
  let baseline = 0;
  if(significant.length){
    baseline = significant.reduce((min, [x]) => Math.min(min, x), Infinity);
  } else {
    let best = -1;
    freqX.forEach((c, x)=>{ if(c > best){ best = c; baseline = x; } });
  }
  const centers = clusterIndents([...freqX.keys()].filter(x => x > baseline + 8));
  const dialogueX = centers.length ? centers[0] : null;
  const characterX = centers.length ? centers[centers.length - 1] : null;

  function bucketOf(x){
    if(dialogueX == null) return null;   // aucun retrait distinct nulle part : pas d'info exploitable
    if(x <= baseline + 8) return 'baseline';
    if(centers.length === 1) return 'indented';
    return Math.abs(x - characterX) < Math.abs(x - dialogueX) ? 'character' : 'dialogue';
  }

  // 3) Aplatissement en éléments de scénario. Deux règles opposées mais
  //    complémentaires, et c'est la seconde qui manquait :
  //
  //    a) SAUT DE PARAGRAPHE. Un écart vertical nettement supérieur à
  //       l'interligne habituel de la page vaut ligne vide (comme en .txt) :
  //       le bloc en cours est terminé.
  //
  //    b) RECOLLAGE. CORRECTIF. Un PDF ne contient pas de paragraphes, il
  //       contient des lignes : une réplique de trois lignes y est écrite
  //       en trois lignes distinctes, coupées par la largeur de la page.
  //       Chacune devenait un élément séparé — d'où un texte importé sans
  //       structure, où plus rien ne distinguait une vraie fin de
  //       paragraphe d'une simple coupure de ligne. On refusionne donc les
  //       lignes qui ne sont que la suite du bloc précédent. Le signal est
  //       purement géométrique, et c'est ce qui le rend fiable : même
  //       colonne à quelques points près + interligne normal = suite du
  //       même bloc, quoi que raconte le texte.
  const WRAPPABLE = new Set(['action','dialogue','parenthetical','text']);
  // Volontairement exclus : 'character' et 'transition'. Une réplique placée
  // juste sous le nom du personnage a le même interligne qu'une suite de
  // ligne ; dans un PDF mal formaté où les deux partagent la même colonne,
  // les recoller donnerait « SALOMON Pardon ? » sur une seule ligne.
  // Exclue aussi : 'scene'. Un test l'a montré — dans un scénario non
  // numéroté, l'en-tête de scène est à la même marge que l'action, et le
  // premier paragraphe d'action se faisait absorber par l'en-tête. Une
  // en-tête de scène qui déborde sur deux lignes reste toutefois recollée,
  // mais à une condition que l'action ne remplit jamais : la suite est elle
  // aussi entièrement en majuscules (voir plus bas).
  const CAPS_ONLY = t => /[A-ZÀ-Ý]/.test(t) && !/[a-zà-ÿ]/.test(t);
  const joinWrapped = (a, b) => (a.replace(/\s+$/,'') + ' ' + b.replace(/^\s+/,'')).replace(/\s{2,}/g,' ');

  const elements = [];
  let expectDialogue = false;
  let prev = null;                  // dernier élément créé, candidat au recollage
  pages.forEach(pl=>{
    const kept = pl.filter(l => !isNoise(l));
    const gaps = [];
    for(let i = 1; i < kept.length; i++) gaps.push(kept[i-1].y - kept[i].y);
    // CORRECTIF. On cherche ici l'INTERLIGNE de la page (l'écart entre deux
    // lignes d'un même paragraphe), pas un écart « moyen ». Une médiane ne
    // convient pas : dans une page composée pour moitié de lignes simples
    // et pour moitié de sauts de bloc, elle tombe entre les deux et un vrai
    // saut de paragraphe passait alors pour une simple suite de ligne. Le
    // bon repère est le plus petit écart qui se répète — un interligne, par
    // définition, revient sans arrêt, alors qu'un écart isolé plus petit
    // n'est qu'un accident de mise en page.
    const counts = new Map();
    gaps.forEach(g=>{ const k = Math.round(g); counts.set(k, (counts.get(k) || 0) + 1); });
    const repeated = [...counts.entries()].filter(([, n]) => n >= 2).map(([g]) => g);
    const lineGap = repeated.length ? Math.min(...repeated)
                  : (gaps.length ? Math.min(...gaps) : 14);
    prev = null;                    // jamais de recollage d'une page à l'autre
    kept.forEach((l, i)=>{
      const gap = i > 0 ? kept[i-1].y - l.y : null;
      const sameFlow = gap != null && lineGap > 0 && gap <= lineGap * 1.35;
      if(gap != null && lineGap > 0 && gap > lineGap * 1.6) expectDialogue = false;

      const c = classifyScreenplayLine(l.text, bucketOf(l.x), expectDialogue);

      // Suite du bloc précédent : même colonne, interligne normal, et le
      // bloc en cours est d'un type qui peut déborder sur plusieurs lignes.
      // Garde-fou : une en-tête de scène ouvre toujours un nouveau bloc,
      // même collée au paragraphe du dessus (certains PDF serrent
      // l'interligne avant une scène).
      const continues = prev && sameFlow && c.type !== 'scene' && Math.abs(prev.x - l.x) <= 6
        && (WRAPPABLE.has(prev.type) || (prev.type === 'scene' && CAPS_ONLY(l.text)));
      if(continues){
        prev.el.text = joinWrapped(prev.el.text, l.text);
        return;                     // expectDialogue inchangé : toujours le même bloc
      }

      const el = newElement(c.type, c.text);
      elements.push(el);
      expectDialogue = c.expect;
      prev = { el, x:l.x, type:c.type };
    });
  });
  return { elements, titleInfo: titlePage.titleInfo };
}

async function extractPdfPages(file){
  const pdfjsLib = await loadPdfJs();
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const pages = [];
  for(let p = 1; p <= pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    pages.push(pdfPageToLines(content.items));
  }
  return pages;
}

async function importPdfFile(file){
  toast(L('Lecture du PDF…','Reading the PDF…'));
  try{
    const pages = await extractPdfPages(file);
    const totalChars = pages.reduce((s, pl) => s + pl.reduce((s2, l) => s2 + l.text.length, 0), 0);
    if(totalChars < 20 * pages.length && pages.length){
      toast(L('Ce PDF semble scanné (image) : aucun texte n\u2019a pu être extrait. Un scénario au format image ne peut pas être importé automatiquement.','This PDF looks scanned (image): no text could be extracted. A screenplay in image format can\u2019t be imported automatically.'));
      return;
    }
    const { elements, titleInfo } = pdfPagesToElements(pages);
    // Si une page de titre a été repérée et retirée, on s'en sert pour
    // préremplir l'auteur — le titre, lui, vient toujours du nom du
    // fichier, comme avant.
    const title = file.name.replace(/\.pdf$/i, '');
    const author = titleInfo && titleInfo.author;
    await finishImport(elements, title,
      'Import PDF terminé : la mise en forme (personnage/dialogue/action) est déduite automatiquement, vérifie-la avant d\u2019écrire.', author);
  }catch(err){
    console.error(err);
    toast(L('Impossible de lire ce PDF (','Couldn\u2019t read this PDF (') + (err && err.message ? err.message : L('erreur inconnue','unknown error')) + L('). Vérifie ta connexion internet : l\u2019import PDF a besoin de charger une bibliothèque de lecture.','). Check your internet connection: PDF import needs to load a reading library.'));
  }
}

/* =====================================================================
   GENERIC EVENT DISPATCH
===================================================================== */
/* =====================================================================
   COFFRE-FORT — SAUVEGARDE HORS NAVIGATEUR
   ---------------------------------------------------------------------
   POURQUOI CE BLOC EXISTE
   Jusqu'ici, l'unique exemplaire d'un scénario vivait dans le stockage
   du navigateur (IndexedDB, avec localStorage en secours). C'est rapide
   et gratuit, mais ce stockage peut disparaître sans prévenir, et
   surtout il n'existe PAS DU TOUT dans trois situations très courantes :
     - la page est ouverte directement depuis le disque (file://) :
       Chrome interdit IndexedDB dans ce mode ;
     - la page tourne dans un aperçu en cadre (iframe bac à sable) :
       le navigateur y bloque tout stockage ;
     - navigation privée ou nettoyage automatique des données de site.
   Dans ces cas, tout ce qui est écrit s'évapore au rafraîchissement —
   exactement le symptôme constaté. Aucune correction du code de
   sauvegarde interne ne peut y changer quoi que ce soit : il faut écrire
   AILLEURS que dans le navigateur.

   CE QUE FONT LES LOGICIELS DU MÉTIER
   WriterDuet, Fade In ou Final Draft ne font pas confiance au navigateur :
   ils écrivent dans un vrai fichier, et/ou sur un compte distant. Sans un
   centime de serveur, on peut reproduire les deux :
     1. COFFRE LOCAL — l'API File System Access (Chrome, Edge, Opera)
        permet de demander UNE FOIS un fichier sur le disque, de garder
        son autorisation, puis d'y réécrire silencieusement à chaque
        modification. Le scénario vit alors dans un vrai .smmproj sur
        l'ordinateur : vider le navigateur ne l'atteint plus.
     2. GOOGLE DRIVE — tout se fait depuis le navigateur, en OAuth, avec
        le Drive de l'utilisateur comme espace de stockage. Aucun serveur
        à héberger, aucun abonnement : seul un identifiant client Google
        (gratuit) est nécessaire, à coller dans les Paramètres.
   Les deux fonctionnent ensemble ou séparément, et n'enlèvent rien à ce
   qui existait : l'enregistrement dans le navigateur continue comme avant
   et reste le plus rapide. Le coffre est une seconde copie, pas un
   remplacement.
===================================================================== */

/* ---------------------------------------------------------------------
   1. DIAGNOSTIC : le navigateur conserve-t-il vraiment quelque chose ?
   On n'attend pas la panne : on écrit un témoin et on le relit. Si la
   relecture échoue, on le dit franchement à l'écran plutôt que de
   laisser croire à une sauvegarde qui n'a pas lieu.
--------------------------------------------------------------------- */
let __storageMode = 'idb';
const PROBE_KEY = 'scriptmm_probe';
async function checkStorageHealth(){
  try{
    await idbSet(PROBE_KEY, 1);
    if(await idbGet(PROBE_KEY) === 1){ __storageMode = 'idb'; return 'idb'; }
  }catch(e){}
  try{
    localStorage.setItem(PROBE_KEY, '1');
    if(localStorage.getItem(PROBE_KEY) === '1'){ __storageMode = 'ls'; return 'ls'; }
  }catch(e){}
  __storageMode = 'none';
  return 'none';
}
function inIframe(){ try{ return window.self !== window.top; }catch(e){ return true; } }
function storageDiagnosis(){
  if(location.protocol === 'file:')
    return L('La page est ouverte directement depuis le disque (adresse en file://). Chrome et Edge interdisent tout stockage dans ce mode : rien de ce qui est écrit ne survit au rafraîchissement.', 'The page is opened directly from disk (a file:// address). Chrome and Edge forbid all storage in this mode: nothing written survives a refresh.');
  if(inIframe())
    return L('La page tourne dans un cadre d\u2019aperçu où le navigateur bloque le stockage : chaque rechargement repart de zéro.', 'The page is running inside a preview frame where the browser blocks storage: every reload starts from scratch.');
  return L('Ce navigateur refuse le stockage local (navigation privée, ou données de site bloquées dans les réglages).', 'This browser refuses local storage (private browsing, or site data blocked in settings).');
}
function showStorageBanner(){
  if(document.getElementById('storageBanner')) return;
  const b = document.createElement('div');
  b.id = 'storageBanner';
  b.className = 'storage-banner';
  b.innerHTML = `<div class="sb-text"><b>${L('Attention : ce navigateur ne garde rien.','Warning: this browser keeps nothing.')}</b> ${esc(storageDiagnosis())}
    ${L('Lie un fichier de ton ordinateur (ou Google Drive) : c\u2019est la seule façon de ne rien perdre ici.','Link a file from your computer (or Google Drive): it\u2019s the only way not to lose anything here.')}</div>
    <div class="sb-actions">
      <button class="btn btn-sm btn-primary" data-act="vaultAttach">${icon('save')} ${L('Lier un fichier','Link a file')}</button>
      <button class="btn btn-sm btn-ghost" data-act="vaultOpenFromFile">${icon('upload')} ${L('Ouvrir un .smmproj','Open a .smmproj')}</button>
      <button class="btn btn-sm btn-ghost" data-act="dismissStorageBanner">${icon('close')}</button>
    </div>`;
  document.body.appendChild(b);
}
function dismissStorageBanner(){ const b = document.getElementById('storageBanner'); if(b) b.remove(); }

/* ---------------------------------------------------------------------
   2. COFFRE LOCAL (File System Access API)
   Le handle de fichier obtenu au premier choix est stocké tel quel dans
   IndexedDB : il est « clonable », donc il survit à la fermeture de
   l'onglet. Au retour, le navigateur redemande éventuellement
   l'autorisation — qui exige un geste de l'utilisateur, d'où la pastille
   cliquable dans la barre d'outils.
--------------------------------------------------------------------- */
const FSA_OK = (typeof window.showSaveFilePicker === 'function');
const vaultKey = id => 'scriptmm_vault_' + id;
let V = { handle:null, pid:null, ok:false, name:'', at:0, err:'', busy:false, timer:null, loading:false };

function safeFileName(t){ return String(t || 'scenario').replace(/[\\/:*?"<>|]/g, '-').slice(0, 80); }
function vaultPayload(p){
  return JSON.stringify({ app:'Raging Page', kind:'project-backup', version:1, savedAt:Date.now(), project:p });
}
function vaultActive(){ return !!(V.handle && V.ok && S.project && V.pid === S.project.id); }

async function vaultLoadFor(pid){
  V = { handle:null, pid, ok:false, name:'', at:0, err:'', busy:false, timer:null, loading:false };
  if(FSA_OK){
    let rec = null;
    try{ rec = await idbGet(vaultKey(pid)); }catch(e){}
    if(rec && rec.handle){
      V.handle = rec.handle; V.at = rec.at || 0; V.name = rec.name || '';
      try{
        const perm = await rec.handle.queryPermission({ mode:'readwrite' });
        V.ok = (perm === 'granted');
        if(!V.ok) V.err = 'perm';
      }catch(e){ V.ok = false; V.err = 'perm'; }
    }
  }
  updateVaultChip();
}

/* Lier (ou relier) le scénario ouvert à un fichier du disque. */
async function vaultAttach(){
  if(!S.project){ toast(L('Ouvre d\u2019abord un scénario, puis relie-le à un fichier.','First open a screenplay, then link it to a file.')); return; }
  if(!FSA_OK){
    toast(L('Ce navigateur ne sait pas écrire directement dans un fichier : utilise Chrome, Edge ou Opera. En attendant, voici une sauvegarde à télécharger.','This browser can\u2019t write directly to a file: use Chrome, Edge or Opera. In the meantime, here\u2019s a backup to download.'));
    try{ exportBackup(); }catch(e){}
    return;
  }
  try{
    const h = await window.showSaveFilePicker({
      suggestedName: safeFileName(S.project.title) + '.smmproj',
      types:[{ description:'Scénario Raging Page', accept:{ 'application/json':['.smmproj'] } }]
    });
    V.handle = h; V.pid = S.project.id; V.ok = true; V.err = ''; V.name = h.name || '';
    try{ await idbSet(vaultKey(S.project.id), { handle:h, at:Date.now(), name:V.name }); }catch(e){}
    await vaultWrite();
    dismissStorageBanner();
    toast(L('Coffre lié : « ','Vault linked: \u201c') + V.name + L(' » est désormais réécrit à chaque modification.','\u201d is now rewritten on every change.'));
    if(S.view === 'editor' && S.tab === 'settings') renderTabBody();
  }catch(e){
    if(e && e.name === 'AbortError') return;
    toast(L('Impossible de lier ce fichier.','Couldn\u2019t link this file.'));
  }
}

/* Redemander l'autorisation d'écriture (exige un clic : d'où la pastille). */
async function vaultReconnect(){
  if(!V.handle){ vaultAttach(); return; }
  try{
    const perm = await V.handle.requestPermission({ mode:'readwrite' });
    if(perm === 'granted'){
      V.ok = true; V.err = '';
      await vaultWrite();
      toast(L('Coffre reconnecté : « ','Vault reconnected: \u201c') + (V.name || L('fichier','file')) + L(' ».','\u201d.'));
    }else{
      toast(L('Autorisation refusée : le fichier ne sera pas mis à jour.','Permission denied: the file won\u2019t be updated.'));
    }
  }catch(e){ toast(L('Impossible de reconnecter ce fichier.','Couldn\u2019t reconnect this file.')); }
  updateVaultChip();
  if(S.view === 'editor' && S.tab === 'settings') renderTabBody();
}

async function vaultWrite(){
  if(!vaultActive() || V.busy) return false;
  V.busy = true; updateVaultChip();
  let ok = false;
  try{
    const w = await V.handle.createWritable();
    await w.write(vaultPayload(S.project));
    await w.close();
    V.at = Date.now(); V.err = ''; ok = true;
    try{ await idbSet(vaultKey(S.project.id), { handle:V.handle, at:V.at, name:V.name }); }catch(e){}
  }catch(e){
    if(e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')){ V.err = 'perm'; V.ok = false; }
    else V.err = 'write';
  }
  V.busy = false; updateVaultChip();
  return ok;
}
function scheduleVaultWrite(){
  if(!vaultActive()) return;
  clearTimeout(V.timer);
  updateVaultChip('pending');
  V.timer = setTimeout(()=>{ vaultWrite(); }, 2500);
}
function flushVaultWrite(){
  if(!vaultActive()) return;
  clearTimeout(V.timer); V.timer = null;
  vaultWrite();
}
function vaultDetach(){
  if(!S.project) return;
  const id = S.project.id;
  clearTimeout(V.timer);
  V = { handle:null, pid:id, ok:false, name:'', at:0, err:'', busy:false, timer:null, loading:false };
  try{ idbDelete(vaultKey(id)); }catch(e){}
  updateVaultChip();
  if(S.view === 'editor' && S.tab === 'settings') renderTabBody();
  toast(L('Coffre détaché : le fichier reste sur ton disque, il n\u2019est simplement plus mis à jour.','Vault detached: the file stays on your disk, it simply isn\u2019t updated anymore.'));
}

/* Remettre un projet complet en état après lecture d'un fichier :
   mêmes garde-fous que la restauration d'une sauvegarde existante. */
function vaultNormalize(p){
  ensureSettings(p); ensureTPDesign(p); ensureStructure(p);
  if(!p.sceneMeta) p.sceneMeta = {};
  if(!p.tagDefs) p.tagDefs = {};
  if(!Array.isArray(p.graveyard)) p.graveyard = [];
  if(!Array.isArray(p.versions)) p.versions = [];
  if(p.seasonName === undefined) p.seasonName = '';
  return p;
}

/* Ouvrir un .smmproj depuis le disque ET rester lié à ce fichier : c'est
   le chemin de retour après un nettoyage du navigateur, et le mode de
   travail « comme un logiciel classique » (un scénario = un fichier). */
async function vaultOpenFromFile(){
  if(!FSA_OK){ try{ triggerImport(); }catch(e){} return; }
  let h, data;
  try{
    const picked = await window.showOpenFilePicker({
      types:[{ description:'Scénario Raging Page', accept:{ 'application/json':['.smmproj','.json'] } }],
      multiple:false
    });
    h = picked[0];
    const f = await h.getFile();
    data = JSON.parse(await f.text());
  }catch(e){
    if(e && e.name === 'AbortError') return;
    toast(L('Fichier illisible : ce n\u2019est pas une sauvegarde Raging Page.','Unreadable file: this isn\u2019t a Raging Page backup.'));
    return;
  }
  const src = data && data.project ? data.project : null;
  if(!src || !Array.isArray(src.elements)){ toast(L('Ce fichier n\u2019est pas une sauvegarde Raging Page.','This file isn\u2019t a Raging Page backup.')); return; }

  const entry = S.projectsIndex.find(e => e.id === src.id);
  if(entry){
    const fileTime = src.updatedAt || 0, localTime = entry.updatedAt || 0;
    if(fileTime > localTime + 2000){
      const go = await mmConfirm(L('Ce fichier est plus récent que la version présente dans ce navigateur. L\u2019ouvrir remplacera la version du navigateur.','This file is more recent than the version in this browser. Opening it will replace the browser\u2019s version.'),
        {title:L('Ouvrir la version du fichier ?','Open the file\u2019s version?'), ok:L('Ouvrir le fichier','Open file'), cancel:L('Garder le navigateur','Keep browser version')});
      if(!go){ await openProject(src.id); await vaultBind(h, src.id); return; }
    }else{
      await openProject(src.id);
      await vaultBind(h, src.id);
      toast(L('Scénario rouvert, et relié à « ','Screenplay reopened, and linked to \u201c') + (h.name || L('ce fichier','this file')) + L(' ».','\u201d.'));
      return;
    }
  }
  const p = vaultNormalize(JSON.parse(JSON.stringify(src)));
  p.updatedAt = Date.now();
  if(p.seriesId && !S.projectsIndex.some(e => e.seriesId === p.seriesId)){
    p.seriesId = null; p.season = null; p.episode = null;
  }
  const idx = S.projectsIndex.findIndex(e => e.id === p.id);
  S.project = p;
  if(idx >= 0) S.projectsIndex[idx] = indexEntryFor(p);
  else S.projectsIndex.push(indexEntryFor(p));
  await saveIndex(); await storSet(proj_key(p.id), p);
  S.view = 'editor'; S.tab = 'editor'; S.undoStack = []; S.redoStack = [];
  render();
  await vaultBind(h, p.id);
  dismissStorageBanner();
  toast(L('Scénario ouvert depuis le fichier, et relié à lui : chaque modification y sera réécrite.','Screenplay opened from the file, and linked to it: every change will be rewritten there.'));
}
async function vaultBind(h, pid){
  V.handle = h; V.pid = pid; V.ok = true; V.err = ''; V.name = h.name || '';
  try{ await idbSet(vaultKey(pid), { handle:h, at:Date.now(), name:V.name }); }catch(e){}
  updateVaultChip();
}

/* ---------------------------------------------------------------------
   3. PASTILLE D'ÉTAT DU COFFRE (à côté de « Sauvegardé »)
   Elle dit la vérité en un coup d'œil : liée / en attente / à reconnecter
   / pas de coffre. Un clic agit selon l'état, sans passer par un menu.
--------------------------------------------------------------------- */
let __vaultChipLoading = false;
function updateVaultChip(state){
  const chip = document.getElementById('vaultChip');
  if(S.project && V.pid !== S.project.id && !__vaultChipLoading){
    __vaultChipLoading = true;
    vaultLoadFor(S.project.id).then(()=>{ __vaultChipLoading = false; });
    return;
  }
  if(!chip) return;
  let cls = 'vault-chip', txt = '', title = '';
  if(!S.project){ chip.style.display = 'none'; return; }
  chip.style.display = '';
  if(V.err === 'perm' || (V.handle && !V.ok)){
    cls += ' warn'; txt = L('Coffre à reconnecter','Vault to reconnect');
    title = L('Le navigateur redemande l\u2019autorisation d\u2019écrire dans « ','The browser is asking again for permission to write to \u201c') + (V.name || L('ton fichier','your file')) + L(' ». Clique pour la redonner.','\u201d. Click to grant it again.');
  }else if(V.err === 'write'){
    cls += ' warn'; txt = L('Coffre en erreur','Vault error');
    title = L('La dernière écriture dans le fichier a échoué. Clique pour réessayer.','The last write to the file failed. Click to try again.');
  }else if(vaultActive()){
    cls += ' ok';
    txt = (state === 'pending' || V.busy) ? L('Coffre…','Vault…') : L('Coffre OK','Vault OK');
    title = L('Chaque modification est réécrite dans « ','Every change is rewritten to \u201c') + (V.name || L('ton fichier','your file')) + L(' »','\u201d') +
            (V.at ? L(' \u00b7 dernière écriture ',' \u00b7 last write ') + timeAgo(V.at) : '') + L('. Clique pour forcer une écriture.','. Click to force a write.');
  }else{
    cls += ' off'; txt = L('Aucun coffre','No vault');
    title = L('Ce scénario n\u2019existe que dans ce navigateur. Clique pour le relier à un fichier de ton ordinateur.','This screenplay only exists in this browser. Click to link it to a file on your computer.');
  }
  chip.className = cls; chip.textContent = txt; chip.title = title;
}
function vaultChipClick(){
  if(!S.project) return;
  if(V.err === 'perm' || (V.handle && !V.ok)) return vaultReconnect();
  if(vaultActive()){ flushVaultWrite(); toast(L('Écriture forcée dans le fichier.','Write to the file forced.')); return; }
  vaultAttach();
}

/* ---------------------------------------------------------------------
   4. GOOGLE DRIVE — sans serveur, sans abonnement
   Le navigateur parle directement à l'API Google avec un jeton obtenu en
   OAuth. La portée demandée est « drive.file » : la plus étroite qui
   existe — Raging Page ne voit QUE les fichiers qu'il a lui-même créés,
   jamais le reste du Drive. Le jeton ne vit qu'en mémoire (perdu à la
   fermeture de l'onglet) : rien de sensible n'est écrit sur le disque.
   Seul l'identifiant client, qui n'est pas un secret, est conservé.
--------------------------------------------------------------------- */
const GD_CLIENT_KEY = 'scriptmm_gdrive_client_id';
const GD_FILE_KEY = id => 'scriptmm_gdrive_file_' + id;
const GD_SCOPE = 'https://www.googleapis.com/auth/drive.file';
let GD = { token:null, exp:0, tc:null, resolve:null, reject:null, timer:null, at:0, busy:false, err:'' };

/* IDENTIFIANT GOOGLE DU SITE (à remplir UNE SEULE FOIS par la personne qui
   met Raging Page en ligne). Une fois collé ici, les visiteurs n'ont plus rien
   à configurer : un bouton « Se connecter avec Google », et c'est tout.
   Ce n'est pas un secret. Laisser vide = ancien fonctionnement (chacun colle
   son propre identifiant dans Paramètres). */
const GD_BUILTIN_CLIENT_ID = '1070717972969-lk5q67452eocggr9jl2296mqakannt0g.apps.googleusercontent.com';
function gdClientId(){ if(GD_BUILTIN_CLIENT_ID) return GD_BUILTIN_CLIENT_ID; try{ return localStorage.getItem(GD_CLIENT_KEY) || ''; }catch(e){ return ''; } }
function gdSaveClientId(){
  const el = document.getElementById('gdClientId');
  if(!el) return;
  const v = el.value.trim();
  try{ localStorage.setItem(GD_CLIENT_KEY, v); }catch(e){}
  GD.tc = null; GD.token = null;
  toast(v ? L('Identifiant Google enregistré. Tu peux maintenant connecter Drive.','Google client ID saved. You can now connect Drive.') : L('Identifiant Google effacé.','Google client ID cleared.'));
  if(S.view === 'editor' && S.tab === 'settings') renderTabBody();
}
function gdConnected(){ return !!(GD.token && Date.now() < GD.exp); }
function gdFileId(pid){ try{ return localStorage.getItem(GD_FILE_KEY(pid)) || ''; }catch(e){ return ''; } }
function gdSetFileId(pid, fid){ try{ fid ? localStorage.setItem(GD_FILE_KEY(pid), fid) : localStorage.removeItem(GD_FILE_KEY(pid)); }catch(e){} }

function gdLoadScript(){
  return new Promise((resolve, reject)=>{
    if(window.google && window.google.accounts && window.google.accounts.oauth2) return resolve();
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true; s.defer = true;
    s.onload = ()=> resolve();
    s.onerror = ()=> reject(new Error('gsi'));
    document.head.appendChild(s);
  });
}
async function gdRequestToken(interactive){
  if(gdConnected()) return GD.token;
  const cid = gdClientId();
  if(!cid) throw new Error('no-client-id');
  await gdLoadScript();
  if(!GD.tc){
    GD.tc = google.accounts.oauth2.initTokenClient({
      client_id: cid,
      scope: GD_SCOPE,
      callback: (resp)=>{
        if(resp && resp.access_token){
          GD.token = resp.access_token;
          GD.exp = Date.now() + ((resp.expires_in || 3600) - 120) * 1000;
          if(GD.resolve) GD.resolve(GD.token);
        }else if(GD.reject){ GD.reject(new Error((resp && resp.error) || 'oauth')); }
        GD.resolve = GD.reject = null;
      },
      error_callback: (err)=>{ if(GD.reject) GD.reject(new Error((err && err.type) || 'oauth')); GD.resolve = GD.reject = null; }
    });
  }
  return new Promise((resolve, reject)=>{
    GD.resolve = resolve; GD.reject = reject;
    try{ GD.tc.requestAccessToken({ prompt: interactive ? 'consent' : '' }); }
    catch(e){ GD.resolve = GD.reject = null; reject(e); }
  });
}
async function gdConnect(){
  if(!gdClientId()){ toast(L('Google Drive n\u2019est pas encore activé sur ce site.','Google Drive isn\u2019t enabled on this site yet.')); try{ switchTab('settings'); }catch(e){} return; }
  try{
    await gdRequestToken(true);
    GD.err = '';
    toast(L('Google Drive connecté.','Google Drive connected.'));
    await gdPush(true);
  }catch(e){
    GD.err = 'auth';
    toast(L('Connexion à Google Drive impossible. Réessaie, et accepte la demande dans la fenêtre Google (autorise aussi les fenêtres pop-up).','Couldn\u2019t connect to Google Drive. Try again, and accept the request in the Google window (also allow pop-ups).'));
  }
  if(S.view === 'editor' && S.tab === 'settings') renderTabBody();
}
function gdDisconnect(){
  GD.token = null; GD.exp = 0;
  toast(L('Déconnecté de Google Drive (les fichiers déjà envoyés restent dans ton Drive).','Disconnected from Google Drive (files already sent stay in your Drive).'));
  if(S.view === 'editor' && S.tab === 'settings') renderTabBody();
}
async function gdUpload(fileId, name, content){
  const boundary = '-------scriptmm' + Date.now();
  const meta = fileId ? { name } : { name, mimeType:'application/json' };
  const body =
    '--' + boundary + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(meta) +
    '\r\n--' + boundary + '\r\nContent-Type: application/json\r\n\r\n' + content +
    '\r\n--' + boundary + '--';
  const url = fileId
    ? 'https://www.googleapis.com/upload/drive/v3/files/' + encodeURIComponent(fileId) + '?uploadType=multipart&fields=id'
    : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id';
  const res = await fetch(url, {
    method: fileId ? 'PATCH' : 'POST',
    headers:{ Authorization:'Bearer ' + GD.token, 'Content-Type':'multipart/related; boundary=' + boundary },
    body
  });
  if(!res.ok) throw new Error('upload-' + res.status);
  return (await res.json()).id;
}
async function gdPush(silent){
  if(!S.project || GD.busy) return;
  if(!gdConnected()){
    try{ await gdRequestToken(false); }
    catch(e){ if(!silent) toast(L('Reconnecte Google Drive pour envoyer ce scénario.','Reconnect Google Drive to send this screenplay.')); return; }
  }
  GD.busy = true; updateVaultChip();
  try{
    const pid = S.project.id;
    let fid = gdFileId(pid);
    const name = safeFileName(S.project.title) + '.smmproj';
    try{
      fid = await gdUpload(fid, name, vaultPayload(S.project));
    }catch(e){
      if(String(e.message).indexOf('upload-404') === 0 || String(e.message).indexOf('upload-403') === 0){
        fid = await gdUpload('', name, vaultPayload(S.project)); // le fichier a été supprimé côté Drive : on en recrée un
      }else throw e;
    }
    gdSetFileId(pid, fid);
    GD.at = Date.now(); GD.err = '';
    if(!silent) toast(L('Scénario envoyé dans ton Google Drive.','Screenplay sent to your Google Drive.'));
  }catch(e){
    GD.err = 'push';
    if(!silent) toast(L('Envoi vers Google Drive impossible.','Couldn\u2019t send to Google Drive.'));
  }
  GD.busy = false;
  if(S.view === 'editor' && S.tab === 'settings') renderTabBody();
}
function scheduleDrivePush(){
  if(!gdConnected() || !S.project) return;
  clearTimeout(GD.timer);
  GD.timer = setTimeout(()=>{ gdPush(true); }, 30000);
}
async function gdPull(){
  if(!S.project) return;
  const fid = gdFileId(S.project.id);
  if(!fid){ toast(L('Ce scénario n\u2019a pas encore de copie dans ton Drive.','This screenplay doesn\u2019t have a copy in your Drive yet.')); return; }
  if(!gdConnected()){ try{ await gdRequestToken(false); }catch(e){ toast(L('Reconnecte Google Drive.','Reconnect Google Drive.')); return; } }
  if(!await mmConfirm(L('La version ouverte ici sera remplacée par celle de ton Google Drive.','The version open here will be replaced by the one in your Google Drive.'),
    {title:L('Remplacer par la version du Drive ?','Replace with the Drive version?'), ok:L('Remplacer','Replace')})) return;
  try{
    const res = await fetch('https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(fid) + '?alt=media',
      { headers:{ Authorization:'Bearer ' + GD.token } });
    if(!res.ok) throw new Error('get');
    const data = await res.json();
    const src = data && data.project;
    if(!src || !Array.isArray(src.elements)) throw new Error('shape');
    const p = vaultNormalize(JSON.parse(JSON.stringify(src)));
    p.id = S.project.id; p.updatedAt = Date.now();
    S.project = p;
    const i = S.projectsIndex.findIndex(e => e.id === p.id);
    if(i >= 0) S.projectsIndex[i] = indexEntryFor(p);
    await saveIndex(); await storSet(proj_key(p.id), p);
    S.undoStack = []; S.redoStack = [];
    render();
    toast(L('Version de Google Drive récupérée.','Version retrieved from Google Drive.'));
  }catch(e){ toast(L('Récupération depuis Google Drive impossible.','Couldn\u2019t retrieve from Google Drive.')); }
}
