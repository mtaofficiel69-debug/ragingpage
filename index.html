/* =====================================================================
   COMPARAISON DE VERSIONS (« Compare » de WriterDuet)
   ---------------------------------------------------------------------
   L'historique savait déjà figer une version et la restaurer — mais en
   aveugle : impossible de voir ce qui séparait la version d'aujourd'hui
   de celle d'il y a trois jours autrement qu'en la restaurant pour aller
   regarder, donc en écrasant son travail en cours. C'est la fonction que
   WriterDuet met au cœur de son historique, et la seule qui manquait
   vraiment : montrer, ligne par ligne, ce qui a été AJOUTÉ et ce qui a
   été SUPPRIMÉ entre une version enregistrée et le scénario actuel.

   L'algorithme est une plus longue sous-séquence commune classique, avec
   deux précautions pour rester instantané même sur un long-métrage :
   on retire d'abord les débuts et fins identiques (dans la vraie vie,
   99 % du scénario n'a pas bougé), et on ne lance le calcul complet que
   si la zone qui reste est raisonnable. Deux lignes sont « la même » si
   elles ont le même type et le même texte, espaces superflus ignorés.
===================================================================== */
function diffKey(e){ return (e.type||'action') + '\u0000' + String(e.text||'').trim().replace(/\s+/g,' '); }
function diffElements(a, b){
  const A = a.map(diffKey), B = b.map(diffKey);
  let s = 0;
  while(s < A.length && s < B.length && A[s] === B[s]) s++;
  let ea = A.length, eb = B.length;
  while(ea > s && eb > s && A[ea-1] === B[eb-1]){ ea--; eb--; }
  const out = [];
  for(let i = 0; i < s; i++) out.push({ op:'=', el:b[i] });
  const ma = A.slice(s, ea), mb = B.slice(s, eb);
  if(ma.length * mb.length > 1200000){
    // Zone modifiée énorme : on n'invente pas un alignement fin, on
    // annonce le bloc tel quel plutôt que de faire ramer la page.
    for(let i = 0; i < ma.length; i++) out.push({ op:'-', el:a[s+i] });
    for(let j = 0; j < mb.length; j++) out.push({ op:'+', el:b[s+j] });
  }else{
    const n = ma.length, m = mb.length;
    const dp = new Uint32Array((n+1) * (m+1));
    const W = m + 1;
    for(let i = n-1; i >= 0; i--)
      for(let j = m-1; j >= 0; j--)
        dp[i*W+j] = (ma[i] === mb[j]) ? dp[(i+1)*W+j+1] + 1
                  : Math.max(dp[(i+1)*W+j], dp[i*W+j+1]);
    let i = 0, j = 0;
    while(i < n && j < m){
      if(ma[i] === mb[j]){ out.push({ op:'=', el:b[s+j] }); i++; j++; }
      else if(dp[(i+1)*W+j] >= dp[i*W+j+1]){ out.push({ op:'-', el:a[s+i] }); i++; }
      else { out.push({ op:'+', el:b[s+j] }); j++; }
    }
    while(i < n){ out.push({ op:'-', el:a[s+i] }); i++; }
    while(j < m){ out.push({ op:'+', el:b[s+j] }); j++; }
  }
  for(let k = eb; k < b.length; k++) out.push({ op:'=', el:b[k] });
  return out;
}
function diffExcerpt(t){
  const s = String(t || '').trim();
  return s ? esc(s.length > 300 ? s.slice(0,300) + '…' : s) : `<i>${L('(ligne vide)','(empty line)')}</i>`;
}
/* N'affiche que les passages qui bougent, avec deux lignes intactes
   autour pour savoir OÙ l'on est dans le scénario. */
function diffPanelHtml(){
  const ver = (S.project.versions || []).find(v => v.id === S.diffVerId);
  if(!ver) return '';
  const rows = diffElements(ver.elements || [], S.project.elements || []);
  const add = rows.filter(r => r.op === '+').length;
  const del = rows.filter(r => r.op === '-').length;
  const CTX = 2;
  const keep = new Array(rows.length).fill(false);
  rows.forEach((r, i) => {
    if(r.op === '=') return;
    for(let k = Math.max(0, i-CTX); k <= Math.min(rows.length-1, i+CTX); k++) keep[k] = true;
  });
  let html = '', gap = false;
  rows.forEach((r, i) => {
    if(!keep[i]){ gap = true; return; }
    if(gap){ html += '<div class="diff-gap">⋯</div>'; gap = false; }
    const cls = r.op === '+' ? 'diff-add' : r.op === '-' ? 'diff-del' : 'diff-ctx';
    const sign = r.op === '+' ? '+' : r.op === '-' ? '−' : '';
    html += `<div class="diff-line ${cls}"><span class="diff-sign">${sign}</span>
      <span class="diff-type">${typeLabelDisplay(r.el.type)}</span>
      <span class="diff-text">${diffExcerpt(r.el.text)}</span></div>`;
  });
  if(!add && !del) html = `<div class="diff-same">${L('Aucune différence : cette version est identique au scénario actuel.','No difference: this version is identical to the current screenplay.')}</div>`;
  return `<div class="diff-panel">
    <div class="diff-head">
      <div><b>${L('Comparaison','Comparison')}</b> — « ${esc(versionLabel(ver))} » (${new Date(ver.timestamp).toLocaleString(getLang()==='en'?'en-US':'fr-FR')}) ${L('face au scénario actuel','against the current screenplay')}</div>
      <button class="btn btn-sm btn-ghost" data-act="closeCompare">${icon('close')} ${L('Fermer','Close')}</button>
    </div>
    <div class="diff-legend"><span class="diff-badge add">+${add} ${L(add>1?'lignes ajoutées':'ligne ajoutée', add>1?'lines added':'line added')}</span>
      <span class="diff-badge del">−${del} ${L(del>1?'lignes supprimées':'ligne supprimée', del>1?'lines removed':'line removed')}</span>
      <span class="diff-note">${L('Le vert est ce qu\u2019il y a aujourd\u2019hui et qui n\u2019existait pas dans la version ; le rouge est ce que la version contenait et qui a disparu depuis.','Green is what exists today and didn\u2019t exist in that version; red is what the version contained and has since disappeared.')}</span></div>
    <div class="diff-body">${html}</div>
  </div>`;
}
function compareVersion(id){ S.diffVerId = (S.diffVerId === id) ? null : id; renderTabBody(); }
function closeCompare(){ S.diffVerId = null; renderTabBody(); }

/* =====================================================================
   LANGUE DE L'INTERFACE (FR / EN)
   ---------------------------------------------------------------------
   Raging Page est écrit en français dans son code, mais s'affiche en
   ANGLAIS par défaut. Un clic sur l'un des deux drapeaux traduit tout
   le CHROME de l'application (boutons, onglets, menus, paramètres,
   aides, messages) — jamais le contenu du scénario : le texte des
   scènes, les titres de projet, les noms de personnages, les tags, les
   notes personnelles et les commentaires restent exactement ce que
   l'utilisateur a écrit, quelle que soit la langue choisie.

   COMMENT ÇA MARCHE, SANS RÉÉCRIRE CHAQUE FONCTION D'AFFICHAGE
   Plutôt que de dupliquer des centaines de chaînes dans tout le code,
   un dictionnaire FR → EN est appliqué directement sur le DOM après
   chaque rendu : chaque nœud de texte est comparé, une fois débarrassé
   des espaces superflus, aux clés du dictionnaire — remplacé seulement
   en cas de correspondance EXACTE. Cette exactitude est ce qui protège
   le contenu de l'utilisateur : une scène, un nom de personnage ou un
   tag ne collera par hasard à une clé du dictionnaire que si l'auteur a
   nommé sa scène très exactement « Ouvrir » ou « Titre », un risque
   négligeable en pratique. Par prudence supplémentaire, la traduction
   n'entre de toute façon jamais dans les zones qui affichent du contenu
   utilisateur (liste I18N_EXCLUDE_SEL ci-dessous) : texte des scènes
   dans l'éditeur, cartes, outline, personnages, tags, notes, corbeille,
   historique, commentaires, page de titre, titres de projet.
   Un MutationObserver relance cette passe à chaque changement du DOM
   (nouvel onglet affiché, menu ouvert, toast affiché…) : aucune fonction
   d'affichage n'a besoin d'appeler quoi que ce soit explicitement.
===================================================================== */
const LANG_KEY = 'scriptmm_lang';
function getLang(){ try{ return localStorage.getItem(LANG_KEY) || 'en'; }catch(e){ return 'en'; } }
function setLangPref(l){ try{ localStorage.setItem(LANG_KEY, l); }catch(e){} }

/* Petit raccourci pour tout ce qui échappe forcément au dictionnaire :
   les boîtes natives prompt()/confirm() ne sont pas des éléments du DOM,
   le MutationObserver qui traduit le reste de l'appli ne peut donc jamais
   les voir. Ce sont les seuls endroits du fichier où le texte anglais est
   écrit à la main à côté du français, plutôt que dans le dictionnaire. */
function L(fr, en){ return getLang()==='en' ? en : fr; }

/* Sélecteur des zones jamais traduites : tout ce qui affiche du texte
   choisi par l'utilisateur (scénario, titres, personnages, tags, notes,
   versions, commentaires, page de titre…), protégé même si une phrase
   venait par malchance à coïncider avec une clé du dictionnaire. */
const I18N_EXCLUDE_SEL = [
  '.line', '[contenteditable]', 'textarea', 'input', 'script', 'style',
  '.card-heading', '.card-syn', '.flat-row-title', '.char-name', '.char-stats',
  '.tag-chip', '.chip-toggle', '.proj-name', '.rail-project', '#charDetail',
  '.titlepage', '#reportResults', '.comment-body', '.diff-text', '.diff-type'
].join(',');

function i18nSkip(el){ return !!(el && el.closest && el.closest(I18N_EXCLUDE_SEL)); }
function i18nWalk(root){
  if(!root || root.nodeType === 8) return;
  if(root.nodeType === 3){
    const raw = root.nodeValue, trimmed = raw.trim();
    if(trimmed && I18N_EN.hasOwnProperty(trimmed) && !i18nSkip(root.parentElement)){
      /* On n'écrit que si le texte change vraiment : écrire la même valeur
         relance le MutationObserver, donc la passe, donc l'écriture… en
         boucle à chaque image (clés identiques FR/EN : Notes, Tags, Outline…). */
      const nv = raw.replace(trimmed, I18N_EN[trimmed]);
      if(nv !== raw) root.nodeValue = nv;
    }
    return;
  }
  if(root.nodeType === 1){
    /* Les attributs title/placeholder sont traduits même sur un élément
       par ailleurs exclu (input, textarea…) : l'exclusion protège le
       CONTENU (texte tapé par l'utilisateur), pas l'indice statique
       affiché quand ce contenu est vide. Il faut donc lire ces attributs
       AVANT de sortir sur i18nSkip, sans quoi le placeholder d'un champ
       de recherche ou d'une zone de notes ne serait jamais traduit. */
    ['title','placeholder'].forEach(attr=>{
      const v = root.getAttribute && root.getAttribute(attr);
      if(v && I18N_EN.hasOwnProperty(v.trim()) && I18N_EN[v.trim()] !== v) root.setAttribute(attr, I18N_EN[v.trim()]);
    });
    if(i18nSkip(root)) return;
  }
  let child = root.firstChild;
  while(child){ i18nWalk(child); child = child.nextSibling; }
}
function applyLanguage(){ if(getLang() === 'en') i18nWalk(document.body); }

let __i18nRaf = null;
function scheduleI18n(){
  if(__i18nRaf) return;
  __i18nRaf = requestAnimationFrame(()=>{ __i18nRaf = null; applyLanguage(); });
}
let __i18nObserver = null;
function startI18nObserver(){
  if(__i18nObserver) return;
  __i18nObserver = new MutationObserver(scheduleI18n);
  __i18nObserver.observe(document.body, {
    childList:true, subtree:true, characterData:true,
    attributes:true, attributeFilter:['title','placeholder']
  });
  scheduleI18n();
}

/* Traduction des toasts : seuls les messages STATIQUES (correspondance
   exacte avec une clé) passent en anglais ; les messages qui contiennent
   des données de l'utilisateur (nom de fichier, titre…) restent
   inchangés faute de correspondance exacte — le comportement voulu. */
const __origToast = toast;
toast = function(msg){
  if(getLang() === 'en' && I18N_EN.hasOwnProperty(String(msg).trim())) msg = I18N_EN[String(msg).trim()];
  return __origToast(msg);
};

/* Boutons de langue, affichés sur l'accueil et dans l'éditeur.
   Texte "FR"/"EN" plutôt que des emojis drapeaux : sur certains systèmes
   (Windows sans pack d'emojis couleur, notamment) un drapeau non pris en
   charge s'affiche comme du texte brut ("GB"...), ce qui rendait le
   bouton illisible et personne ne comprenait qu'il servait à changer de
   langue. Du texte simple s'affiche partout, sans ambiguïté. */
function langFlagsHtml(extraCls){
  const lang = getLang();
  return `<div class="lang-flags ${extraCls||''}" role="group" aria-label="Langue / Language">
    <button class="lang-flag ${lang==='fr'?'active':''}" data-act="setLang" data-id="fr" title="${L('Passer en français','Switch to French')}" aria-label="Français">FR</button>
    <button class="lang-flag ${lang==='en'?'active':''}" data-act="setLang" data-id="en" title="${L('Passer en anglais','Switch to English')}" aria-label="English">EN</button>
  </div>`;
}
/* Les mentions de continuité (personnage ET page) sont désormais toujours
   calculées à partir de la langue de l'interface — plus besoin de les
   resynchroniser à part : render() suffit, elles se recalculent au
   passage (voir contdMap et pageContWord). */
/* Changer de langue reconstruit toute l'interface : sans précaution, chaque
   zone qui défile (scénario, panneaux, navigateur de scènes, listes…) repartait
   tout en haut. On note donc la position de chaque zone qui défile, puis on la
   remet une fois la nouvelle langue affichée (plusieurs fois, car la pagination
   et la traduction finissent un instant après le rendu). */
function scrollKeyOf(el){
  if(el.id) return '#' + el.id;
  const parts = [];
  let n = el;
  while(n && n !== document.body && n.nodeType === 1){
    if(n.id){ parts.unshift('#' + n.id); break; }
    const sib = n.parentNode ? Array.prototype.indexOf.call(n.parentNode.children, n) : 0;
    parts.unshift(n.tagName.toLowerCase() + ':' + sib);
    n = n.parentNode;
  }
  return parts.join('>');
}
function captureScrolls(){
  const out = [];
  const root = document.getElementById('app') || document.body;
  const seen = [root].concat(Array.prototype.slice.call(root.querySelectorAll('*')));
  seen.forEach(el => { if(el.scrollTop > 0 || el.scrollLeft > 0) out.push([scrollKeyOf(el), el.scrollTop, el.scrollLeft]); });
  return { items: out, win: [window.scrollX, window.scrollY] };
}
function restoreScrolls(snap){
  const root = document.getElementById('app') || document.body;
  const byKey = new Map();
  [root].concat(Array.prototype.slice.call(root.querySelectorAll('*'))).forEach(el => {
    if(el.scrollHeight > el.clientHeight || el.scrollWidth > el.clientWidth) byKey.set(scrollKeyOf(el), el);
  });
  snap.items.forEach(([k, top, left]) => {
    const el = byKey.get(k);
    if(el){ el.scrollTop = top; el.scrollLeft = left; }
  });
  if(snap.win[0] || snap.win[1]) window.scrollTo(snap.win[0], snap.win[1]);
}
function setLang(l){
  const snap = captureScrolls();
  const selTab = S.tab;
  setLangPref(l); render(); scheduleI18n();
  // le rendu pose d'abord un contenu vide ou non paginé : on remet la position
  // tout de suite, puis après la pagination et la traduction.
  restoreScrolls(snap);
  [60, 200, 500, 1000].forEach(ms => setTimeout(() => {
    if(S.tab !== selTab) return;          // l'utilisateur a changé d'onglet entre-temps
    restoreScrolls(snap);
  }, ms));
}

/* =====================================================================
   SCÉNARIO D'EXEMPLE ET « AIDE À L'ÉCRITURE »
   Deux entrées vers le même contenu : l'accueil (choix de la langue) et
   l'onglet « Aide à l'écriture » de l'éditeur. Dans les deux cas on crée
   une COPIE personnelle : on peut la modifier sans abîmer le modèle.
   Français = mise en page française ; anglais = mise en page américaine.
===================================================================== */
let S_sampleLang = null;
function sampleDefaultLang(){ return getLang()==='en' ? 'en' : 'fr'; }
function parseSampleRows(txt){
  return txt.trim().split('\n').map(l=>{ const a = l.split('|'); return { t:a[0], text:a[1], key:a[2] }; });
}
function buildSampleProject(lang){
  const en = lang === 'en';
  const p = newProject(en ? 'Last Aisle' : 'Dernier Rayon', en ? 'us' : 'fr', 'Court métrage');
  p.author = 'Raging Page';
  p.titlePageExtra = en ? 'Example screenplay \u2014 free to copy, edit and keep' : 'Scénario d\u2019exemple \u2014 libre à copier, modifier et conserver';
  p.isSample = true; p.sampleLang = lang;
  const T = { s:'scene', a:'action', c:'character', p:'parenthetical', d:'dialogue', t:'transition', n:'note', h:'shot', k:'card' };
  const keyToId = {};
  p.elements = parseSampleRows(en ? SAMPLE_EN : SAMPLE_FR).map(r=>{
    const el = newElement(T[r.t], r.text);
    /* « k » : mention de fin (FIN / THE END) — centrée, corps 12 pt normal, comme dans un scénario imprimé. */
    if(r.t === 'k') el.card = Object.assign(cardDefaults(), { size:12, align:'center', bold:false, italic:false, caps:true, font:'mono', frame:'none', width:100, space:1, full:false });
    if(r.t === 's' && r.key) keyToId[r.key] = el.id;
    return el;
  });
  Object.keys(SAMPLE_OUTLINES).forEach(k=>{
    if(keyToId[k]) p.sceneMeta[keyToId[k]] = { tags:[], outline: SAMPLE_OUTLINES[k][en?1:0], color:'' };
  });
  p.structure = { beats: SAMPLE_BEATS.map((b,i)=>({
    id: uid('beat'), title: en ? b[2] : b[1], note: en ? b[4] : b[3],
    color: STRUCTURE_COLORS[i % STRUCTURE_COLORS.length], sceneId: keyToId[b[0]] || null
  })) };
  return p;
}
async function createSample(id){
  const lang = (id === 'fr' || id === 'en') ? id : (S_sampleLang || sampleDefaultLang());
  if(S.view === 'editor'){ closeMoreMenu(); stopReading(); stopDictation(); cancelPendingPagination(); hideAutocomplete(); }
  flushAutosave();
  const p = buildSampleProject(lang);
  ensureSettings(p); ensureTPDesign(p); ensureStructure(p);
  S.project = p;
  S.projectsIndex.push(indexEntryFor(p));
  await saveIndex(); await storSet(proj_key(p.id), p);
  closeSampleModal();
  S.view = 'editor'; S.tab = 'editor'; S.undoStack = []; S.redoStack = [];
  render();
}
function stripSampleNotes(){
  if(!S.project) return;
  pushUndo();
  S.project.elements = S.project.elements.filter(e=>e.type !== 'note');
  scheduleAutosave(); renderTabBody();
  toast(L('Notes supprimées : il ne reste que le scénario.','Notes removed: only the screenplay is left.'));
}

function toggleMoreMenu(id, e){
  if(document.getElementById('tbMoreMenu')){ closeMoreMenu(); return; }
  const btn = e.target.closest('button');
  if(!btn) return;
  const r = btn.getBoundingClientRect();
  const html = `<div class="tb-more-backdrop" id="tbMoreBackdrop" data-act="closeMoreMenu"></div>
    <div class="tb-more-menu" id="tbMoreMenu" data-stop="1" style="top:${Math.round(r.bottom+6)}px; right:${Math.round(window.innerWidth-r.right)}px;">${moreMenuHtml()}</div>`;
  document.body.insertAdjacentHTML('beforeend', html);
  // N'importe quel choix dans le panneau le referme — c'est un menu, pas un
  // tableau de bord : basculer un deuxième réglage se fait en le rouvrant.
  document.getElementById('tbMoreMenu').addEventListener('click', e=>{ if(e.target.closest('.tb-font-row')) return; closeMoreMenu(); });
  document.addEventListener('keydown', onMoreMenuKeydown);
}
function closeMoreMenu(){
  const b = document.getElementById('tbMoreBackdrop'); if(b) b.remove();
  const m = document.getElementById('tbMoreMenu'); if(m) m.remove();
  document.removeEventListener('keydown', onMoreMenuKeydown);
}
function onMoreMenuKeydown(e){ if(e.key === 'Escape') closeMoreMenu(); }

function onGlobalClick(e){
  const t = e.target.closest('[data-act]');
  if(!t) return;
  if(t.dataset.stop && t !== e.target){ /* still fine */ }
  const act = t.dataset.act; const id = t.dataset.id;
  if(ACTIONS[act]) ACTIONS[act](id, e);
}

const SYN = { groups:null, open:false, tab:'alt', last:null, query:'', items:[], timer:null, repMode:'words', repMin:3, repOpen:null, repData:null, repTimer:null };
const SYN_ER = ['e','es','ent','ons','ez','ait','aient','ais','ant','é','ée','és','ées','a','èrent','er','era','erait','erai','eras','eront'];
function synEsc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function synParse(){
  if(SYN.groups) return SYN.groups;
  SYN.groups = SYN_DB_TEXT.trim().split('\n').map(line=>{
    const p = line.split('|');
    const t = p[0], nuance = p[1], alts = (p[2]||'').split(';').filter(Boolean), heads = (p[3]||'').split(',').filter(Boolean);
    const items = alts.map(a=>{
      if(t==='v'){ const m=a.split('>'); return {text:m[0], cons:m[1]||'d', lemma:m[0]}; }
      if(t==='n'){ const q=a.split(':'), w=q[0].split('~'); return {text:w[0], tag:w[1]||'', pl:q[1]||'', lemma:w[0]}; }
      const w=a.split('~'); return {text:w[0], adj:w[1]==='a', lemma:w[0]};
    });
    const keys = [];
    heads.forEach(h=>h.split(':').forEach(k=>keys.push({k:k.replace(/^\^/,'').toLowerCase(), head:true})));
    if(!heads.length && items[0]) keys.push({k:items[0].lemma.toLowerCase(), head:true});
    items.forEach(i=>{ if(i.lemma.indexOf('{')<0) keys.push({k:i.lemma.toLowerCase(), head:false}); });
    return {t, nuance, items, keys};
  });
  return SYN.groups;
}
function synWordMatch(key, w){
  if(w===key) return true;
  const stem = (key.length>=6 && /(er|ir|re)$/.test(key)) ? key.slice(0,-2) : key;
  if(stem.length<5) return w===key || w===key+'s' || w===key+'x';
  return w.startsWith(stem) && w.length<=stem.length+5;
}
function synTokens(s){ return s.toLowerCase().split(/[^\p{L}'’-]+/u).filter(Boolean); }
function synMatch(key, q, toks){
  if(key.indexOf(' ')>=0) return q.indexOf(key)>=0 ? q.split(key).length-1 : 0;
  let n=0; for(const w of toks) if(synWordMatch(key,w)) n++; return n;
}
function synApplyCase(src, txt){
  return (src && src[0] && src[0]!==src[0].toLowerCase() && src[0]===src[0].toUpperCase()) ? txt.charAt(0).toUpperCase()+txt.slice(1) : txt;
}
/* Construit la forme à insérer pour une alternative, d'après le mot cliqué. */
function synForm(g, it, word, key){
  let t = it.text.replace(/\{p[sf]?\}/g, m=> m==='{pf}'?'sa':'son');
  if(g.t==='v'){
    if(key && key.length>=6 && /er$/.test(key) && !/^(se |s')/.test(it.text)){
      const stem = key.slice(0,-2), w = word.toLowerCase();
      if(w.startsWith(stem)){
        const end = w.slice(stem.length);
        if(SYN_ER.indexOf(end)>=0 && /er$/.test(it.text) && it.text.indexOf(' ')<0 && !/(ger|cer|yer|eler|eter)$/.test(it.text))
          return {txt: it.text.slice(0,-2)+end, ok:true};
        if(SYN_ER.indexOf(end)>=0 && /er$/.test(it.text) && it.text.indexOf(' ')>0 && it.text.indexOf('{')<0){
          const sp = it.text.indexOf(' '), v = it.text.slice(0,sp);
          if(/^[a-zéèêàâîïôûç]+er$/.test(v) && !/(ger|cer|yer|eler|eter)$/.test(v))
            return {txt: v.slice(0,-2)+end+it.text.slice(sp), ok:true};
        }
      }
    }
    return {txt:t, ok:false};
  }
  if(g.t==='n'){
    const plural = /[sx]$/i.test(word) && word.length>3;
    if(plural && !/p$/.test(it.tag)){ t = it.pl || (/[sxz]$/.test(t)?t:t+'s'); }
    return {txt:t, ok:true};
  }
  if(it.adj || g.t==='a'){
    if(/s$/i.test(word) && !/[sx]$/.test(t)) t+='s';
    if(/e$/i.test(word) && /[ué]$/.test(t) && !/e$/.test(t)) t+='e';
  }
  return {txt:t, ok:true};
}
function synLookup(q){
  const ql = q.toLowerCase().trim(), toks = synTokens(ql), out = [];
  if(!toks.length) return out;
  synParse().forEach(g=>{
    let best = null;
    g.keys.forEach(kk=>{
      if(synMatch(kk.k, ql, toks)){ if(!best || (kk.head && !best.head) || (kk.k.length>best.k.length && kk.head===best.head)) best = kk; }
    });
    if(!best) return;
    const w = best.k.indexOf(' ')>=0 ? best.k : (toks.find(x=>synWordMatch(best.k,x))||toks[0]);
    const list = g.items.filter(i=> i.lemma.toLowerCase()!==best.k && i.lemma.toLowerCase()!==ql).map(i=>{
      const f = synForm(g, i, w, best.k); return {g, it:i, txt:f.txt, ok:f.ok};
    });
    if(list.length) out.push({g, score:(best.head?2:1)+(best.k.indexOf(' ')>=0?1:0), list});
  });
  return out.sort((a,b)=>b.score-a.score).slice(0,8);
}
/* Contexte d'édition : ligne + bornes du mot sélectionné / sous le curseur. */
function synCtxFromSelection(){
  const page = document.getElementById('page'), sel = window.getSelection();
  if(!page || !sel || !sel.rangeCount) return null;
  const r = sel.getRangeAt(0);
  if(!page.contains(r.startContainer)) return null;
  const sp = selectionSpan();
  if(!sp) return null;
  if(sp.multi) return {multi:true, text:sel.toString().slice(0,80)};
  const el = findEl(sp.a.dataset.id); if(!el) return null;
  const txt = el.text||''; let l=sp.aOff, rr=sp.bOff;
  if(l===rr){
    while(l>0 && /[\p{L}'’-]/u.test(txt[l-1])) l--;
    while(rr<txt.length && /[\p{L}'’-]/u.test(txt[rr])) rr++;
  }
  const word = txt.slice(l,rr).replace(/^['’-]+|['’-]+$/g,'');
  return {id:sp.a.dataset.id, l, r:rr, text:txt.slice(l,rr), word};
}
function synTrack(){
  const c = synCtxFromSelection();
  if(c && !c.multi && c.text) SYN.last = c;
  if(c && SYN.open && SYN.tab==='alt' && !document.activeElement.closest?.('#synPanel')){
    clearTimeout(SYN.timer);
    SYN.timer = setTimeout(()=>{ const d=synCtxFromSelection(); if(d && d.text && d.text!==SYN.query){ SYN.query=d.text; synRender(); } }, 220);
  }

function synRepScan(){
  const p = S.project, numbers = sceneNumbers(), pageOf = (S.pagination && S.pagination.pageOf) || {};
  const SKIP = {scene:1, character:1, note:1, shot:1, transition:1};
  const words = {}, near = {}, units = [];
  let sceneNo = '', gi = 0;
  p.elements.forEach(el=>{
    if(el.type === 'scene'){ sceneNo = numbers[el.id] != null ? String(numbers[el.id]) : ''; return; }
    if(SKIP[el.type] || !el.text) return;
    const toks = [], re = /\p{L}[\p{L}'’-]*/gu; let m;
    while((m = re.exec(el.text))){
      const w = m[0].replace(/^['’-]+|['’-]+$/g, '');
      toks.push({ w:w.toLowerCase(), off:m.index, len:m[0].length, g:gi++ });
    }
    units.push({ el, toks, sc:sceneNo, pg:pageOf[el.id] });
  });
  const stem = w=> (w.length > 4 && /[sx]$/.test(w)) ? w.slice(0, -1) : w;
  const okWord = w=> w.length >= 4 && !SYN_STOP.has(w);
  const add = (map, key, surf, u, t, len)=>{
    const e = map[key] || (map[key] = { k:key, forms:{}, occ:[] });
    e.forms[surf] = (e.forms[surf] || 0) + 1;
    e.occ.push({ id:u.el.id, off:t.off, len, sc:u.sc, pg:u.pg, g:t.g });
  };
  const phr = {};
  units.forEach(u=>{
    u.toks.forEach((t, i)=>{
      if(okWord(t.w)) add(words, stem(t.w), t.w, u, t, t.len);
      for(const n of [2, 3]){
        const e = u.toks[i + n - 1]; if(!e) continue;
        if(!okWord(t.w) || !okWord(e.w)) continue;
        const raw = u.el.text.slice(t.off, e.off + e.len);
        add(phr, u.toks.slice(i, i + n).map(x=>x.w).join(' '), raw.toLowerCase(), u, t, raw.length);
      }
    });
  });
  const fin = map=> Object.values(map).map(e=>{
    e.label = Object.keys(e.forms).sort((a, b)=>e.forms[b] - e.forms[a])[0];
    e.n = e.occ.length; return e;
  });
  const W = fin(words), P = fin(phr);
  // Échos : même mot à moins de 30 mots d'écart.
  W.forEach(e=>{
    let c = 0; for(let i = 1; i < e.occ.length; i++) if(e.occ[i].g - e.occ[i-1].g <= 30) c++;
    e.near = c;
  });
  return { W, P, total: units.reduce((s, u)=>s + u.toks.length, 0) };
}
function synRepList(){
  const d = SYN.repData || (SYN.repData = synRepScan()), min = SYN.repMin;
  let list;
  if(SYN.repMode === 'near') list = d.W.filter(e=>e.near >= 1 && e.n >= 2).sort((a, b)=>b.near - a.near || b.n - a.n);
  else if(SYN.repMode === 'phr'){
    list = d.P.filter(e=>e.n >= Math.max(2, min - 1));
    // une expression de 2 mots incluse dans une de 3 mots de même fréquence est redondante
    list = list.filter(e=> e.k.split(' ').length === 3 || !list.some(o=>o !== e && o.k.indexOf(e.k) >= 0 && o.n >= e.n));
    list.sort((a, b)=>b.n - a.n || b.k.length - a.k.length);
  } else list = d.W.filter(e=>e.n >= min).sort((a, b)=>b.n - a.n);
  return list.slice(0, 40);
}

      }).join('') + (e.occ.length > 40 ? `<div class="sy-hint" style="padding:6px 12px;">+ ${e.occ.length - 40}</div>` : '') + '</div>';
      return `<button class="sy-row${open?' open':''}" data-rk="${synEsc(e.k)}"><div class="sy-rl"><span class="sy-rw">${synEsc(e.label)}</span>${mode==='words'&&e.near>=3?`<span class="sy-tag" title="${L('Revient souvent à moins de 30 mots','Often within 30 words')}">${L('proches','close')}</span>`:''}<span class="sy-rn">${mode==='near'?e.near+'×':e.n+'×'}</span><svg class="sy-ch" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 1.5 6.5 5 3 8.5"/></svg></div><div class="sy-bar"><i style="width:${Math.max(6, Math.round(big(e) / maxv * 100))}%"></i></div></button>${occ}`;

function synJump(id, off, len){
  const div = document.querySelector('#page [data-id="' + id + '"]'); if(!div) return;

      const r = document.createRange(); r.setStart(tn, Math.min(off, tn.length)); r.setEnd(tn, Math.min(off + len, tn.length));

const REV_UI = { color:null, cmp:null };

function revColor(id){ return REV_COLORS.find(c=>c.id===id) || REV_COLORS[0]; }
function revColorName(id){ const c = revColor(id); return L(c.fr, c.en); }
function revEnsure(p){
  if(!p.rev || !Array.isArray(p.rev.rounds)) p.rev = { rounds:[], show:true, inExport:true, paper:true, inText:true };
  if(p.rev.show === undefined) p.rev.show = true;
  if(p.rev.inExport === undefined) p.rev.inExport = true;
  if(p.rev.paper === undefined) p.rev.paper = true;      // papier de couleur (PDF / impression)
  if(p.rev.inText === undefined) p.rev.inText = true;    // marques dans .txt / .fountain / .fdx
  if(!p.rev.manual) p.rev.manual = {};                   // lignes marquées à la main { id: indice de révision }
  if(!p.rev.hidden) p.rev.hidden = {};                   // lignes démarquées à la main { id: texte au moment du démarquage }
  return p.rev;
}
function revDateStr(ts){
  try{ return new Date(ts).toLocaleDateString(L('fr-FR','en-US'), {day:'2-digit', month:'2-digit', year:'numeric'}); }
  catch(e){ return ''; }
}
/* { idLigne: indice de la révision qui l'a modifiée en dernier } */
function revCalc(p){
  const r = revEnsure(p), n = r.rounds.length, marks = {}, delOnly = {}, del = r.rounds.map(()=>0);
  if(!n) return { marks, delOnly, del };
  const live = p.elements.filter(el=>el.type !== 'note'), liveSet = new Set(live.map(e=>e.id));
  live.forEach(el=>{
    let next = el.text || '';
    for(let k = n - 1; k >= 0; k--){
      const base = r.rounds[k].base || {};
      const has = Object.prototype.hasOwnProperty.call(base, el.id);
      const prev = has ? base[el.id] : null;
      if(prev !== next){ marks[el.id] = k; break; }
      next = prev;
    }
  });
  // Suppressions : une ligne présente à la photo k et absente aujourd'hui laisse un
  // astérisque sur la ligne qui la précédait (comme dans Final Draft).
  if(live.length) r.rounds.forEach((rd, k)=>{
    const base = rd.base || {};
    let last = null, pend = [];
    const put = id=>{
      if(marks[id] === undefined || marks[id] < k){ marks[id] = k; delOnly[id] = true; }
    };
    Object.keys(base).forEach(id=>{
      if(liveSet.has(id)){
        if(pend.length && last === null) put(id);
        pend = []; last = id;
      } else if((base[id] || '').trim()){
        del[k]++;
        if(last !== null) put(last); else pend.push(id);
      }
    });
    if(pend.length && last === null) put(live[0].id);
  });
  // Marquage manuel (Ctrl+Alt+M) : forcé en plus, ou retiré tant que le texte n'a pas rebougé.
  const man = r.manual || {}, hid = r.hidden || {};
  Object.keys(man).forEach(id=>{
    const k = man[id];
    if(k < n && liveSet.has(id) && (marks[id] === undefined || marks[id] < k)){ marks[id] = k; delete delOnly[id]; }
  });
  live.forEach(el=>{
    if(hid[el.id] !== undefined && hid[el.id] === (el.text || '')){ delete marks[el.id]; delete delOnly[el.id]; }
  });
  return { marks, delOnly, del };
}
function revMarks(p){ return revCalc(p).marks; }
/* Scènes omises : numéro figé d'une scène qui n'est plus dans le scénario
   (corbeille ou supprimée définitivement). Le numéro n'est jamais réattribué. */
function revOmittedScenes(p){
  p = p || S.project;
  if(!p.settings || !p.settings.numbersLocked) return [];
  const set = new Set((p.omittedNums || []).map(String));
  (p.graveyard || []).forEach(g=>{ if(g.meta && g.meta.lockedNum) set.add(String(g.meta.lockedNum)); });
  return Array.from(set).sort((a,b)=>{
    const ma = /^(\d+)(.*)$/.exec(a) || [0,0,a], mb = /^(\d+)(.*)$/.exec(b) || [0,0,b];
    return (+ma[1] - +mb[1]) || String(ma[2]).localeCompare(String(mb[2]));
  });
}
/* Hauteur de chaque ligne visuelle d'un bloc (un astérisque par ligne). */
function revLineTops(div){
  const rg = document.createRange(); rg.selectNodeContents(div);
  const tops = [];
  Array.from(rg.getClientRects()).filter(r=>r.height>0).forEach(r=>{
    if(!tops.some(t=>Math.abs(t.top - r.top) < 3)) tops.push({top:r.top, h:r.height});
  });
  if(!tops.length){ const r = div.getBoundingClientRect(); tops.push({top:r.top, h:r.height}); }
  return tops.sort((a,b)=>a.top-b.top);
}
function revLabelText(k, p){
  const rd = (p || S.project).rev.rounds[k];
  return L('RÉVISION ','REVISED ') + revColorName(rd.color).toUpperCase() + ' · ' + revDateStr(rd.date);
}

  st.textContent = `
  #revMarks{position:absolute; inset:0; z-index:3; pointer-events:none; -webkit-user-select:none; user-select:none;}

  .rev-omit{position:absolute; left:var(--pm-left,3cm); right:var(--pm-right,2.5cm); bottom:calc(var(--pm-bottom,2.5cm) * .35); font-family:var(--script-font,var(--mono)); font-size:9pt; color:#555; line-height:1.3;}
  .rev-label{right:calc(var(--pm-right,2.5cm) + 1.7cm); top:var(--pn-top,1.2cm); font-size:9.5pt; letter-spacing:.04em;}
  #printArea .print-page, #pdfStage .print-page, #printArea .rev-star, #printArea .rev-label, #printArea .rev-omit{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
  #revBackdrop .modal{max-width:470px; max-height:90vh; overflow:auto;}
  #revBackdrop .rv-sub{font-size:13.5px; color:var(--ink-soft); margin:-8px 0 14px; line-height:1.45;}
  #revBackdrop .rv-row{display:flex; align-items:center; gap:10px; padding:8px 10px; border:1px solid var(--hair); border-radius:4px; margin-bottom:6px; font-size:14px;}
  #revBackdrop .rv-dot{width:14px; height:14px; border-radius:50%; flex:none;}
  #revBackdrop .rv-row span.rv-n{margin-left:auto; color:var(--ink-soft); font-size:12.5px;}
  #revBackdrop .rv-sw{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 14px;}
  #revBackdrop .rv-sw button{display:flex; align-items:center; gap:6px; padding:5px 10px 5px 6px; border:2px solid var(--hair); background:var(--surface-soft); color:var(--ink); border-radius:16px; font:13px var(--sans); cursor:pointer;}
  #revBackdrop .rv-sw button.on{border-color:var(--accent);}
  #revBackdrop .rv-chk{display:flex; align-items:center; gap:8px; font-size:13.5px; margin:6px 0; cursor:pointer;}
  #revBackdrop .rv-cmp{border:1px solid var(--hair); border-radius:4px; padding:8px 10px; margin:0 0 8px; max-height:240px; overflow:auto; font-size:13px;}
  #revBackdrop .rv-cmp-h{font-weight:700; margin-bottom:6px;}
  #revBackdrop .rv-cmp-row{padding:4px 0; border-top:1px solid var(--hair);}
  #revBackdrop .rv-cmp-row del{display:block; color:var(--ink-soft);}
  #revBackdrop .rv-cmp-row ins{display:block; text-decoration:none;}
  #revBackdrop .rv-cmp-row em{display:block; color:var(--ink-soft);}
  #revBackdrop .rv-row button.rv-see{margin-left:auto; border:1px solid var(--hair); background:none; color:var(--ink); border-radius:12px; padding:2px 9px; font:12px var(--sans); cursor:pointer;}
  #revBackdrop h3{font:700 11px var(--sans); letter-spacing:.07em; text-transform:uppercase; color:var(--ink-soft); margin:16px 0 8px;}
  `;
  document.head.appendChild(st);
}

/* ---- Éditeur : astérisques dans la marge + étiquette en haut de page ---- */
function revDraw(){
  const stack = document.getElementById('pageStack'), page = document.getElementById('page');
  let layer = document.getElementById('revMarks');
  if(!stack || !page || !S.project || S.tab !== 'editor'){ if(layer) layer.remove(); return; }
  const p = S.project, r = revEnsure(p);
  if(!r.rounds.length || !r.show){ if(layer) layer.remove(); return; }
  revCss();
  if(!layer){ layer = document.createElement('div'); layer.id = 'revMarks'; stack.appendChild(layer); }
  const sr = stack.getBoundingClientRect();
  const sc = (stack.offsetWidth ? sr.width / stack.offsetWidth : 1) || 1;
  const rc = revCalc(p), marks = rc.marks;
  const sheets = Array.from(document.querySelectorAll('#sheets .sheet')).map(s=>({top:s.offsetTop, h:s.offsetHeight}));
  const pageBest = {};
  let html = '';
  page.querySelectorAll('.line[data-id]').forEach(div=>{
    const k = marks[div.dataset.id]; if(k === undefined) return;
    const ink = revColor(r.rounds[k].color).ink;
    const tl = revLineTops(div);
    (rc.delOnly[div.dataset.id] ? tl.slice(-1) : tl).forEach(t=>{
      const y = (t.top - sr.top) / sc, h = t.h / sc;
      html += `<div class="rev-star" style="top:${y.toFixed(1)}px;height:${h.toFixed(1)}px;line-height:${h.toFixed(1)}px;color:${ink}">*</div>`;
      const mid = y + h / 2;
      const si = sheets.findIndex(s=> mid >= s.top && mid < s.top + s.h);
      if(si >= 0) pageBest[si] = Math.max(pageBest[si] === undefined ? -1 : pageBest[si], k);
    });
  });
  Object.keys(pageBest).forEach(si=>{
    const k = pageBest[si], ink = revColor(r.rounds[k].color).ink;
    html += `<div class="rev-label" style="top:${sheets[si].top}px;color:${ink}">${esc(revLabelText(k))}</div>`;
  });
  layer.innerHTML = html;
}
let REV_T = null;
function scheduleRevDraw(ms){
  clearTimeout(REV_T);
  REV_T = setTimeout(()=>{ try{ revDraw(); }catch(e){} }, ms === undefined ? 180 : ms);
}

/* ---- Impression / PDF : mêmes marques, posées sur chaque feuille ---- */
/* Scènes et pages omises : mention en pied de la dernière feuille (impression et PDF),
   lue telle quelle par pdfReadSheet comme les autres marques. */
function revOmitNote(sheets, p){
  if(!sheets.length) return;
  const sc = revOmittedScenes(p);
  const pg = (p === S.project && S.pagination && S.pagination.omitted) ? S.pagination.omitted : [];
  if(!sc.length && !pg.length) return;
  revCss();
  const parts = [];
  if(sc.length) parts.push(L('Scènes omises (OMITTED) : ','Omitted scenes: ') + sc.join(', '));
  if(pg.length) parts.push(L('Pages omises (OMITTED) : ','Omitted pages: ') + pg.join(', '));
  const last = sheets[sheets.length - 1];
  const d = document.createElement('div');
  d.className = 'rev-omit'; d.textContent = parts.join('  ·  ');
  last.appendChild(d);
}
function revDecorateSheets(sheets, p){
  const r = revEnsure(p);
  try{ revOmitNote(sheets, p); }catch(e){}
  if(!r.rounds.length) return;
  if(!r.inExport && !r.paper) return;
  revCss();   // indispensable aussi pour un export de série : l'épisode exporté n'est pas forcément ouvert
  const rc = revCalc(p), marks = rc.marks;
  sheets.forEach(sheet=>{
    const sr = sheet.getBoundingClientRect();
    let best = -1;
    const stars = [];
    sheet.querySelectorAll('.line[data-id]').forEach(div=>{
      const k = marks[div.dataset.id]; if(k === undefined) return;
      best = Math.max(best, k);
      const ink = revColor(r.rounds[k].color).ink;
      const tl = revLineTops(div);
      (rc.delOnly[div.dataset.id] ? tl.slice(-1) : tl).forEach(t=> stars.push({ top:t.top - sr.top, h:t.h, ink }));
    });
    if(best < 0) return;                      // page intacte : reste blanche, sans marque
    const col = revColor(r.rounds[best].color);
    // Papier de couleur : la page prend la teinte de sa révision la plus récente,
    // comme les pages de remplacement d'un vrai tournage. pdfReadSheet relit
    // ce fond tel quel, le PDF le reproduit donc sans code supplémentaire.
    if(r.paper) sheet.style.background = col.bg;
    if(!r.inExport) return;
    stars.forEach(t=>{
      const el = document.createElement('div');
      el.className = 'rev-star'; el.textContent = '*';
      el.style.cssText = `top:${t.top.toFixed(1)}px;height:${t.h.toFixed(1)}px;line-height:${t.h.toFixed(1)}px;color:${t.ink};`;
      sheet.appendChild(el);
    });
    const l = document.createElement('div');
    l.className = 'rev-label'; l.textContent = revLabelText(best, p);
    l.style.color = col.ink;
    sheet.appendChild(l);
  });
}

/* ---- Exports texte : .txt, .fountain, .fdx ----
   Mêmes marques que dans l'éditeur, déduites de la même comparaison.
   - .txt : astérisque calé au bord droit (colonne 78), comme sur une page.
   - .fountain : note [[révision bleue]] en fin de ligne (syntaxe standard,
     ignorée à l'affichage par WriterDuet, Fade In, Highland…). Les lignes
     Personnage et Parenthèse ne la portent pas : elle casserait leur
     détection chez la plupart des lecteurs ; leur marque passe à la
     réplique qui suit.
   - .fdx : attribut RevisionID sur chaque <Text> + liste <Revisions>. */
function revTextMarks(p){
  p = p || S.project;
  const r = revEnsure(p);
  if(!r.rounds.length || !r.inText) return null;
  return revMarks(p);
}
function revOmittedText(p){
  const om = revOmittedScenes(p);
  return om.length ? L('Scènes omises (OMITTED) : ','Omitted scenes: ') + om.join(', ') : '';
}
function revLegendText(p){
  const r = revEnsure(p), om = revOmittedText(p);
  if(!r.rounds.length || !r.inText) return om;
  return L('Révisions','Revisions') + ' : ' +
    r.rounds.map(rd=> revColorName(rd.color) + ' (' + revDateStr(rd.date) + ')').join(', ') +
    ' — * ' + L('= ligne modifiée','= changed line') + (om ? '\n' + om : '');
}
function revTxtStar(line){
  const W = 78;
  if(line.length >= W - 2) return line + ' *';
  return line + ' '.repeat(W - line.length - 1) + '*';
}
function revFountainNote(k, p){
  const r = revEnsure(p || S.project);
  return '[[' + L('révision ','revision ') + revColorName(r.rounds[k].color).toLowerCase() + ']]';
}
function revFdxColor(hex){ return String(hex).toUpperCase() + '000000'; }
function revFdxBlock(p){
  const r = revEnsure(p);
  if(!r.rounds.length || !r.inText) return '';
  const rows = ['<Revision ID="0" Name="White Revision" Color="#FFFFFF000000" Mark="" Style=""/>'].concat(r.rounds.map((rd, i)=>{
    const c = revColor(rd.color);
    return `<Revision ID="${i+1}" Name="${esc(c.en + ' Revision')}" Color="${revFdxColor(c.ink)}" Mark="*" Style=""/>`;
  })).join('\n');
  return `<Revisions ActiveSet="${r.rounds.length}">\n${rows}\n</Revisions>\n`;
}

/* ---- Fenêtre « Révisions » ---- */
function revNextColor(r){
  if(!r.rounds.length) return REV_COLORS[0].id;
  const last = REV_COLORS.findIndex(c=>c.id === r.rounds[r.rounds.length-1].color);
  return REV_COLORS[(last + 1) % REV_COLORS.length].id;
}
/* Comparaison : ce que la révision k a changé (avant → après), plus les lignes disparues depuis. */
function revCmpHtml(p, k){
  const r = revEnsure(p), rc = revCalc(p), base = r.rounds[k].base || {};
  const c = revColor(r.rounds[k].color), cut = t=> esc(String(t || '').trim().slice(0, 160));
  const live = p.elements.filter(e=>e.type !== 'note'), liveSet = new Set(live.map(e=>e.id));
  const ch = live.filter(e=> rc.marks[e.id] === k && !rc.delOnly[e.id]);
  const dl = Object.keys(base).filter(id=> !liveSet.has(id) && (base[id] || '').trim());
  const rows = ch.slice(0, 40).map(e=>{
    const had = Object.prototype.hasOwnProperty.call(base, e.id) && (base[e.id] || '').trim();
    return `<div class="rv-cmp-row">${had ? `<del>${cut(base[e.id])}</del>` : `<em>${L('nouvelle ligne','new line')}</em>`}<ins>${cut(e.text)}</ins></div>`;
  }).join('') + dl.slice(0, 20).map(id=>`<div class="rv-cmp-row"><del>${cut(base[id])}</del><em>${L('supprimée','deleted')}</em></div>`).join('');
  const more = Math.max(0, ch.length - 40) + Math.max(0, dl.length - 20);
  return `<div class="rv-cmp"><div class="rv-cmp-h" style="color:${c.ink}">${L('Changements de la révision ','Changes in the ')}${esc(revColorName(r.rounds[k].color))}${L('',' revision')} · ${ch.length} ${L('modifiée(s)','changed')}, ${dl.length} ${L('supprimée(s)','deleted')}</div>${rows || `<em>${L('Aucun changement.','No changes.')}</em>`}${more ? `<div class="rv-cmp-row"><em>${L('…et ' + more + ' autre(s).','…and ' + more + ' more.')}</em></div>` : ''}</div>`;
}
function revModalInner(){
  const p = S.project, r = revEnsure(p), rc = revCalc(p), marks = rc.marks;
  const counts = r.rounds.map(()=>0);
  Object.keys(marks).forEach(id=>{ counts[marks[id]]++; });
  if(!REV_UI.color) REV_UI.color = revNextColor(r);
  const cur = r.rounds.length ? r.rounds[r.rounds.length-1] : null;
  const rows = r.rounds.length
    ? r.rounds.map((rd, k)=>{
        const c = revColor(rd.color), n = counts[k];
        return `<div class="rv-row"><span class="rv-dot" style="background:${c.ink}"></span><b>${esc(revColorName(rd.color))}</b><span>${esc(revDateStr(rd.date))}</span><span class="rv-n">${n} ${L(n>1?'lignes':'ligne', n>1?'lines':'line')}${rc.del[k] ? ' · ' + rc.del[k] + ' ' + L(rc.del[k]>1?'supprimées':'supprimée', rc.del[k]>1?'deleted':'deleted') : ''}${k===r.rounds.length-1 ? ' · ' + L('en cours','active') : ''}</span><button class="rv-see" data-rv="cmp" data-k="${k}">${REV_UI.cmp===k ? L('Masquer','Hide') : L('Voir','View')}</button></div>`;
      }).reverse().join('')
    : `<div class="rv-sub" style="margin:0 0 6px;">${L('Aucune révision pour l\u2019instant : le texte actuel est la version blanche.','No revisions yet: the current text is the white draft.')}</div>`;
  const sw = REV_COLORS.map(c=>`<button data-rc="${c.id}" class="${REV_UI.color===c.id?'on':''}"><span class="rv-dot" style="background:${c.ink}"></span>${esc(L(c.fr,c.en))}</button>`).join('');
  return `<h2>${L('Révisions colorées','Colour revisions')}</h2>
    <p class="rv-sub">${L('Fige le texte actuel et lance une nouvelle couleur : chaque ligne modifiée ensuite reçoit un astérisque dans la marge, et chaque page touchée indique sa couleur et sa date.','Freezes the current text and starts a new colour: every line changed afterwards gets an asterisk in the margin, and each touched page shows its colour and date.')}</p>
    <h3>${L('Historique','History')}</h3>${rows}${(REV_UI.cmp != null && r.rounds[REV_UI.cmp]) ? revCmpHtml(p, REV_UI.cmp) : ''}
    <h3>${L('Nouvelle révision','New revision')}</h3>
    <div class="rv-sw">${sw}</div>
    <button class="btn btn-primary" data-rv="new">${L('Lancer la révision ','Start the ')}${esc(revColorName(REV_UI.color))}${L('',' revision')}</button>
    ${cur ? `<button class="btn btn-ghost" data-rv="del" style="margin-left:6px;">${L('Annuler la dernière','Undo the last one')}</button>` : ''}
    <h3>${L('Numéros de page','Page numbers')}</h3>
    <p class="rv-sub" style="margin:0 0 8px;">${L('Verrouille la pagination actuelle : une page modifiée garde son numéro et les pages ajoutées deviennent 12A, 12B… Un saut de page est forcé devant chaque page figée.','Locks the current pagination: a revised page keeps its number and added pages become 12A, 12B… A page break is forced before each locked page.')}</p>
    ${p.pageLock ? `<div class="rv-row"><span class="rv-dot" style="background:var(--accent)"></span><b>${L('Pages verrouillées','Pages locked')}</b><span>${esc(revDateStr(p.pageLock.date))}</span><span class="rv-n">${p.pageLock.pages.length} ${L('pages','pages')}</span></div>
      ${(S.pagination.omitted||[]).length ? `<div class="rv-sub" style="margin:0 0 8px;">${L('Pages omises (OMITTED) : ','Omitted pages: ')}${esc(S.pagination.omitted.join(', '))}</div>` : ''}` : ''}
    ${revOmittedScenes(p).length ? `<div class="rv-sub" style="margin:0 0 8px;">${esc(revOmittedText(p))}</div>` : ''}
    <button class="btn btn-primary" data-rv="plock">${p.pageLock ? L('Figer à nouveau les pages','Re-lock the pages') : L('Verrouiller les pages','Lock the pages')}</button>
    ${p.pageLock ? `<button class="btn btn-ghost" data-rv="punlock" style="margin-left:6px;">${L('Déverrouiller','Unlock')}</button>` : ''}
    <h3>${L('Affichage','Display')}</h3>
    <label class="rv-chk"><input type="checkbox" data-rv="show" ${r.show?'checked':''}> ${L('Afficher les astérisques dans l\u2019éditeur','Show asterisks in the editor')}</label>
    <label class="rv-chk"><input type="checkbox" data-rv="exp" ${r.inExport?'checked':''}> ${L('Astérisques et étiquette dans le PDF et l\u2019impression','Asterisks and label in the PDF and print')}</label>
    <label class="rv-chk"><input type="checkbox" data-rv="paper" ${r.paper?'checked':''}> ${L('Papier de couleur : les pages modifiées prennent la teinte de leur révision (PDF et impression)','Coloured paper: changed pages take the tint of their revision (PDF and print)')}</label>
    <label class="rv-chk"><input type="checkbox" data-rv="txt" ${r.inText?'checked':''}> ${L('Marquer les lignes modifiées dans les exports .txt, .fountain et .fdx','Mark changed lines in the .txt, .fountain and .fdx exports')}</label>
    <div class="rv-sub" style="margin:10px 0 0;">${L('Raccourci : Ctrl+Alt+R (Cmd+Alt+R sur Mac).','Shortcut: Ctrl+Alt+R (Cmd+Alt+R on Mac).')}</div>
    <div class="modal-actions"><button class="btn btn-ghost" data-rv="close">${L('Fermer','Close')}</button></div>`;
}
/* Marque / démarque à la main la ligne où se trouve le curseur (Ctrl+Alt+M). */
function revToggleLine(){
  if(!S.project || S.tab !== 'editor') return;
  const p = S.project, r = revEnsure(p);
  if(!r.rounds.length){ toast(L('Lance d\u2019abord une révision.','Start a revision first.')); return; }
  const sel = window.getSelection(); let n = sel && sel.anchorNode;
  if(n && n.nodeType === 3) n = n.parentNode;
  const div = n && n.closest ? n.closest('.line[data-id]') : null;
  const el = div ? p.elements.find(e=>e.id === div.dataset.id) : null;
  if(!el || el.type === 'note'){ toast(L('Place le curseur dans une ligne du scénario.','Put the cursor in a screenplay line.')); return; }
  const marked = revCalc(p).marks[el.id] !== undefined;
  if(marked){ delete r.manual[el.id]; r.hidden[el.id] = el.text || ''; toast(L('Ligne démarquée.','Line unmarked.')); }
  else { delete r.hidden[el.id]; r.manual[el.id] = r.rounds.length - 1; toast(L('Ligne marquée.','Line marked.')); }
  scheduleAutosave(); revDraw();
}
function openRevisions(){
  if(!S.project || S.tab !== 'editor') return;
  closeRevisions(); revCss();
  document.body.insertAdjacentHTML('beforeend', `<div class="modal-backdrop" id="revBackdrop"><div class="modal" data-stop="1">${revModalInner()}</div></div>`);
  const bd = document.getElementById('revBackdrop');
  const redraw = ()=>{ bd.querySelector('.modal').innerHTML = revModalInner(); };
  bd.addEventListener('click', async e=>{
    if(e.target === bd){ closeRevisions(); return; }
    const sw = e.target.closest('[data-rc]');
    if(sw){ REV_UI.color = sw.dataset.rc; redraw(); return; }
    const b = e.target.closest('button[data-rv]'); if(!b) return;
    const p = S.project, r = revEnsure(p), act = b.dataset.rv;
    if(act === 'close'){ closeRevisions(); }
    else if(act === 'new'){
      const base = {};
      p.elements.forEach(el=>{ if(el.type !== 'note') base[el.id] = el.text || ''; });
      r.rounds.push({ color:REV_UI.color, date:Date.now(), base });
      REV_UI.color = revNextColor(r);
      scheduleAutosave(); redraw(); revDraw();
      toast(L('Révision ' + revColorName(r.rounds[r.rounds.length-1].color).toLowerCase() + ' lancée : tes modifications seront marquées.','Revision started: your changes will be marked.'));
    }
    else if(act === 'plock' || act === 'punlock'){
      if(act === 'plock') plLock(p); else p.pageLock = null;
      scheduleAutosave(); try{ paginateEditor(); }catch(e){} redraw(); revDraw();
      toast(act === 'plock' ? L('Pages verrouillées.','Pages locked.') : L('Pages déverrouillées.','Pages unlocked.'));
    }
    else if(act === 'cmp'){ const k = +b.dataset.k; REV_UI.cmp = (REV_UI.cmp === k) ? null : k; redraw(); }
    else if(act === 'del'){
      if(!r.rounds.length) return;
      if(!await mmConfirm(L('Ses marques disparaissent. Le texte n\u2019est pas modifié.','Its marks disappear. The text is not changed.'),
        {title:L('Annuler la dernière révision ?','Undo the last revision?'), ok:L('Annuler la révision','Undo revision'), cancel:L('Garder','Keep'), danger:true})) return;
      r.rounds.pop(); REV_UI.color = revNextColor(r);
      scheduleAutosave(); redraw(); revDraw();
    }
  });
  bd.addEventListener('change', e=>{
    const c = e.target.closest('input[data-rv]'); if(!c) return;
    const r = revEnsure(S.project);
    if(c.dataset.rv === 'show') r.show = c.checked;
    if(c.dataset.rv === 'exp') r.inExport = c.checked;
    if(c.dataset.rv === 'paper') r.paper = c.checked;
    if(c.dataset.rv === 'txt') r.inText = c.checked;
    scheduleAutosave(); revDraw();
  });
}

// Redessin des astérisques : après chaque pagination, à la frappe et au redimensionnement.
(function(){

   v29 — OUTILS DE SÉCURITÉ ET DE CIRCULATION DU SCÉNARIO
   ---------------------------------------------------------------------
   1. Rappel de sauvegarde hors navigateur (bandeau discret, par projet)
   2. Renommer partout : personnage ou décor, avec aperçu ligne par ligne
   3. Chasseur de variantes : quasi-doublons de noms (MARC / MARCO, CAFÉ / CAFE)
   4. Récupérer UNE scène depuis une ancienne version
   5. Sides : PDF d'un acteur (ses scènes, ses répliques surlignées)
   Tout est greffé sur l'existant : mêmes boîtes de dialogue, même annulation
   (Ctrl+Z), même sauvegarde automatique. Avant chaque geste de masse, un
   instantané est ajouté à l'Historique.
===================================================================== */
const WD = { h:{} };
const WD_BK_KEY = 'scriptmm_backup_by_project', WD_SNOOZE_KEY = 'scriptmm_backup_snooze';
const WD_BK_DAYS = 7;

/* ---------- utilitaires ---------- */
function wdRead(k){ try{ return JSON.parse(localStorage.getItem(k)) || {}; }catch(e){ return {}; } }
function wdWrite(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function wdNorm(s){
  return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase()
    .replace(/[\u2019\u2018]/g,"'").replace(/[^A-Z0-9' ]+/g,' ').replace(/\s+/g,' ').trim();
}
function wdSig(s){ return wdNorm(s).replace(/^(LE|LA|LES|UN|UNE|THE|AN|A)\s+/,'').replace(/^L'\s*/,'').trim(); }
function wdLev(a, b, max){
  if(Math.abs(a.length - b.length) > max) return max + 1;
  let prev = Array.from({length:b.length + 1}, (_, i)=>i);
  for(let i = 1; i <= a.length; i++){
    const cur = [i]; let rowMin = i;
    for(let j = 1; j <= b.length; j++){
      const v = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
      cur[j] = v; if(v < rowMin) rowMin = v;
    }
    if(rowMin > max) return max + 1;
    prev = cur;
  }
  return prev[b.length];
}
function wdSimilar(a, b){
  if(a === b) return true;
  if(Math.min(a.length, b.length) < 4) return false;
  if(/\d/.test(a + b) && a.replace(/\d+/g,'#') === b.replace(/\d+/g,'#')) return false;   // AGENT 1 / AGENT 2 : deux personnes
  const thr = Math.max(a.length, b.length) >= 9 ? 2 : 1;
  return wdLev(a, b, thr) <= thr;
}
function wdRx(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function wdCapital(nn){
  if(nn !== nn.toUpperCase()) return nn;
  return nn.toLowerCase().replace(/(^|[\s\-'\u2019])(\p{L})/gu, (m, a, b)=> a + b.toUpperCase());
}
function wdCase(match, nn){
  if(match === match.toUpperCase() && match !== match.toLowerCase()) return nn.toUpperCase();
  if(match === match.toLowerCase()) return nn.toLowerCase();
  return wdCapital(nn);
}
function wdMarkHtml(s){ return esc(s).replace(/\u0001/g,'<mark>').replace(/\u0002/g,'</mark>'); }
function wdAfterEdit(){ if(S.tab === 'editor') renderEditorTab(); else renderTabBody(); }
function wdSnapshot(label){
  const p = S.project; if(!Array.isArray(p.versions)) p.versions = [];
  p.versions.push({ id: uid('ver'), label, auto:false, timestamp:Date.now(), elements:snapshot() });
  if(p.versions.length > 25) p.versions.shift();
}
function wdApply(changes, label){
  const on = changes.filter(c=>c.on);
  if(!on.length) return 0;
  pushUndo(); wdSnapshot(label);
  const map = new Map(on.map(c=>[c.id, c.after]));
  S.project.elements.forEach(el=>{ if(map.has(el.id)) el.text = map.get(el.id); });
  scheduleAutosave(); wdAfterEdit();
  return on.length;
}

function wdMarkBackup(pid){ const m = wdRead(WD_BK_KEY); m[pid] = Date.now(); wdWrite(WD_BK_KEY, m); }
function wdBackupState(){
  const p = S.project;
  if(!p || S.view !== 'editor') return null;
  try{ if(vaultActive()) return null; }catch(e){}            // le coffre écrit déjà sur le disque
  const size = (p.elements||[]).reduce((n, e)=> n + (e.text||'').length, 0);
  const last = wdRead(WD_BK_KEY)[p.id] || 0;
  const snooze = wdRead(WD_SNOOZE_KEY)[p.id] || 0;
  if(Date.now() < snooze) return null;
  if(!last){ return size > 1500 ? { never:true } : null; }
  if((p.updatedAt || 0) <= last) return null;                   // rien de neuf depuis
  const days = Math.floor((Date.now() - last) / 864e5);
  return days >= WD_BK_DAYS ? { days } : null;
}
function wdBackupCheck(){
  const old = document.getElementById('wdBackupBar'); if(old) old.remove();
  const st = wdBackupState(); if(!st) return;
  const tb = document.querySelector('.main-col > .topbar'); if(!tb) return;
  const bar = document.createElement('div');
  bar.className = 'wd-bar'; bar.id = 'wdBackupBar'; bar.setAttribute('role','status');
  const msg = st.never
    ? L('Ce scénario n\u2019existe que dans ce navigateur. Un nettoyage du navigateur peut l\u2019effacer : garde une copie en fichier.',

    : L('Dernière sauvegarde en fichier : il y a ' + st.days + ' jours. Ce que tu as écrit depuis n\u2019existe que dans ce navigateur.',

  bar.innerHTML = '<div class="wd-bar-text"><b>' + L('Sauvegarde','Backup') + '</b> · ' + esc(msg) + '</div>' +

    '<button class="btn btn-sm btn-ghost" data-wd="bkLater">' + L('Plus tard','Later') + '</button></div>';
  bar.addEventListener('click', e=>{
    const b = e.target.closest('[data-wd]'); if(b && WD.h[b.dataset.wd]) WD.h[b.dataset.wd](b, e);

  tb.insertAdjacentElement('afterend', bar);
}

/* =====================================================================
   DONNÉES : personnages et décors
===================================================================== */
const WD_HEAD = /^(\s*(?:INT\.?\s*\/\s*EXT|EXT\.?\s*\/\s*INT|I\s*\/\s*E|INT|EXT)\s*[.\-\u2013]?\s+)([\s\S]*)$/i;
function wdParseHeading(t){
  t = t || '';
  const m = WD_HEAD.exec(t);
  const pre = m ? m[1] : '', body = m ? m[2] : t;
  const loc = body.split(/\s+[-\u2013\u2014]\s+/)[0];
  return { pre, loc, rest: body.slice(loc.length) };
}
function wdCharSplit(text){
  const full = text || '';
  let core = full.replace(/\s+$/, ''), prev;
  do { prev = core; core = core.replace(/\s*\([^()]*\)\s*$/, ''); } while(core !== prev);
  const lead = core.length - core.replace(/^\s+/, '').length;
  return { pre: core.slice(0, lead), raw: core.trim(), tail: full.slice(core.length) };
}
function wdCharList(){
  const m = new Map();
  S.project.elements.forEach(el=>{
    if(el.type !== 'character') return;
    const k = wdCharSplit(el.text).raw.toUpperCase(); if(!k) return;
    if(!m.has(k)) m.set(k, { key:k, n:0 });
    m.get(k).n++;
  });
  return Array.from(m.values()).sort((a, b)=> b.n - a.n || a.key.localeCompare(b.key));
}
function wdLocList(){
  const m = new Map();
  S.project.elements.forEach(el=>{
    if(el.type !== 'scene') return;
    const k = wdParseHeading(el.text).loc.trim().toUpperCase(); if(!k) return;
    if(!m.has(k)) m.set(k, { key:k, n:0 });
    m.get(k).n++;
  });
  return Array.from(m.values()).sort((a, b)=> b.n - a.n || a.key.localeCompare(b.key));
}
/* Plans de changement : [{id, kind, before, after, bh, ah, on}] */
function wdPlanChar(olds, nn, opt){
  opt = opt || {};
  const set = new Set(olds.map(k=>k.toUpperCase()));
  const alt = olds.slice().sort((a, b)=> b.length - a.length).map(wdRx).join('|');
  const rx = alt ? new RegExp('(?<![\\p{L}\\p{N}_])(' + alt + ')(?![\\p{L}\\p{N}_])', 'giu') : null;
  const out = [];
  S.project.elements.forEach(el=>{
    if(el.type === 'character'){
      const b = wdCharSplit(el.text);
      if(!set.has(b.raw.toUpperCase())) return;
      const after = b.pre + nn.toUpperCase() + b.tail;
      if(after !== el.text) out.push({ id:el.id, kind:'cue', before:el.text, after,
        bh:esc(el.text), ah:wdMarkHtml(b.pre + '\u0001' + nn.toUpperCase() + '\u0002' + b.tail), on:true });
      return;
    }
    const wanted = (el.type === 'action' && opt.action) || ((el.type === 'dialogue' || el.type === 'parenthetical') && opt.dlg);
    if(!wanted || !rx || !el.text) return;
    let hit = false;
    const after = el.text.replace(rx, m=>{ hit = true; return wdCase(m, nn); });
    if(!hit || after === el.text) return;
    const bh = wdMarkHtml(el.text.replace(rx, m=>'\u0001' + m + '\u0002'));
    const ah = wdMarkHtml(el.text.replace(rx, m=>'\u0001' + wdCase(m, nn) + '\u0002'));
    out.push({ id:el.id, kind: el.type === 'action' ? 'action' : 'dial', before:el.text, after, bh, ah, on:true });
  });
  return out;
}
function wdPlanLoc(olds, nn){
  const set = new Set(olds.map(k=>k.toUpperCase()));
  const out = [];
  S.project.elements.forEach(el=>{
    if(el.type !== 'scene') return;
    const h = wdParseHeading(el.text);
    if(!set.has(h.loc.trim().toUpperCase())) return;
    const lead = h.loc.length - h.loc.replace(/^\s+/, '').length, trail = h.loc.length - h.loc.replace(/\s+$/, '').length;
    const mid = nn.toUpperCase();
    const after = h.pre + h.loc.slice(0, lead) + mid + h.loc.slice(h.loc.length - trail) + h.rest;
    if(after !== el.text) out.push({ id:el.id, kind:'scene', before:el.text, after, bh:esc(el.text),
      ah:wdMarkHtml(h.pre + '\u0001' + mid + '\u0002' + h.rest), on:true });
  });
  return out;
}
function wdKindLabel(k){
  return k === 'cue' ? L('Réplique','Cue') : k === 'action' ? L('Action','Action') : k === 'dial' ? L('Dialogue','Dialogue') : L('Scène','Scene');
}

function wdRnPlan(){

    (R.mode === 'char' ? '<div class="wd-opts"><label><input type="checkbox" data-wdin="rnAct"' + (R.action ? ' checked' : '') + '> ' + L('Mentions dans l\u2019action','Mentions in action') + '</label>' +
      '<label><input type="checkbox" data-wdin="rnDlg"' + (R.dlg ? ' checked' : '') + '> ' + L('Mentions dans les dialogues','Mentions in dialogue') + '</label></div>' : '') +
    '<div class="wd-body" id="wdRnPrev"></div>' +
    '<div class="modal-actions"><button class="btn" data-wd="close">' + L('Annuler','Cancel') + '</button>' +
    '<button class="btn btn-primary" id="wdRnGo" data-wd="rnGo"></button></div>');
  wdRnPaint();
  const inp = document.getElementById('wdRnNew'); if(inp) inp.focus();
}
function wdRnPaint(){
  const R = WD.rn, box = document.getElementById('wdRnPrev'), go = document.getElementById('wdRnGo'); if(!box) return;
  const ch = R.changes, n = ch.filter(c=>c.on).length;
  const cnt = k=> ch.filter(c=>c.on && c.kind === k).length;
  let html = '';
  if(!R.nn.trim()) html = '<div class="wd-empty">' + L('Tape le nouveau nom pour voir les lignes concernées.','Type the new name to see the affected lines.') + '</div>';
  else if(R.nn.trim().toUpperCase() === R.old) html = '<div class="wd-empty">' + L('Le nouveau nom est identique.','The new name is the same.') + '</div>';
  else {
    const exists = wdRnList().some(x=>x.key === R.nn.trim().toUpperCase());
    if(exists) html += '<p class="wd-warn">' + L('« ' + esc(R.nn.trim().toUpperCase()) + ' » existe déjà : les deux seront fusionnés.', '“' + esc(R.nn.trim().toUpperCase()) + '” already exists: the two will be merged.') + '</p>';
    if(R.mode === 'char' && R.old.length <= 3) html += '<p class="wd-warn">' + L('Nom très court : vérifie bien les mentions avant de valider.','Very short name: check the mentions carefully.') + '</p>';
    html += '<p class="wd-sum">' + (R.mode === 'char'
      ? cnt('cue') + ' ' + L('répliques','cues') + ' · ' + cnt('action') + ' ' + L('mentions dans l\u2019action','in action') + ' · ' + cnt('dial') + ' ' + L('dans les dialogues','in dialogue')
      : cnt('scene') + ' ' + L('entêtes de scène','scene headings')) + '</p>';
    html += '<div class="wd-list">' + ch.slice(0, 80).map((c, i)=>
      '<label class="wd-chg"><input type="checkbox" data-wdin="rnChk" data-i="' + i + '"' + (c.on ? ' checked' : '') + '>' +
      '<span class="wd-k">' + wdKindLabel(c.kind) + '</span><span class="wd-t"><span class="wd-b">' + c.bh + '</span><br>' + c.ah + '</span></label>').join('') + '</div>';
    if(ch.length > 80) html += '<div class="wd-more">' + L('+ ' + (ch.length - 80) + ' autres lignes, toutes cochées.', '+ ' + (ch.length - 80) + ' more lines, all ticked.') + '</div>';
    if(!ch.length) html = html + '<div class="wd-empty">' + L('Aucune ligne concernée.','No line affected.') + '</div>';
  }
  box.innerHTML = html;
  go.disabled = n === 0;
  go.textContent = n ? L('Renommer (' + n + ' lignes)', 'Rename (' + n + ' lines)') : L('Renommer','Rename');
}

/* =====================================================================
   3. CHASSEUR DE VARIANTES
===================================================================== */
function wdFindVariants(){
  const ign = new Set(S.project.wdIgnore || []), out = [];
  [['char', wdCharList()], ['loc', wdLocList()]].forEach(([type, list])=>{
    const it = list.map(x=>({ key:x.key, n:x.n, sig:wdSig(x.key) })).filter(x=>x.sig);
    const par = it.map((_, i)=>i);
    const find = i=> par[i] === i ? i : (par[i] = find(par[i]));
    for(let i = 0; i < it.length; i++) for(let j = i + 1; j < it.length; j++)
      if(wdSimilar(it[i].sig, it[j].sig)) par[find(j)] = find(i);
    const groups = new Map();
    it.forEach((x, i)=>{ const r = find(i); if(!groups.has(r)) groups.set(r, []); groups.get(r).push(x); });
    groups.forEach(g=>{
      if(g.length < 2) return;
      const sig = type + ':' + g.map(x=>x.key).sort().join('|');
      if(ign.has(sig)) return;
      g.sort((a, b)=> b.n - a.n);
      out.push({ type, sig, members:g, pick:g[0].key });
    });
  });
  return out;
}
function wdOpenVariants(){
  closeMoreMenu();
  WD.vr = { groups: wdFindVariants() };
  wdVrDraw();
}
function wdVrDraw(){
  const gs = WD.vr.groups;
  const body = gs.length ? gs.map((g, i)=>
    '<div class="wd-card"><div class="wd-card-h"><span class="wd-badge">' + (g.type === 'char' ? L('Personnage','Character') : L('Décor','Location')) + '</span>' +
    '<span style="display:flex;gap:6px;"><button class="btn btn-sm btn-primary" data-wd="vrMerge" data-i="' + i + '">' + L('Fusionner','Merge') + '</button>' +
    '<button class="btn btn-sm btn-ghost" data-wd="vrIgnore" data-i="' + i + '">' + L('Ce sont des différents','They\u2019re different') + '</button></span></div>' +
    g.members.map(m=>'<label class="wd-pick"><input type="radio" name="wdvr' + i + '" data-wdin="vrPick" data-i="' + i + '" value="' + esc(m.key) + '"' + (m.key === g.pick ? ' checked' : '') + '>' +
      '<span class="wd-name">' + esc(m.key) + '</span><span class="wd-n">' + m.n + ' ' + (g.type === 'char' ? L('répliques','cues') : L('scènes','scenes')) + '</span></label>').join('') + '</div>').join('')
    : '<div class="wd-empty">' + L('Aucune variante suspecte. Tes noms de personnages et de décors sont cohérents.','No suspicious variants. Your character and location names are consistent.') + '</div>';
  wdModal('wdVrBd',

    '<div class="wd-body">' + body + '</div>' +

  const g = WD.vr.groups[+b.dataset.i];

  toast(L(n + ' lignes unifiées en « ' + g.pick + ' ». Annulable avec Ctrl+Z.', n + ' lines unified as “' + g.pick + '”. Undo with Ctrl+Z.'));
  WD.vr.groups = wdFindVariants(); wdVrDraw();
};

function wdScenesOf(els){
  const out = []; let cur = null;
  els.forEach(el=>{
    if(el.type === 'scene'){ cur = { id:el.id, heading:el.text, els:[el] }; out.push(cur); }
    else if(cur) cur.els.push(el);
  });
  return out;
}
function wdSig2(sc){ return sc.els.map(e=>e.type + ':' + (e.text || '')).join('\n'); }
function wdOpenSceneRestore(verId){
  const ver = (S.project.versions || []).find(v=>v.id === verId); if(!ver) return;
  WD.sr = { verId, onlyDiff:true, open:null };
  wdSrDraw();
}
function wdSrData(){
  const ver = S.project.versions.find(v=>v.id === WD.sr.verId);
  const cur = new Map(wdScenesOf(S.project.elements).map(s=>[s.id, s]));
  return { ver, rows: wdScenesOf(ver.elements).map((s, i)=>{
    const c = cur.get(s.id);
    const st = !c ? 'gone' : (wdSig2(c) === wdSig2(s) ? 'same' : 'mod');
    return { s, i, c, st };
  }) };
}
function wdSrDraw(){

    return '<div class="wd-card"><div class="wd-card-h"><div style="min-width:0;"><div class="flat-row-title" style="font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' +
      (r.i + 1) + '. ' + esc(r.s.heading || L('(sans titre)','(untitled)')) + '</div>' +

/* Clone d'une scène ancienne ; les id déjà pris ailleurs dans le scénario sont renouvelés. */
function wdCloneScene(sc, takenIds, forceNew){
  return sc.els.map(e=>{
    const c = JSON.parse(JSON.stringify(e));
    if(forceNew || takenIds.has(c.id)) c.id = uid('el');
    return c;
  });
}
function wdSrDo(sceneId, mode){
  const { ver } = wdSrData();
  const old = wdScenesOf(ver.elements).find(s=>s.id === sceneId); if(!old) return;
  const els = S.project.elements;
  const start = els.findIndex(e=>e.id === sceneId);
  let end = -1;
  if(start >= 0){ end = els.findIndex((e, i)=> i > start && e.type === 'scene'); if(end < 0) end = els.length; }
  const label = L('Avant récupération de la scène : ','Before recovering scene: ') + (old.heading || '');
  pushUndo(); wdSnapshot(label);
  let at, insert;
  if(mode === 'replace' && start >= 0){
    const taken = new Set(els.filter((_, i)=> i < start || i >= end).map(e=>e.id));
    insert = wdCloneScene(old, taken, false);
    els.splice(start, end - start, ...insert);
  } else {
    const taken = new Set(els.map(e=>e.id));
    insert = wdCloneScene(old, taken, mode === 'copy');
    if(mode === 'copy' && start >= 0) at = end;
    else {
      const prevSc = wdScenesOf(ver.elements); const k = prevSc.findIndex(s=>s.id === sceneId);
      let prevId = null; for(let q = k - 1; q >= 0; q--){ if(els.some(e=>e.id === prevSc[q].id)){ prevId = prevSc[q].id; break; } }
      if(prevId){
        const ps = els.findIndex(e=>e.id === prevId);
        at = els.findIndex((e, i)=> i > ps && e.type === 'scene'); if(at < 0) at = els.length;
      } else {
        const fs = els.findIndex(e=>e.type === 'scene'); at = fs < 0 ? els.length : fs;
      }
    }
    els.splice(at, 0, ...insert);
  }
  scheduleAutosave();
  toast(mode === 'replace' ? L('Scène remplacée. Annulable avec Ctrl+Z.','Scene replaced. Undo with Ctrl+Z.') : mode === 'copy' ? L('Copie insérée après la scène actuelle.','Copy inserted after the current scene.') : L('Scène récupérée à sa place.','Scene recovered in place.'));
  if(S.tab === 'history') renderTabBody();
  wdSrDraw();
}
WD.h.srReplace = b=>{ wdSrDo(b.dataset.id, 'replace'); };
WD.h.srCopy = b=>{ wdSrDo(b.dataset.id, 'copy'); };
WD.h.srBack = b=>{ wdSrDo(b.dataset.id, 'back'); };

function wdWithProject(p, fn){
  const real = S.project; S.project = p;
  try{ return fn(); } finally { S.project = real; }

function wdSidesBuild(o){
  const real = S.project, nums = sceneNumbers();
  const key = o.key.toUpperCase();
  const mention = new RegExp('(?<![\\p{L}\\p{N}_])' + wdRx(key) + '(?![\\p{L}\\p{N}_])', 'iu');
  const scenes = wdScenesOf(real.elements.filter(e=>e.type !== 'note'));
  const hl = new Set(), kept = [];
  scenes.forEach(sc=>{
    let speaks = false, mentioned = false, on = false;
    sc.els.forEach(e=>{
      if(e.type === 'character'){ on = wdCharSplit(e.text).raw.toUpperCase() === key; if(on){ speaks = true; hl.add(e.id); } }
      else if(e.type === 'dialogue' || e.type === 'parenthetical'){ if(on) hl.add(e.id); }
      else { on = false; if(mention.test(e.text || '')) mentioned = true; }
    });
    if(speaks || (o.scope === 'appears' && mentioned)) kept.push(sc);
  });
  const meta = {};
  kept.forEach(sc=>{ meta[sc.id] = Object.assign({}, (real.sceneMeta || {})[sc.id], { lockedNum: nums[sc.id] }); });
  const clone = Object.assign({}, real, {
    elements: [].concat(...kept.map(sc=>sc.els)), sceneMeta: meta, pageLock: null, versions: [], graveyard: [], comments: {},
    settings: Object.assign({}, real.settings, { numbersLocked:true, watermarkText:o.wm || '', titlePageEnabled:!!o.title })
  });
  return { clone, hl, count: kept.length };
}

  if(!list.length){ toast(L('Aucun personnage qui parle dans ce scénario.','No speaking character in this screenplay.')); return; }
