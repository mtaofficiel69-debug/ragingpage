  .card-tags{display:flex; flex-wrap:wrap; gap:4px;}
  .tag-chip{
    font-size:11px; font-weight:600; background:var(--tag-chip-bg); color:var(--tag-chip-text); padding:2px 7px; border-radius:10px;
  }
  .card-chars{font-size:12px; color:var(--ink-soft);}
  .card-foot{display:flex; justify-content:space-between; align-items:center; margin-top:2px;}

  /* ---------- STRUCTURE (squelette du film, avant l'écriture) ---------- */
  .structure-help{font-size:13px; color:var(--ink-soft); line-height:1.5; max-width:640px; margin:0 0 14px;}
  /* Liste verticale, illimitée : la première scène tout en haut, on en
     ajoute en dessous. Pas de colonnes — juste l'ordre du film. */
  .structure-list{display:flex; flex-direction:column; gap:10px; padding:0 24px 18px; max-width:720px;}
  .structure-card{
    background:var(--surface); border:1px solid var(--hair); border-left:4px solid var(--sc-color,var(--hair));
    border-radius:3px; padding:10px 12px; display:flex; gap:10px; cursor:grab; position:relative;
  }
  .structure-card.dragging{opacity:.35;}
  .structure-card.drop-before{box-shadow:inset 0 3px 0 -1px var(--accent);}
  .structure-card.drop-after{box-shadow:inset 0 -3px 0 -1px var(--accent);}
  .structure-card-num{
    flex:none; width:24px; padding-top:2px; font-family:var(--display); font-weight:700; font-size:13px;
    color:var(--ink-soft); text-align:right; user-select:none;
  }
  .structure-card-body{flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:7px;}
  .structure-card-body.is-linked{opacity:.72;}
  .structure-card input[type=text]{
    border:none; background:transparent; font-family:var(--display); font-weight:600; font-size:13.5px;
    color:var(--ink); padding:1px 0; width:100%;
  }
  .structure-card input[type=text]:focus{outline:none; border-bottom:1px solid var(--accent);}
  .structure-card textarea{
    border:1px solid var(--hair); border-radius:3px; padding:6px 8px; font-size:12.5px; min-height:44px;
    background:var(--surface-soft); color:var(--ink-soft); resize:vertical; font-family:var(--sans);
  }
  .structure-swatches{display:flex; gap:5px; flex-wrap:wrap; align-items:center;}
  .structure-swatch{width:15px; height:15px; border-radius:50%; border:1.5px solid #0002; cursor:pointer; padding:0;}
  .structure-swatch.active{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ink);}
  .structure-card-foot{display:flex; justify-content:space-between; align-items:center; gap:6px; flex-wrap:wrap;}
  .structure-card-foot-btns{display:flex; align-items:center; gap:6px;}
  .structure-linked-badge{font-size:11px; color:var(--ok); font-weight:600;}
  .structure-add{border:1px dashed var(--hair); background:transparent; color:var(--ink-soft); border-radius:3px; padding:10px; font-size:13px; cursor:pointer; text-align:center; max-width:720px; width:calc(100% - 48px); margin-left:24px;}
  .structure-add:hover{border-color:var(--accent-2); color:var(--accent-2);}

  /* ---------- generic list rows for outline/reports/graveyard/history ---------- */
  .flat-list{padding:16px 24px 60px; display:flex; flex-direction:column; gap:10px;}
  .flat-row{border:1px solid var(--hair); border-radius:4px; padding:12px 14px; background:var(--surface);}
  .flat-row-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px;}
  .flat-row-title{font-family:var(--mono); font-weight:700; font-size:13.5px; text-transform:uppercase;}
  .flat-row textarea{width:100%; border:1px solid var(--hair); border-radius:3px; padding:7px 9px; font-size:13.5px; min-height:52px; background:var(--surface-soft); color:var(--ink);}
  .flat-row input[type=text]{border:1px solid var(--hair); border-radius:3px; padding:6px 8px; font-size:13px; width:100%; background:var(--surface-soft); color:var(--ink);}
  .row-tags-edit{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:6px;}

  .panel-block{margin-bottom:22px;}
  .panel-block h4{font-family:var(--display); font-size:15px; color:var(--ink); margin:0 0 8px; font-weight:600;}

  /* ---------- modale Aide (« Comment faire ») ----------
     Des onglets par situation (démarrer / séries / sauvegarde & export /
     éditeur), chacun court et scannable : étapes numérotées, listes à
     puces, et un encart distinct pour ce qui a le plus de conséquences
     (la sauvegarde complète). Le gras reste réservé aux tout premiers
     repères de chaque bloc (le titre exact d\u2019un bouton, un nom de
     fichier) plutôt qu\u2019étalé sur toute la phrase, pour que l\u2019œil
     sache où regarder au lieu d\u2019avoir tout en évidence à la fois.
     Tailles de texte du panneau agrandies de 2% par rapport au reste
     de l\u2019interface. */
  .help-modal{max-width:600px;}
  .help-tabs{display:flex; flex-wrap:wrap; gap:7px; margin:0 0 18px; padding-bottom:16px; border-bottom:1px solid var(--hair);}
  .help-tab{
    display:inline-flex; align-items:center; gap:6px; border:1px solid var(--hair); background:var(--surface);
    color:var(--ink-soft); padding:7px 13px; border-radius:20px; font-size:12.75px; font-weight:600; cursor:pointer;
  }
  .help-tab .icon{width:13px; height:13px;}
  .help-tab:hover{border-color:var(--accent); color:var(--ink);}
  .help-tab.active{border-color:var(--accent); background:#3699D40d; color:var(--accent-2);}

  /* ---------- Scénario d'exemple et Aide à l'écriture ---------- */
  #homeView .wd-nav-sample .icon{color:var(--accent);}
  .wh-wrap{padding:16px 24px 70px; max-width:860px;}

  /* ---------- v32 : colonne d'accueil + stabilité de la barre du haut ---------- */
  #homeView .wd-about{border-top:1px solid var(--hair); margin-top:auto; padding:18px 12px 4px;}
  #homeView .wd-about .wd-tag{font-size:13.5px; line-height:1.45; color:var(--ink); margin:0 0 12px;}
  #homeView .wd-points{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px;}
  #homeView .wd-points li{display:flex; gap:9px; align-items:flex-start; font-size:12.5px; line-height:1.4; color:var(--ink-soft);}
  #homeView .wd-points .icon{flex:none; width:14px; height:14px; margin-top:1px; color:var(--accent);}
  @media (max-width:900px){ #homeView .wd-points{display:none;} #homeView .wd-about{border-top:0; padding:0 4px;} }
  /* Largeurs fixes : quand « Sauvegardé » devient « Sauvegarde… », rien ne se décale sous la souris. */
  .save-status{display:inline-flex; align-items:center; justify-content:flex-start; min-width:112px; box-sizing:border-box; white-space:nowrap;}
  .vault-chip{display:inline-block; min-width:92px; box-sizing:border-box; text-align:center; white-space:nowrap;}
  .pg-indicator{min-width:118px; box-sizing:border-box; justify-content:center;}
  .search-count{min-width:34px; text-align:right;}

  /* v33 : colonne de navigation stable (comme WriterDuet) : surbrillance immédiate, repère animé, pas de décalage de la page */
  .center-pane{scrollbar-gutter:stable;}
  .rail-item{user-select:none; -webkit-tap-highlight-color:transparent; outline:none; transition:background .12s ease, color .12s ease;}
  .rail-item::before{content:''; position:absolute; left:-10px; top:7px; bottom:7px; width:3px; border-radius:0 3px 3px 0; background:#5DB6EC; opacity:0; transform:scaleY(.35); transition:opacity .15s ease, transform .15s ease; pointer-events:none;}
  .rail-item.active::before{opacity:1; transform:scaleY(1);}
  .rail-item.active:hover{background:rgba(54,153,212,.26);}
  .topbar .btn, .topbar .pg-indicator, .topbar .save-status{user-select:none;}
  .help-body{max-height:54vh; overflow:auto; padding-right:6px;}
  .help-intro{font-size:13.26px; color:var(--ink-soft); line-height:1.6; margin:0 0 18px;}
  .help-group-title{
    font-family:var(--display); font-size:13.26px; font-weight:600;
    color:var(--ink); padding-bottom:7px; border-bottom:1px solid var(--hair); margin:0 0 12px;
  }
  .help-section{margin-bottom:24px;}
  .help-section:last-child{margin-bottom:4px;}
  .help-step-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:16px;}
  .help-step{display:flex; gap:12px; align-items:flex-start;}
  .help-step-num{
    flex:none; width:22px; height:22px; border-radius:50%; background:var(--accent); color:#fff;
    font-size:12.24px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:1px;
  }
  .help-step-body{font-size:13.77px; line-height:1.62; color:var(--ink);}
  .help-step-body b{color:var(--ink); font-weight:600;}
  .help-list{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:10px;}
  .help-list li{font-size:13.77px; line-height:1.62; color:var(--ink); padding-left:16px; position:relative;}
  .help-list li::before{content:''; position:absolute; left:0; top:8px; width:5px; height:5px; border-radius:50%; background:var(--accent);}
  .help-callout{
    background:var(--surface-soft); border-left:3px solid var(--accent); border-radius:0 var(--radius) var(--radius) 0;
    padding:13px 15px; margin-top:16px; font-size:13.26px; line-height:1.6; color:var(--ink);
  }
  .help-callout b{color:var(--ink); font-weight:600;}
  .help-p{font-size:13.77px; line-height:1.62; color:var(--ink); margin:0 0 10px;}
  .help-p:last-child{margin-bottom:0;}
  .help-kbd-row{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:4px;}

  .char-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--hair); cursor:pointer;}
  .char-row:hover{background:var(--overlay-hover-soft);}
  .char-name{font-weight:600; font-size:13px;}
  .char-stats{font-size:12.5px; color:var(--ink-soft);}

  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:20px 24px;}
  .stat-card{border:1px solid var(--hair); border-radius:4px; padding:16px; background:var(--surface);}
  .stat-num{font-family:var(--display); font-size:26px; font-weight:700; color:var(--accent);}
  .stat-label{font-size:13px; color:var(--ink-soft); margin-top:2px;}

  .kbd{
    display:inline-block; border:1px solid var(--hair); border-bottom-width:2px; border-radius:3px; padding:3px 7px;
    font-size:12.5px; font-family:var(--mono); background:var(--surface-soft-2); white-space:nowrap;
  }
  .shortcuts-table{width:100%; border-collapse:collapse; font-size:13px;}
  .shortcuts-table td{padding:7px 4px; border-bottom:1px solid var(--hair);}

  /* ---------- modale Raccourcis ----------
     Avant : un seul tableau de 14 lignes dans le désordre, en 13px, où il
     fallait lire toute la liste pour trouver une touche. Maintenant :
     quatre groupes par moment d'usage (écrire / naviguer / historique /
     annoter), colonne de touches alignée à gauche, textes agrandis, et
     l'explication longue passe en sous-ligne grise pour que l'œil puisse
     ne lire que les libellés courts. */
  .sc-modal{max-width:660px; max-height:84vh; overflow:auto;}
  .sc-intro{font-size:13.5px; color:var(--ink-soft); margin:-10px 0 20px;}
  .sc-group{margin-bottom:24px;}
  .sc-group:last-of-type{margin-bottom:6px;}
  .sc-group-title{
    font-size:11.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink-soft); padding-bottom:8px; border-bottom:1px solid var(--hair); margin-bottom:2px;
  }
  .sc-row{display:flex; gap:20px; align-items:baseline; padding:10px 2px;}
  .sc-row + .sc-row{border-top:1px solid var(--overlay-hover);}
  .sc-keys{flex:none; width:186px; display:flex; flex-wrap:wrap; gap:5px; align-items:center;}
  .sc-keys .sc-plus{font-size:11.5px; color:var(--ink-soft);}
  .sc-desc{font-size:14.5px; line-height:1.45;}
  .sc-note{display:block; font-size:12.5px; color:var(--ink-soft); line-height:1.45; margin-top:3px;}

  /* ---------- Aller à la scène (Ctrl+K) ----------
     Emprunté à WriterDuet : sauter à n'importe quelle scène sans quitter
     l'éditeur ni faire défiler à la main. Liste filtrable au clavier. */
  .jump-modal{max-width:560px; padding:20px;}
  .jump-input{
    width:100%; padding:11px 12px; border:1px solid var(--hair); border-radius:var(--radius);
    font-size:15px; background:var(--surface-soft); color:var(--ink); outline:none;
  }
  .jump-input:focus{border-color:var(--accent);}
  .jump-list{margin-top:12px; max-height:52vh; overflow:auto;}
  .jump-item{
    display:flex; align-items:baseline; gap:12px; padding:9px 10px; border-radius:var(--radius);
    cursor:pointer; font-size:14px;
  }
  .jump-item:hover{background:var(--overlay-hover);}
  .jump-item.sel{background:var(--tag-chip-bg);}
  .jump-num{flex:none; width:34px; font-family:var(--mono); font-size:13px; color:var(--ink-soft);}
  .jump-head{flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .jump-page{flex:none; font-size:12.5px; color:var(--ink-soft);}
  .jump-empty{padding:16px 10px; font-size:13.5px; color:var(--ink-soft);}

  /* ---------- Mode Focus (Ctrl+Maj+F) ----------
     Emprunté à WriterDuet (son "Focus Mode" / surlignage de la ligne
     active) : estompe tout le texte sauf la ligne où est le curseur, pour
     écrire sans que l'œil soit distrait par le reste de la page. Purement
     visuel — une seule classe posée sur #page, rien dans les données ni
     dans les exports. */
  #page.focus-mode .line{opacity:.32; transition:opacity .12s;}
  #page.focus-mode .line.line-active{opacity:1;}

  /* ---------- Lire à voix haute (Ctrl+Maj+L) ----------
     Emprunté à WriterDuet ("Read Aloud") : entendre une scène plutôt que
     la relire des yeux fait ressortir des lourdeurs de dialogue qu'on ne
     voit plus à force de relecture silencieuse. Purement transitoire —
     rien n'est stocké, l'icône change juste pendant la lecture. */
  .btn-tw.reading{color:var(--accent);}

  textarea.notes-area{width:100%; min-height:60vh; border:1px solid var(--hair); border-radius:4px; padding:16px; font-size:13.5px; line-height:1.6; background:var(--surface-soft); color:var(--ink);}

  .toolbar-row{display:flex; align-items:center; gap:8px; padding:14px 24px 0; flex-wrap:wrap;}
  .chip-toggle{
    border:1px solid var(--hair); background:var(--surface); padding:5px 11px; border-radius:14px; font-size:13px; font-weight:600; color:var(--ink-soft);
  }
  .chip-toggle.on{background:var(--accent); border-color:var(--accent); color:#fff;}

  /* ---------- IMPRESSION / PDF ---------- */
  /* Une vraie page imprimée par feuille de l'éditeur : mêmes dimensions,
     mêmes marges, mêmes sauts. Ce que l'on voit est ce que l'on imprime. */
  .print-page{
    position:relative; width:var(--page-w,21cm); height:var(--page-h,29.7cm); overflow:hidden;
    background:var(--paper); color:var(--paper-ink);
    font-family:var(--script-font,var(--mono)); font-size:12pt; line-height:1.5;
    padding: var(--pm-top,2.5cm) var(--pm-right,2.5cm) var(--pm-bottom,2.5cm) var(--pm-left,3cm);
    break-after:page; page-break-after:always;
  }
  .print-page:last-child{break-after:auto; page-break-after:auto;}
  /* v47 : encre IDENTIQUE à WriterDuet à l'export PDF et à l'impression. WriterDuet imprime tout le texte
     (courant, gras, italique, numéros de scène et de page, marques de continuité) en noir 0/0/0, sans
     transparence ; Raging Page utilisait un gris bleuté (#23262E), un gris moyen pour les numéros et un brun
     pour les didascalies. Le gras reste un vrai gras (graisse de police), donc toujours distinct du reste.
     L'affichage à l'écran (éditeur) n'est pas modifié. */
  .print-page{ --paper-ink:#000; --paper-ink-soft:#000; color:#000; }
  .print-page .line--parenthetical{ color:#000; }
  .print-page .sheet-cont{ opacity:1; }
  /* Filigrane (PDF & impression) : texte discret en diagonale, au centre de
     chaque page, réglable dans Paramètres. Inspiré des logiciels du métier
     (Final Draft, WriterDuet) : sert à marquer une copie de lecture
     ("CONFIDENTIEL", le nom du destinataire…) pour repérer d'où vient une
     fuite si le scénario circule avant sa sortie. N'apparaît jamais dans
     l'éditeur lui-même, seulement à l'export/impression — exactement comme
     les numéros de page, ajoutés au même endroit du code. */
  .sheet-watermark{
    position:absolute; top:50%; left:50%; width:200%;
    transform:translate(-50%,-50%) rotate(-38deg);
    text-align:center; white-space:nowrap; pointer-events:none; user-select:none;
    font-family:var(--script-font,var(--mono)); font-size:52pt; font-weight:700; letter-spacing:.06em;
    text-transform:uppercase; color:rgba(0,0,0,.08); z-index:0;
  }
  /* La première ligne d'une page commence au ras de la marge : sa marge
     haute d'origine (1,6em pour une entête de scène par ex.) n'a de sens
     qu'entre deux blocs, pas en tête de page. */
  .print-page > .line:first-of-type{margin-top:0 !important;}
  /* v26 : :first-of-type compte aussi le numéro de page (.sheet-num, un <div>) : la règle ci-dessus ne touchait donc
     JAMAIS la première ligne des pages numérotées, qui descendait de sa marge haute (16 à 26 px) et débordait en bas. */
  .print-page > .line.pg-first{margin-top:0 !important;}
  /* v26 : (MORE) / NOM (CONT'D) sont réservés sur exactement 1 ligne (24 px) : sans padding, ils ne dépassent plus. */
  .line.pg-mark{padding-top:0; padding-bottom:0; min-height:0;}
  #printArea .titlepage{break-after:page; page-break-after:always; margin-bottom:0;}
  /* Conteneur invisible servant à mesurer la pagination de l'export
     (les notes en sont exclues, la pagination y est donc différente). */
  #pageMeasure{
    position:fixed; left:-10000px; top:0; visibility:hidden; pointer-events:none;
    width:var(--page-w,21cm); font-family:var(--script-font,var(--mono)); font-size:12pt; line-height:1.5;
    padding: var(--pm-top,2.5cm) var(--pm-right,2.5cm) var(--pm-bottom,2.5cm) var(--pm-left,3cm);
  }

  /* La zone d'impression n'est jamais visible à l'écran : elle n'existe que
     le temps d'un export. L'ancienne version la laissait affichée en clair
     pendant l'impression, et surtout dépendait d'un nettoyage à retardement
     pour la faire disparaître — si ce nettoyage ne tombait pas au bon
     moment, tout le scénario restait plaqué par-dessus l'éditeur. */
  #printArea{display:none;}

  @media print{
    /* CORRECTIF. L'ancienne règle masquait l'interface avec
       visibility:hidden. Un élément « invisible » de cette façon occupe
       toujours toute sa place : l'éditeur, qui fait la hauteur du scénario
       entier, restait donc dans le flux et le navigateur imprimait le
       scénario PUIS autant de pages blanches que l'éditeur en occupait —
       des documents à rallonge, parfois impossibles à rouvrir. display:none
       les retire réellement du flux. */
    body > *{display:none !important;}
    #printArea{display:block !important; position:static; width:auto; margin:0;}
    /* CORRECTIF. Une feuille exactement aussi haute que la page physique
       (29,7 cm sur 29,7 cm) la dépasse d'une fraction de pixel une fois
       arrondie par le navigateur — qui glisse alors une page blanche entre
       CHAQUE feuille. Le millimètre retiré ici est pris tout en bas de la
       marge basse, là où aucun texte ne descend jamais : la pagination,
       elle, ne change pas d'un iota. */
    .print-page{box-shadow:none; margin:0; height:calc(var(--page-h,29.7cm) - 1mm);}
    #printArea .titlepage{height:calc(var(--page-h,29.7cm) - 1mm); min-height:0;}
  }

  /* ---------- INTERLIGNE « STANDARD » (comme WriterDuet / Final Draft) ----------
     12 pt sur 12 pt = 6 lignes au pouce, soit ~54 lignes par page : une page
     = environ une minute d'écran. Le mode « confortable » garde l'ancien 1,5.
     Les marges entre blocs sont en em : elles restent des lignes vides entières. */
  html.ls-std #page, html.ls-std .print-page, html.ls-std #pageMeasure, html.ls-std .pg-mark-lbl{line-height:1;}
  html.ls-std .line{min-height:1em;}
  html.ls-std .line:not(.line--card):not(.line--dual){padding-top:0; padding-bottom:0;}
  /* CORRECTIF PAGINATION (v38). Sans padding vertical, une ligne VIDE éditable est une boîte « creuse » :
     le navigateur laisse alors fuiter la marge posée par la pagination sur la première ligne d'une
     feuille (jusqu'à ~235 px) dans toutes les lignes vides qui suivent. Chaque Entrée repoussait donc
     la ligne de ~250 px, les feuilles se multipliaient et le texte sortait des pages. Un contexte de
     mise en page propre à chaque ligne (flow-root) arrête cette fuite sans rien changer d'autre :
     les marges entre lignes voisines fusionnent comme avant. Le mode « confortable » n'est pas
     concerné (ses lignes gardent 1 px de padding, comme en v25). */
  html.ls-std .line:not(.line--card):not(.line--dual){display:flow-root;}
  html.ls-std .line--scene{margin-top:2em;}
  /* v45 : deux lignes d'action qui se suivent sont deux LIGNES de texte (comme PageRenderer.js) : plus de
     ligne vide automatique entre elles. Une page contient ~54 lignes de texte au lieu de ~29. Une ligne
     vide s'obtient en laissant une ligne d'action vide. */
  html.ls-std .line--action + .line--action{margin-top:0;}
  /* v40 : alignement sur le gabarit Final Draft / WriterDuet. En interligne standard, tout espace entre blocs
     est un nombre ENTIER de lignes vides (1 ligne = 12 pt). Les anciennes marges fractionnaires (1,2 em pour une
     transition ou un dialogue simultané, 0,25 em sous le nom d'une colonne) ajoutaient 3 à 4 px parasites qui
     décalaient la grille des lignes : une page ne retombait pas sur les mêmes lignes qu'un logiciel du métier. */
  html.ls-std .line--transition{margin-top:1em;}
  html.ls-std .line--dual{margin-top:1em;}
  html.ls-std .dual-col > .line--dialogue{margin-top:0;}

  @media (max-width:880px){
    .rail{width:64px;}
    .rail-item span.lbl{display:none;}
    .rail-project, .rail-bottom{display:none;}
    .side-pane{position:fixed; right:0; top:52px; bottom:0; z-index:50; box-shadow:-8px 0 20px #0002;}
    .page-scroll{padding:20px 10px 160px;}
  }
  /* ---------- SÉLECTION EXPRESS (v12) : une pastille par scène, dans la marge ----------
     Une petite pastille discrète à côté du numéro de chaque scène (jamais
     sur le texte). Au survol elle se déplie en deux choix :
         ▢ Scène   → sélectionne cette scène
         ▤ Tout    → sélectionne tout le scénario
     En même temps, un fin trait de couleur longe la scène concernée et le
     texte prend une très légère teinte, pour voir d'avance ce qui sera pris.
     Au repos : seulement la pastille, discrète mais visible. Elles vivent
     dans une couche à part (#sceneTools), jamais dans les lignes éditables :
     aucun effet sur le curseur, la pagination ou les exports. */
  #sceneTools{position:absolute; inset:0; z-index:2; pointer-events:none;}
  #sceneTools .st-chip{
    position:absolute; left:calc(var(--pm-left,3cm) - 2.7cm); width:1.75cm; min-height:20px;
    pointer-events:none; z-index:3; display:flex; flex-direction:column;
  }
  #sceneTools .st-chip:hover{pointer-events:auto;}
  #sceneTools .st-seg{
    display:flex; align-items:center; gap:5px; box-sizing:border-box; height:20px; padding:0 6px;
    border-radius:10px; cursor:pointer; pointer-events:auto; user-select:none; -webkit-tap-highlight-color:transparent;
    font-family:var(--sans); font-size:10px; font-weight:600; line-height:1; white-space:nowrap;
    color:var(--accent-2); background:rgba(255,255,255,.94); border:1px solid rgba(31,111,160,.28);
    box-shadow:0 1px 3px rgba(20,30,50,.10);
    transition:background .14s ease, color .14s ease, border-color .14s ease, box-shadow .14s ease, opacity .14s ease, width .14s ease;
  }
  #sceneTools .st-seg svg{flex:none; width:12px; height:12px; stroke:currentColor; fill:none; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round;}
  #sceneTools .st-seg .st-t{display:none;}
  /* au repos : pastille ronde, discrète */
  #sceneTools .st-seg.st-one{width:20px; padding:0; justify-content:center; opacity:.7;}
  #sceneTools .st-seg.st-all{display:none; margin-top:4px;}
  /* au survol : elle se déplie */
  #sceneTools .st-chip:hover .st-seg.st-one,
  #sceneTools .st-chip.st-open .st-seg.st-one{width:100%; padding:0 6px; justify-content:flex-start; opacity:1;}
  #sceneTools .st-chip:hover .st-seg .st-t,
  #sceneTools .st-chip.st-open .st-seg .st-t{display:inline;}
  #sceneTools .st-chip:hover .st-seg.st-all,
  #sceneTools .st-chip.st-open .st-seg.st-all{display:flex; width:100%; opacity:1;}
  #sceneTools .st-seg.st-hot{background:var(--accent-2); color:#fff; border-color:var(--accent-2); box-shadow:0 2px 6px rgba(31,111,160,.35);}
  #sceneTools .st-seg.st-pop{animation:stPop .35s ease-out;}
  @keyframes stPop{0%{transform:scale(1)} 40%{transform:scale(1.14)} 100%{transform:scale(1)}}
  /* le fin trait qui longe la scène (visible seulement au survol) */
  #sceneTools .st-rail{
    position:absolute; left:calc(var(--pm-left,3cm) - 2.9cm + 1px); width:3px; border-radius:3px;
    background:var(--accent-2); opacity:0; transform:scaleY(.96); transition:opacity .15s ease, transform .15s ease;
    pointer-events:none;
  }
  #sceneTools .st-rail.st-hot{opacity:.8; transform:none;}
  .line.st-hint{background:rgba(54,153,212,.06);}
  #page.st-hint-all .line:not(.line--dual){background:rgba(54,153,212,.06);}
  @keyframes stFlash{0%{background:rgba(54,153,212,.28)} 100%{background:rgba(54,153,212,0)}}
  .line.st-flash{animation:stFlash .85s ease-out;}
  #page.st-flash-all .line{animation:stFlash .85s ease-out;}
  @media print{ #sceneTools{display:none !important;} }

  /* =====================================================================
     v24 — HABILLAGE « WriterDuet » : même fonctionnement, autre peau.
     Placée EN DERNIER : ne surcharge que l'interface. La feuille de
     scénario (.sheet, .line, .titlepage, impression, exports) n'est
     volontairement jamais touchée.
     ===================================================================== */
  :root{
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --display:var(--sans);
    --radius:6px;
    --shadow-sm:0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.07);
    --shadow-md:0 2px 4px rgba(16,24,40,.05), 0 8px 20px -6px rgba(16,24,40,.14);
    --focus-ring:0 0 0 3px rgba(54,153,212,.22);
  }
  html[data-theme="dark"]{ --shadow-sm:0 1px 2px rgba(0,0,0,.35); --shadow-md:0 8px 22px -6px rgba(0,0,0,.55); }
  body{font-feature-settings:'cv11','ss01'; letter-spacing:-.003em;}

  /* Le nom « Raging Page » */
  .mm-word{display:inline-flex; align-items:center; line-height:0; white-space:nowrap; user-select:none;}
  .mm-word svg{display:block; height:1em; width:4.836em;}
  .mm-word .w1{fill:var(--ink);}
  .mm-word .w2{fill:var(--accent);}
  .mmlb{fill:#1F6FA0;}
  html[data-theme="dark"] .mmlb, .rail .mmlb{fill:#3699D4;}
  /* Fumée du crayon : uniquement sur le logo de l'accueil (mmLogo(..., true)) */
  .mm-logo-smoke{overflow:visible;}
  .mm-smoke .sp{fill:#FCFDFE; stroke:#14425E; stroke-width:1.8; transform-box:fill-box; transform-origin:center; opacity:0; animation:mmSmoke 4.2s ease-out infinite;}
  .mm-smoke .sp2{animation-delay:1.4s;}
  .mm-smoke .sp3{animation-delay:2.8s;}
  @keyframes mmSmoke{0%{opacity:0; transform:translate(0,2px) scale(.45);} 18%{opacity:1;} 65%{opacity:.9;} 100%{opacity:0; transform:translate(9px,-38px) scale(1.6);}}
  @media (prefers-reduced-motion:reduce){
    .mm-smoke .sp{animation:none; opacity:.95;}
    .mm-smoke .sp1{transform:translate(0,-3px) scale(.8);}
    .mm-smoke .sp2{transform:translate(4px,-16px) scale(1.1);}
    .mm-smoke .sp3{transform:translate(8px,-30px) scale(1.4); opacity:.7;}
  }
  #homeView .wd-brand{font-size:inherit; gap:12px;}
  #homeView .wd-brand .mm-word{font-size:37.5px;}
  #homeView .wd-about b{display:block; margin-bottom:8px;}
  #homeView .wd-about b .mm-word{font-size:26.6px;}
  .mm-word-sm{font-size:31.5px;}
  .hub-sep{width:1px; height:20px; background:var(--hair); margin:0 4px; flex:none;}
  .rail .mm-word{font-size:29.4px;}
  .rail .mm-word .w1{fill:#fff;}
  .rail .mm-word .w2{fill:#6DBCEB;}

  /* Accueil : compteur de scénarios */
  #homeView .wd-main-h{align-items:center; gap:14px; margin:2px 2px 18px;}
  #homeView .wd-main-h h1{font-size:28px; letter-spacing:-.025em;}
  #homeView .wd-count{
    display:inline-flex; align-items:center; justify-content:center; min-width:34px; height:34px; padding:0 12px;
    border-radius:999px; background:var(--tag-chip-bg); color:var(--tag-chip-text);
    font-size:18px; font-weight:700; line-height:1; letter-spacing:-.01em; font-variant-numeric:tabular-nums;
    box-shadow:inset 0 0 0 1px rgba(54,153,212,.22);
  }
  #homeView .wd-top{height:60px; box-shadow:0 1px 0 var(--hair);}
  #homeView .wd-table{border-radius:12px; box-shadow:var(--shadow-sm);}
  #homeView .wd-new{border-radius:8px; font-weight:600;}

  /* Boutons et champs */
  .btn{border-radius:6px; font-weight:500; transition:background .12s, border-color .12s, box-shadow .12s, color .12s;}
  .btn:hover{border-color:#B7D4EC;}
  .btn-primary{font-weight:600; box-shadow:0 1px 2px rgba(31,111,160,.35);}
  .btn-primary:hover{border-color:#2C7FB0;}
  .btn:focus-visible{outline:none; box-shadow:var(--focus-ring);}
  .field input[type=text], .field input[type=date], .field input[type=number], .field textarea, .field select,
  .flat-row textarea, .flat-row input[type=text], .structure-card textarea{
    border-radius:6px; transition:border-color .12s, box-shadow .12s, background .12s;
  }
  .field input:focus, .field textarea:focus, .field select:focus, .flat-row textarea:focus, .flat-row input:focus, .structure-card textarea:focus{
    outline:none; border-color:var(--accent); box-shadow:var(--focus-ring); background:var(--surface);
  }
  .field label{font-weight:600; letter-spacing:0;}
  .modal-backdrop{backdrop-filter:blur(2px);}
  .modal{border-radius:12px; box-shadow:0 0 0 1px var(--hair), 0 24px 64px rgba(10,10,20,.32);}
  .modal h2{font-family:var(--sans); font-weight:700; letter-spacing:-.015em;}
  .fmt-opt{border-radius:8px;}
  .tag-chip, .chip-toggle{border-radius:999px;}
  .center-pane, .rail-nav, .side-pane, #homeView .home-list-scroll{scrollbar-width:thin; scrollbar-color:rgba(120,128,150,.4) transparent;}
  /* v26 : barre de défilement de l'éditeur plus large (comme WriterDuet), plus facile à saisir pour parcourir les pages. */
  .center-pane{scrollbar-width:auto; scrollbar-color:rgba(110,118,140,.55) rgba(120,128,150,.12);}
  .center-pane::-webkit-scrollbar{width:16px; height:16px;}
  .center-pane::-webkit-scrollbar-track{background:rgba(120,128,150,.12);}
  .center-pane::-webkit-scrollbar-thumb{background:rgba(110,118,140,.55); border-radius:8px; border:3px solid transparent; background-clip:content-box; min-height:48px;}
  .center-pane::-webkit-scrollbar-thumb:hover{background:rgba(110,118,140,.85); background-clip:content-box;}

  /* Colonne de gauche */
  .rail{width:240px; border-right:0; box-shadow:inset -1px 0 0 rgba(0,0,0,.28);}
  .rail-top{padding:0;}
  .rail-brand{height:60px; padding:0 18px; gap:11px; border-bottom:1px solid var(--hair-dark);}
  .rail-logo{border-radius:7px;}
  .rail-project{
    margin:14px 12px 4px; padding:10px 12px 11px; border-radius:10px; background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.08); color:#fff; font-size:14px; font-weight:600; line-height:1.35;
  }
  .rail-project::before{content:attr(data-label); display:block; margin-bottom:3px; font-size:10.5px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--studio-text-dim);}
  .rail-nav{padding:2px 10px 12px;}
  .rail-group{padding:16px 12px 6px; font-size:10.5px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--studio-text-dim); opacity:.85;}
  .rail-item{position:relative; gap:12px; padding:8px 12px; margin:1px 0; border-radius:8px; font-size:14px; font-weight:500; cursor:pointer; transition:background .12s, color .12s;}
  .rail-item .icon{width:16px; height:16px; opacity:.85;}
  .rail-item:hover{background:rgba(255,255,255,.07);}
  .rail-item.active{background:rgba(54,153,212,.2); color:#fff;}
  .rail-item.active .icon{opacity:1; color:#7CC6F2;}
  .rail-item.active::before{content:''; position:absolute; left:-10px; top:7px; bottom:7px; width:3px; border-radius:0 3px 3px 0; background:#5DB6EC;}
  /* v34 : colonne de gauche façon WriterDuet — survol net, sans saut, sans clignotement. */
  .rail-nav{scrollbar-gutter:stable; overscroll-behavior:contain;}
  .rail-item{transition:none; touch-action:manipulation; -webkit-user-drag:none;}
  .rail-item::before{transition:opacity .12s ease, transform .12s ease;}
  .rail-item > *{pointer-events:none;}
  @media (hover:hover){
    .rail-item:hover{background:rgba(255,255,255,.07); color:#fff;}
    .rail-item:hover .icon{opacity:1;}
    .rail-item.active:hover{background:rgba(54,153,212,.26);}
  }
  .rail-item:active{background:rgba(255,255,255,.11);}
  /* v36 : barre du haut qui se compacte par paliers (comme WriterDuet) — plus aucun chevauchement.
     Ordre : police → libellés des boutons → statut en pastille → recherche réduite → indicateur de page raccourci. */
  .topbar{min-width:0; overflow:hidden;}
  .topbar-left{flex:1 1 auto; overflow:hidden;}
  .topbar-right{flex:none;}
  .topbar-left > *, .topbar-right > *{flex:none;}
  @media (max-width:1720px){ .topbar select.tb-font, .topbar select.tb-font + .tb-div{display:none;} }
  @media (max-width:1560px){
    .topbar .btn[data-act="goHome"] .tb-lbl{display:none;}
    .topbar .btn[data-act="goHome"]{padding:7px 9px;}
    .search-box input{width:110px;}
  }
  @media (max-width:1420px){
    .topbar .btn[data-act="insertCard"] .tb-lbl, .topbar .btn[data-act="openLayout"] .tb-lbl{display:none;}
  }
  @media (max-width:1300px){
    .topbar .btn .tb-lbl{display:none;}
    .topbar .btn{padding:7px 9px;}
    .topbar .btn.btn-primary{padding:8px 11px;}
  }
  @media (max-width:1460px){
    .save-status{min-width:0; padding:5px 9px;}
    .save-status #saveLabel{display:none;}
    .vault-chip{min-width:0; width:14px; height:14px; padding:0; font-size:0; background:currentColor; border-color:transparent; align-self:center;}
    .vault-chip.ok{color:#127a4b;} .vault-chip.warn{color:#c47a00;} .vault-chip.off{color:var(--ink-soft);}
  }
  @media (max-width:1300px){
    .search-box input{width:70px;}
    .pg-indicator{min-width:0; padding:4px 8px;}
    .topbar{padding:0 12px; gap:8px;}
    .tb-div{margin:0 4px;}
  }
  @media (max-width:1120px){
    .search-box input{width:48px;}
    .topbar .btn[data-act="doUndo"], .topbar .btn[data-act="doRedo"], .topbar-left .tb-div:nth-of-type(n+2){display:none;}
  }
  @media (max-width:980px){
    .lang-flags{display:none;}
  }
  .rail-item.active:active{background:rgba(54,153,212,.26);}
  .rail-bottom{padding:12px 18px; font-size:12px; letter-spacing:.01em;}

  /* Barre du haut */
  .topbar{height:60px; padding:0 20px; gap:16px; box-shadow:0 1px 0 var(--hair); border-bottom:0;}
  .topbar-left, .topbar-right{gap:4px;}
  .topbar .btn{border-color:transparent; background:transparent; font-weight:500; padding:7px 11px; font-size:14px; white-space:nowrap;}
  .topbar-left, .topbar-right{flex-wrap:nowrap; min-width:0;}
  .topbar .btn:hover{background:var(--overlay-hover); border-color:transparent;}
  .topbar .btn .icon{color:var(--ink-soft);}
  .topbar .btn[data-act="insertScene"]{border-color:var(--hair); background:var(--surface); box-shadow:var(--shadow-sm); margin:0 2px;}
  .topbar .btn[data-act="insertScene"]:hover{border-color:#B7D4EC; background:var(--surface-soft);}
  .topbar .btn.btn-primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; padding:8px 15px; margin-left:6px;}
  .topbar .btn.btn-primary:hover{background:#2C7FB0; border-color:#2C7FB0;}
  .topbar .btn.btn-primary .icon{color:#fff;}
  .tb-div{flex:none; width:1px; height:22px; background:var(--hair); margin:0 8px;}
  .save-status{padding:5px 11px; border-radius:999px; background:var(--surface-soft-2); font-size:12.5px; font-weight:500;}
  .search-box{border-radius:999px; padding:6px 13px; background:var(--surface-soft-2); border-color:transparent; transition:box-shadow .12s, border-color .12s, background .12s;}
  .search-box:focus-within{background:var(--surface); border-color:var(--accent); box-shadow:var(--focus-ring);}
  .pg-indicator{border-radius:999px;}
  .lang-flags{margin:0 2px;}

  /* En-tête commun des onglets */
  .center-pane{background:var(--backdrop);}
  /* Zone « morte » autour des feuilles pendant l'écriture : un gris un peu plus soutenu que le reste
     de l'interface (comme WriterDuet), pour que la page blanche se détache nettement. Limité à
     l'éditeur : les autres onglets gardent le fond habituel. */
  :root{--editor-backdrop:#DCE0E7;}
  html[data-theme="dark"]{--editor-backdrop:#0D0D13;}
  .center-pane:has(#pageStack){background:var(--editor-backdrop);}
  .cards-toolbar{padding:26px 24px 6px; gap:14px; flex-wrap:wrap;}
  .pane-title{font-family:var(--sans); font-weight:700; font-size:26px; line-height:1.15; letter-spacing:-.025em; border-bottom:0; padding-bottom:0; margin-bottom:0;}
  .side-pane .pane-title{font-size:18px; padding-bottom:10px; border-bottom:1px solid var(--hair); margin-bottom:14px;}
  .cards-hint, .structure-help{font-size:13.5px;}

  /* Cartes */
  .cards-grid{gap:16px; padding:18px 24px 64px;}
  .card{border-radius:10px; box-shadow:var(--shadow-sm); padding:14px 15px 13px 13px; gap:8px; transition:border-left-color .12s, background .12s, box-shadow .15s, transform .15s;}
  .card:hover{background:var(--surface); box-shadow:var(--shadow-md);}
  .card-heading{font-weight:600;}
  .card-num{font-weight:700;}

  /* Structure */
  .structure-list{gap:12px; max-width:760px;}
  .structure-card{border-radius:10px; box-shadow:var(--shadow-sm); padding:12px 14px; gap:12px; transition:box-shadow .15s;}
  .structure-card:hover{box-shadow:var(--shadow-md);}
  .structure-card input[type=text]{font-weight:600; font-size:14.5px;}
  .structure-add{border-radius:10px; padding:13px; font-weight:500; background:transparent; transition:border-color .12s, color .12s, background .12s;}
  .structure-add:hover{background:var(--tag-chip-bg);}

  /* Outline, Tags, Corbeille, Historique */
  .flat-list{gap:12px; padding:18px 24px 64px;}
  .flat-row{border-radius:10px; box-shadow:var(--shadow-sm); padding:14px 16px; transition:box-shadow .15s, border-color .15s;}
  .flat-row:hover{box-shadow:var(--shadow-md);}
  .flat-row-title{font-weight:600;}

  /* Personnages */
  .char-row{border:1px solid var(--hair); border-radius:10px; background:var(--surface); box-shadow:var(--shadow-sm); padding:13px 16px; margin-bottom:10px; transition:border-color .12s, box-shadow .15s;}
  .char-row:hover{background:var(--surface); border-color:#B7D4EC; box-shadow:var(--shadow-md);}
  .char-name{font-weight:600;}

  /* Statistiques */
  .stat-grid{gap:16px; padding:20px 24px 40px;}
  .stat-card{border-radius:12px; box-shadow:var(--shadow-sm); padding:20px 22px;}
  .stat-num{font-size:34px; letter-spacing:-.03em; line-height:1.1;}
  .stat-label{font-size:13.5px; margin-top:4px;}

  /* Paramètres */
  .center-pane > div > .panel-block{background:var(--surface); border:1px solid var(--hair); border-radius:12px; padding:18px 20px 6px; box-shadow:var(--shadow-sm); margin-bottom:18px;}
  .panel-block h4{font-family:var(--sans); font-size:15.5px; font-weight:700; letter-spacing:-.01em; margin-bottom:12px;}
  .toolbar-row{padding-left:24px; padding-right:24px;}

  /* Navigateur de scènes */
  .side-pane{width:300px; box-shadow:-1px 0 0 var(--hair);}
  .nav-pane-head{border-bottom:0; padding-bottom:4px;}
  .nav-pane-head .t{font-family:var(--sans); font-size:17px; font-weight:700; letter-spacing:-.015em;}
  .nav-pane-head .c{font-weight:500;}
  .nav-filter input{border-radius:999px; padding:8px 13px; background:var(--surface-soft-2); border-color:transparent;}
  .nav-filter input:focus{background:var(--surface); border-color:var(--accent); box-shadow:var(--focus-ring);}
  .nav-item{border-radius:8px; padding:8px 10px;}
  .nav-item.active{background:var(--tag-chip-bg); border-color:transparent; box-shadow:inset 3px 0 0 var(--accent);}

  @media (max-width:880px){
    .rail{width:64px;}
    .rail-brand{justify-content:center; padding:0;}
    .rail-brand .mm-word, .rail-group{display:none;}
    .rail-nav{padding:8px 8px;}
    .rail-item{justify-content:center; padding:10px 0;}
    .rail-item.active::before{left:-8px;}
    .topbar{padding:0 12px; gap:8px;}
    .tb-div{margin:0 4px;}
    .cards-toolbar{padding:20px 16px 4px;}
    .pane-title{font-size:22px;}
    #homeView .wd-main-h h1{font-size:24px;}
    #homeView .wd-count{min-width:30px; height:30px; font-size:16px;}
  }

/* ===== v29 : sauvegarde, renommage global, variantes, scènes d'anciennes versions, sides ===== */
.wd-bar{display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:8px 20px; font-size:13px; line-height:1.4;
  background:var(--chip-bg); color:var(--ink); border-bottom:1px solid var(--hair); border-left:3px solid #d98b1f;}
.wd-bar .wd-bar-text{flex:1 1 280px; min-width:0;}
.wd-bar .wd-bar-text b{font-weight:700;}
.wd-bar .wd-bar-actions{display:flex; gap:6px; align-items:center;}
.wd-modal{max-width:660px; width:100%; max-height:88vh; display:flex; flex-direction:column; padding:24px 26px 20px;}
.wd-modal h2{margin:0 0 4px;}
.wd-sub{font-size:13px; color:var(--ink-soft); margin:0 0 14px; line-height:1.45;}
.wd-body{overflow:auto; min-height:0; margin:0 -6px; padding:0 6px;}
.wd-seg{display:inline-flex; border:1px solid var(--hair); border-radius:9px; overflow:hidden; margin-bottom:14px;}
.wd-seg button{border:0; background:var(--surface); color:var(--ink-soft); padding:6px 14px; font-size:13px; font-weight:600; cursor:pointer;}
.wd-seg button.on{background:var(--accent); color:#fff;}
.wd-row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.wd-opts{display:flex; flex-wrap:wrap; gap:6px 18px; margin:2px 0 12px; font-size:13px;}
.wd-opts label{display:flex; align-items:center; gap:6px; cursor:pointer;}
.wd-sum{font-size:12.5px; color:var(--ink-soft); margin:0 0 8px; font-weight:600;}
.wd-warn{font-size:12.5px; color:#9a5b00; background:rgba(217,139,31,.12); border-radius:8px; padding:6px 10px; margin:0 0 8px;}
.wd-list{display:flex; flex-direction:column; gap:6px;}
.wd-chg{display:flex; gap:9px; align-items:flex-start; border:1px solid var(--hair); border-radius:8px; padding:7px 10px; background:var(--surface); cursor:pointer; font-size:12.5px;}
.wd-chg input{margin-top:3px; flex:none;}
.wd-chg .wd-k{flex:none; width:62px; font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft); padding-top:2px;}
.wd-chg .wd-t{min-width:0; flex:1; font-family:var(--mono); white-space:pre-wrap; word-break:break-word;}
.wd-chg .wd-b{color:var(--ink-soft); text-decoration:line-through; text-decoration-color:#d6454566;}
.wd-chg mark{background:rgba(54,153,212,.22); color:inherit; border-radius:3px; padding:0 1px;}
.wd-chg .wd-b mark{background:rgba(214,69,69,.18);}
.wd-more{font-size:12.5px; color:var(--ink-soft); padding:4px 2px;}
.wd-card{border:1px solid var(--hair); border-radius:10px; padding:12px 14px; background:var(--surface); margin-bottom:10px;}
.wd-card-h{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px;}
.wd-badge{font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); background:var(--chip-bg); border-radius:6px; padding:3px 7px;}
.wd-pick{display:flex; align-items:center; gap:8px; padding:4px 0; font-size:13.5px; cursor:pointer;}
.wd-pick .wd-n{margin-left:auto; font-size:12px; color:var(--ink-soft);}
.wd-pick .wd-name{font-family:var(--mono); font-weight:700;}
.wd-chip{font-size:11px; font-weight:700; border-radius:6px; padding:2px 7px;}
.wd-chip.mod{background:rgba(217,139,31,.16); color:#9a5b00;}
.wd-chip.gone{background:rgba(214,69,69,.14); color:#b02a2a;}
.wd-chip.same{background:var(--chip-bg); color:var(--ink-soft);}
.wd-prev{margin-top:8px; max-height:220px; overflow:auto; border:1px solid var(--hair); border-radius:8px; padding:8px 10px; background:var(--surface-soft); font-family:var(--mono); font-size:12px; line-height:1.5; white-space:pre-wrap;}
.wd-prev .wd-ln-new{background:rgba(47,158,68,.14);}
.wd-prev .wd-ln-old{background:rgba(214,69,69,.12);}
.wd-empty{padding:26px 8px; text-align:center; color:var(--ink-soft); font-size:13.5px;}
.wd-modal .modal-actions{margin-top:16px;}
.wd-modal select, .wd-modal input[type=text]{width:100%;}
@media (max-width:640px){ .wd-row2{grid-template-columns:1fr;} .wd-chg .wd-k{display:none;} }
/* Sides : réplique de l'acteur surlignée à l'impression */
#printArea .line.side-hl, #pdfStage .line.side-hl{background:#fff1a8 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
#printArea .line--character.side-hl, #pdfStage .line--character.side-hl{width:fit-content; max-width:100%;}
.wd-bar.wd-bar-info{border-left-color:var(--accent);}

  /* ===== Paramètres : même D.A. que le reste du site (v64) ===== */
  .center-pane > div > .sset-group > .panel-block{background:var(--surface); border:1px solid var(--hair); border-radius:12px; padding:18px 20px 6px; box-shadow:var(--shadow-sm); margin-bottom:18px;}
  .sset-nav{gap:4px; padding:4px; background:var(--surface-soft-2); border:1px solid var(--hair); border-radius:12px; margin:8px 0 14px;}
  .sset-nav .fmt-opt{border:0; border-radius:9px; padding:9px 10px; text-align:center; background:transparent; color:var(--ink-soft); transition:background .12s, color .12s, box-shadow .12s;}
  .sset-nav .fmt-opt .t{font-size:14px; font-weight:600;}
  .sset-nav .fmt-opt:hover{color:var(--ink);}
  .sset-nav .fmt-opt.active{background:var(--surface); color:var(--accent); box-shadow:var(--shadow-sm), 0 0 0 1px var(--hair);}
  .sset-lead{font-size:14px; line-height:1.5; margin:0 2px 14px; color:color-mix(in srgb, var(--ink) 80%, var(--surface));}
  .sset-group .panel-block h4{font-size:16px; color:var(--ink);}
  .sset-group .opt-help{font-size:13.5px; line-height:1.55; color:color-mix(in srgb, var(--ink) 78%, var(--surface));}
  .sset-group .opt-label{font-size:14px; color:var(--ink);}
  .sset-group .field label{font-size:13.5px; color:var(--ink);}
  .sset-group .field input[type=text], .sset-group .field input[type=date], .sset-group .field input[type=number], .sset-group .field select{
    border-color:color-mix(in srgb, var(--ink) 24%, var(--surface)); color:var(--ink);
  }
  .sset-group .fmt-choice:not(.sset-nav) .fmt-opt{border-color:color-mix(in srgb, var(--ink) 22%, var(--surface)); color:var(--ink);}
  .sset-group .fmt-choice:not(.sset-nav) .fmt-opt.active{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, var(--surface));}
  .sset-group .fmt-opt .d{color:color-mix(in srgb, var(--ink) 70%, var(--surface));}
  .sset-group .btn:not(.btn-primary), .sset-group .btn-ghost:not(.btn-danger){border-color:color-mix(in srgb, var(--ink) 28%, var(--surface)); color:var(--ink); background:var(--surface);}
  .sset-group .btn:not(.btn-primary):hover{background:var(--overlay-hover); border-color:var(--accent);}
  .sset-group .btn-danger{color:var(--danger); border-color:color-mix(in srgb, var(--danger) 55%, var(--surface));}
  .sset-group .btn-primary, .center-pane [data-act="saveSettings"]{background:var(--accent-2); border-color:var(--accent-2); color:#fff;}
  .sset-group .btn-primary:hover, .center-pane [data-act="saveSettings"]:hover{background:#185A84; border-color:#185A84;}
  .center-pane [data-act="saveSettings"]{padding:11px 22px; font-size:14.5px; font-weight:600; box-shadow:var(--shadow-sm);}
  .sset-group details summary{color:var(--accent); font-weight:600;}

  /* Paramètres › Sauvegarde : texte aéré, par petites touches lisibles (v65) */
  .sset-sub{font-size:14px; line-height:1.5; margin:-2px 0 12px; color:color-mix(in srgb, var(--ink) 82%, var(--surface));}
  .sset-label{font-size:13px; font-weight:600; color:var(--ink); margin:0 0 8px;}
  .sset-points{list-style:none; margin:0 0 16px; padding:0; display:grid; gap:8px;}
  .sset-points li{position:relative; padding-left:26px; font-size:13.5px; line-height:1.45; color:color-mix(in srgb, var(--ink) 78%, var(--surface));}
  .sset-points li::before{content:""; position:absolute; left:2px; top:1px; width:15px; height:15px; border-radius:50%; background:color-mix(in srgb, var(--accent) 16%, var(--surface));}
  .sset-points li::after{content:""; position:absolute; left:7.5px; top:4.5px; width:3.5px; height:6.5px; border:solid var(--accent); border-width:0 2px 2px 0; transform:rotate(45deg);}
  .sset-actions{display:flex; gap:8px; flex-wrap:wrap; margin:0 0 14px;}
  .sset-status{display:flex; align-items:flex-start; gap:9px; padding:10px 12px; margin:0 0 14px; background:var(--surface-soft); border:1px solid var(--hair); border-radius:9px; font-size:13px; line-height:1.45; color:var(--ink);}
  .sset-status .sset-dot{flex:none; width:8px; height:8px; margin-top:5px; border-radius:50%; background:color-mix(in srgb, var(--ink) 35%, var(--surface));}
  .sset-status.ok .sset-dot{background:var(--ok);}
  .sset-status.warn .sset-dot{background:#D98A00;}
  .sset-more{margin:0 0 14px;}
  .sset-more summary{cursor:pointer; font-size:13px; font-weight:600; color:var(--accent); margin-bottom:6px;}

  /* Paramètres › Mise en page : lignes à case + explication courte dessous (v66) */
  .sset-row{margin:0 0 12px;}
  .sset-row .opt-label{margin-bottom:0;}
  .sset-hint{font-size:13px; line-height:1.5; margin:3px 0 0 24px; color:color-mix(in srgb, var(--ink) 74%, var(--surface));}
  .sset-sep{border-top:1px solid var(--hair); margin:6px 0 14px;}

  /* Menu « Plus d'options » : rubriques (v67) */
  .tb-more-menu .tb-more-title{padding:10px 10px 4px; font-size:10.5px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-soft);}
  .tb-more-menu .tb-more-title:first-child{padding-top:4px;}

  /* Comment faire : onglets en barre, contenu en cartes (v68) */
  .help-modal{max-width:640px;}

  .help-tabs{gap:4px; padding:4px; background:var(--surface-soft-2); border:1px solid var(--hair); border-radius:12px; margin:0 0 16px; flex-wrap:nowrap; overflow-x:auto;}
  .help-tab{flex:1 1 auto; justify-content:center; border:0; background:transparent; border-radius:9px; padding:8px 10px; white-space:nowrap; font-size:13px; transition:background .12s, color .12s, box-shadow .12s;}
  .help-tab:hover{color:var(--ink);}
  .help-tab.active{background:var(--surface); color:var(--accent); box-shadow:var(--shadow-sm), 0 0 0 1px var(--hair);}
  .help-body{max-height:58vh;}
  .help-card{background:var(--surface); border:1px solid var(--hair); border-radius:12px; padding:14px 16px 6px; margin-bottom:12px; box-shadow:var(--shadow-sm);}

  .help-card-t{font-size:14.5px; font-weight:700; letter-spacing:-.01em; color:var(--ink); margin:0 0 10px;}
  .help-card .help-p{margin:0 0 12px;}
  .help-card .help-step-list{margin:0 0 12px;}
  .help-card .help-list{margin:0 0 12px;}
  .help-card .help-callout{margin:2px 0 12px;}
  .help-points{list-style:none; margin:0 0 12px; padding:0; display:grid; gap:8px;}
  .help-points li{position:relative; padding-left:26px; font-size:13.5px; line-height:1.5; color:var(--ink);}
  .help-points li::before{content:""; position:absolute; left:2px; top:2px; width:15px; height:15px; border-radius:50%; background:color-mix(in srgb, var(--accent) 16%, var(--surface));}
  .help-points li::after{content:""; position:absolute; left:7.5px; top:5.5px; width:3.5px; height:6.5px; border:solid var(--accent); border-width:0 2px 2px 0; transform:rotate(45deg);}
  /* Aide à l'écriture : cartes, même D.A. que Sauvegarde et Comment faire (v69) */

function tpFmFilter(){
  const pop = document.querySelector('.tp-fm-pop'); if(!pop) return;
  const q = (pop.querySelector('.tp-fm-search').value||'').trim().toLowerCase();
  const TOP = ['fav','page','recent'];
  let any = false; const seen = {};
  pop.querySelectorAll('.tp-fm-item:not(.follow)').forEach(it=>{
    const g = it.dataset.grp, top = TOP.includes(g), match = !q || (it.dataset.name||'').includes(q);
    let ok;
    if(tpFmCatSel==='fav') ok = g==='fav' && match;
    else if(tpFmCatSel!=='all') ok = g===tpFmCatSel && match;
    else ok = q ? (!top && match) : true;
    it.style.display = ok ? '' : 'none';
    it.classList.remove('kb');
    if(ok){ any = true; seen[g] = 1; }
  });
  pop.querySelectorAll('.tp-fm-grp').forEach(g=>{ g.style.display = seen[g.dataset.grp] ? '' : 'none'; });
  const fol = pop.querySelector('.tp-fm-item.follow'); if(fol) fol.style.display = (!q && tpFmCatSel==='all') ? '' : 'none';
  const emp = pop.querySelector('.tp-fm-empty');
  if(emp){
    emp.textContent = (tpFmCatSel==='fav' && !tpFavs.length && !q) ? L('Aucun favori. Clique sur ☆ à côté d\u2019une police pour la garder sous la main.','No favorites yet. Click ☆ next to a font to keep it handy.') : L('Aucune police trouvée.','No font found.');
    emp.style.display = any ? 'none' : '';
  }
}

  const prop = key==='page' ? '--tp-font' : '--tp-'+key+'-font';
  if(!fid){ if(key==='page') return; tp.style.removeProperty(prop); tpFmPrev = true; return; }

function tpFmMove(dir){
  const list = document.querySelector('.tp-fm-pop .tp-fm-list'); if(!list) return;
  const items = [...list.querySelectorAll('.tp-fm-item')].filter(n=>n.style.display!=='none');
  if(!items.length) return;
  let i = items.findIndex(n=>n.classList.contains('kb'));
  items.forEach(n=>n.classList.remove('kb'));
  i = i<0 ? (dir>0 ? 0 : items.length-1) : Math.max(0, Math.min(items.length-1, i+dir));
  const n = items[i]; n.classList.add('kb');
  if(n.offsetTop < list.scrollTop + 30) list.scrollTop = Math.max(0, n.offsetTop - 30);
  else if(n.offsetTop + n.offsetHeight > list.scrollTop + list.clientHeight) list.scrollTop = n.offsetTop + n.offsetHeight - list.clientHeight + 6;
  tpFmPreview(n);
}

function tpRenderToolbar(){
  const t = document.getElementById('tpToolbar'); if(!t) return;
  // Le menu de polices garde sa recherche, son défilement et sa sélection clavier d'un rendu à l'autre : il reste ouvert quand on choisit une police.
  const old = t.querySelector('.tp-fm-pop'); let keep = null;
  if(old){
    const s = old.querySelector('.tp-fm-search'), l = old.querySelector('.tp-fm-list'), kb = old.querySelector('.tp-fm-item.kb');
    let anchor = null;
    [...l.querySelectorAll('.tp-fm-item')].some(n=>{
      if(n.style.display==='none') return false;
      if(n.offsetTop + n.offsetHeight > l.scrollTop){ anchor = {g:n.dataset.grp, id:n.dataset.id, off:n.offsetTop - l.scrollTop}; return true; }
      return false;
    });
    keep = {q:s.value, top:l.scrollTop, anchor, focus:document.activeElement===s, a:s.selectionStart, b:s.selectionEnd, kb: kb ? [kb.dataset.grp, kb.dataset.id] : null};
  }
  t.innerHTML = tpToolbarHtml();
  const pills = document.getElementById('tpPills'); if(pills) pills.innerHTML = tpPillsHtml();
  const pop = t.querySelector('.tp-fm-pop');
  if(pop){
    // le menu s'ouvre SOUS la rangée « Modifier » : on peut changer d'élément sans le fermer
    const wrap = pop.parentNode, pl = document.getElementById('tpPills');
    if(wrap && pl){
      const gap = Math.max(8, Math.round(pl.getBoundingClientRect().bottom - wrap.getBoundingClientRect().top) + 8);
      pop.style.top = gap + 'px';
      // …et au-dessus de la colonne de droite, pour ne jamais cacher la page : l'aperçu en direct reste visible
      const col = document.getElementById('tpControlsCol');
      if(col){
        const cl = col.getBoundingClientRect().left, wl = wrap.getBoundingClientRect().left;
        if(cl > wl && cl + 360 <= window.innerWidth - 12) pop.style.left = Math.round(cl - wl) + 'px';
      }
      pop.style.maxHeight = Math.max(260, Math.min(480, window.innerHeight - pl.getBoundingClientRect().bottom - 24)) + 'px';
    }
    const s = pop.querySelector('.tp-fm-search'), list = pop.querySelector('.tp-fm-list');
    if(keep){
      s.value = keep.q; tpFmFilter();
      const same = (g,id)=>[...list.querySelectorAll('.tp-fm-item')].find(x=>x.dataset.grp===g && x.dataset.id===id);
      const an = keep.anchor && same(keep.anchor.g, keep.anchor.id);
      list.scrollTop = an ? Math.max(0, an.offsetTop - keep.anchor.off) : keep.top;
      if(keep.kb){ const n = same(keep.kb[0], keep.kb[1]); if(n && n.style.display!=='none') n.classList.add('kb'); }
      if(keep.focus){ try{ s.focus({preventScroll:true}); s.setSelectionRange(keep.a, keep.b); }catch(err){} }
    }else{
      tpFmFilter();
      const act = [...list.querySelectorAll('.tp-fm-item.active:not(.follow)')].find(n=>!['fav','page','recent'].includes(n.dataset.grp));
      if(act) list.scrollTop = Math.max(0, act.offsetTop - 90);
      try{ s.focus({preventScroll:true}); }catch(err){}
    }
  }else if(tpFmPrev){ tpFmRestore(); }
}

/* Ajuste la page d'aperçu à la hauteur de l'écran : on voit toute la page sans défiler. */
function tpFitPreview(){
  const shell = document.getElementById('tpPreviewShell'); if(!shell) return;
  const tp = shell.querySelector('.titlepage'); if(!tp) return;
  const pw = tp.offsetWidth, ph = tp.offsetHeight; if(!pw || !ph) return;
  const wide = window.innerWidth > 820;
  // la section occupe exactement la hauteur visible : rien ne défile, la barre et les boutons « Modifier » restent en place
  const root = document.getElementById('tpRoot'), pane = document.getElementById('centerPane');
  if(root && pane) root.style.height = wide ? pane.clientHeight+'px' : '';
  const dw = shell.closest('.tp-design-wrap'), cap = document.querySelector('.tp-preview-caption'), mat = shell.parentNode;
  let availH;
  if(wide && dw){
    const cs = getComputedStyle(dw);
    const inner = dw.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    availH = inner - (mat.offsetHeight - shell.offsetHeight) - (cap ? cap.offsetHeight : 0) - 14;
  }else availH = window.innerHeight * 0.75;
  availH = Math.max(260, availH);
  const availW = Math.max(220, Math.min(window.innerWidth - 90, 640));
  const s = Math.max(0.25, Math.min(availH/ph, availW/pw, 0.9));
  shell.style.width = Math.round(pw*s)+'px'; shell.style.height = Math.round(ph*s)+'px';
  tp.style.transform = 'scale('+s.toFixed(4)+')';
  tp.style.setProperty('--tp-hs', (1/s).toFixed(4));
  if(cap) cap.style.width = (shell.parentNode.offsetWidth)+'px';
}

function tpDragSelKey(shell){
  const sel = window.getSelection ? window.getSelection() : null;
  if(!sel || sel.isCollapsed || !sel.anchorNode || !shell || !shell.contains(sel.anchorNode)) return null;
  const el = sel.anchorNode.nodeType===1 ? sel.anchorNode : sel.anchorNode.parentElement;
  const n = el && el.closest ? el.closest('[data-tpk]') : null;
  return n ? n.dataset.tpk : null;
}
function tpBindPreview(shell){
  if(shell._tpBound) return; shell._tpBound = true;
  const keyOf = t => { const n = t && t.closest ? t.closest('[data-tpk]') : null; return n ? n.dataset.tpk : null; };
  // un bloc de texte occupe toute la largeur de la page : on ne le sélectionne que si le clic tombe vraiment sur son texte
  const hitKey = e=>{
    const n = e.target && e.target.closest ? e.target.closest('[data-tpk]') : null; if(!n) return null;
    let rects = [];
    try{ const r = document.createRange(); r.selectNodeContents(n); rects = [...r.getClientRects()].filter(q=>q.width>0 && q.height>0); }catch(err){}
    if(!rects.length) rects = [n.getBoundingClientRect()];
    const tol = 8;
    return rects.some(q=> e.clientX>=q.left-tol && e.clientX<=q.right+tol && e.clientY>=q.top-tol && e.clientY<=q.bottom+tol) ? n.dataset.tpk : null;
  };
  shell.addEventListener('mousedown', e=>{
    if(S.tpDrawMode || e.button!==0) return;
    if(hitKey(e)) return;
    const n = e.target.closest ? e.target.closest('[data-tpk]') : null;
    if(n){ e.preventDefault(); const a = document.activeElement; if(a && a!==document.body && shell.contains(a) && a.blur) a.blur(); }   // clic à côté du texte : pas de curseur dans le bloc
  });
  shell.addEventListener('click', e=>{
    if(S.tpDrawMode) return;
    const ds = tpDragSelKey(shell); if(ds){ tpSelect(ds); return; }   // fin d'un glisser-sélectionner : on garde le bloc et son texte sélectionné
    const k = hitKey(e) || 'page';
    const a = document.activeElement;
    if(a && a!==document.body && shell.contains(a) && keyOf(a)!==k && a.blur) a.blur();   // le curseur ne reste pas dans l'ancien bloc
    tpSelect(k);
  });
  shell.addEventListener('focusin', e=>{ const k = keyOf(e.target); if(k) tpSelect(k); });
  shell.addEventListener('keydown', e=>{
    const k = keyOf(e.target); if(!k) return;
    if(e.key==='Enter' && (k==='title' || k==='author')){ e.preventDefault(); e.target.blur(); return; }
    if((e.metaKey || e.ctrlKey) && !e.altKey && !e.shiftKey && 'biu'.includes(e.key.toLowerCase()) && e.key.length===1){
      e.preventDefault(); tpSel = k; tpTbFmt(e.key.toLowerCase());
    }
  });
  shell.addEventListener('paste', e=>{
    const k = keyOf(e.target); if(!k || !e.target.isContentEditable) return;
    e.preventDefault();
    let t = (e.clipboardData || window.clipboardData).getData('text') || '';
    if(k!=='extra') t = t.replace(/\s*\n\s*/g,' ');
    document.execCommand('insertText', false, t);
  });
  shell.addEventListener('input', e=>{
    const k = keyOf(e.target); const p = S.project; if(!k) return;
    if(k==='title'){
      p.title = e.target.textContent; tpSyncField('tpProjectTitle', p.title);
      const rail = document.querySelector('.rail-project'); if(rail) rail.textContent = p.title;
      scheduleAutosave();
    }else if(k==='author'){
      p.author = e.target.textContent; tpSyncField('tpAuthorText', p.author);
      const box = e.target.closest('.tp-author'); if(box) box.classList.toggle('tp-ph-grp', !p.author.trim());
      scheduleAutosave();
    }else if(k==='extra'){
      p.titlePageExtra = String(e.target.innerText||'').split('\n').map(s=>s.replace(/\s+$/,'')).join('\n').replace(/\n{3,}/g,'\n\n').replace(/^\n+|\n+$/g,'');
      tpSyncField('tpExtraText', p.titlePageExtra); scheduleAutosave();
    }
  });
  shell.addEventListener('focusout', e=>{
    const k = keyOf(e.target); const p = S.project; if(!k) return;
    if(k==='title' && !String(p.title||'').trim()){
      p.title = L('Sans titre','Untitled'); e.target.textContent = p.title; tpSyncField('tpProjectTitle', p.title);
      const rail = document.querySelector('.rail-project'); if(rail) rail.textContent = p.title;
      scheduleAutosave();
    }
    if(k==='author'){ p.author = String(p.author||'').trim(); if(p.author) setDefaultAuthor(p.author); }
    if(k==='extra') e.target.innerHTML = tpExtraLinesHtml(p.titlePageExtra);
  });
}

   Les polices d'origine non soulignées et tout le corps du scénario gardent exactement le chemin d'avant. */

function tpRasterBlock(doc, b){
  const K = 4;                                   // pixels par point
  const wPx = Math.max(1, Math.ceil(b.widthPt * K));
  const pad = Math.ceil(b.fontPt * K * 0.5);     // marge de sécurité : une lettre à empattement large ne doit jamais être rognée
  const font = (b.italic?'italic ':'') + (b.bold?'700':'400') + ' ' + (b.fontPt*K) + 'px ' + b.fam;
  const probe = document.createElement('canvas').getContext('2d');
  probe.font = font;
  const wrapAt = limit => {
    const out = [];
    String(b.text).split('\n').forEach(para=>{
      let cur = '';
      para.split(' ').forEach(w=>{
        const t = cur ? cur+' '+w : w;
        if(!cur || probe.measureText(t).width <= limit) cur = t; else { out.push(cur); cur = w; }
      });
      out.push(cur);
    });
    return out;
  };
  // Même garde-fou que pour le texte normal : plus de lignes que le navigateur n'en a utilisé = écart d'arrondi, pas un vrai retour à la ligne.
  let lines = wrapAt(wPx + 2);
  for(let t = 1; b.maxLines && lines.length > b.maxLines && t <= 6; t++) lines = wrapAt(wPx * (1 + 0.03*t) + 2);
  const top = b.fontPt * 1.25;
  const cv = document.createElement('canvas');
  cv.width = wPx + 2*pad; cv.height = Math.ceil((top + (lines.length-1)*b.lineHeightPt + b.fontPt*0.6) * K);
  const ctx = cv.getContext('2d');
  ctx.font = font; ctx.textBaseline = 'alphabetic';
  ctx.textAlign = b.align==='center' ? 'center' : b.align==='right' ? 'right' : 'left';
  const a = (b.opacity===undefined?1:b.opacity) * (b.color.a===undefined?1:b.color.a);
  const rgba = 'rgba('+b.color.r+','+b.color.g+','+b.color.b+','+a+')';
  ctx.fillStyle = rgba; ctx.strokeStyle = rgba; ctx.lineWidth = Math.max(1, b.fontPt * K * 0.055);
  const x = pad + (b.align==='center' ? wPx/2 : b.align==='right' ? wPx : 0);
  lines.forEach((ln,i)=>{
    const y = (top + i*b.lineHeightPt) * K;
    ctx.fillText(ln, x, y);
    if(b.under){
      const w = ctx.measureText(ln).width;
      const x0 = b.align==='center' ? x - w/2 : b.align==='right' ? x - w : x;
      ctx.beginPath(); ctx.moveTo(x0, y + b.fontPt*K*0.13); ctx.lineTo(x0 + w, y + b.fontPt*K*0.13); ctx.stroke();
    }
  });
  doc.addImage(cv.toDataURL('image/png'), 'PNG', b.xPt - pad / K, b.yPt - top, cv.width / K, cv.height / K, undefined, 'FAST');
}

  const h = (hex||'#000000').replace('#','');
  const r = parseInt(h.substring(0,2),16)||0, g = parseInt(h.substring(2,4),16)||0, b = parseInt(h.substring(4,6),16)||0;
  return `rgba(${r},${g},${b},${alpha})`;
}

    case 'lines': return { image:`repeating-linear-gradient(0deg, ${c} 0, ${c} 1px, transparent 1px, transparent 11px)`, size:'auto' };

/* =====================================================================
   STORAGE HELPERS
   ---------------------------------------------------------------------
   Les scénarios vivent dans IndexedDB plutôt que dans localStorage : le
   quota y est bien plus large (des centaines de Mo, au lieu des 5-10 Mo
   de localStorage), ce qui évite qu'une page de titre illustrée ou un
   historique de versions fasse échouer l'enregistrement en silence une
   fois le quota atteint. localStorage ne garde plus que de petits
   réglages (thème, horodatage de dernière sauvegarde…) et sert de filet
   de secours si IndexedDB est indisponible : dans ce cas l'app continue
   de fonctionner exactement comme avant, sans rien casser.
===================================================================== */
const IDB_NAME = 'scriptmm_db';
const IDB_STORE = 'kv';
let __idbOpenPromise = null;
function openIDB(){
  if(__idbOpenPromise) return __idbOpenPromise;
  __idbOpenPromise = new Promise(resolve=>{
    if(!('indexedDB' in window)){ resolve(null); return; }
    let req;
    try{ req = indexedDB.open(IDB_NAME, 1); }catch(e){ resolve(null); return; }
    req.onupgradeneeded = ()=>{ try{ req.result.createObjectStore(IDB_STORE); }catch(e){} };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> resolve(null);
    req.onblocked = ()=> resolve(null);
  });
  return __idbOpenPromise;
}
function idbGet(key){
  return openIDB().then(db=>{
    if(!db) return Promise.reject(new Error('idb-unavailable'));
    return new Promise((resolve,reject)=>{
      try{
        const rq = db.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).get(key);
        rq.onsuccess = ()=> resolve(rq.result===undefined ? null : rq.result);
        rq.onerror = ()=> reject(rq.error);
      }catch(e){ reject(e); }
    });
  });
}
function idbSet(key, val){
  return openIDB().then(db=>{
    if(!db) return Promise.reject(new Error('idb-unavailable'));
    return new Promise((resolve,reject)=>{
      try{
        const tx = db.transaction(IDB_STORE,'readwrite');
        tx.objectStore(IDB_STORE).put(val, key);
        tx.oncomplete = ()=> resolve(true);
        tx.onerror = ()=> reject(tx.error);
        tx.onabort = ()=> reject(tx.error);
      }catch(e){ reject(e); }
    });
  });
}
function idbDelete(key){
  return openIDB().then(db=>{
    if(!db) return Promise.reject(new Error('idb-unavailable'));
    return new Promise((resolve,reject)=>{
      try{
        const tx = db.transaction(IDB_STORE,'readwrite');
        tx.objectStore(IDB_STORE).delete(key);
        tx.oncomplete = ()=> resolve(true);
        tx.onerror = ()=> reject(tx.error);
      }catch(e){ reject(e); }
    });
  });
}
/* DOUBLE ÉCRITURE : IndexedDB **et** localStorage.
   IndexedDB reste la référence (quota large, pas de limite pratique),
   mais chaque enregistrement est aussi recopié dans localStorage quand
   il y tient. Les deux stockages ne tombent pas toujours ensemble : un
   nettoyage, un profil corrompu ou un navigateur qui bloque l'un peut
   laisser l'autre intact — et la relecture ci-dessous récupère alors
   automatiquement la copie survivante. Si la copie localStorage ne
   passe pas (quota atteint, page de titre illustrée…), on ne bloque
   rien : on efface simplement la copie devenue périmée pour ne jamais
   ressusciter une vieille version, et IndexedDB continue seul. */
async function storGet(key){
  let v = null;
  try{ v = await idbGet(key); }catch(e){ v = null; }
  if(v != null) return v;
  try{ const raw = localStorage.getItem(key); return raw != null ? JSON.parse(raw) : null; }
  catch(e2){ return null; }
}
async function storSet(key, val){
  let ok = false;
  try{ await idbSet(key, val); ok = true; }catch(e){}
  try{ localStorage.setItem(key, JSON.stringify(val)); ok = true; }
  catch(e2){ try{ localStorage.removeItem(key); }catch(e3){} }
  return ok;
}
async function storDelete(key){
  try{ await idbDelete(key); }catch(e){}
  try{ localStorage.removeItem(key); }catch(e2){}
}
/* Migration ponctuelle et sûre : copie l'index et chaque projet déjà
   présents dans localStorage vers IndexedDB, et ne nettoie localStorage
   qu'une fois la copie confirmée — impossible de perdre un scénario au
   passage. Si IndexedDB n'est pas disponible, rien n'est supprimé et
   l'app continue de tourner sur localStorage comme avant cette mise à
   jour ; la tentative sera simplement refaite au prochain lancement. */
async function migrateLocalStorageToIDB(){
  try{
    const rawIdx = localStorage.getItem(IDX_KEY);
    if(rawIdx==null) return;
    const idx = JSON.parse(rawIdx);
    if(!Array.isArray(idx)) return;
    // RÉCUPÉRATION, plus migration : localStorage est désormais une copie
    // permanente et volontaire. On ne recopie donc vers IndexedDB que ce
    // qui y MANQUE, et on n'efface plus jamais la copie localStorage — sans
    // quoi un simple lancement écraserait du récent par du plus ancien.
    let cur = null;
    try{ cur = await idbGet(IDX_KEY); }catch(e){ cur = null; }
    if(cur == null) await idbSet(IDX_KEY, idx);
    for(const entry of idx){
      let has = null;
      try{ has = await idbGet(proj_key(entry.id)); }catch(e){ has = null; }
      if(has != null) continue;
      const raw = localStorage.getItem(proj_key(entry.id));
      if(raw!=null) await idbSet(proj_key(entry.id), JSON.parse(raw));
    }
  }catch(e){ /* IndexedDB indisponible ou erreur en cours de route : on ne touche à rien. */ }
}
/* Demande au navigateur de classer Raging Page en stockage "persistant" :
   Chrome et Firefox honorent cette demande et excluent alors le site de

   silencieux qui peut sinon vider les données d'un site peu visité).
   Best-effort : ignorée sans erreur si l'API n'existe pas ou refuse. */
function requestPersistentStorage(){
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }
  catch(e){}
}
