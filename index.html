/* Géométrie d'une page, mesurée sur le conteneur lui-même : on déduit
   l'échelle px/cm de sa largeur réelle, ce qui reste juste quelle que soit
   la résolution, le zoom navigateur ou le format choisi. */
function pageGeometry(container, format){
  const cs = getComputedStyle(container);
  const inner = container.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const total = inner + parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
  const ratio = format === 'us' ? (11 / 8.5) : (29.7 / 21);
  const pageH = total * ratio;
  const mTop = parseFloat(cs.paddingTop) || 0;
  const mBottom = parseFloat(cs.paddingBottom) || 0;
  return { pageH, mTop, mBottom, contentH: Math.max(60, pageH - mTop - mBottom) };
}

/* Calcule les sauts de page d'un conteneur de lignes.
   Si `apply` est vrai, la marge haute des blocs rejetés est écrite dans le
   DOM (mode éditeur). Sinon on se contente de renvoyer la répartition
   (mode export/statistiques).
   Renvoie { pageCount, pages:[[element,…],…], pageOf:{idElement:numéro} }. */
/* Associe un bloc mesuré à sa page. Un bloc de dialogue simultané n'a pas
   d'identifiant propre (c'est un conteneur) : ce sont les deux répliques
   qu'il contient qui doivent recevoir le numéro de page, sinon elles
   disparaîtraient de l'indicateur de page, du navigateur de scènes et des
   rapports. */
function mapPageIds(div, pageOf, pageNo){
  if(div.dataset && div.dataset.id) pageOf[div.dataset.id] = pageNo;
  if(div.classList && div.classList.contains('dual-wrap')){
    div.querySelectorAll('[data-id]').forEach(n=>{ pageOf[n.dataset.id] = pageNo; });
  }
}
/* ---- Verrouillage des pages (12A, 12B) ----
   p.pageLock = { pages:[{label, first}] } : à chaque page figée on garde son
   numéro et l'id du premier bloc qui COMMENCE sur elle (l'ancre). La
   pagination force un saut de page devant chaque ancre : une page révisée
   ne déborde plus sur la suivante, elle s'allonge en 12A, 12B. */
function pageLockSet(proj){
  proj = proj || S.project;
  const pl = proj && proj.pageLock;
  if(!pl || !Array.isArray(pl.pages) || !pl.pages.length) return null;
  const s = new Set(); pl.pages.forEach(x=>{ if(x.first) s.add(x.first); });
  return s.size ? s : null;
}
function plKey(d){
  if(!d) return '';
  if(d.dataset && d.dataset.id) return d.dataset.id;
  const n = d.querySelector && d.querySelector('[data-id]');
  return n ? n.dataset.id : '';
}
function plNextLabel(prev){
  const m = /^(\d+)([A-Z]*)$/.exec(String(prev));
  if(!m) return prev + 'A';
  const a = m[2].split('');
  if(!a.length) return m[1] + 'A';
  let i = a.length - 1;
  while(i >= 0){ if(a[i] === 'Z'){ a[i] = 'A'; i--; } else { a[i] = String.fromCharCode(a[i].charCodeAt(0) + 1); break; } }
  if(i < 0) a.unshift('A');
  return m[1] + a.join('');
}
/* Pour une page : id de son premier bloc (ancre) ou, si elle ne fait que
   prolonger un bloc coupé de la page précédente, id de ce bloc (suite). */
function plInfo(pages, k){
  const pg = pages[k] || [], key = plKey(pg[0]);
  if(k === 0) return { key, ckey:'' };
  const prev = new Set(pages[k-1].map(plKey).filter(Boolean));
  const c = pg.map(plKey).find(x=> x && prev.has(x));
  if(c && (!key || key === c)) return { key:'', ckey:c };
  return { key, ckey:'' };
}
/* Numéro affiché de chaque page + pages figées qui n'existent plus (omises). */
function computePageLabels(pages, proj){
  proj = proj || S.project;
  const start = (ensureSettings(proj).pageNumberStart) || 1, pl = proj.pageLock;
  if(!pl || !Array.isArray(pl.pages) || !pl.pages.length)
    return { labels: pages.map((_, k)=> String(start + k)), omitted: [] };
  const idx = {}, cidx = {};
  pl.pages.forEach((x, i)=>{
    if(x.first) idx[x.first] = i;
    else if(x.cont){ (cidx[x.cont] = cidx[x.cont] || []).push(i); }
  });
  const used = new Set(), labels = []; let prev = null;
  pages.forEach((pg, k)=>{
    const inf = plInfo(pages, k);
    let lab = null;
    if(inf.key && idx[inf.key] !== undefined && !used.has(idx[inf.key])){ lab = pl.pages[idx[inf.key]].label; used.add(idx[inf.key]); }
    else if(inf.ckey && cidx[inf.ckey]){
      const q = cidx[inf.ckey].find(i=>!used.has(i));
      if(q !== undefined){ lab = pl.pages[q].label; used.add(q); }
    }
    if(lab === null && k === 0){ lab = pl.pages[0].label; used.add(0); }
    if(lab === null) lab = plNextLabel(prev);
    labels.push(lab); prev = lab;
  });
  return { labels, omitted: pl.pages.filter((x, i)=>!used.has(i)).map(x=>x.label) };
}
function pageLbl(n){ const l = S.pagination && S.pagination.labels; return (l && l[n-1]) || String(n); }
function plLock(p){
  const res = measureExportPages(p), labels = computePageLabels(res.pages, p).labels, pages = [];
  res.pages.forEach((pg, k)=>{
    if(!pg.length) return;
    const inf = plInfo(res.pages, k);
    pages.push({ label: labels[k], first: inf.key || '', cont: inf.ckey || '' });
  });
  p.pageLock = { pages, date: Date.now(), std: true };
}
/* ---------------------------------------------------------------------
   v44 — PAGINATION ALIGNÉE SUR PageRenderer.js
   Mêmes règles, dans le même ordre de décision :
   · un bloc « Personnage » = nom + didascalies + répliques, posé d'un seul tenant ;
   · s'il ne tient pas : coupe la plus basse possible, ENTRE deux répliques (la réplique du
     haut doit faire ≥ 2 lignes) ou DANS une réplique (≥ 2 lignes de chaque côté), avec
     (MORE) en bas et NOM (CONT'D) en haut de la page suivante ;
   · sinon le bloc entier passe à la page suivante, sans (CONT'D) ;
   · une entête de scène ne reste en bas de page que si ≥ 2 lignes du bloc suivant tiennent
     dessous (1 ligne si c'est une autre entête ou une transition), sinon saut AVANT l'entête ;
     une entête restée seule après un report est emmenée avec le bloc ;
   · action / transition / texte : posés entiers, sinon coupés (≥ 2 lignes de chaque côté),
     sinon reportés ; coupe au mot qui tient (jamais « à la fin de phrase ») ;
   · tolérance de 1 px sous la hauteur utile (PAGE_EPS), aucune ligne dans la marge basse.
--------------------------------------------------------------------- */
const PAGE_EPS = 1;
const SPLIT_C = new Set(['action','text','dialogue','parenthetical','transition','shot']);
function computePagination(container, format, apply, proj){
  const allLines = Array.from(container.children).filter(n => n.classList && n.classList.contains('line'));
  const lines = allLines.filter(n => n.dataset.type !== 'note');   // v49 : les notes sont hors flux (voir .line--note)
  if(apply) allLines.forEach(d => { d.style.marginTop = ''; d.classList.remove('is-pagetop'); if(d.classList.contains('is-split')){ d.classList.remove('is-split', 'is-split-mid'); d.style.removeProperty('--sp-top'); d.style.removeProperty('--sp-h'); d.style.removeProperty('--sp-x'); d.style.removeProperty('--sp-y1'); } });
  if(!lines.length) return { pageCount:1, pages:[[]], pageOf:{}, spill:{}, geo:pageGeometry(container, format) };

  const geo = pageGeometry(container, format);
  const contentH = geo.contentH;
  // Carton « page entière » : sa boîte fait exactement la hauteur utile d'une feuille.
  lines.forEach(d => { if(d.classList.contains('line--card')) d.style.minHeight = (d.dataset.full === '1') ? Math.floor(contentH - 2) + 'px' : ''; });
  const dead = geo.mBottom + PAGE_GAP + geo.mTop;   // espace mort entre deux zones de texte
  const step = contentH + dead;

  // Une seule passe de lecture : position et hauteur réelles de chaque ligne (marges fusionnées comprises).
  // v45 : mesures FRACTIONNAIRES (getBoundingClientRect) au lieu des entiers d'offsetTop/offsetHeight.
  // Un carton (22 pt x 1,35 = 39,6 px) arrondi à 40 px décalait chaque carton de 0,4 px : après quelques
  // cartons, le haut des pages dérivait et la pagination « cassait ».
  const r0 = lines[0].getBoundingClientRect();
  const cssW = parseFloat(getComputedStyle(container).width);   // largeur CSS exacte (offsetWidth est arrondi)
  const sc0 = (cssW > 0) ? (container.getBoundingClientRect().width / cssW) : 1;
  const scl = (isFinite(sc0) && sc0 > 0 && Math.abs(sc0 - 1) > 0.002) ? sc0 : 1;
  const base0 = (r0.top - container.getBoundingClientRect().top) / scl;   // v49 : fractionnaire aussi (offsetTop est arrondi : 0,5 px d'erreur sur toute la page)
  const m = lines.map(d => {
    const r = d.getBoundingClientRect();
    if(!(r.height > 0)) return { d, top:d.offsetTop, h:d.offsetHeight };
    return { d, top: base0 + (r.top - r0.top) / scl, h: r.height / scl };
  });
  const lh = parseFloat(getComputedStyle(lines[0]).lineHeight);
  const oneLine = (isFinite(lh) && lh > 0) ? lh : 20;
  const stg = S.project && S.project.settings; const marksOn = !!(stg && stg.autoContd);
  const lockSet = pageLockSet(proj);
  const MORE_H = marksOn ? oneLine : 0;

  const typ = i => m[i].d.dataset.type;
  const gapOf = i => i === 0 ? 0 : Math.max(0, m[i].top - (m[i-1].top + m[i-1].h));
  const hOv = {};                                   // hauteur du RESTE d'une ligne coupée
  const hOf = i => hOv[i] !== undefined ? hOv[i] : m[i].h;
  const isLock = i => !!(lockSet && lockSet.has(plKey(m[i].d)));

  // ---- Blocs logiques (comme _buildBlockQueue) ----
  const dq = [];
  for(let i = 0; i < m.length;){
    if(typ(i) === 'character'){
      const ls = [i]; i++;
      while(i < m.length && (typ(i) === 'parenthetical' || typ(i) === 'dialogue') && !isLock(i)){ ls.push(i); i++; }
      dq.push({ type:'character', lines:ls, cue:false });
    } else { dq.push({ type:typ(i), lines:[i] }); i++; }
  }

  // ---- État ----
  const pages = [[]], pgIdx = [[]], filled = [false];
  const pageOf = {}, spill = {}, splits = [], breaks = [];
  const topOf = [], domBottom = [], firstOfPage = [];
  let pageIdx = 0, y = 0;
  const pageTop = () => pageIdx * step;
  const limit = () => pageIdx * step + contentH + PAGE_EPS;
  const ensure = k => { if(!pages[k]){ pages[k] = []; pgIdx[k] = []; filled[k] = false; } };
  const newPage = () => { pageIdx++; ensure(pageIdx); y = pageIdx * step; };
  const firstTop = (i, pad) => filled[pageIdx] ? y + gapOf(i) : pageTop() + pad;
  const extent = (ls, first) => {
    const tops = []; let pb = 0;
    ls.forEach((i, q) => { const t = q === 0 ? first : pb + gapOf(i); tops.push(t); pb = t + hOf(i); });
    return { tops, bottom: pb };
  };
  const commit = (ls, tops, contLine) => {
    const atTop = !filled[pageIdx];
    ls.forEach((i, q) => {
      if(i !== contLine){ topOf[i] = tops[q]; firstOfPage[i] = (q === 0 && atTop); }
      domBottom[i] = tops[q] + hOf(i);
      pages[pageIdx].push(m[i].d); pgIdx[pageIdx].push(i);
    });
    filled[pageIdx] = true; y = domBottom[ls[ls.length - 1]];
  };
  // Changement de page parce que le bloc courant est reporté en entier (_breakPage) :
  // une entête de scène restée seule en bas de page est emmenée avec lui.
  const breakPage = (why, type, need) => {
    const pg = pgIdx[pageIdx];
    const carry = (pg.length > 1 && typ(pg[pg.length - 1]) === 'scene') ? pg[pg.length - 1] : -1;
    breaks.push({ to: pageIdx + 2, why, free: Math.max(0, limit() - y), need: need || 0, type });
    if(carry >= 0){ pg.pop(); pages[pageIdx].pop(); }
    newPage();
    if(carry >= 0) commit([carry], [pageTop()]);
  };
  // Bloc plus haut qu'une page, impossible à couper : il déborde sur les feuilles suivantes.
  const spillLoop = () => {
    let g = 0;
    while(y > pageIdx * step + contentH + PAGE_EPS && g++ < 500){ pageIdx++; ensure(pageIdx); filled[pageIdx] = true; spill[pageIdx] = true; }
  };
  const lineMetrics = i => {
    const cs = getComputedStyle(m[i].d);
    const lh1 = parseFloat(cs.lineHeight) || oneLine;
    const pT = parseFloat(cs.paddingTop) || 0, pB = parseFloat(cs.paddingBottom) || 0;
    return { lh1, pT, pB, n: Math.round((m[i].h - pT - pB) / lh1) };
  };
  const cueFor = cd => {
    if(!marksOn || !cd) return '';
    const who = (cd.textContent || '').trim();
    return who ? (hasContdMark(who) ? who : who + ' ' + contdMarkWord()) : '';
  };
  // Coupe DANS la ligne i (posée en `top`) : k lignes restent ici, le reste passe en haut de la page suivante.
  const cutInside = (i, top, k, mt, isDlg, cueText, left) => {
    const cueH = cueText ? oneLine : 0;
    const newTop0 = (pageIdx + 1) * step;
    const spH = newTop0 - (top + mt.pT + k * mt.lh1) + cueH;
    splits.push({ kind:'inside', div:m[i].d, k, top, pT:mt.pT, lh:mt.lh1, spH, newTop:newTop0, startPage:pageIdx,
                  more: isDlg && marksOn, cue:cueText, left, extra:0, cutIdx:null, moreY: top + mt.pT + k * mt.lh1 });
    if(apply){
      m[i].d.classList.add('is-split');
      m[i].d.style.setProperty('--sp-top', (k * mt.lh1 + 0.5) + 'px');
      m[i].d.style.setProperty('--sp-h', (spH - 0.5) + 'px');
    }
    hOv[i] = m[i].h - mt.pT - k * mt.lh1;           // hauteur du reste, sur la page suivante
  };
  // _splitDialogue : la coupe la plus basse possible (entre deux répliques, puis dans la réplique).
  const splitDlg = (b, first) => {
    const ls = b.lines, ex = extent(ls, first), minJ = b.cue ? 0 : 1;
    for(let j = ls.length - 1; j >= minJ; j--){
      const i = ls[j]; if(typ(i) !== 'dialogue') continue;
      if(j < ls.length - 1 && ex.tops[j] + hOf(i) + MORE_H <= limit() && hOf(i) >= 2 * oneLine - 1) return { kind:'between', j, ex };
      if(hOv[i] !== undefined) continue;             // déjà coupée : pas de double coupe
      const mt = lineMetrics(i);
      const k = Math.min(Math.floor((limit() - ex.tops[j] - mt.pT - MORE_H) / mt.lh1 + 1e-6), mt.n - 2);
      if(k >= 2) return { kind:'inside', j, k, mt, ex };
    }
    return null;
  };

  // ---- Boucle principale (comme _layout) ----
  while(dq.length){
    const b = dq.shift(), i0 = b.lines[0];
    if(lockSet && !b.cue && !b.contLine && filled[pageIdx] && isLock(i0)){      // page figée : saut forcé devant l'ancre
      breaks.push({ to: pageIdx + 2, why:'lock', free: Math.max(0, limit() - y), need:0, type: typ(i0) });
      newPage();
    }

    // Cas A : entête de scène + sonde du bloc suivant
    if(b.type === 'scene'){
      const nb = dq[0];
      const nbBig = !!(nb && nb.type === 'card' && m[i0].h + gapOf(nb.lines[0]) + m[nb.lines[0]].h > contentH);   // carton page entière : il ne peut pas suivre l'entête
      const need = m[i0].h + ((nb && !nbBig) ? gapOf(nb.lines[0]) + ((nb.type === 'scene' || nb.type === 'transition' || nb.type === 'card') ? 1 : 2) * oneLine : 0);
      let first = firstTop(i0, 0);
      if(first + need > limit() && filled[pageIdx]){ breakPage('keep', 'scene', need); first = firstTop(i0, 0); }
      commit([i0], [first]);
      continue;
    }

    // Cas B : bloc Personnage (nom + didascalies + répliques)
    if(b.type === 'character'){
      const pad = (b.cue && b.cueText) ? oneLine : 0;
      let first = firstTop(i0, pad), ex = extent(b.lines, first);
      if(ex.bottom <= limit()){ commit(b.lines, ex.tops, b.contLine); continue; }
      let sp = splitDlg(b, first);
      if(!sp && filled[pageIdx]){
        breakPage('fit', 'character', ex.bottom - first);
        first = firstTop(i0, pad); ex = extent(b.lines, first);
        if(ex.bottom <= limit()){ commit(b.lines, ex.tops, b.contLine); continue; }
        sp = splitDlg(b, first);
      }
      if(!sp){ commit(b.lines, ex.tops, b.contLine); spillLoop(); continue; }       // cas dégénéré : bloc insécable
      const ls = b.lines, j = sp.j, cueDiv = b.cueDiv || m[i0].d;
      const cueText = b.cue ? b.cueText : cueFor(cueDiv);
      const left = cueDiv.offsetLeft;
      if(sp.kind === 'between'){
        commit(ls.slice(0, j + 1), sp.ex.tops.slice(0, j + 1), b.contLine);
        const ia = ls[j], bot = sp.ex.tops[j] + hOf(ia);
        splits.push({ kind:'between', div:m[ia].d, startPage:pageIdx, more:marksOn, cue:cueText, left, newTop:(pageIdx + 1) * step, moreY:bot });
        newPage();
        dq.unshift({ type:'character', lines: ls.slice(j + 1), cue:true, cueText, cueDiv });
      } else {
        const i = ls[j];
        commit(ls.slice(0, j + 1), sp.ex.tops.slice(0, j + 1), b.contLine);
        cutInside(i, sp.ex.tops[j], sp.k, sp.mt, true, cueText, left);
        newPage();
        dq.unshift({ type:'character', lines: ls.slice(j), cue:true, cueText, cueDiv, contLine:i });
      }
      continue;
    }

    // Cas C : action, transition, texte, carton, dialogue simultané… (un seul nœud)
    const t = typ(i0);
    let first = firstTop(i0, 0);
    if(first + hOf(i0) <= limit()){ commit([i0], [first], b.contLine); continue; }
    const canSplit = SPLIT_C.has(t) && hOf(i0) <= contentH && hOv[i0] === undefined;
    const trySplit = f => { if(!canSplit) return null; const mt = lineMetrics(i0); const k = Math.min(Math.floor((limit() - f - mt.pT) / mt.lh1 + 1e-6), mt.n - 2); return k >= 2 ? { k, mt } : null; };
    let sp = trySplit(first);
    if(!sp && filled[pageIdx]){
      breakPage('fit', t, hOf(i0));
      first = firstTop(i0, 0);
      if(first + hOf(i0) <= limit()){ commit([i0], [first], b.contLine); continue; }
      sp = trySplit(first);
    }
    if(!sp){ commit([i0], [first], b.contLine); spillLoop(); continue; }
    commit([i0], [first], b.contLine);
    cutInside(i0, first, sp.k, sp.mt, false, '', m[i0].d.offsetLeft);
    newPage();
    dq.unshift({ type:b.type, lines:[i0], contLine:i0 });
  }
  for(let k = 0; k < pages.length; k++) if(!pages[k]) pages[k] = [];

  // Marges : seule la 1re ligne de chaque feuille est repoussée (les autres gardent leur marge naturelle).
  if(apply){
    lines[0].style.marginTop = '0px';
    for(let i = 1; i < m.length; i++) if(firstOfPage[i]){
      m[i].d.style.marginTop = (topOf[i] - domBottom[i-1]) + 'px';
      m[i].d.classList.add('is-pagetop');
    }
  }
  // Un bloc appartient à la page où il COMMENCE.
  const seen = new Set();
  pages.forEach((pg, k) => pg.forEach(d => { if(seen.has(d)) return; seen.add(d); mapPageIds(d, pageOf, k + 1); }));
  // v49 : une note est rattachée à la page de la ligne qui la précède (sinon de celle qui la suit).
  { let lastPg = null; const pending = [];
    allLines.forEach(d => {
      if(d.dataset.type === 'note'){ if(lastPg !== null) pageOf[d.dataset.id] = lastPg; else pending.push(d); }
      else { const v = pageOf[d.dataset.id]; if(v !== undefined){ lastPg = v; pending.splice(0).forEach(n => { pageOf[n.dataset.id] = v; }); } }
    }); }

  // Export / impression : on coupe réellement le nœud (la copie de mesure est jetable).
  if(!apply) splits.forEach(sp => {
    const A = sp.div, pa = pages[sp.startPage], pb = pages[sp.startPage + 1];
    const mk = (txt) => { const d = document.createElement('div'); d.className = 'line line--character pg-mark';
      d.style.marginTop = '0'; d.textContent = txt; return d; };
    if(sp.kind === 'between'){
      if(sp.more) pa.splice(pa.indexOf(A) + 1, 0, mk(moreMarkWord()));
      if(sp.cue && pb) pb.unshift(mk(sp.cue));
      return;
    }
    const tn = A.firstChild;
    if(!tn || tn.nodeType !== 3) return;
    const base = A.getBoundingClientRect().top + sp.pT + sp.k * sp.lh - 2;
    const rng = document.createRange();
    let lo = 0, hi = tn.length;
    while(lo < hi){
      const mid = (lo + hi) >> 1;
      rng.setStart(tn, mid); rng.setEnd(tn, Math.min(mid + 1, tn.length));
      if(rng.getBoundingClientRect().top >= base) hi = mid; else lo = mid + 1;
    }
    const full = tn.data;
    const B = A.cloneNode(false);
    A.textContent = full.slice(0, lo).replace(/\s+$/, '');
    B.textContent = full.slice(lo).replace(/^\s+/, '');
    if(sp.more) pa.splice(pa.indexOf(A) + 1, 0, mk(moreMarkWord()));
    const at = pb.indexOf(A);
    if(at >= 0) pb.splice(at, 1, ...(sp.cue ? [mk(sp.cue), B] : [B]));
  });
  return { pageCount: pages.length, pages, pageOf, spill, geo, splits, breaks, topOf, domBottom, firstOfPage, lines,
           debug:{ contentH, step, oneLine, linesPerPage: Math.floor((contentH + PAGE_EPS) / oneLine), blocks: m.length } };
}

/* ---- rendu des feuilles derrière le texte de l'éditeur ---- */
/* ---- v49 : VÉRIFICATION APRÈS COUP ----
   La pagination décide d'après des mesures ; une fois les marges écrites dans le DOM, on relit la position
   RÉELLE de la première ligne de chaque feuille. Si elle n'est pas exactement en haut de la zone de texte
   (police arrivée en retard, arrondi du navigateur, zoom…), on corrige sa marge de l'écart constaté, feuille
   après feuille. Garantie : une nouvelle page commence toujours sur sa première ligne de texte, au pixel près. */
function pgVerifyAndHeal(res){
  try{
    const page = document.getElementById('page'); if(!page || !res || !res.pages) return;
    const geo = res.geo, pageH = geo.pageH;
    const cssW = parseFloat(getComputedStyle(page).width);
    const pr0 = page.getBoundingClientRect();
    const K = (cssW > 0 && pr0.width > 0) ? pr0.width / cssW : 1;
    const viol = [];
    for(let k = 1; k < res.pages.length; k++){
      const first = res.pages[k][0];
      if(!first || first.classList.contains('is-split')) continue;           // suite d'un bloc coupé : posée par la coupe
      if(first.dataset && first.dataset.synthetic) continue;
      let guard = 0;
      while(guard++ < 3){
        const pr = page.getBoundingClientRect();
        const want = geo.mTop + k * (pageH + PAGE_GAP);
        const got = (first.getBoundingClientRect().top - pr.top) / K;
        const dlt = want - got;
        if(Math.abs(dlt) <= 0.6) break;
        viol.push({ page:k + 1, delta:+dlt.toFixed(2) });
        const cur = parseFloat(first.style.marginTop) || 0;
        first.style.marginTop = (cur + dlt) + 'px';
        first.classList.add('is-pagetop');
      }
    }
    window.__pgViolations = viol;
    if(viol.length && window.console) console.warn('[pagination] recalage de', viol.length, 'première(s) ligne(s) de page', viol.slice(0, 5));
  }catch(err){ /* la vérification ne doit jamais bloquer l'édition */ }
}
function paginateEditor(){
  const page = document.getElementById('page');
  const stack = document.getElementById('pageStack');
  const sheets = document.getElementById('sheets');
  const zoom = document.getElementById('pageZoom');
  if(!page || !stack || !sheets || !zoom || !S.project) return;

  const st = ensureSettings(S.project);
  const res = computePagination(page, S.project.format, true);
  const { pageH } = res.geo;
  pgVerifyAndHeal(res);

  // min-height (et non height) : si un bloc dépasse la hauteur d'une page,
  // la pile s'agrandit au lieu de rogner la fin du texte.
  stack.style.minHeight = (res.pageCount * pageH + (res.pageCount - 1) * PAGE_GAP) + 'px';

  const numbers = sceneNumbers();
  const sceneOfPage = firstSceneOfEachPage(res.pages, numbers, res.spill);
  const PLB = computePageLabels(res.pages);
  S.pagination.labels = PLB.labels; S.pagination.omitted = PLB.omitted;
  let html = '';
  for(let k = 0; k < res.pageCount; k++){
    const top = k * (pageH + PAGE_GAP);
    const num = PLB.labels[k];
    const showNum = st.showPageNumbers && (k > 0 || st.numberFirstPage);
    // « CONTINUITÉ : » en bas de page quand la scène se poursuit sur la
    // suivante, « (continuité) » en haut de la page qui la reprend.
    const contBottom = st.showContinued && sceneOfPage[k+1] && sceneOfPage[k+1].continued;
    const contTop = st.showContinued && sceneOfPage[k] && sceneOfPage[k].continued;
    html += `<div class="sheet" style="top:${top}px;height:${pageH}px;">
      ${k > 0 ? `<div class="pg-dot" style="top:${res.geo.mTop + 6}px"></div>` : ''}
      ${showNum ? `<div class="sheet-num">${num}.</div>` : ''}
      ${contTop ? `<div class="sheet-cont is-top">${esc(pageContWord('top'))}</div>` : ''}
      ${contBottom ? `<div class="sheet-cont is-bottom">${esc(pageContWord('bottom'))}</div>` : ''}
    </div>`;
    if(k < res.pageCount - 1){
      html += `<div class="sheet-tab" style="top:${top + pageH + 8}px;">fin de page ${num}</div>`;
    }
  }
  (res.splits || []).forEach(sp => {
    if(sp.more) html += `<div class="pg-mark-lbl" style="left:${sp.left}px;top:${res.geo.mTop + sp.moreY}px">${esc(moreMarkWord())}</div>`;
    if(sp.cue) html += `<div class="pg-mark-lbl" style="left:${sp.left}px;top:${res.geo.mTop + sp.newTop}px">${esc(sp.cue)}</div>`;
  });
  /* On ne reconstruit les feuilles que si leur rendu a changé : évite le
     clignotement des numéros / « fin de page » à chaque frappe. */
  if(S.pagination._sheetsHtml !== html || !sheets.firstChild){
    sheets.innerHTML = html;
    S.pagination._sheetsHtml = html;
  }
  const rc = document.getElementById('railCount');
  if(rc){ const t = S.project.elements.length + ' ' + L('éléments','elements'); if(rc.textContent !== t) rc.textContent = t; }

  // Mise à l'échelle si la fenêtre est plus étroite qu'une feuille : le
  // papier garde ses proportions et ses marges réelles, on ne fait que le
  // regarder de plus loin. La pagination, elle, reste calculée sur les
  // dimensions vraies.
  const pane = document.getElementById('centerPane');
  const avail = pane ? pane.clientWidth - 28 : stack.offsetWidth;
  const k = Math.min(1, Math.max(0.35, avail / stack.offsetWidth));
  S.pagination.zoom = k;
  stack.style.transform = k < 1 ? 'scale(' + k + ')' : '';
  zoom.style.width = (stack.offsetWidth * k) + 'px';
  zoom.style.height = (stack.offsetHeight * k) + 'px';

  S.pagination.count = res.pageCount;
  S.pagination.pageOf = res.pageOf;
  S.pagination.debug = res.debug;
  updatePageIndicator();
  try{ refreshSceneTools(); }catch(err){ /* les boutons de marge ne doivent jamais gêner la pagination */ }
  refreshNav();   // les numéros de page affichés par le navigateur viennent d'ici
  if(window.__pgDebug) renderPgDebug(res);
}

/* =====================================================================
   SÉLECTION EXPRESS (v9) — toute une scène / tout le scénario
   ---------------------------------------------------------------------
   Un bouton de chaque côté du texte, à la hauteur de chaque titre de
   scène : à gauche (à côté du numéro) = sélectionne la scène entière,
   à droite = sélectionne tout le scénario (comme Ctrl+A). Les boutons
   sont dans une couche séparée posée par-dessus la feuille, repositionnée
   à chaque pagination : le contenu éditable n'est jamais touché.
===================================================================== */
/* Une accolade par scène (et par feuille si la scène court sur plusieurs
   pages : on découpe aux bords des feuilles pour ne pas enjamber le vide
   entre deux pages), plus une accolade « tout le scénario » à droite. Deux
   passes (lecture puis écriture), et on ne reconstruit que si la géométrie
   a changé. */
let ST_HOT = null;
const ST_ALL = '__all__';
function refreshSceneTools(){
  if(ST_LOCK && ST_LOCK.length && !ST_LOCK[0].isConnected) ST_LOCK = null;
  const stack = document.getElementById('pageStack');
  const page = document.getElementById('page');
  if(!stack || !page) return;
  let layer = document.getElementById('sceneTools');
  if(!layer){
    layer = document.createElement('div');
    layer.id = 'sceneTools';
    // mousedown annulé : le clic ne vole ni le focus ni la sélection en cours
    layer.addEventListener('mousedown', e => { if(e.target.closest && e.target.closest('.st-seg')) e.preventDefault(); });
    layer.addEventListener('click', onSceneToolsClick);
    layer.addEventListener('mouseover', e => {
      const seg = e.target.closest ? e.target.closest('.st-seg') : null;
      stSetHot(seg ? seg.dataset.sid : null);
    });
    layer.addEventListener('mouseleave', () => stSetHot(null));
    stack.appendChild(layer);
  }
  const topOf = n => { while(n && n.parentNode !== page) n = n.parentNode; return n; };
  const sheetsR = Array.from(document.querySelectorAll('#sheets .sheet')).map(sh => [sh.offsetTop, sh.offsetTop + sh.offsetHeight]);
  const base = page.offsetTop;
  const all = pageLineDivs();
  const blocks = [];
  let cur = null;
  all.forEach(d => {
    if(d.dataset.type === 'scene'){ cur = { id: d.dataset.id, first: d, last: d }; blocks.push(cur); }
    else if(cur) cur.last = d;
  });
  const segs = [];
  const clip = (id, y0, y1) => {
    if(!sheetsR.length){ if(y1 - y0 > 4) segs.push([id, y0, y1]); return; }
    sheetsR.forEach(r => {
      const lo = Math.max(y0, r[0] + 2), hi = Math.min(y1, r[1] - 2);
      if(hi - lo > 4) segs.push([id, lo, hi]);
    });
  };
  blocks.forEach(bk => {
    const t1 = topOf(bk.first), t2 = topOf(bk.last);
    if(!t1 || !t2) return;
    clip(bk.id, base + t1.offsetTop + 2, base + t2.offsetTop + t2.offsetHeight - 2);
  });
  if(all.length){
    const t1 = topOf(all[0]), t2 = topOf(all[all.length - 1]);
    if(t1 && t2) clip(ST_ALL, base + t1.offsetTop + 2, base + t2.offsetTop + t2.offsetHeight - 2);
  }
  // pastilles : une par scène, à la hauteur du titre
  const chips = blocks.map(bk => {
    const t1 = topOf(bk.first);
    return t1 ? [bk.id, base + t1.offsetTop + Math.max(0, Math.round((t1.offsetHeight - 20) / 2))] : null;
  }).filter(Boolean);
  const sig = chips.map(c => c[0] + ':' + Math.round(c[1])).join('|') + '#' +
    segs.filter(g => g[0] !== ST_ALL).map(g => g[0] + ':' + Math.round(g[1]) + ':' + Math.round(g[2])).join('|');
  if(layer._sig === sig) return;
  layer._sig = sig;
  const tipScene = esc(L('Sélectionner toute cette scène', 'Select this whole scene'));
  const tipAll = esc(L('Sélectionner tout le scénario (comme Ctrl+A)', 'Select the whole script (like Ctrl+A)'));
  const lblScene = esc(L('Scène', 'Scene')), lblAll = esc(L('Tout', 'All'));
  const icoScene = '<svg viewBox="0 0 12 12"><rect x="1.5" y="2" width="9" height="8" rx="1.5" stroke-dasharray="2 1.6"/></svg>';
  const icoAll = '<svg viewBox="0 0 12 12"><path d="M2 2.5h8M2 5h8M2 7.5h8M2 10h5"/></svg>';
  layer.innerHTML =
    segs.filter(g => g[0] !== ST_ALL).map(g =>
      '<div class="st-rail" data-sid="' + esc(g[0]) + '" style="top:' + Math.round(g[1]) + 'px;height:' + Math.round(g[2] - g[1]) + 'px"></div>'
    ).join('') +
    chips.map(c =>
      '<div class="st-chip" style="top:' + Math.round(c[1]) + 'px">' +
        '<div class="st-seg st-one" role="button" data-sid="' + esc(c[0]) + '" title="' + tipScene + '">' + icoScene + '<span class="st-t">' + lblScene + '</span></div>' +
        '<div class="st-seg st-all" role="button" data-sid="' + ST_ALL + '" title="' + tipAll + '">' + icoAll + '<span class="st-t">' + lblAll + '</span></div>' +
      '</div>'
    ).join('');
  if(ST_HOT) stSetHot(ST_HOT);

/* Survol : l'accolade s'allume sur toute sa hauteur, et ce qui sera
   sélectionné se teinte légèrement. */
function stSetHot(sid){
  const layer = document.getElementById('sceneTools');
  const page = document.getElementById('page');
  document.querySelectorAll('#page .line.st-hint').forEach(d => d.classList.remove('st-hint'));
  if(page) page.classList.remove('st-hint-all');
  if(layer) layer.querySelectorAll('.st-hot').forEach(g => g.classList.remove('st-hot'));
  ST_HOT = sid || null;
  if(!sid || !layer || !page) return;
  layer.querySelectorAll('.st-seg').forEach(g => { if(g.dataset.sid === sid) g.classList.add('st-hot'); });
  layer.querySelectorAll('.st-rail').forEach(g => { if(sid === ST_ALL || g.dataset.sid === sid) g.classList.add('st-hot'); });
  if(sid === ST_ALL){ page.classList.add('st-hint-all'); return; }
  const div = page.querySelector('[data-id="' + sid + '"]');
  const blk = div ? sceneBlockOf(div) : null;
  if(blk) blk.lines.forEach(d => d.classList.add('st-hint'));
}

/* Les lignes de la scène : du titre jusqu'à la veille du titre suivant. */
function sceneBlockOf(sceneDiv){
  const lines = pageLineDivs();
  const i = lines.indexOf(sceneDiv);
  if(i < 0) return null;
  let j = i + 1;
  while(j < lines.length && lines[j].dataset.type !== 'scene') j++;
  return { lines: lines.slice(i, j), first: lines[i], last: lines[j - 1] };
}
/* Ligne réelle située à une borne posée sur #page (indice d'ENFANT de #page,
   pas indice de ligne : un dialogue simultané compte pour un seul enfant). */
function stBoundaryLine(page, offset, isEnd){
  const kids = page.childNodes;
  const linesIn = n => {
    if(!n || n.nodeType !== 1) return [];
    const inner = n.querySelectorAll('.line[data-id]');
    if(inner.length) return Array.from(inner);
    return n.matches('.line[data-id]') ? [n] : [];
  };
  if(!isEnd){
    for(let i = Math.max(0, offset); i < kids.length; i++){ const l = linesIn(kids[i]); if(l.length) return l[0]; }
  } else {
    for(let i = Math.min(offset, kids.length) - 1; i >= 0; i--){ const l = linesIn(kids[i]); if(l.length) return l[l.length - 1]; }
  }
  return null;
}

/* VERROU TEMPORAIRE DES LIGNES
   Chaque ligne est un contentEditable séparé, et Chrome rabote toute
   sélection partielle qui traverse plusieurs de ces zones (seule la 1re
   ligne resterait surlignée, et Ctrl+C ne copierait qu'elle). Le temps que
   la sélection « scène / scénario » est active, on passe donc les lignes en
   lecture seule : la sélection est alors surlignée et copiée en entier. Dès
   qu'on clique ailleurs ou qu'on appuie sur une touche, tout est rendu
   éditable : Suppr/Retour/Entrée/une lettre remplacent la sélection comme
   dans l'éditeur (via applyRangeEdit), Échap/flèches la referment. */
let ST_LOCK = null;
function stLock(){
  if(ST_LOCK) return;
  const saved = [];
  document.querySelectorAll('#page [contenteditable="true"]').forEach(n => {
    saved.push(n); n.setAttribute('contenteditable', 'false');
  });
  ST_LOCK = saved;
}
function stUnlock(){
  if(!ST_LOCK) return;
  ST_LOCK.forEach(n => { if(n.isConnected) n.setAttribute('contenteditable', 'true'); });
  ST_LOCK = null;
}
/* Clic droit (ou Ctrl+clic sur Mac) SUR une sélection de plusieurs lignes :
   on la garde telle quelle pour que le menu contextuel (Copier…) s'applique
   à elle. Sans cela, le navigateur la réduit à un simple curseur dès le
   bouton enfoncé, et le moteur de glisser-sélectionner de l'éditeur la
   reconstruit à tort au relâchement. */
function stPointInSelection(x, y){
  const sel = window.getSelection();
  if(!sel || !sel.rangeCount || sel.isCollapsed) return false;
  const page = document.getElementById('page');
  const r = sel.getRangeAt(0);
  if(!page || !page.contains(r.commonAncestorContainer)) return false;
  const rects = r.getClientRects();
  for(let i = 0; i < rects.length; i++){
    const q = rects[i];
    if(x >= q.left - 2 && x <= q.right + 2 && y >= q.top - 2 && y <= q.bottom + 2) return true;
  }
  return false;
}
function stIsContextClick(e){
  return e.button === 2 || (e.button === 0 && e.ctrlKey && /Mac|iPhone|iPad/.test(navigator.platform || ''));
}
/* Un clic sur une BARRE DE DÉFILEMENT (celle du centre, des panneaux, de la
   page entière) est signalé par le navigateur comme un mousedown sur
   l'élément qui défile. Il ne doit jamais compter comme « un clic ailleurs » :
   sinon la sélection de scène/scénario sautait dès qu'on attrapait l'ascenseur. */
function stOnScrollbar(e){
  let t = e.target;
  if(!t || t.nodeType !== 1) return false;
  if(t === document.documentElement || t === document.body){
    const de = document.documentElement;
    return e.clientX >= de.clientWidth || e.clientY >= de.clientHeight;
  }
  const r = t.getBoundingClientRect();
  const vBar = t.offsetWidth - t.clientWidth - (t.clientLeft || 0) * 2;
  const hBar = t.offsetHeight - t.clientHeight - (t.clientTop || 0) * 2;
  if(vBar > 0 && e.clientX >= r.left + (t.clientLeft || 0) + t.clientWidth && e.clientX <= r.right) return true;
  if(hBar > 0 && e.clientY >= r.top + (t.clientTop || 0) + t.clientHeight && e.clientY <= r.bottom) return true;
  return false;
}
document.addEventListener('mousedown', e => {
  if(e.target && e.target.closest && e.target.closest('#sceneTools')) return;
  if(stOnScrollbar(e)) return;      // ascenseur : on ne touche à rien
  if(stIsContextClick(e) && stPointInSelection(e.clientX, e.clientY)){
    e.preventDefault();             // la sélection reste, le menu contextuel s'ouvre dessus
    dragStartPoint = null;
    return;
  }
  if(!ST_LOCK) return;
  if(e.button === 2) return;        // clic droit ailleurs : le verrou reste jusqu'au prochain vrai clic
  stUnlock();                       // le clic qui suit pose le curseur normalement
}, true);
document.addEventListener('mouseup', e => {
  if(e.button === 2) dragStartPoint = null;   // un clic droit ne doit jamais refaire une sélection
}, true);
document.addEventListener('keydown', e => {
  if(!ST_LOCK) return;
  if(!document.getElementById('page')){ ST_LOCK = null; return; }
  const k = e.key;
  if(k === 'Shift' || k === 'Control' || k === 'Alt' || k === 'Meta' || k === 'CapsLock') return;
  if(e.ctrlKey || e.metaKey){
    const kl = String(k).toLowerCase();
    if(kl === 'a' && !e.shiftKey){ e.preventDefault(); selectWholeScript(true); return; }
    if(kl === 'x'){
      e.preventDefault();
      const span = selectionSpan();
      const selTxt = window.getSelection().toString();
      stWriteClipboard(selTxt.trim() ? selTxt : ((span && stSpanText(span)) || selTxt));
      stUnlock();
      if(span) applyRangeEdit(span, '');
      return;
    }
    return;                          // Ctrl+C et les autres raccourcis : comportement normal
  }
  if(e.altKey) return;
  if(k === 'Delete' || k === 'Backspace' || k === 'Enter' || k.length === 1){
    e.preventDefault();
    const span = selectionSpan();
    stUnlock();
    if(span) applyRangeEdit(span, k === 'Enter' ? '\n' : (k.length === 1 ? k : ''));
    return;
  }
  stUnlock();                        // Échap, flèches… : on referme la sélection
  const sel = window.getSelection(); if(sel) sel.removeAllRanges();
}, true);

/* Texte d'une sélection multi-lignes relu dans le MODÈLE (et non dans ce que
   le navigateur veut bien sérialiser). Sert de filet à la copie / coupe. */
function stSpanText(span){
  if(!span || !span.a || !span.b || !S.project) return null;
  const ai = findIdx(span.a.dataset.id), bi = findIdx(span.b.dataset.id);
  if(ai < 0 || bi < 0 || bi < ai) return null;
  const els = S.project.elements;
  if(ai === bi) return (els[ai].text || '').slice(span.aOff, span.bOff);
  const out = [];
  for(let i = ai; i <= bi; i++){
    let t = els[i].text || '';
    if(i === ai) t = t.slice(span.aOff);
    if(i === bi) t = t.slice(0, span.bOff);
    out.push(t);
  }
  return out.join('\n');
}
function stWriteClipboard(text){
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }catch(err){}
    ta.remove();
  };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).catch(fallback);
    else fallback();
  }catch(err){ fallback(); }
}
/* Ctrl+C : si le navigateur n'a rien à copier alors qu'une sélection
   multi-lignes existe bien dans l'éditeur, on copie le texte du modèle. */
document.addEventListener('keydown', e => {
  if(!(e.ctrlKey || e.metaKey) || e.shiftKey || e.altKey || String(e.key).toLowerCase() !== 'c') return;
  const page = document.getElementById('page');
  const sel = window.getSelection();
  if(!page || !sel || !sel.rangeCount || sel.isCollapsed) return;
  const r = sel.getRangeAt(0);
  if(!page.contains(r.startContainer) || !page.contains(r.endContainer)) return;
  if(sel.toString().trim()) return;                 // la copie normale marche
  const span = selectionSpan();
  const alt = span && span.multi ? stSpanText(span) : null;
  if(!alt || !alt.trim()) return;
  e.preventDefault();
  stWriteClipboard(alt);
  toast(L('Copié', 'Copied'));
}, true);
function stFlashLines(lines){
  lines.forEach(d => {
    d.classList.remove('st-flash'); void d.offsetWidth; d.classList.add('st-flash');
    setTimeout(() => d.classList.remove('st-flash'), 950);
  });
}
function selectWholeScene(sceneDiv){
  const blk = sceneBlockOf(sceneDiv);
  const page = document.getElementById('page');
  if(!blk || !page) return;
  const topOf = n => { while(n && n.parentNode !== page) n = n.parentNode; return n; };
  const kids = Array.prototype.slice.call(page.childNodes);
  const t1 = topOf(blk.first), t2 = topOf(blk.last);
  if(!t1 || !t2) return;
  stLock();
  // Bornes posées sur #page lui-même (comme Ctrl+A), pas dans les lignes.
  const range = document.createRange();
  range.setStart(page, kids.indexOf(t1));
  range.setEnd(page, kids.indexOf(t2) + 1);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  stFlashLines(blk.lines);
  const num = sceneNumbers()[sceneDiv.dataset.id];
  const n = blk.lines.length;
  toast(L(
    (num ? 'Scène ' + num : 'Scène') + ' sélectionnée · ' + n + ' ligne' + (n > 1 ? 's' : '') + ' — Ctrl+C copier · Suppr effacer',
    (num ? 'Scene ' + num : 'Scene') + ' selected · ' + n + ' line' + (n > 1 ? 's' : '') + ' — Ctrl+C copy · Del delete'));
}
function selectWholeScript(quiet){
  const page = document.getElementById('page');
  if(!page || !page.firstChild) return;
  stLock();
  const range = document.createRange();
  range.selectNodeContents(page);          // exactement comme Ctrl+A
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  if(quiet === true) return;               // Ctrl+A : discret, sans effet ni message
  page.classList.remove('st-flash-all'); void page.offsetWidth; page.classList.add('st-flash-all');
  setTimeout(() => page.classList.remove('st-flash-all'), 950);
  const n = pageLineDivs().length;
  toast(L('Tout le scénario sélectionné · ' + n + ' lignes — Ctrl+C copier · Suppr effacer',
          'Whole script selected · ' + n + ' lines — Ctrl+C copy · Del delete'));
}
function onSceneToolsClick(e){
  const seg = e.target.closest ? e.target.closest('.st-seg') : null;
  const page = document.getElementById('page');
  const layer = document.getElementById('sceneTools');
  if(!seg || !page || !layer) return;
  const sid = seg.dataset.sid;
  const div = sid === ST_ALL ? null : page.querySelector('[data-id="' + sid + '"]');
  if(sid !== ST_ALL && !div) return;
  e.preventDefault();
  const mine = Array.from(layer.querySelectorAll('.st-seg')).filter(g => g.dataset.sid === sid);
  mine.forEach(g => { g.classList.remove('st-pop'); void g.offsetWidth; g.classList.add('st-pop'); });
  setTimeout(() => mine.forEach(g => g.classList.remove('st-pop')), 500);
  if(sid === ST_ALL) selectWholeScript(); else selectWholeScene(div);
}
/* ---- panneau de diagnostic (Ctrl+Alt+D) ----
   Affiche ce que le moteur MESURE réellement. Si la pagination tombe au
   mauvais endroit, c'est presque toujours parce qu'une de ces valeurs est
   fausse (hauteur de page, hauteur de ligne, marges), et non parce que la
   logique de découpe est fausse. */
function renderPgDebug(res){
  let box = document.getElementById('pgDebug');
  if(!box){
    box = document.createElement('div');
    box.id = 'pgDebug';
    box.style.cssText = 'position:fixed;right:10px;bottom:10px;z-index:9999;background:#111;color:#0f0;'
      + 'font:11px/1.5 monospace;padding:10px 12px;border-radius:6px;max-width:320px;white-space:pre;'
      + 'box-shadow:0 6px 24px #0007;pointer-events:none;';
    document.body.appendChild(box);
  }
  const g = res.geo, d = res.debug || {};
  const f = focusedLine();
  const cr = f ? caretRect() : null;
  box.textContent =
    'DIAGNOSTIC PAGINATION  (Ctrl+Alt+D)  \u2014 fichier v44\n' +
    'blocs sur la page du curseur : ' + (f && res.pages[(S.pagination.pageOf[f.dataset.id] || 1) - 1] ? res.pages[(S.pagination.pageOf[f.dataset.id] || 1) - 1].length : 'n/a') + '\n' +
    'hauteur feuille   : ' + Math.round(g.pageH) + ' px\n' +

    'zone de texte     : ' + Math.round(g.contentH) + ' px\n' +
    'hauteur de ligne  : ' + (d.oneLine ? d.oneLine.toFixed(1) : '?') + ' px\n' +
    'lignes par page   : ' + (d.linesPerPage != null ? d.linesPerPage : '?') + '\n' +
    'blocs / pages     : ' + (d.blocks != null ? d.blocks : '?') + ' / ' + res.pageCount + '\n' +
    'zoom              : ' + (S.pagination.zoom || 1).toFixed(3) + '\n' +
    'bloc au curseur   : ' + (f ? (f.dataset.type + ' \u2192 page ' + S.pagination.pageOf[f.dataset.id]) : 'n/a') + '\n' +
    'page affichée     : ' + S.pagination.current + ' / ' + S.pagination.count + '\n' +
    'curseur (y écran) : ' + (cr ? Math.round((cr.top + cr.bottom) / 2) : 'n/a') + '\n' +
    'SAUTS DE PAGE (reste en bas / place demandée) :\n' +
    ((res.breaks && res.breaks.length) ? res.breaks.slice(-8).map(b =>
      ' → p.' + b.to + ' : reste ' + Math.round(b.free) + ' px (' + (b.free / (d.oneLine || 16)).toFixed(1) + ' l.)'
      + (b.why === 'fit' ? ', il fallait ' + Math.round(b.need) + ' px : ne tient pas'
        : b.why === 'keep' ? ' : bloc solidaire (' + b.type + ')'
        : ' : page verrouillée')).join('\n') : ' aucun');
}
document.addEventListener('keydown', e=>{
  if(e.ctrlKey && e.altKey && (e.key === 'd' || e.key === 'D')){
    e.preventDefault();
    window.__pgDebug = !window.__pgDebug;
    const box = document.getElementById('pgDebug');
    if(!window.__pgDebug && box) box.remove();
    else repaginateNow();
  }
});

/* Pour chaque page > 1 : la scène en cours en haut de page, si celle-ci a
   commencé sur une page précédente (donc « (SUITE) »).
   `spill` (renvoyé par computePagination) signale les pages que survole un
   bloc trop grand pour tenir sur une seule feuille (longue tirade, long
   bloc d'action) : ces pages-là ne reçoivent AUCUNE ligne propre dans
   `pages[k]` — le bloc n'est poussé qu'une fois, sur la page où IL
   commence — alors qu'elles sont pourtant bien réelles, numérotées, et
   affichent du texte. Sans en tenir compte ici, `linesOfPage.length` vaut
   0 sur ces pages : elles étaient vues comme « vides », et la mention de
   continuité n'apparaissait ni en haut de ces pages, ni en bas de celle
   qui les précède. C'était la cause précise des mentions manquantes sur
   les scènes contenant un bloc de texte long — un cas nettement plus
   fréquent après un import, où les paragraphes ne sont pas redécoupés. */
function firstSceneOfEachPage(pages, numbers, spill){
  const out = {};
  let last = null;                     // dernière entête de scène rencontrée
  pages.forEach((linesOfPage, k) => {
    const hasContent = linesOfPage.length > 0 || (spill && spill[k]);
    const opensWithScene = linesOfPage.length && linesOfPage[0].dataset.type === 'scene';
    if(k > 0 && !opensWithScene && last && hasContent){
      out[k] = { label:last, continued:true };
    }
    linesOfPage.forEach(div => {
      if(div.dataset.type !== 'scene') return;
      const el = findEl(div.dataset.id);
      if(!el) return;
      const n = numbers[el.id];
      last = n ? ('SCÈNE ' + n) : ((el.text || '').trim().toUpperCase().slice(0, 40) || 'SCÈNE');
    });
  });
  return out;
}
/* Mention fixe de continuité de page (distincte de la mention de
   continuité de personnage ci-dessus) : « CONTINUITÉ : » en bas de la page
   qui se termine au milieu d'une scène, « (continuité) » en haut de la
   page suivante qui la reprend. Toujours ces mots-là, dans la langue de
   l'interface — ce n'est plus un réglage à choisir dans les Paramètres. */
function pageContWord(pos){
  return pos === 'top' ? L('(continuité)', '(continued)') : L('CONTINUITÉ :', 'CONTINUED:');
}

/* Repagination groupée à l'image (requestAnimationFrame) : si plusieurs
   frappes arrivent dans la même image, on ne recalcule qu'une fois — mais
   sans jamais attendre une pause dans la frappe comme le faisait l'ancien
   debounce à 110ms (c'est ce délai qui donnait l'impression qu'une page
   vide mettait du temps à disparaître). */
function schedulePaginate(){
  if(S.pagination.pending != null) return;
  S.pagination.pending = requestAnimationFrame(() => {
    S.pagination.pending = null;
    if(S.view !== 'editor' || S.tab !== 'editor') return;
    paginateEditor();
    // CORRECTIF. La pagination vient peut-être de déplacer le bloc en cours
    // d'édition (il a grossi et ne tient plus sur la page). On ne replace la
    // vue qu'APRÈS ce déplacement : viser l'ancienne position faisait glisser
    // le texte sous le curseur juste après l'avoir amené à l'écran.
    if(focusedLine()){ ensureCaretVisible(); updatePageIndicator(); }
  });
}
/* Pour une action structurelle isolée (Entrée, fusion, changement de type…) :
   on veut que la ligne soit à sa place FINALE avant de lui donner le focus,
   sinon le navigateur amène l'écran à l'ancienne position puis la
   pagination la déplace juste après — d'où l'hésitation entre deux pages
   ressentie en sautant de ligne. Ces actions sont ponctuelles (jamais des
   dizaines par seconde comme la frappe), donc un recalcul synchrone ne
   coûte rien à voir (quelques ms, mesuré). */
function repaginateNow(){
  if(S.pagination.pending != null){ cancelAnimationFrame(S.pagination.pending); S.pagination.pending = null; }
  if(S.view === 'editor' && S.tab === 'editor') paginateEditor();
}

/* ---- indicateur « Page x / y » ---- */
/* La ligne actuellement éditée, ou null. */
function focusedLine(){
  const a = document.activeElement;
  return (a && a.closest) ? a.closest('#page .line') : null;
}
/* Sur quelle feuille tombe une ordonnée donnée (coordonnées écran). Renvoie
   un numéro de page 1-based, ou null s'il n'y a pas encore de feuille. */
function pageAtViewportY(y){
  const sheets = document.querySelectorAll('.sheet');
  if(!sheets.length) return null;
  let best = null, bestDist = Infinity;
  for(let i = 0; i < sheets.length; i++){
    const r = sheets[i].getBoundingClientRect();
    if(y >= r.top && y <= r.bottom) return i + 1;       // dans la feuille
    const d = y < r.top ? r.top - y : y - r.bottom;     // sinon, la plus proche
    if(d < bestDist){ bestDist = d; best = i + 1; }
  }
  return best;
}
function pageStep(){
  const stack = document.getElementById('pageStack');
  if(!stack) return 1;
  const k = S.pagination.zoom || 1;
  const pageH = S.project.format === 'us' ? stack.offsetWidth * (11 / 8.5) : stack.offsetWidth * (29.7 / 21);
  return (pageH + PAGE_GAP) * k;
}
/* Page dominante à l'écran — utilisée uniquement quand rien n'est en train
   d'être édité (lecture au défilement). */
function dominantVisiblePage(){
  const pane = document.getElementById('centerPane');
  if(!pane) return 1;
  const paneRect = pane.getBoundingClientRect();
  const sheets = document.querySelectorAll('.sheet');
  let best = 0, bestOverlap = -1;
  sheets.forEach((sheet, i) => {
    const r = sheet.getBoundingClientRect();
    const overlap = Math.max(0, Math.min(r.bottom, paneRect.bottom) - Math.max(r.top, paneRect.top));
    if(overlap > bestOverlap){ bestOverlap = overlap; best = i; }
  });
  return best + 1;
}
function updatePageIndicator(){
  const el = document.getElementById('pageIndicator');
  if(!el) return;
  // En train d'écrire (le curseur est actuellement visible à l'écran,
  // puisqu'on le maintient dans la vue) : la page affichée est celle où se
  // trouve VRAIMENT le curseur, et elle change dès qu'il atteint la
  // première ligne de la page suivante — même si l'écran montre encore
  // surtout la précédente au-dessus (comme dans Word : le numéro suit le
  // curseur, pas ce qui remplit le plus l'écran).
  // Si en revanche on a défilé manuellement loin du curseur pour relire
  // autre chose, c'est ce qui est à l'écran qui doit faire foi.
  const pane = document.getElementById('centerPane');
  const focused = focusedLine();
  let byCaret = null;
  if(focused && pane){
    const pr = pane.getBoundingClientRect();
    const cr = caretRect();
    const ref = cr || focused.getBoundingClientRect();
    if(ref.bottom > pr.top && ref.top < pr.bottom){
      // CORRECTIF. On regarde sur QUELLE FEUILLE tombe réellement le curseur,
      // au lieu de prendre la page où commence le bloc qui le contient. Un
      // paragraphe un peu long peut commencer en bas d'une feuille : l'ancien
      // code annonçait alors la page du début du bloc, ce qui ne correspondait
      // pas à l'endroit où l'on est en train d'écrire.
      byCaret = pageAtViewportY((ref.top + ref.bottom) / 2)
             || S.pagination.pageOf[focused.dataset.id];
    }
  }
  S.pagination.current = Math.min(S.pagination.count, Math.max(1, byCaret || dominantVisiblePage()));
  el.innerHTML = `${L('Page','Page')} <b>${esc(pageLbl(S.pagination.current))}</b> / ${S.pagination.count}`;
}
async function goToPage(){
  const _v = await mmPrompt(L('Numéro de page (1 – ' + S.pagination.count + ')', 'Page number (1 – ' + S.pagination.count + ')'), S.pagination.current, {title:L('Aller à la page','Go to page'), ok:L('Aller','Go')});
  const n = parseInt(_v, 10);
  if(!n || n < 1 || n > S.pagination.count) return;
  scrollToPage(n);
}
function scrollToPage(n){
  const zoom = document.getElementById('pageZoom');
  const pane = document.getElementById('centerPane');
  if(!zoom || !pane) return;
  pane.scrollTo({ top: zoom.offsetTop + (n - 1) * pageStep() - 20, behavior:'smooth' });
}
/* =====================================================================
   EDITOR TAB — the real script editor
===================================================================== */
function renderEditorTab(){
  const c = document.getElementById('centerPane');
  c.innerHTML = `<div class="page-scroll ${FORMATS[S.project.format].cls}">
    <div id="pageZoom"><div id="pageStack"><div id="sheets"></div><div id="page"></div></div></div>
  </div>`;
  const page = document.getElementById('page');
  const numbers = sceneNumbers();
  const contdOf = contdMap(S.project.elements);
  if(S.focusMode) page.classList.add('focus-mode');
  appendFlow(page, S.project.elements, el=> buildLineDiv(el, numbers, contdOf));
  page.addEventListener('keydown', onLineKeydown);
  page.addEventListener('input', onLineInput);
  page.addEventListener('focusin', onLineFocus);
  // Si le focus quitte carrément l'éditeur (clic ailleurs dans l'appli,
  // changement d'onglet…) plutôt que de passer à une autre ligne, onLineFocus
  // ne se redéclenche pas : on rattrape ici la mention de la ligne quittée.
  page.addEventListener('focusout', ()=>{ setTimeout(refreshContdMarks, 0); });
  page.addEventListener('mousedown', onPageMouseDown);
  page.addEventListener('beforeinput', onBeforeInput);
  page.addEventListener('paste', onPagePaste);
  page.addEventListener('cut', onPageCut);
  c.addEventListener('scroll', onEditorScroll);
  // CORRECTIF. Rien ne suivait le curseur quand il bougeait SANS que le texte
  // change : flèches, clic souris dans le même paragraphe, Origine/Fin,
  // Page préc./suiv., Ctrl+flèches. L'événement `selectionchange` est le seul
  // qui couvre tous ces cas d'un coup. Il est posé une seule fois sur le
  // document (renderEditorTab peut être rejoué plusieurs fois).
  page.addEventListener('keyup', onCaretMoved);
  if(!selectionWatchBound){
    selectionWatchBound = true;
    document.addEventListener('selectionchange', onSelectionMoved);
  }
  // Première pagination après le rendu, puis une seconde fois quand les
  // polices web sont réellement chargées : tant que Courier Prime n'est pas
  // là, les hauteurs mesurées sont celles de la police de repli et les
  // sauts de page tomberaient au mauvais endroit.
  requestAnimationFrame(()=>{
    paginateEditor();
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>repaginateNow());
  });
  if(S.search.query) runSearch(S.search.query, true);
}
/* Déplacement du curseur sans modification du texte.
   `scroll` distingue les deux besoins : après une touche de navigation on
   ramène la vue sur le curseur, mais après un simple clic on se contente de
   rafraîchir l'indicateur — sinon cliquer près d'un bord ferait sauter la
   page sous la souris, ce qui est très désagréable. */
let selectionWatchBound = false, caretRaf = null;
let lastFocusedLineId = null; // dernière ligne éditée, indépendant du focus DOM au moment du clic (voir speakScene)
function scheduleCaretSync(scroll){
  if(caretRaf) return;
  caretRaf = requestAnimationFrame(()=>{
    caretRaf = null;
    if(S.view !== 'editor' || S.tab !== 'editor') return;
    if(!focusedLine()) return;
    // Une pagination est déjà programmée : elle fera le travail elle-même,
    // avec les bonnes positions. On ne veut pas deux recadrages qui se
    // contredisent dans la même image.
    if(S.pagination.pending != null) return;
    if(scroll) ensureCaretVisible();
    updatePageIndicator();
    navSyncActive();
  });
}
/* CORRECTIF (v39). `keyup` se déclenche aussi pour Maj, Ctrl, Alt, Verr. Maj, Échap, F1-F12… qui ne
   déplacent JAMAIS le curseur. En mode Machine à écrire, chacune de ces touches ramenait brutalement la
   vue au curseur : dès qu'on avait fait défiler le document (molette ou barre de défilement) et qu'on
   relâchait une touche, la page « sautait » en arrière et la barre de défilement semblait bloquée. */
function onCaretMoved(e){
  if(e && typeof e.key === 'string' && /^(Shift|Control|Alt|AltGraph|Meta|OS|CapsLock|NumLock|ScrollLock|Escape|ContextMenu|Fn|FnLock|F\d{1,2})$/.test(e.key)) return;
  scheduleCaretSync(true);
}
function onSelectionMoved(){ scheduleCaretSync(false); }

let editorScrollRaf = null;
function onEditorScroll(){
  hideAutocomplete();
  closeExtMenu();
  if(editorScrollRaf) return;
  editorScrollRaf = requestAnimationFrame(()=>{ editorScrollRaf = null; updatePageIndicator(); });
}
/* =====================================================================
   DIALOGUE SIMULTANÉ — LE MODÈLE
   ---------------------------------------------------------------------
   MÊME CONVENTION QUE LE MÉTIER. Un dialogue simultané n'est pas un type
   de ligne : c'est un DRAPEAU posé sur le nom du personnage de DROITE
   (el.dual === true), qui signifie « ce bloc se joue en même temps que
   le bloc de dialogue juste au-dessus ». C'est très exactement ce que
   font Final Draft (<DualDialogue>) et Fountain (le ^ après le nom) —
   donc l'export et l'import se font sans rien traduire, et un fichier
   passé par WriterDuet revient avec ses simultanés intacts.

   POURQUOI PAS UN TYPE DE LIGNE : un bloc simultané reste composé de
   lignes Personnage / Parenthétique / Dialogue tout ce qu'il y a de plus
   normales. Complétion des noms, reprises de parole « (SUITE) »,
   recherche, statistiques, rapports, corbeille : tout continue de
   fonctionner sans une seule ligne de code en plus. Retirer le drapeau
   remet les deux blocs l'un sous l'autre, sans rien perdre.

   LE RENDU. flowUnits() regroupe les éléments en « unités » d'affichage :
   une ligne seule, un bloc de dialogue, ou une PAIRE simultanée. Les
   trois montages qui existent dans l'application (l'éditeur, la mesure
   d'export, la mesure des huitièmes) passent tous par appendFlow(), donc
   l'écran, le PDF, l'impression et la pagination voient rigoureusement la
   même chose — c'est la seule façon d'avoir un WYSIWYG honnête.
===================================================================== */
const DUAL_BODY_TYPES = new Set(['dialogue','parenthetical']);
/* Bornes du bloc de dialogue qui commence à l'indice `start` (un
   Personnage, suivi de ses parenthétiques et de ses répliques). */
function dialogueBlockAt(els, start){
  const arr = [els[start]];
  let j = start + 1;
  while(j < els.length && DUAL_BODY_TYPES.has(els[j].type)){ arr.push(els[j]); j++; }
  return { arr, end:j };
}
/* Remonte de `idx` jusqu'au Personnage qui ouvre son bloc de dialogue.
   Renvoie -1 si la ligne n'appartient pas à un bloc de dialogue. */
function dialogueBlockStart(idx){
  const els = S.project.elements;
  for(let i = Math.min(idx, els.length - 1); i >= 0; i--){
    if(els[i].type === 'character') return i;
    if(!DUAL_BODY_TYPES.has(els[i].type)) return -1;
  }
  return -1;
}
/* Bornes de la PAIRE simultanée qui contient l'élément d'indice `idx`
   (première ligne de la colonne de gauche → dernière ligne de celle de
   droite), ou null si cet élément n'est pas dans une paire. */
function dualPairRange(idx){
  const els = S.project.elements;
  const bs = dialogueBlockStart(idx);
  if(bs < 0) return null;
  if(els[bs].dual){
    const leftStart = bs > 0 ? dialogueBlockStart(bs - 1) : -1;
    if(leftStart < 0 || els[leftStart].dual) return null;
    return { start:leftStart, rightStart:bs, end:dialogueBlockAt(els, bs).end };
  }
  const after = dialogueBlockAt(els, bs).end;
  const nxt = els[after];
  if(nxt && nxt.type === 'character' && nxt.dual)
    return { start:bs, rightStart:after, end:dialogueBlockAt(els, after).end };
  return null;
}
function flowUnits(els){
  const units = [];
  let i = 0;
  while(i < els.length){
    const el = els[i];
    if(el.type === 'character'){
      const b = dialogueBlockAt(els, i);
      const prev = units[units.length - 1];
      // Le drapeau ne vaut que s'il y a bien un bloc de dialogue JUSTE
      // au-dessus, et que celui-ci n'est pas déjà la colonne de droite
      // d'une paire (deux colonnes au maximum, comme partout ailleurs).
      if(el.dual && prev && prev.kind === 'block'){
        units.pop();
        units.push({ kind:'dual', left:prev.arr, right:b.arr });
      } else {
        units.push({ kind:'block', arr:b.arr });
      }
      i = b.end;
      continue;
    }
    units.push({ kind:'single', el });
    i++;
  }
  return units;
}
/* Remplit un conteneur avec le flux mis en page. `make` fabrique la ligne
   (éditable dans l'éditeur, simple nœud de mesure à l'export). */
function appendFlow(container, els, make){
  flowUnits(els).forEach(u=>{
    if(u.kind === 'dual'){
      const wrap = document.createElement('div');
      wrap.className = 'line line--dual dual-wrap';
      wrap.dataset.type = 'dual';
      const L = document.createElement('div'); L.className = 'dual-col dual-col-l';
      const R = document.createElement('div'); R.className = 'dual-col dual-col-r';
      u.left.forEach(el=> L.appendChild(make(el)));
      u.right.forEach(el=> R.appendChild(make(el)));
      wrap.appendChild(L); wrap.appendChild(R);
      container.appendChild(wrap);
    } else if(u.kind === 'block'){
      u.arr.forEach(el=> container.appendChild(make(el)));
    } else {
      container.appendChild(make(u.el));
    }
  });
}
/* La ligne est-elle dans une paire simultanée ? Les manipulations de DOM
   par voisinage (ligne précédente / suivante) n'y sont plus valables : on
   refait alors proprement le rendu de l'éditeur à partir du modèle. */
function inDualWrap(div){ return !!(div && div.closest && div.closest('.dual-wrap')); }
function rebuildEditorAt(id, offset){
  renderEditorTab();
  const d = document.querySelector('#page [data-id="' + id + '"]');
  if(d) focusDiv(d, Math.min(offset == null ? 0 : offset, (d.textContent || '').length));
}
/* Voisin d'une ligne AU SENS DU MODÈLE (et non du DOM) : dans une paire
   simultanée, la ligne suivante n'est pas toujours le nœud d'à côté. */
/* Toutes les lignes RÉELLES de la page, dans l'ordre du scénario. Les
   colonnes d'un dialogue simultané y figurent (gauche puis droite) alors
   qu'elles ne sont pas des enfants directs de #page : compter ou parcourir
   page.children donnerait un décompte faux dès qu'une paire existe. */
function pageLineDivs(){
  const page = document.getElementById('page');
  return page ? Array.from(page.querySelectorAll('.line[data-id]')) : [];
}
function neighborLineDiv(el, dir){
  const i = findIdx(el.id);
  const n = i < 0 ? null : S.project.elements[i + dir];
  return n ? document.querySelector('#page [data-id="' + n.id + '"]') : null;
}

function buildLineDiv(el, numbers, contdOf){
  const div = document.createElement('div');
  div.className = 'line line--'+el.type;
  div.contentEditable = 'true';
  div.dataset.id = el.id;
  div.dataset.type = el.type;
  div.dataset.placeholder = placeholderFor(el.type)||'';
  div.textContent = el.text || '';
  if(!el.text) div.dataset.empty='1';
  if(el.type==='scene' && S.project.settings.showSceneNumbers && numbers[el.id]){
    div.dataset.sceneNum = numbers[el.id]+'.';
  }
  if(contdOf && contdOf[el.id]) div.dataset.contd = contdOf[el.id];
  applyCardStyle(div, el);
  if(S.project.comments && S.project.comments[el.id]){
    div.dataset.comment = '1';
    div.title = L('Commentaire : ','Comment: ') + S.project.comments[el.id];
  }
  return div;
}
function refreshLineDiv(div, el){
  // div.className était réécrit intégralement ici, ce qui effaçait au
  // passage les classes posées dynamiquement ailleurs — 'line-active' (Mode
  // Focus) et 'hl' (surbrillance de recherche). Concrètement : taper Tab
  // pour transformer une ligne d'Action en Personnage (donc créer un nom de
  // personnage) déclenche ce changement de type, et avec le Mode Focus actif
  // la ligne qu'on était pourtant en train d'écrire perdait 'line-active' et
  // retombait dans le texte estompé. On préserve donc ces deux classes.
  const hadActive = div.classList.contains('line-active');
  const hadHl = div.classList.contains('hl');
  div.className = 'line line--'+el.type; div.dataset.type = el.type; div.dataset.placeholder = placeholderFor(el.type)||'';
  if(hadActive) div.classList.add('line-active');
  if(hadHl) div.classList.add('hl');
  if(el.type === 'card' && !el.card) el.card = cardDefaults();
  applyCardStyle(div, el);
  // Le type vient de changer : la chaîne des reprises de parole n'est plus
  // la même, on la recalcule sur tout le script plutôt que sur cette ligne.
  delete div.dataset.contd;
  setTimeout(refreshContdMarks, 0);
  // Changer de type change les marges et l'indentation, donc la hauteur :
  // la pagination doit être rejouée.
  schedulePaginate();
  if(el.type!=='scene'){
    delete div.dataset.sceneNum;
  }
}
function lineText(div){
  return div.textContent;
}
function findEl(id){ return S.project.elements.find(e=>e.id===id); }
function findIdx(id){ return S.project.elements.findIndex(e=>e.id===id); }

function onLineInput(e){
  const page = document.getElementById('page');
  const div = e.target.closest('.line');
  // Saisie qui n'atterrit pas dans une ligne, ou structure qui ne
  // correspond plus au modèle : on réaligne avant toute chose.
  if(!div || (page && pageLineDivs().length !== S.project.elements.length)){
    syncFromDOM(); repaginateNow(); scheduleAutosave(); return;
  }
  const el = findEl(div.dataset.id);
  if(!el){ syncFromDOM(); repaginateNow(); return; }
  let text = lineText(div);
  el.text = (el.type === 'card') ? text.replace(/\n$/, '') : text;
  div.dataset.empty = text ? '' : '1';
  autoDetect(el, div);
  refreshContdMarks();
  updateExtMenu(div, el);
  updateAutocomplete(div, el);
  // Le recadrage de la vue et l'indicateur sont désormais rejoués à
  // l'intérieur de schedulePaginate(), une fois les blocs à leur place
  // définitive. Les appeler ici visait l'ancienne mise en page.
  schedulePaginate();
  scheduleAutosave();
}
function autoDetect(el, div){
  const t = el.text.trim();
  if(el.type==='action'){
    if(/^(INT|EXT|INT\.\/EXT|EXT\.\/INT|EST|INTERIEUR|EXTERIEUR|INT\/EXT)[.\s]/i.test(t) && t.length>3){
      el.type='scene'; pushUndoLight(); refreshLineDiv(div, el); renumberScenes();
    } else if(/^\(.*\)?$/.test(t) && t.startsWith('(')){
      el.type='parenthetical'; pushUndoLight(); refreshLineDiv(div, el);
    }
  }
}
function pushUndoLight(){ /* structural auto-changes: keep undo stack sane, snapshot occasionally */ }
function renumberScenes(){
  // La chaîne des reprises de parole dépend de l'ORDRE des lignes : elle
  // change exactement aux mêmes moments que les numéros de scène (insertion,
  // scission, collage, resynchronisation). On la recalcule donc ici.
  refreshContdMarks();
  // The scene number is a ::before (see CSS) driven by a data-sceneNum
  // attribute on the line itself, not a DOM node inside the editable
  // content — so updating it here never touches the line's child nodes
  // and can never disturb an in-progress caret/selection.
  const numbers = sceneNumbers();
  document.querySelectorAll('#page .line--scene').forEach(div=>{
    const el = findEl(div.dataset.id);
    if(el && S.project.settings.showSceneNumbers && numbers[el.id]){
      div.dataset.sceneNum = numbers[el.id]+'.';
    } else {
      delete div.dataset.sceneNum;
    }
  });
}

/* =====================================================================
   CARTONS — texte du scénario placé « où l'on veut », avec son propre style
   ---------------------------------------------------------------------
   Un carton est un élément comme les autres (type 'card') : il vit dans
   l'ordre du scénario, s'exporte, se déplace avec sa scène. Son aspect est
   stocké dans el.card — jamais dans le texte — et se règle depuis le
   panneau de droite dès que le curseur est dedans :
     taille (pt) · alignement · largeur · police · gras / italique /
     majuscules · cadre (filets, cadre, double cadre) · espacement ·
     « page entière » (le carton occupe sa propre feuille, centré au milieu).
   Maj+Entrée fait un retour à la ligne à l'intérieur du carton.
===================================================================== */
const CARD_FONTS = {
  mono:'var(--script-font,var(--mono))',
  serif:'Georgia, "Times New Roman", Times, serif',
  sans:'Helvetica, Arial, sans-serif'
};
const CARD_VARS = ['--card-size','--card-align','--card-weight','--card-style','--card-case','--card-font','--card-width','--card-ml','--card-mr','--card-sp'];
function cardDefaults(){
  return { size:22, align:'center', width:100, bold:true, italic:false, caps:true, font:'mono', frame:'none', space:2, full:false };
}
function cardOf(el){ return Object.assign(cardDefaults(), (el && el.card) || {}); }
/* Pose (ou retire) le style d'un carton sur sa ligne. Appelée partout où
   une ligne est fabriquée : éditeur, mesure d'export, longueur des scènes. */
function layoutOf(el){ return Object.assign({ align:null, left:null, right:null }, (el && el.layout) || {}); }
function layoutActive(el){ const l = layoutOf(el); return !!(l.align || isFinite(l.left) && l.left !== null || isFinite(l.right) && l.right !== null); }
function applyLayoutStyle(div, el){
  ['data-lay-a','data-lay-l','data-lay-r'].forEach(a => div.removeAttribute(a));
  ['--lay-a','--lay-l','--lay-r'].forEach(v => div.style.removeProperty(v));
  if(!el || el.type === 'card' || el.type === 'note') return;
  const l = layoutOf(el), st = div.style;
  if(l.align === 'left' || l.align === 'center' || l.align === 'right'){ div.setAttribute('data-lay-a', '1'); st.setProperty('--lay-a', l.align); }
  if(l.left !== null && isFinite(l.left)){ div.setAttribute('data-lay-l', '1'); st.setProperty('--lay-l', Math.max(0, Math.min(14, Number(l.left))) + 'cm'); }
  if(l.right !== null && isFinite(l.right)){ div.setAttribute('data-lay-r', '1'); st.setProperty('--lay-r', 'calc(' + Math.max(0, Math.min(14, Number(l.right))) + 'cm - 3px)'); }
}
function applyCardStyle(div, el){
  applyLayoutStyle(div, el);
  if(!el || el.type !== 'card'){
    CARD_VARS.forEach(n => div.style.removeProperty(n));
    div.style.minHeight = '';
    delete div.dataset.frame; delete div.dataset.full;
    return;
  }
  const c = cardOf(el), st = div.style;
  const w = Math.min(100, Math.max(20, Number(c.width) || 100));
  st.setProperty('--card-size', Math.min(120, Math.max(8, Number(c.size) || 22)) + 'pt');
  st.setProperty('--card-align', c.align === 'left' || c.align === 'right' ? c.align : 'center');
  st.setProperty('--card-weight', c.bold ? '700' : '400');
  st.setProperty('--card-style', c.italic ? 'italic' : 'normal');
  st.setProperty('--card-case', c.caps ? 'uppercase' : 'none');
  st.setProperty('--card-font', CARD_FONTS[c.font] || CARD_FONTS.mono);
  st.setProperty('--card-width', w >= 100 ? 'auto' : w + '%');
  const al = (c.align === 'left' || c.align === 'right') ? c.align : 'center';
  st.setProperty('--card-ml', (w >= 100 || al === 'left') ? '-3px' : 'auto');
  st.setProperty('--card-mr', (w >= 100 || al === 'right') ? '-3px' : 'auto');
  st.setProperty('--card-sp', (Math.max(0, Number(c.space)) * 18) + 'pt');
  if(c.frame && c.frame !== 'none' && !c.full) div.dataset.frame = c.frame; else delete div.dataset.frame;
  if(c.full) div.dataset.full = '1'; else { delete div.dataset.full; div.style.minHeight = ''; }
}
function cardPanelHtml(el){
  const c = cardOf(el), id = el.id;
  const seg = (prop, opts) => opts.map(o =>
    `<button class="btn btn-sm ${String(c[prop]) === String(o[0]) ? 'btn-primary' : ''}" data-act="cardSet" data-id="${id}|${prop}|${o[0]}">${o[1]}</button>`).join('');
  const tog = (prop, label, title) =>
    `<button class="btn btn-sm ${c[prop] ? 'btn-primary' : ''}" data-act="cardSet" data-id="${id}|${prop}|${!c[prop]}" title="${title||''}">${label}</button>`;
  return `<div class="pane-title">${L('Carton','Title card')}</div>
  <div class="panel-block card-panel" data-card-id="${id}">
    <div class="cp-row"><div class="cp-lbl">${L('Taille','Size')} — <span id="cardSizeVal">${c.size}</span> pt</div>
      <input type="range" id="cardSizeRange" min="10" max="96" step="1" value="${c.size}">
      <div class="cp-seg" style="margin-top:6px;">${seg('size',[[14,'S'],[22,'M'],[32,'L'],[48,'XL'],[72,'XXL']])}</div></div>
    <div class="cp-row"><div class="cp-lbl">${L('Position du texte','Text alignment')}</div>
      <div class="cp-seg">${seg('align',[['left',L('Gauche','Left')],['center',L('Centre','Center')],['right',L('Droite','Right')]])}</div></div>
    <div class="cp-row"><div class="cp-lbl">${L('Largeur du bloc','Block width')}</div>
      <div class="cp-seg">${seg('width',[[100,'100 %'],[75,'75 %'],[50,'50 %'],[33,'33 %']])}</div></div>
    <div class="cp-row"><div class="cp-lbl">${L('Police','Font')}</div>

function onLineFocus(e){

  // elle a été ignorée par refreshContdMarks() tant qu'elle avait le focus
  // (voir le correctif juste au-dessus de cette fonction) — on rattrape sa
  // mention maintenant qu'elle ne l'a plus.
  if(lastFocusedLineId && lastFocusedLineId !== div.dataset.id) refreshContdMarks();
  lastFocusedLineId = div.dataset.id;

    const prev = document.querySelector('#page .line.line-active');
    if(prev && prev!==div) prev.classList.remove('line-active');
    div.classList.add('line-active');
  }
  // La ligne vient d'obtenir le focus (frappe, flèches, clic) : on la garde
  // sous les yeux. Appelé après repaginateNow() partout où l'un et l'autre
  // se combinent, la position lue ici est donc déjà la position finale —
  // un seul déplacement de la vue, jamais deux qui se contredisent.
  ensureLineVisible(div);

  showContextPanel(el);
}
/* Fait défiler #centerPane, sans effet de bord ni animation (le déplacement
   doit être instantané pour suivre la frappe sans donner d'à-coup), pour
   que la ligne reste confortablement dans la zone visible. */
function ensureLineVisible(div){
  ensureRectVisible(div ? div.getBoundingClientRect() : null);
}
/* Version précise : suit la position RÉELLE du curseur, pas seulement le
   bloc qui le contient. Un bloc peut retourner à la ligne plusieurs fois
   (une réplique qui s'allonge, une action longue) sans jamais changer de
   focus — dans ce cas ensureLineVisible seule ne voit rien bouger, alors
   que le curseur, lui, continue de descendre à l'intérieur du bloc. C'est
   ce qui laissait le curseur sortir de l'écran en pleine frappe. */
/* Premier rectangle réellement exploitable d'une liste (Chrome en renvoie
   régulièrement de dégénérés, 0×0 en (0,0), qu'il ne faut surtout pas
   prendre pour la position du curseur : on croirait le curseur en haut à
   gauche de l'écran et la vue sauterait). */
function usableRect(rects){
  for(let i = 0; i < rects.length; i++){
    const r = rects[i];
    if(r.height > 0 || r.width > 0) return r;
  }
  return null;
}
function caretRect(){
  const sel = window.getSelection();
  if(!sel || !sel.rangeCount) return null;
  const range = sel.getRangeAt(0).cloneRange();
  range.collapse(true);
  let r = usableRect(range.getClientRects());
  if(r) return r;

  // CORRECTIF. Un point de collapse en tout début de ligne ne renvoie aucun
  // rect utilisable dans Chrome — autrement dit après CHAQUE appui sur
  // Entrée, le cas le plus fréquent qui soit. L'ancien code ne détectait
  // alors rien et ne faisait rien suivre. On élargit le range d'un seul
  // caractère, en arrière puis en avant : cela donne toujours un rectangle
  // sur la bonne ligne, sans jamais toucher au DOM ni à la sélection de
  // l'utilisateur (c'est ce dernier point qui cassait les sélections
  // multi-lignes dans l'approche « insertion d'un repère »).
  const node = range.startContainer, off = range.startOffset;
  if(node.nodeType === 3){
    if(off > 0){
      const p = range.cloneRange(); p.setStart(node, off - 1); p.setEnd(node, off);
      r = usableRect(p.getClientRects()); if(r) return r;
    }
    if(off < node.textContent.length){
      const n = range.cloneRange(); n.setStart(node, off); n.setEnd(node, off + 1);
      r = usableRect(n.getClientRects()); if(r) return r;
    }
  }
  // Ligne entièrement vide : le bloc lui-même fait office de repère.
  const host = node.nodeType === 1 ? node : node.parentNode;
  const line = host && host.closest ? host.closest('.line') : null;
  if(!line) return null;
  const lr = line.getBoundingClientRect();
  return (lr.width || lr.height) ? lr : null;
}
function ensureRectVisible(r){
  const pane = document.getElementById('centerPane');
  if(!pane || !r || (!r.width && !r.height && !r.top && !r.bottom)) return;
  const paneRect = pane.getBoundingClientRect();
  if(S.typewriterMode){
    // Le curseur reste toujours au centre vertical de la fenêtre : on
    // défile toujours d'exactement l'écart entre son centre et celui de
    // la zone visible, jamais seulement quand il sort d'une marge.
    pane.scrollTop += (r.top + r.bottom)/2 - (paneRect.top + paneRect.height/2);
    return;
  }
  const margin = 96;
  if(r.top < paneRect.top + margin){
    pane.scrollTop -= (paneRect.top + margin) - r.top;
  } else if(r.bottom > paneRect.bottom - margin){
    pane.scrollTop += r.bottom - (paneRect.bottom - margin);
  }
}
function ensureCaretVisible(){
  ensureRectVisible(caretRect());
}
function showContextPanel(el){
  const side = document.getElementById('sidePane');
  if(side && side.dataset.mode === 'layout' && el.type !== 'card' && el.type !== 'note'){ side.innerHTML = layoutPanelHtml(el); bindLayoutPanel(el); return; }   // v48 : le panneau « Aligner » suit la ligne active
  // Note: scene headings used to pop this panel open on focus (outline,
  // tags, duplicate/delete). It sat right next to — and on narrow windows
  // on top of — the text being typed, making the heading itself hard to
  // edit. Outline & tags editing and duplicate/delete are all still

    <button class="btn btn-sm btn-danger" data-act="deleteElement" data-id="${el.id}">${L('Supprimer cette note','Delete this note')}</button></div>`;
