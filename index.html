<style>
  :root{
    --paper:#FCFDFE;
    --ink:#23262E;
    --ink-soft:#5C6270;
    --studio:#262535;
    --studio-2:#2F2E44;
    --studio-text:#EDEEF5;
    --studio-text-dim:#9A99B0;
    --accent:#3699D4;
    --accent-2:#1F6FA0;
    --hair:#DADFE6;
    --hair-dark:#3B3A52;
    --backdrop:#EEF1F5;
    --danger:#D64545;
    --ok:#2F9E44;
    --radius:3px;
    --sans:'Archivo',system-ui,sans-serif;
    --display:'Fraunces',var(--sans);
    --mono:'Courier Prime','Courier New',monospace;

    /* Couleurs "chrome" (interface) — distinctes de --ink/--paper qui
       habillent la page de scénario elle-même et ne changent jamais,
       comme dans la plupart des logiciels d'écriture de scénario. */
    --paper-ink:var(--ink);
    --paper-ink-soft:var(--ink-soft);
    --surface:#fff;
    --surface-soft:#F7F9FB;
    --surface-soft-2:#F2F5F8;
    --row-hover:#ffffff80;
    --chip-bg:#00000009;
    --overlay-hover:#00000008;
    --overlay-hover-soft:#00000005;
    --tag-chip-bg:#1F6FA01c;
    --tag-chip-text:#145073;
  }
  html[data-theme="dark"]{
    --backdrop:#14141C;
    --ink:#E8EAF2;
    --ink-soft:#A7ACC0;
    --hair:#363548;
    --surface:#262535;
    --surface-soft:#2B2A3D;
    --surface-soft-2:#2B2A3D;
    --row-hover:#ffffff0d;
    --chip-bg:#ffffff14;
    --overlay-hover:#ffffff12;
    --overlay-hover-soft:#ffffff0a;
    --tag-chip-bg:#3699D433;
    --tag-chip-text:#A9D8F5;
    /* La feuille de scénario, elle, reste claire en thème sombre (comme
       dans la plupart des logiciels d'écriture) : on repique donc l'encre
       du papier sur les valeurs claires, sinon le texte deviendrait clair
       sur papier clair. */
    --paper-ink:#1A1D22;
    --paper-ink-soft:#5A5F68;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--backdrop); color:var(--ink); font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit; cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  ::selection{background:#BFE3FA;}
  /* CORRECTIF (export PDF). Le lissage "antialiased" allège nettement le
     tracé du texte à l'écran (surtout sur macOS/WebKit) par rapport à un
     rendu de police par défaut. La page du scénario, elle, doit garder un
     poids d'encre proche de ce que rendra le PDF final (dessiné en
     vectoriel plein, sans ce lissage) — sinon l'écriture semble "changer
     d'opacité" entre l'écran et l'export alors que c'est exactement la
     même couleur des deux côtés. Le chrome de l'appli garde le lissage
     léger ; seule la feuille elle-même en sort.
  */
  .sheet, .print-page, .titlepage{-webkit-font-smoothing:auto;}
  #app{height:100vh; display:flex; flex-direction:column; overflow:hidden;}
  .hidden{display:none !important;}

  /* ---------- HOME ---------- */
  #homeView, #seriesHubView{flex:1; overflow:auto; display:flex; justify-content:center; padding:56px 24px;}
  .home-wrap{width:100%; max-width:760px;}
  /* La page d'accueil garde la hauteur de l'écran : seule la liste des
     scénarios défile (dans .home-list-scroll), le pied de page reste
     toujours visible à sa place, jamais superposé à la liste. */
  #homeView{overflow:hidden;}
  #homeView .home-wrap{height:100%; display:flex; flex-direction:column; min-height:0;}
  #homeView .home-brand, #homeView .home-sub, #homeView .home-actions, #homeView .home-formats, #homeView .home-foot{flex:none;}
  #homeView .home-list-scroll{
    flex:1; min-height:0; overflow-y:auto; padding-bottom:4px;
    /* Aucun scénario ne doit apparaître à moitié coupé en bas du cadre :
       le défilement se cale toujours sur le haut d'une ligne entière. */
    scroll-snap-type:y proximity;
  }
  .home-brand{display:flex; align-items:baseline; gap:10px; margin-bottom:4px;}
  .home-brand .mark{font-family:var(--display); font-weight:700; font-size:30px; letter-spacing:-0.01em;}
  .home-brand .mark em{font-style:normal; color:var(--accent);}
  .home-sub{color:var(--ink-soft); font-size:14.5px; margin-bottom:40px;}
  .home-actions{display:flex; gap:10px; margin-bottom:36px; flex-wrap:wrap;}
  .btn{
    border:1px solid var(--hair); background:var(--surface); color:var(--ink); padding:10px 16px;
    border-radius:var(--radius); font-size:14px; font-weight:600; display:inline-flex; align-items:center; gap:8px;
    transition:border-color .15s, background .15s;
  }
  .btn:hover{border-color:#A9CBE8;}
  .btn-primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn-primary:hover{background:#2C7FB0;}
  .btn-ghost{background:transparent; border-color:transparent;}
  .btn-ghost:hover{background:var(--overlay-hover);}
  .btn-danger{color:var(--danger); border-color:#EFC6C6;}
  .btn-sm{padding:6px 10px; font-size:13.5px;}
  /* Bouton "Machine à écrire" : toujours lisible, jamais coloré — il prend
     l'encre de l'interface (donc noir en thème clair, blanc en thème
     sombre), exactement comme les autres boutons discrets de la barre.
     C'est la petite pastille à sa droite qui dit si le mode tourne ou non :
     verte quand il est actif, rouge quand il est coupé, dans les mêmes
     verts/rouges que le reste de l'appli (--ok / --danger) et en opacité
     réduite pour rester un signal de coin d'œil, pas une alarme. */
  .btn-tw{color:var(--ink); background:transparent; border-color:transparent;}
  .btn-tw:hover{background:var(--overlay-hover); border-color:transparent;}
  .tw-dot{
    width:6px; height:6px; border-radius:50%; flex:none;
    background:var(--danger); opacity:.5; transition:background .15s, opacity .15s;
  }
  .tw-dot.on{background:var(--ok); opacity:.9;}
  .icon{width:15px; height:15px; flex:none;}
  .proj-list{display:flex; flex-direction:column; gap:1px; border-top:1px solid var(--hair);}
  .proj-row{
    display:flex; align-items:center; justify-content:space-between; padding:16px 4px;
    border-bottom:1px solid var(--hair); cursor:pointer;
    scroll-snap-align:start; scroll-snap-stop:always;
  }
  .proj-row:hover{background:var(--row-hover);}
  .proj-name{font-weight:600; font-size:15px;}
  .proj-meta{color:var(--ink-soft); font-size:12.5px; margin-top:3px;}
  .proj-badge{
    font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    padding:3px 7px; border-radius:2px; background:var(--chip-bg); color:var(--ink-soft); margin-right:8px;
  }
  .proj-row-actions{display:flex; gap:6px; opacity:0; transition:opacity .1s;}
  .proj-row:hover .proj-row-actions{opacity:1;}
  .empty-state{padding:40px 4px; color:var(--ink-soft); font-size:14px; border-top:1px solid var(--hair);}
  /* Pied de page de l'accueil : une vraie signature de produit, centrée
     sous la liste des scénarios. Pas de gras dans le texte, pas de tirets
     cabossés — de la prose calme, une largeur de lecture confortable. */
  .home-foot{
    position:relative;
    margin:84px auto 8px; padding-top:34px; border-top:1px solid var(--hair);
    max-width:600px; text-align:center;
  }
  /* Élément décoratif : un petit repère circulaire posé au centre du
     filet, façon marque de montage / amorce de pellicule. Un seul trait,
     ton sur ton, sans couleur ni icône — juste assez pour signer la page
     sans peser sur la sobriété générale. */
  .home-foot::before{
    content:''; position:absolute; top:-4.5px; left:50%; transform:translateX(-50%);
    width:9px; height:9px; border-radius:50%;
    background:var(--backdrop); border:1.2px solid var(--hair);
  }
  .home-foot .foot-mark{
    font-family:var(--display); font-weight:700; font-size:17px; letter-spacing:-0.01em;
    color:var(--ink); margin-bottom:12px;
  }
  .home-foot .foot-mark em{font-style:normal; color:var(--accent);}
  .home-foot p{
    color:var(--ink-soft); font-size:15px; line-height:1.75; margin:0 0 10px;
  }
  /* Les quatre pastilles (Gratuit / Sans compte / Sans publicité / Tes
     fichiers restent chez toi) sont retirées : leur contenu reste dans la
     phrase ci-dessus, simplement mise en retrait — plus petite, plus
     légère, dernière dans l'ordre de lecture — pour ne plus rivaliser
     visuellement avec la phrase de mission juste au-dessus. */
  .home-foot p.foot-p-soft{
    font-size:13px; line-height:1.65; opacity:.78; margin-bottom:0;
  }
  /* Ligne discrète sous les boutons d'accueil : indique aux nouveaux venus que
     le .fdx (Final Draft) circule dans LES DEUX SENS, import comme export. */
  .home-formats{color:var(--ink-soft); font-size:13px; line-height:1.5; margin:-24px 0 34px; max-width:620px;}

  /* Textes de l'accueil légèrement agrandis (+3,7% puis +2,5% puis +4% puis +3%) pour la lisibilité */
  #homeView .home-sub{font-size:16.52px;}
  #homeView .home-actions .btn{font-size:15.94px;}
  #homeView .proj-name{font-size:17.09px;}
  #homeView .proj-meta{font-size:14.22px;}
  #homeView .proj-badge{font-size:11.96px;}
  #homeView .proj-row-actions .btn{font-size:14.22px;}
  #homeView .empty-state{font-size:15.94px;}

  /* ---------- ACCUEIL, façon tableau de bord (liste de scripts + volet latéral) ----------
     Habillage seul : mêmes actions (data-act), mêmes données. Tout est limité à
     #homeView, le hub de série et le reste de l'appli ne bougent pas. */
  #homeView{flex-direction:column; justify-content:flex-start; align-items:stretch; padding:0; overflow:hidden;}
  #homeView .wd-top{
    flex:none; display:flex; align-items:center; justify-content:space-between; gap:16px;
    height:56px; padding:0 24px; background:var(--surface); border-bottom:1px solid var(--hair);
  }
  #homeView .wd-brand{display:flex; align-items:center; gap:11px; font-family:var(--sans); font-weight:700; font-size:19px; letter-spacing:-.01em; color:var(--ink);}
  #homeView .wd-brand em{font-style:normal; color:var(--accent);}
  #homeView .wd-logo{width:40px; height:40px; flex:none; display:block; border-radius:7px;}
  #homeView .wd-top-r{display:flex; align-items:center; gap:10px;}
  #homeView .wd-body{flex:1; min-height:0; display:flex; align-items:stretch; width:100%; max-width:1180px; margin:0 auto; padding:28px 24px 24px; gap:28px;}
  #homeView .wd-side{flex:none; width:268px; display:flex; flex-direction:column; gap:4px; overflow-y:auto; min-height:0;}
  #homeView .wd-new{width:100%; justify-content:center; padding:12px 16px; font-size:15.5px; border-radius:6px; margin-bottom:14px; box-shadow:0 1px 2px #1F6FA044;}
  #homeView .wd-navs{display:flex; flex-direction:column; gap:4px;}
  #homeView .wd-nav{
    width:100%; display:flex; align-items:center; gap:12px; padding:10px 12px; border:0; border-radius:6px;
    background:transparent; color:var(--ink); font-size:15px; font-weight:500; text-align:left; transition:background .12s;
  }
  #homeView .wd-nav:hover{background:var(--overlay-hover);}
  #homeView .wd-nav .icon{width:17px; height:17px; color:var(--ink-soft);}
  #homeView .wd-nav small{display:block; font-size:12.5px; font-weight:400; color:var(--ink-soft); margin-top:1px; line-height:1.35;}
  #homeView .wd-rule{height:1px; background:var(--hair); margin:12px 4px;}
  #homeView .wd-note{font-size:13px; line-height:1.55; color:var(--ink-soft); padding:0 12px;}
  #homeView .wd-about{margin-top:auto; padding:22px 12px 0; font-size:13px; line-height:1.6; color:var(--ink-soft);}
  #homeView .wd-about b{display:block; font-weight:600; color:var(--ink); font-size:14px; margin-bottom:6px;}
  #homeView .wd-about p{margin:0 0 8px;}
  #homeView .wd-main{flex:1; min-width:0; min-height:0; display:flex; flex-direction:column;}
  #homeView .wd-main-h{flex:none; display:flex; align-items:baseline; gap:12px; margin:2px 2px 16px;}
  #homeView .wd-main-h h1{margin:0; font-family:var(--sans); font-size:26px; font-weight:700; letter-spacing:-.015em;}
  #homeView .wd-count{font-size:14px; color:var(--ink-soft);}
  #homeView .wd-table{flex:1; min-height:0; display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--hair); border-radius:8px; overflow:hidden;}
  #homeView .wd-thead, #homeView .proj-row{display:grid; grid-template-columns:minmax(0,1fr) 210px 130px; align-items:center; column-gap:16px;}
  #homeView .wd-thead{flex:none; padding:11px 20px; background:var(--surface-soft); border-bottom:1px solid var(--hair); font-size:13px; font-weight:600; color:var(--ink-soft);}
  #homeView .wd-thead{padding-right:20px;}
  #homeView .proj-row{position:relative; padding-right:20px;}
  #homeView .home-list-scroll{flex:1; min-height:0; overflow-y:auto; padding:0; scroll-snap-type:y proximity;}
  #homeView .proj-list{border-top:0; gap:0;}
  #homeView .proj-row{padding:14px 20px; border-bottom:1px solid var(--hair);}
  #homeView .proj-row:last-child{border-bottom:0;}
  #homeView .proj-row:hover{background:var(--surface-soft);}
  #homeView .wd-title{display:flex; align-items:center; gap:14px; min-width:0;}
  #homeView .wd-ico{
    flex:none; width:34px; height:42px; border:1px solid var(--hair); border-radius:3px; background:#fff; position:relative;
    box-shadow:0 1px 2px #0000000d; transition:border-color .12s;
  }
  #homeView .wd-ico::before, #homeView .wd-ico::after{content:''; position:absolute; left:6px; right:6px; height:2px; background:#C9D1DB; border-radius:1px;}
  #homeView .wd-ico::before{top:11px; box-shadow:0 5px 0 #C9D1DB, 0 10px 0 #C9D1DB;}
  #homeView .wd-ico::after{top:7px; width:12px; right:auto; background:var(--accent); opacity:.85;}
  #homeView .proj-row:hover .wd-ico{border-color:var(--accent);}
  #homeView .wd-title .proj-name{font-size:16.5px; font-weight:600; line-height:1.3; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  #homeView .wd-title .proj-meta{font-size:13.5px; margin-top:2px;}
  #homeView .wd-cell{font-size:14.5px; color:var(--ink-soft); white-space:nowrap;}
  #homeView .wd-cell .proj-badge{margin:0; font-size:12px; text-transform:none; letter-spacing:0; font-weight:600; padding:3px 9px; border-radius:10px;}
  #homeView .proj-row-actions{position:absolute; right:12px; top:50%; transform:translateY(-50%); padding-left:28px; background:linear-gradient(90deg, transparent, var(--surface-soft) 28px); justify-content:flex-end; opacity:0;}
  #homeView .proj-row:hover .proj-row-actions, #homeView .proj-row:focus-within .proj-row-actions{opacity:1;}
  #homeView .proj-row-actions .btn{font-size:13.5px; padding:5px 10px;}
  #homeView .wd-empty{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:14px; padding:48px 24px; border:0;}
  #homeView .wd-empty .wd-ico{width:54px; height:68px; border-radius:4px;}
  #homeView .wd-empty .wd-ico::before{left:10px; right:10px; top:18px; box-shadow:0 8px 0 #C9D1DB, 0 16px 0 #C9D1DB;}
  #homeView .wd-empty .wd-ico::after{left:10px; top:11px; width:18px;}
  #homeView .wd-empty p{margin:0; max-width:380px; font-size:15.5px; line-height:1.55; color:var(--ink-soft);}
  #homeView button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  @media (hover:none){ #homeView .proj-row-actions{opacity:1;} }
  @media (max-width:900px){
    #homeView{overflow:auto;}
    #homeView .wd-body{flex-direction:column; padding:20px 16px 28px; gap:20px; min-height:auto;}
    #homeView .wd-side{display:contents;}
    #homeView .wd-new{order:-2; width:100%; margin-bottom:0;}
    #homeView .wd-navs{order:-1; flex-direction:row; flex-wrap:wrap; gap:6px; margin-top:-8px;}
    #homeView .wd-nav{width:auto; flex:1 1 auto; padding:9px 12px;}
    #homeView .wd-nav small, #homeView .wd-rule, #homeView .wd-note{display:none;}
    #homeView .wd-about{order:3; margin:0; padding:0 4px;}
    #homeView .wd-main{flex:none;}
    #homeView .wd-table{flex:none; overflow:visible;}
    #homeView .home-list-scroll{overflow:visible;}
    #homeView .wd-thead{display:none;}
    #homeView .proj-row{grid-template-columns:minmax(0,1fr); row-gap:6px; padding:14px 16px;}
    #homeView .wd-fmt{display:none;}
    #homeView .wd-date{padding-left:48px; font-size:13px;}
    #homeView .proj-row-actions{position:static; transform:none; padding:0 0 0 48px; background:none; grid-column:1 / -1; justify-content:flex-start;}
    #homeView .wd-top{padding:0 16px;}
  }
  @media (prefers-reduced-motion:reduce){ #homeView *{transition:none !important;} }

  /* ---------- create modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:#14141Eaa; display:flex; align-items:center; justify-content:center;
    z-index:200; padding:20px;
  }
  .modal{background:var(--surface); border-radius:6px; width:100%; max-width:440px; padding:28px; box-shadow:0 20px 60px #0004;}
  .modal h2{font-family:var(--display); font-size:19px; margin:0 0 18px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:13.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px;}
  .field input[type=text], .field input[type=date], .field input[type=number], .field textarea, .field select{
    width:100%; padding:9px 10px; border:1px solid var(--hair); border-radius:var(--radius); font-size:14px; background:var(--surface-soft); color:var(--ink);
  }
  .field textarea{resize:vertical; min-height:70px;}
  .fmt-choice{display:flex; gap:8px;}
  .fmt-opt{
    flex:1; border:1.5px solid var(--hair); border-radius:var(--radius); padding:12px 10px; cursor:pointer; text-align:left;
  }
  .fmt-opt.active{border-color:var(--accent); background:#3699D40d;}
  .fmt-opt .t{font-weight:700; font-size:14.5px;}
  .fmt-opt .d{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:22px;}

  /* ---------- boîtes de dialogue Raging Page (remplacent confirm()/prompt()) ---------- */
  .mmd-backdrop{position:fixed; inset:0; z-index:500; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(20,20,30,.52); animation:mmdFade .14s ease-out;}
  .mmd{width:100%; max-width:410px; background:var(--surface); color:var(--ink); border-radius:12px; padding:24px 24px 18px; box-shadow:0 0 0 1px var(--hair), 0 24px 64px rgba(10,10,20,.38); animation:mmdPop .17s cubic-bezier(.2,.8,.3,1);}
  .mmd-head{display:flex; gap:14px; align-items:flex-start;}
  .mmd-ico{flex:none; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:rgba(54,153,212,.14); color:var(--accent);}
  .mmd.danger .mmd-ico{background:rgba(214,69,69,.14); color:var(--danger);}
  .mmd-ico svg{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
  .mmd-text{min-width:0; flex:1;}
  .mmd-title{margin:2px 0 0; font-family:var(--sans); font-size:17px; font-weight:700; letter-spacing:-.01em; line-height:1.3;}
  .mmd-msg{margin:6px 0 0; font-size:14.5px; line-height:1.5; color:var(--ink-soft); white-space:pre-line; overflow-wrap:anywhere;}
  .mmd-input{display:block; width:100%; margin-top:14px; padding:10px 12px; font:inherit; font-size:15px; color:var(--ink); background:var(--surface-soft); border:1px solid var(--hair); border-radius:8px;}
  .mmd-input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(54,153,212,.22);}
  .mmd-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:22px;}
  .mmd-actions .btn{min-width:92px; justify-content:center; padding:8px 16px; font-size:14.5px;}
  .mmd.danger .mmd-ok{background:var(--danger); border-color:var(--danger); color:#fff;}
  .mmd.danger .mmd-ok:hover{background:#B93838; border-color:#B93838;}
  .mmd .btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .mmd.danger .mmd-ok:focus-visible{outline-color:var(--danger);}
  @keyframes mmdFade{from{opacity:0}to{opacity:1}}
  @keyframes mmdPop{from{opacity:0; transform:translateY(8px) scale(.97)}to{opacity:1; transform:none}}
  @media (prefers-reduced-motion:reduce){ .mmd-backdrop, .mmd{animation:none;} }
  @media (max-width:480px){ .mmd{padding:20px 18px 14px;} .mmd-actions{flex-direction:column-reverse;} .mmd-actions .btn{width:100%;} }

  /* Textes des modales de création (nouveau scénario / nouvel épisode /
     nouvelle saison) légèrement agrandis (+4%) pour la lisibilité — même
     logique que les tailles de l'accueil, mais volontairement limité à
     ces deux modales (#createBackdrop, #epBackdrop) pour ne pas toucher
     aux Paramètres, à la Page de titre ou aux autres endroits qui
     partagent les mêmes classes .field/.fmt-opt/.btn. */
  #createBackdrop .modal h2, #epBackdrop .modal h2{font-size:19.76px;}
  #createBackdrop .field label, #epBackdrop .field label{font-size:14.04px;}
  #createBackdrop .field input[type=text], #createBackdrop .field input[type=number], #createBackdrop .field select,
  #epBackdrop .field input[type=text], #epBackdrop .field input[type=number]{font-size:14.56px;}
  #createBackdrop .fmt-opt .t, #epBackdrop .fmt-opt .t{font-size:15.08px;}
  #createBackdrop .fmt-opt .d, #epBackdrop .fmt-opt .d{font-size:13px;}
  #createBackdrop .btn, #epBackdrop .btn{font-size:14.56px;}

  /* ---------- EDITOR SHELL ---------- */
  #editorView{flex:1; display:flex; overflow:hidden;}
  .rail{
    width:200px; flex:none; background:var(--studio); color:var(--studio-text); display:flex; flex-direction:column;
    border-right:1px solid var(--hair-dark);
  }
  .rail-top{padding:16px 16px 10px;}
  .rail-brand{font-family:var(--display); font-weight:700; font-size:16px; cursor:pointer; display:flex; align-items:center; gap:7px;}
  .rail-brand:hover{opacity:.85;}
  .rail-logo{flex:none; display:block; border-radius:6px;}
  .rail-project{font-size:12.5px; color:var(--studio-text-dim); margin-top:8px; line-height:1.4; word-break:break-word;}
  .rail-nav{flex:1; overflow-y:auto; padding:6px 8px;}
  /* Boutons de la colonne de gauche (Éditeur, Cartes, Outline, Page de
     titre, Note, Paramètres, etc.) légèrement agrandis (+15%) pour la
     lisibilité — même logique que les tailles de l'accueil ci-dessus. */
  .rail-item{
    display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:var(--radius); font-size:14.95px;
    color:var(--studio-text-dim); margin-bottom:1px;
  }
  .rail-item:hover{background:#ffffff0d; color:var(--studio-text);}
  .rail-item.active{background:#ffffff17; color:#fff;}
  .rail-item .icon{width:14px; height:14px;}
  .rail-sep{height:1px; background:var(--hair-dark); margin:8px 6px;}
  .rail-bottom{padding:10px 14px 14px; font-size:12px; color:var(--studio-text-dim); border-top:1px solid var(--hair-dark);}

  .main-col{flex:1; display:flex; flex-direction:column; min-width:0;}
  .topbar{
    height:52px; flex:none; display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:0 18px; border-bottom:1px solid var(--hair); background:var(--surface);
  }
  .topbar-left, .topbar-right{display:flex; align-items:center; gap:8px;}
  /* ---------- « PLUS D'OPTIONS » (trois petits points) ----------
     La barre de l'éditeur a fini par porter trop de boutons pour une
     largeur d'écran normale — la solution WriterDuet/Google Docs : ne
     garder en clair que les gestes fréquents, et ranger le reste dans un
     petit panneau qui se déroule sous les trois points, sans jamais
     recouvrir le texte ni forcer la barre à passer à la ligne. */
  .tb-more-backdrop{position:fixed; inset:0; z-index:150; background:transparent;}
  .tb-more-menu{
    position:fixed; z-index:151; background:var(--surface); border:1px solid var(--hair);
    border-radius:var(--radius); box-shadow:0 14px 34px #0003; padding:6px;
    min-width:236px; max-width:280px; max-height:min(72vh,540px); overflow-y:auto;
    display:flex; flex-direction:column; gap:2px;
  }
  .tb-more-menu .btn{width:100%; justify-content:flex-start; text-align:left; background:transparent; border-color:transparent;}
  .tb-more-menu .btn:hover{background:var(--overlay-hover);}
  .tb-more-menu .btn.btn-primary{background:var(--accent); color:#fff;}
  .tb-more-menu .btn.btn-primary:hover{background:#2C7FB0;}
  .tb-more-sep{height:1px; background:var(--hair); margin:6px 4px;}
  .save-status{font-size:12.5px; color:var(--ink-soft); display:flex; align-items:center; gap:6px;}
  /* Pastille d'etat du coffre-fort (fichier local), a cote de "Sauvegarde" */
  /* Comparaison de versions */
  .diff-panel{margin:18px 0 60px; border:1px solid var(--hair); border-radius:6px; background:var(--surface); overflow:hidden;}
  .diff-head{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    padding:12px 14px; border-bottom:1px solid var(--hair); font-size:13.5px;}
  .diff-legend{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 14px; border-bottom:1px solid var(--hair);}
  .diff-badge{font-size:12px; padding:3px 9px; border-radius:999px; white-space:nowrap;}
  .diff-badge.add{color:#127a4b; background:rgba(18,122,75,.12);}
  .diff-badge.del{color:#a3312a; background:rgba(163,49,42,.12);}
  .diff-note{font-size:12px; color:var(--ink-soft); flex:1 1 240px;}
  .diff-body{max-height:60vh; overflow:auto; padding:6px 0;}
  .diff-line{display:flex; align-items:flex-start; gap:10px; padding:3px 14px; font-size:13.5px; line-height:1.45;}
  .diff-sign{width:12px; flex:0 0 12px; font-weight:700; text-align:center;}
  .diff-type{flex:0 0 96px; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); padding-top:2px;}
  .diff-text{flex:1; white-space:pre-wrap; word-break:break-word;}
  .diff-add{background:rgba(18,122,75,.10); color:#0f5f3b;}
  .diff-del{background:rgba(163,49,42,.10); color:#8d2c26; text-decoration:line-through; text-decoration-color:rgba(141,44,38,.45);}
  .diff-ctx{color:var(--ink-soft); opacity:.8;}
  .diff-gap{padding:2px 14px 2px 36px; color:var(--ink-soft); opacity:.55; letter-spacing:.3em;}
  .diff-same{padding:16px 14px; color:var(--ink-soft);}
  .lang-flags{display:flex; gap:2px; padding:2px; border-radius:999px; background:var(--chip-bg,rgba(0,0,0,.04));}
  .lang-flag{font-family:var(--sans); font-size:11.5px; font-weight:700; letter-spacing:.03em; line-height:1;
    padding:6px 11px; border-radius:999px; border:1px solid transparent;
    background:transparent; cursor:pointer; color:var(--ink-soft);}
  .lang-flag:hover{color:var(--ink);}
  .lang-flag.active{color:#fff; background:var(--accent,#3699D4); border-color:var(--accent,#3699D4);}
  .vault-chip{font-size:11.5px; line-height:1; padding:4px 8px; border-radius:999px; cursor:pointer;
    border:1px solid var(--line); color:var(--ink-soft); background:transparent; white-space:nowrap; user-select:none;}
  .vault-chip:hover{filter:brightness(.97);}
  .vault-chip.ok{color:#127a4b; border-color:#9ad3b6; background:rgba(18,122,75,.08);}
  .vault-chip.warn{color:#9a5b00; border-color:#e3b778; background:rgba(154,91,0,.10);}
  .vault-chip.off{opacity:.75;}
  /* Bandeau d'alerte quand le navigateur ne conserve rien du tout */
  .storage-banner{position:fixed; left:16px; right:16px; bottom:16px; z-index:9999; display:flex; gap:14px;
    align-items:center; justify-content:space-between; flex-wrap:wrap;
    background:var(--panel,#fff); color:var(--ink,#23262E); border:1px solid #e3b778;
    border-left:4px solid #d98b1f; border-radius:12px; padding:12px 14px;
    box-shadow:0 12px 32px rgba(0,0,0,.18); font-size:13px; max-width:920px; margin:0 auto;}
  .storage-banner .sb-text{flex:1 1 320px; line-height:1.45;}
  .storage-banner .sb-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .dot{width:6px; height:6px; border-radius:50%; background:var(--ok);}
  .dot.saving{background:var(--accent-2); animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .search-box{display:flex; align-items:center; gap:6px; border:1px solid var(--hair); border-radius:var(--radius); padding:5px 9px; background:var(--surface-soft-2);}
  .search-box input{border:none; outline:none; background:transparent; font-size:13.5px; width:130px; color:var(--ink);}
  .search-count{font-size:12px; color:var(--ink-soft); white-space:nowrap;}

  .body-row{flex:1; display:flex; min-height:0;}
  .center-pane{flex:1; overflow-y:auto; min-width:0;}
  .side-pane{
    width:280px; flex:none; border-left:1px solid var(--hair); background:var(--surface); overflow-y:auto;
    padding:18px;
  }
  .pane-title{font-family:var(--display); font-weight:600; font-size:20px; letter-spacing:-0.01em; color:var(--ink); margin:0 0 14px; padding-bottom:10px; border-bottom:1px solid var(--hair);}

  /* ---------- NAVIGATEUR DE SCÈNES ----------
     Le panneau latéral de l'éditeur : la liste de toutes les scènes,
     toujours visible à côté du texte. Volontairement sobre — il doit se
     lire d'un coup d'œil sans jamais tirer l'œil hors de la page. */
  .nav-pane-head{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin:0 0 10px; padding-bottom:10px; border-bottom:1px solid var(--hair);}
  .nav-pane-head .t{font-family:var(--display); font-weight:600; font-size:19px; letter-spacing:-0.01em; color:var(--ink);}
  .nav-pane-head .c{font-size:12px; color:var(--ink-soft); white-space:nowrap;}
  .nav-filter{margin:0 0 10px;}
  .nav-filter input{width:100%; box-sizing:border-box; border:1px solid var(--hair); border-radius:var(--radius); padding:6px 9px; font-size:13px; background:var(--surface-soft-2); color:var(--ink); outline:none;}
  .nav-filter input:focus{border-color:var(--accent);}
  .nav-list{display:flex; flex-direction:column; gap:2px;}
  .nav-item{display:flex; align-items:baseline; gap:8px; padding:7px 8px; border-radius:var(--radius); cursor:pointer; border:1px solid transparent; line-height:1.35;}
  .nav-item:hover{background:var(--surface-soft-2);}
  .nav-item.active{background:var(--surface-soft-2); border-color:var(--accent);}
  .nav-item .nav-num{flex:none; min-width:22px; font-size:11.5px; font-weight:600; color:var(--ink-soft); font-variant-numeric:tabular-nums;}
  .nav-item.active .nav-num{color:var(--accent);}
  .nav-item .nav-txt{flex:1; min-width:0; font-size:12.5px; color:var(--ink); text-transform:uppercase; letter-spacing:.01em;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .nav-item .nav-page{flex:none; font-size:11px; color:var(--ink-soft); font-variant-numeric:tabular-nums;}
  .nav-empty{padding:14px 2px; font-size:13px; color:var(--ink-soft);}

  /* ---------- PAGE / EDITOR ---------- */
  .page-scroll{display:flex; justify-content:center; padding:44px 24px 200px;}

  /* PAGINATION
     ----------
     Le texte reste un seul flux continu (#page) : c'est indispensable, car
     chaque ligne est un contentEditable indépendant et découper le flux dans
     N conteneurs casserait la sélection, le caret et la navigation clavier.
     Les « feuilles » sont donc dessinées derrière le texte (#sheets), et le
     moteur de pagination pousse chaque bloc qui déborde vers le haut de la
     feuille suivante en lui ajoutant une marge haute calculée. Résultat :
     WYSIWYG, sans jamais toucher au contenu éditable. */
  /* #pageStack garde TOUJOURS les dimensions réelles du papier (sinon les
     marges, qui sont en centimètres, ne seraient plus proportionnelles au
     texte et la pagination inventerait des pages). Quand la fenêtre est
     trop étroite, c'est #pageZoom qui réduit l'ensemble à l'échelle. */
  #pageZoom{position:relative;}
  #pageStack{position:relative; width:var(--page-w,21cm); transform-origin:top left;}
  #sheets{position:absolute; inset:0; z-index:0; pointer-events:none;}
  .sheet{
    position:absolute; left:0; width:100%;
    background:var(--paper); box-shadow:0 1px 3px #0002, 0 18px 40px -18px #0004;
  }
  .sheet-num{
    position:absolute; top:var(--pn-top,1.2cm); right:var(--pm-right,2.5cm);
    font-family:var(--script-font,var(--mono)); font-size:11pt; color:var(--paper-ink-soft);
    -webkit-user-select:none; user-select:none;
  }
  .sheet-cont{
    position:absolute; font-family:var(--script-font,var(--mono)); font-size:10.5pt; letter-spacing:.04em;
    color:var(--paper-ink-soft); opacity:.75; -webkit-user-select:none; user-select:none;
  }
  .sheet-cont.is-bottom{bottom:calc(var(--pm-bottom,2.5cm) * .35); right:var(--pm-right,2.5cm);}
  .sheet-cont.is-top{top:calc(var(--pn-top,1.2cm) + 1.1em); left:var(--pm-left,3cm);}
  .sheet-tab{
    position:absolute; left:0; right:0; text-align:center; font-family:var(--sans); font-size:9.5px;
    font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-soft); opacity:.55;
    -webkit-user-select:none; user-select:none;
  }
  #page{
    position:relative; z-index:1; width:100%; background:transparent;
    font-family:var(--script-font,var(--mono)); font-size:12pt; line-height:1.5; color:var(--paper-ink);
    padding: var(--pm-top,2.5cm) var(--pm-right,2.5cm) var(--pm-bottom,2.5cm) var(--pm-left,3cm);
  }

  .topbar select.tb-font{height:32px; width:104px; border:1px solid var(--hair); border-radius:10px; background:var(--surface); color:var(--ink); font-size:12.5px; font-weight:600; padding:0 8px; cursor:pointer;}
  .topbar select.tb-font:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px #3699D433;}
  @media (max-width:1560px){ .topbar select.tb-font, .topbar select.tb-font + .tb-div{display:none;} }
  .tb-more-menu .tb-font-row .icon{width:16px; height:16px; flex:none;}
  .tb-more-menu .tb-font-row{display:flex; align-items:center; gap:8px; padding:6px 10px; font-size:12.5px; font-weight:600; color:var(--ink-soft);}
  .tb-more-menu .tb-font-row select{flex:1; height:30px; border:1px solid var(--hair); border-radius:8px; background:var(--surface); color:var(--ink); font-size:12.5px; padding:0 6px;}
  /* Repère discret sur la 1re ligne rejetée en haut d'une nouvelle feuille. */
  /* v49 : le point « haut de page » n'est plus un ::after posé SUR la ligne. Ajouté après la mesure, il suffisait à
     faire passer une ligne limite de 2 à 3 rangées (quirk de white-space:pre-wrap) : la pagination décalait alors
     toute la page de 16 px. Il est maintenant dessiné dans la feuille (voir paginateEditor) : rien dans le texte
     ne change plus après la mesure. */
  .pg-dot{position:absolute; left:calc(var(--pm-left,3cm) - 1.1cm); width:5px; height:5px; border-radius:50%;
    background:var(--accent-2); opacity:.55; pointer-events:none;}
  .pg-indicator{
    display:flex; align-items:center; gap:6px; font-family:var(--sans); font-size:12.5px; font-weight:600;
    color:var(--ink-soft); background:var(--chip-bg); border:1px solid var(--hair); border-radius:var(--radius);
    padding:4px 9px; cursor:pointer; white-space:nowrap;
  }
  .pg-indicator:hover{color:var(--ink);}
  .pg-indicator b{font-weight:700; color:var(--ink);}
  .line{
    outline:none; white-space:pre-wrap; word-wrap:break-word; position:relative; min-height:1.5em;
    padding:1px 3px; margin:0 -3px;
  }
  .line:focus{background:#3699D40c;}
  .line[data-empty="1"]:focus:before{content: attr(data-placeholder); color:#00000030; pointer-events:none;}
  .line--scene{font-weight:var(--scene-weight,700); text-transform:uppercase; margin-top:1.6em; margin-left:var(--scene-indent,0);}
  /* v59 : sur un en-tête de scène vide et numéroté, le numéro reste dans la marge et l'exemple s'affiche dans la ligne (il passait sous le bouton de la scène). */
  .line--scene[data-scene-num][data-empty="1"]:focus:before{content:attr(data-scene-num); color:var(--paper-ink-soft);}
  .line--scene[data-scene-num][data-empty="1"]:focus:not([data-comment]):after{content:attr(data-placeholder); color:#00000030; pointer-events:none; white-space:nowrap;}
  /* v60 : nouveau scénario — la toute première ligne, encore vide, se repère d'un coup d'œil : un exemple en filigrane et un léger fond, sans rien de lourd. Ça disparaît dès qu'on écrit. */
  #page > .line--scene[data-empty="1"]:first-child:not(:focus){background:#3699D40a; border-radius:2px; box-shadow:inset 2px 0 0 #3699D455;}
  #page > .line--scene[data-empty="1"]:first-child:not(:focus):not([data-comment]):after{content:attr(data-placeholder); color:#00000026; pointer-events:none; white-space:nowrap;}
  /* Scene number is drawn as a ::before pseudo-element (like the placeholder
     text below), never as a real DOM node inside the editable line. A real
     contenteditable="false" node used to sit here; as long as the line had
     no other text yet, that node was the line's *only* content and browsers
     refuse to place an editable caret inside a contentEditable element whose
     entire content is non-editable — so typing into a brand-new scene
     heading silently did nothing. A ::before never enters the DOM as a
     child, so it can never block the caret and is automatically excluded
     from textContent/copy-paste. */
  .line--scene[data-scene-num]:before{
    content: attr(data-scene-num);
    position:absolute; left:calc(-1.7cm - var(--sn-gap,.4cm)); width:1.7cm; text-align:right; color:var(--paper-ink-soft); font-weight:400; font-size:10.5pt;
    text-transform:none; -webkit-user-select:none; user-select:none;
  }
  /* Repère de commentaire (fonctionnalité inspirée de WriterDuet) : une
     ligne qui porte une remarque (Ctrl/Cmd+Maj+M) affiche cette petite
     pastille dans la marge de droite, avec le texte du commentaire en
     info-bulle native (attribut title posé sur la ligne elle-même) — sans
     jamais toucher au contenu éditable ni apparaître dans les exports. */
  .line[data-comment]:after{
    content:'💬'; position:absolute; right:-1.9cm; top:0; width:1.5cm; font-size:9.5pt;
    text-transform:none; -webkit-user-select:none; user-select:none; opacity:.75;
  }
  /* Un paragraphe d'action est toujours précédé d'une ligne vide dans un
     scénario — c'est d'ailleurs déjà ce que produit l'export .txt/.fountain
     (une ligne vide avant chaque action). Sans cette marge, deux
     paragraphes d'action qui se suivent, ou une action juste après une
     réplique, se retrouvaient collés à l'écran comme à l'impression. */
  .line--action{margin-top:1em; margin-left:var(--action-indent,0);}
  .line--character{margin-top:1em; font-weight:var(--char-weight,400); text-transform:uppercase; margin-left:var(--char-indent,0);}
  .line--parenthetical{font-style:italic; margin-left:var(--paren-indent,1.2cm); margin-right:2cm; color:#3a352c;}
  .line--dialogue{margin-left:var(--dlg-indent,1.2cm); margin-right:var(--dlg-right,1cm); max-width:var(--dlg-width,none);}
  /* Deux blocs de dialogue qui se suivent = une réplique en deux
     paragraphes (le seul cas où ça arrive) : ligne vide entre les deux. */
  .line--dialogue + .line--dialogue{margin-top:1em;}

  /* ---------- DIALOGUE SIMULTANÉ (dual dialogue) ----------
     Deux répliques qui se parlent EN MÊME TEMPS, côte à côte, comme dans
     WriterDuet et Final Draft. Le bloc entier (les deux colonnes) est un
     seul enfant de #page portant la classe .line : le moteur de
     pagination le mesure donc comme un bloc unique et ne coupe JAMAIS
     une colonne en deux — c'est exactement la règle du métier.
     Les colonnes reprennent les mêmes proportions que les logiciels du
     métier : nom du personnage centré au-dessus de sa colonne, réplique
     en dessous, les deux colonnes se partageant la largeur du texte. */
  .line--dual{
    display:flex; align-items:flex-start; gap:var(--dual-gap,1cm);
    margin:1.2em 0 0; padding:1px 3px; margin-left:-3px; margin-right:-3px;
  }
  .dual-col{flex:1 1 0; min-width:0;}
  .dual-col > .line{margin-left:0; margin-right:0; max-width:none;}
  .dual-col > .line--character{
    margin-top:0; margin-left:var(--dual-char-indent,1.2cm); margin-right:0;
  }
  .dual-col > .line--dialogue{margin-top:.25em; margin-left:0; margin-right:0;}
  .dual-col > .line--dialogue + .line--dialogue{margin-top:1em;}
  .dual-col > .line--parenthetical{
    margin-top:0; margin-left:var(--dual-paren-indent,.7cm); margin-right:0;
  }
  /* Le bloc étant lui-même une .line, le Mode Focus l'estomperait deux
     fois (le conteneur ET la réplique dedans) : on ne laisse agir que
     l'estompage des lignes réelles. */
  #page.focus-mode .line--dual{opacity:1;}
  .line--transition{text-transform:uppercase; text-align:var(--trans-align,right); margin-top:1.2em;}
  .line--shot{font-weight:var(--shot-weight,700); text-transform:uppercase; margin-top:1em; margin-left:0;}
  .line--text{margin-top:1em; margin-left:0;}
  /* ---------- CARTON : texte placé librement (carton de titre, d'époque, de fin…) ----------
     Tout le style vient de variables CSS posées sur la ligne par applyCardStyle() à partir
     de el.card (taille, alignement, largeur, police, gras/italique/majuscules, espacement)
     et de deux attributs (data-frame : cadre ; data-full : carton plein page, centré au
     milieu de la feuille). Les marges passent par des variables pour que la pagination,
     qui réécrit margin-top en ligne, puisse toujours revenir à la valeur de la classe. */
  /* v48 : MISE EN PAGE LIBRE d'une ligne (bouton « Aligner »). Fonctionne sur n'importe quel type de ligne (action,
     dialogue, scène…), sans passer par un carton. Les retraits se mesurent depuis les bords de la colonne de texte ;
     0 cm = exactement comme une ligne d'action. Les variables sont posées par applyLayoutStyle(). */
  .line[data-lay-a]{text-align:var(--lay-a);}
  .line[data-lay-l]{margin-left:var(--lay-l);}
  .line[data-lay-r]{margin-right:var(--lay-r);}
  .line[data-lay-l], .line[data-lay-r]{max-width:none; min-width:3cm;}
  .line--card{
    font-size:var(--card-size,22pt); line-height:1.35; text-align:var(--card-align,center);
    font-weight:var(--card-weight,700); font-style:var(--card-style,normal);
    text-transform:var(--card-case,uppercase); font-family:var(--card-font,var(--mono));
    width:var(--card-width,auto); margin-left:var(--card-ml,-3px); margin-right:var(--card-mr,-3px);
    margin-top:var(--card-sp,36pt); margin-bottom:var(--card-sp,36pt);
  }
  .line--card[data-frame="lines"]{border-top:1.5px solid currentColor; border-bottom:1.5px solid currentColor; padding:.4em 3px;}
  .line--card[data-frame="box"]{border:1.5px solid currentColor; padding:.5em .8em;}
  .line--card[data-frame="double"]{border:4px double currentColor; padding:.5em .8em;}
  .line--card[data-full="1"]{display:flex; flex-direction:column; justify-content:center; margin-top:0; margin-bottom:0;}
  .card-panel .cp-row{margin-bottom:12px;}
  .card-panel .cp-lbl{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:5px;}
  .card-panel .cp-seg{display:flex; flex-wrap:wrap; gap:4px;}
  .card-panel .cp-seg .btn{min-width:34px; justify-content:center;}
  .card-panel input[type=range]{width:100%;}
  .line--note{
    background:#DCEEFB; border-left:3px solid var(--accent-2); padding:6px 10px; font-style:italic; font-size:10.5pt;
    margin:8px 0; color:#14425E; font-family:var(--sans);
  }
  /* v49 : une note n'est jamais imprimée ni exportée, donc elle ne doit JAMAIS occuper de place dans la page.
     Elle flotte dans la marge de droite, à la hauteur où elle a été écrite : la pagination de l'éditeur est
     ainsi exactement celle de l'export. (Marge négative = boîte de marge de largeur nulle : aucun texte ne
     la contourne et aucune ligne n'est décalée.) */
  #page > .line--note{
    position:absolute; left:calc(100% - 58px); top:auto; width:24px; height:24px; margin:0; padding:0; overflow:hidden;
    font-size:0; line-height:0; box-sizing:border-box; z-index:3; cursor:pointer; border-radius:6px;
  }
  #page > .line--note:not(:hover):not(:focus)::before{
    content:'\270E'; display:block; font:14px/22px var(--sans); font-style:normal; text-align:center; color:#14425E;
  }
  /* survol / édition : la note se déplie par-dessus le texte (aucune place prise dans la page) */
  #page > .line--note:hover, #page > .line--note:focus{
    left:auto; right:12px; width:300px; height:auto; padding:6px 10px; overflow:visible; font-size:10.5pt; line-height:1.4;
    cursor:text; box-shadow:0 6px 18px -6px #0005; z-index:6;
  }
  /* Bloc coupé entre deux pages : un flottant pleine largeur, dont la forme (shape-outside)
     ne commence qu'à la ligne de coupe, repousse la suite du texte en haut de la feuille
     suivante SANS toucher au contenu éditable. */
  .line.is-split{display:flow-root;}
  .line.is-split::before{content:""; float:left; width:100%;
    height:calc(var(--sp-top,0px) + var(--sp-h,0px)); shape-outside:inset(var(--sp-top,0px) 0 0 0); pointer-events:none;}
  /* Coupe au milieu d'une ligne (juste après une fin de phrase) : le flotteur passe à droite et sa forme
     « mord » seulement sur la fin de la ligne de coupe, puis sur tout ce qui suit. */
  .line.is-split-mid::before{float:right; shape-outside:polygon(var(--sp-x,0px) var(--sp-y1,0px), 100% var(--sp-y1,0px), 100% 100%, 0 100%, 0 var(--sp-top,0px), var(--sp-x,0px) var(--sp-top,0px));}
  .pg-mark-lbl{position:absolute; font-family:var(--script-font,var(--mono)); font-size:12pt; line-height:1.5; color:var(--paper-ink,#111);
    text-transform:uppercase; white-space:pre; pointer-events:none; user-select:none;}
  /* Mention de continuité — (CONT'D)/(SUITE) — rendue en ::after à partir de
     data-contd. Elle n'appartient donc PAS au contenu éditable : le curseur
     ne peut pas entrer dedans, Retour arrière ne peut pas l'effacer, et elle
     ne remonte jamais dans el.text via textContent. */
  .line--character[data-contd]::after{ content:" " attr(data-contd); }
  /* Menu des extensions, ouvert en tapant « ( » après un nom de personnage. */
  .ext-menu{
    position:fixed; z-index:70; background:var(--surface); border:1px solid var(--hair);
    border-radius:var(--radius); box-shadow:0 10px 30px -10px #0005; padding:4px;
    max-height:260px; overflow:auto; min-width:250px; font-family:var(--sans);
  }
  .ext-item{
    display:block; width:100%; text-align:left; border:0; background:none; cursor:pointer;
    padding:6px 9px; border-radius:calc(var(--radius) - 2px); color:var(--ink); font-size:13px;
  }
  .ext-item .ext-code{font-family:var(--mono); font-weight:700;}
  .ext-item .ext-desc{display:block; font-size:11.5px; color:var(--ink-soft); margin-top:1px;}
  .ext-item.sel{background:var(--accent); color:#fff;}
  .ext-item.sel .ext-desc{color:#ffffffcc;}
  .ext-hint{font-size:11px; color:var(--ink-soft); padding:5px 9px 3px; border-top:1px solid var(--hair); margin-top:4px;}
  .type-badge{
    position:absolute; right:-1.55cm; top:0; font-family:var(--sans); font-size:9px; font-weight:700; text-transform:uppercase;
    letter-spacing:.03em; color:#00000000; width:1.4cm; -webkit-user-select:none; user-select:none;
  }
  .line:focus .type-badge{color:var(--accent);}
  /* Les variables de format sont posées sur le CONTENEUR (et non sur #page)
     pour que les feuilles, les numéros de page et les pages d'impression
     héritent exactement des mêmes marges que le texte. */
  .format-us{--page-w:8.5in; --page-h:11in; --pn-top:.5in;
    --pm-top:1in; --pm-bottom:1in; --pm-left:1.5in; --pm-right:1in;
    --char-indent:2.2in; --paren-indent:1.6in; --dlg-indent:1in; --dlg-width:3.5in; --dlg-right:auto;
    --dual-gap:.4in; --dual-char-indent:.6in; --dual-paren-indent:.3in;}
  .format-fr{--page-w:21cm; --page-h:29.7cm; --pn-top:1.2cm;
    --pm-top:2.5cm; --pm-bottom:2.5cm; --pm-left:calc(1.5in - 3px); --pm-right:calc(21cm - 7.5in);
    --char-indent:2in; --paren-indent:2.08in; --dlg-indent:1in; --dlg-width:calc(3.5in + 6px); --dlg-right:auto;
    --sn-gap:.544in;
    /* v46 : gabarit calé sur WriterDuet (A4) : texte de 1,5 po à 7,5 po (432 pt), personnage à 3,5 po, réplique à 2,5 po sur 3,5 po,
       didascalie à ≈3,58 po, numéro de scène à 0,75 po. Les 3 px retirés à la marge gauche compensent le padding des lignes. */
    --dual-gap:1cm; --dual-char-indent:1.3cm; --dual-paren-indent:.7cm;}
  .titlepage{
    width:var(--page-w,21cm); min-height:var(--page-h,29.7cm); background:var(--tp-bg,var(--paper)); box-shadow:0 1px 3px #0002; margin-bottom:24px;
    font-family:var(--tp-font,var(--mono)); color:var(--tp-color,var(--paper-ink));
    display:flex; flex-direction:column; align-items:var(--tp-align-items,center); justify-content:center;
    text-align:var(--tp-text-align,center); gap:6px; padding:3cm; position:relative; overflow:hidden;
    background-image:var(--tp-pattern-image,none); background-size:var(--tp-pattern-size,auto);
    -webkit-print-color-adjust:exact; print-color-adjust:exact; color-adjust:exact;
  }
  .titlepage .tp-bg-image{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:var(--tp-img-opacity,1); z-index:0;}
  .titlepage .tp-drawing-layer{position:absolute; inset:0; width:100%; height:100%; z-index:1; pointer-events:none;}
  /* Image libre de la page de titre : posée où l'on veut, à la taille voulue (valeurs en % de la page). */
  .titlepage .tp-title.tp-title-off{visibility:hidden;}
  .titlepage .tp-free-img{position:absolute; z-index:2; margin:0; padding:0; line-height:0; box-sizing:border-box;}
  .titlepage .tp-free-img > img{display:block; width:100%; height:100%; object-fit:fill; pointer-events:none; -webkit-user-drag:none; user-select:none;}
  .tp-editing .tp-free-img{cursor:move; touch-action:none; outline:2px solid transparent; outline-offset:0; transition:outline-color .12s;}
  .tp-editing .tp-free-img:hover{outline-color:#3699D470;}
  .tp-editing .tp-free-img.tp-sel{outline-color:var(--accent);}
  .tp-free-h{position:absolute; width:calc(13px * var(--tp-hs,1)); height:calc(13px * var(--tp-hs,1)); margin:calc(-6.5px * var(--tp-hs,1)); background:#fff; border:calc(2px * var(--tp-hs,1)) solid var(--accent); border-radius:50%; box-sizing:border-box; z-index:5; touch-action:none;}
  .tp-free-h[data-h="nw"]{left:0; top:0; cursor:nwse-resize;} .tp-free-h[data-h="ne"]{left:100%; top:0; cursor:nesw-resize;}
  .tp-free-h[data-h="sw"]{left:0; top:100%; cursor:nesw-resize;} .tp-free-h[data-h="se"]{left:100%; top:100%; cursor:nwse-resize;}
  .tp-free-h[data-h="n"]{left:50%; top:0; cursor:ns-resize; border-radius:3px;} .tp-free-h[data-h="s"]{left:50%; top:100%; cursor:ns-resize; border-radius:3px;}
  .tp-free-h[data-h="w"]{left:0; top:50%; cursor:ew-resize; border-radius:3px;} .tp-free-h[data-h="e"]{left:100%; top:50%; cursor:ew-resize; border-radius:3px;}
  .tp-drawing-on .tp-free-img{pointer-events:none;}
  .tp-checkrow{display:flex; align-items:center; gap:9px; font-size:13.5px; color:var(--ink); cursor:pointer; margin-top:10px;}
  .tp-checkrow input{accent-color:var(--accent); width:16px; height:16px;}
  .titlepage .tp-content{position:relative; z-index:2; display:flex; flex-direction:column; align-items:var(--tp-align-items,center); gap:6px; width:100%;}
  .titlepage .tp-title{font-size:var(--tp-title-size,20pt); font-weight:700; text-transform:uppercase; margin-bottom:30px;}
  .titlepage .tp-sub{font-size:var(--tp-sub-size,12pt); margin-bottom:60px;}
  .titlepage .tp-author{font-size:var(--tp-author-size,12pt);}
  .titlepage .tp-author-label{margin-bottom:4px;}
  .titlepage .tp-author-name{}
  .titlepage .tp-extra-wrap{display:flex; flex-direction:column; gap:5px; margin:16px 0 0;}
  .titlepage .tp-extra-line{font-size:var(--tp-sub-size,12pt); opacity:.85;}
  .titlepage .tp-foot{margin-top:auto; font-size:var(--tp-foot-size,10pt); opacity:.7;}
  /* v51 : chaque élément de la page de titre a sa propre police, taille, couleur, alignement, gras / italique / souligné.
     Sans réglage, chaque variable retombe sur la valeur d'avant : rendu strictement identique. */
  .titlepage .tp-title{font-family:var(--tp-title-font,inherit); font-weight:var(--tp-title-weight,700); font-style:var(--tp-title-style,inherit); text-decoration:var(--tp-title-deco,none); color:var(--tp-title-color,inherit); align-self:var(--tp-title-self,auto); text-align:var(--tp-title-ta,inherit);}
  .titlepage .tp-sub{font-family:var(--tp-sub-font,inherit); font-weight:var(--tp-sub-weight,inherit); font-style:var(--tp-sub-style,inherit); text-decoration:var(--tp-sub-deco,none); color:var(--tp-sub-color,inherit); align-self:var(--tp-sub-self,auto); text-align:var(--tp-sub-ta,inherit);}
  .titlepage .tp-author{align-self:var(--tp-author-box,auto);}
  .titlepage .tp-author-label{font-family:var(--tp-by-font,inherit); font-size:var(--tp-by-size,inherit); font-weight:var(--tp-by-weight,inherit); font-style:var(--tp-by-style,inherit); text-decoration:var(--tp-by-deco,none); color:var(--tp-by-color,inherit); text-align:var(--tp-by-ta,inherit);}
  .titlepage .tp-author-name{font-family:var(--tp-author-font,inherit); font-weight:var(--tp-author-weight,inherit); font-style:var(--tp-author-style,inherit); text-decoration:var(--tp-author-deco,none); color:var(--tp-author-color,inherit); text-align:var(--tp-author-ta,inherit);}
  .titlepage .tp-extra-wrap{align-self:var(--tp-extra-self,auto);}
  .titlepage .tp-extra-line{font-size:var(--tp-extra-size,var(--tp-sub-size,12pt)); font-family:var(--tp-extra-font,inherit); font-weight:var(--tp-extra-weight,inherit); font-style:var(--tp-extra-style,inherit); text-decoration:var(--tp-extra-deco,none); color:var(--tp-extra-color,inherit); text-align:var(--tp-extra-ta,inherit);}
  .titlepage .tp-foot{font-family:var(--tp-foot-font,inherit); font-weight:var(--tp-foot-weight,inherit); font-style:var(--tp-foot-style,inherit); text-decoration:var(--tp-foot-deco,none); color:var(--tp-foot-color,inherit); align-self:var(--tp-foot-self,auto); text-align:var(--tp-foot-ta,inherit);}

  /* ---------- TITLE PAGE DESIGN TAB ---------- */
  .tp-design-wrap{
    display:flex; gap:32px; padding:22px 24px 70px; align-items:flex-start; flex-wrap:wrap;
    max-width:1500px; margin:0 auto; justify-content:center;
  }
  .tp-preview-col{
    flex:none; position:sticky; top:18px; display:flex; flex-direction:column; align-items:center; gap:12px;
  }
  .tp-preview-mat{
    padding:26px 22px; border-radius:10px;
    background:
      radial-gradient(circle at 30% 20%, #0000000a, transparent 55%),
      var(--surface-soft);
    border:1px solid var(--hair);
  }
  .tp-preview-shell{
    width:14.3cm; height:20.2cm; overflow:hidden; position:relative; flex:none;
    box-shadow:0 1px 2px #0003, 0 24px 46px -20px #00000040; background:var(--surface);
  }
  .tp-preview-shell .titlepage{
    width:21cm; min-height:29.7cm; transform:scale(.68); transform-origin:top left; margin-bottom:0; box-shadow:none;
  }
  .tp-preview-caption{
    font-size:13px; color:var(--ink-soft); text-align:center; max-width:14.3cm; line-height:1.55;
  }
  .tp-preview-caption b{color:var(--ink); font-weight:600;}
  .tp-controls-col{
    flex:1 1 560px; min-width:300px; max-width:820px;
    display:grid; grid-template-columns:repeat(auto-fit, minmax(280px,1fr)); gap:18px; align-content:start;
  }
  .tp-panel{
    background:var(--surface); border:1px solid var(--hair); border-radius:10px; padding:18px 20px;
    box-shadow:0 1px 2px #00000008, 0 10px 24px -18px #00000030;
  }
  .tp-panel-head{
    display:flex; align-items:center; gap:10px; margin-bottom:10px; padding-bottom:10px;
    border-bottom:1px solid var(--hair);
  }
  .tp-panel-icon{
    width:26px; height:26px; border-radius:7px; background:#3699D41a; color:var(--accent-2);
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .tp-panel-icon svg{width:14px; height:14px;}
  .tp-panel-icon.tp-mono{font-family:var(--mono); font-size:12px; font-weight:700; background:#3699D41a; color:var(--accent-2);}
  .tp-panel-head h4{margin:0; font-size:14.5px; font-weight:700; color:var(--ink);}
  .tp-field{padding:14px 0;}
  .tp-field:first-of-type{padding-top:10px;}
  .tp-field + .tp-field{border-top:1px solid var(--hair);}
  .tp-field-label{font-size:13.5px; font-weight:600; color:var(--ink-soft); margin-bottom:7px; display:block;}
  .tp-field-help{font-size:13px; color:var(--ink-soft); margin:6px 0 0; line-height:1.5;}
  /* Onglet Paramètres : mêmes tailles que l'onglet Page de titre
     (.tp-field-label / .tp-field-help ci-dessus) pour une lecture
     uniforme d'un onglet à l'autre — libellés à case à cocher un peu
     plus grands, paragraphes d'explication remontés au même corps que
     le reste de la D.A., avec le même interlignage confortable. */
  .panel-block .opt-label{display:flex; gap:8px; align-items:center; font-size:13.5px; font-weight:600; color:var(--ink); margin-bottom:10px;}
  .panel-block .opt-help{font-size:13px; color:var(--ink-soft); margin:0; line-height:1.5;}
  .tp-field input[type=text], .tp-field textarea{
    width:100%; box-sizing:border-box; padding:9px 10px; border:1px solid var(--hair); border-radius:var(--radius);
    font-size:14.5px; background:var(--surface-soft); color:var(--ink); resize:vertical;
  }
  .tp-field input[type=text]:focus, .tp-field textarea:focus{outline:none; border-color:var(--accent);}
  .tp-swatches{display:flex; gap:8px; flex-wrap:wrap; margin-top:4px;}
  .tp-swatch{
    width:23px; height:23px; border-radius:50%; border:1.5px solid #0000001a; cursor:pointer; padding:0; flex:none;
  }
  .tp-swatch.active{box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--accent);}
  .tp-color-row{display:flex; align-items:center; gap:10px;}
  .tp-color-row input[type=color]{width:34px; height:28px; border:1px solid var(--hair); border-radius:6px; padding:2px; background:var(--surface);}
  .tp-range-row{display:flex; align-items:center; gap:10px;}
  .tp-range-row + .tp-range-row{margin-top:9px;}
  .tp-range-row label{width:82px; font-size:13px; color:var(--ink-soft); flex:none;}
  .tp-range-row input[type=range]{flex:1; accent-color:var(--accent);}
  .tp-range-row .val{font-size:12.5px; color:var(--ink-soft); width:42px; text-align:right; flex:none;}
  .tp-font-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .tp-font-opt{
    border:1.5px solid var(--hair); border-radius:8px; padding:10px 8px; cursor:pointer; text-align:center; font-size:14px; background:var(--surface-soft);
    transition:border-color .12s, background .12s;
  }
  .tp-font-opt:hover{border-color:#3699D466;}
  .tp-font-opt.active{border-color:var(--accent); background:#3699D414;}
  .tp-pattern-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
  .tp-pattern-opt{
    border:1.5px solid var(--hair); border-radius:8px; padding:8px 4px; cursor:pointer; text-align:center; font-size:12.5px; background:var(--surface-soft);
    transition:border-color .12s, background .12s;
  }
  .tp-pattern-opt:hover{border-color:#3699D466;}
  .tp-pattern-opt.active{border-color:var(--accent); background:#3699D414;}
  .tp-pattern-swatch{width:100%; height:26px; border-radius:5px; margin-bottom:5px; border:1px solid var(--hair);}
  .tp-align-choice{display:flex; gap:8px;}
  .tp-align-opt{
    flex:1; border:1.5px solid var(--hair); border-radius:8px; padding:9px 8px; text-align:center; font-size:13.5px; cursor:pointer;
    background:var(--surface-soft); transition:border-color .12s, background .12s; color:var(--ink);
  }
  .tp-align-opt:hover{border-color:#3699D466;}
  .tp-align-opt.active{border-color:var(--accent); background:#3699D414; color:var(--accent-2); font-weight:600;}
  .tp-draw-toolbar{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .tp-draw-toolbar + .tp-draw-toolbar{margin-top:10px;}
  .tp-pen-size{width:18px; height:18px; border-radius:50%; border:1.5px solid var(--hair); background:var(--surface); cursor:pointer; padding:0;}
  .tp-pen-size.active{border-color:var(--accent); box-shadow:0 0 0 2px #3699D433;}
  /* v51 : section Page de titre façon WriterDuet × Apple — barre d'outils flottante au-dessus d'une page qu'on édite directement. */
  .tp-tb-wrap{position:sticky; top:8px; z-index:45; display:flex; justify-content:center; padding:10px 24px 0; pointer-events:none;}
  .tp-tb{pointer-events:auto; display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:3px; padding:6px 8px; max-width:100%;
    border-radius:14px; background:var(--surface); background:color-mix(in srgb, var(--surface) 84%, transparent);
    -webkit-backdrop-filter:saturate(180%) blur(18px); backdrop-filter:saturate(180%) blur(18px);
    border:1px solid var(--hair); box-shadow:0 1px 2px #0000000d, 0 14px 34px -14px #00000052; font-family:var(--sans);}
  .tp-tb-chip{font-size:12px; font-weight:600; color:var(--accent-2); background:#3699D41a; border-radius:8px; padding:6px 11px; margin-right:3px; white-space:nowrap;}
  .tp-tb-sep{width:1px; height:22px; background:var(--hair); margin:0 6px; flex:none;}
  .tp-tb-btn{height:32px; min-width:32px; padding:0 8px; border:0; background:transparent; border-radius:8px; cursor:pointer; color:var(--ink); display:inline-flex; align-items:center; justify-content:center; gap:6px; font-size:14px; font-family:var(--sans); line-height:1; transition:background .1s;}
  .tp-tb-btn:hover{background:#3699D414;}
  .tp-tb-btn.on{background:#3699D424; color:var(--accent-2);}
  .tp-tb-btn.txt{font-size:13px; color:var(--ink-soft);}
  .tp-tb-btn svg{display:block;}
  .tp-tb-font{width:190px; justify-content:space-between; border:1px solid var(--hair); background:var(--surface-soft); padding:0 10px;}
  .tp-tb-font.open{border-color:var(--accent);}
  .tp-tb-size{display:inline-flex; align-items:center; border:1px solid var(--hair); border-radius:8px; background:var(--surface-soft);}
  .tp-tb-size .tp-tb-btn{height:30px; min-width:28px; padding:0; font-size:16px; color:var(--ink-soft);}
  .tp-tb-size input{width:36px; height:30px; border:0; background:transparent; text-align:center; font-size:14px; color:var(--ink); font-family:var(--sans); font-variant-numeric:tabular-nums; padding:0; outline:none;}
  .tp-tb-fmt{width:32px; font-size:15px;}
  .tp-tb-dot{width:18px; height:18px; border-radius:50%; border:1.5px solid #00000030; box-shadow:inset 0 0 0 2px var(--surface); flex:none;}
  .tp-col-wrap{position:relative;}
  .tp-tb-pop{position:absolute; z-index:70; right:0; top:calc(100% + 8px); width:222px; padding:12px; background:var(--surface); border:1px solid var(--hair); border-radius:12px; box-shadow:0 18px 44px -14px #00000066;}
  .tp-tb-swatches{display:grid; grid-template-columns:repeat(6,1fr); gap:8px;}
  .tp-tb-swatches .tp-swatch{width:24px; height:24px;}
  .tp-tb-pop-row{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:12px; padding-top:10px; border-top:1px solid var(--hair); font-size:13px; color:var(--ink-soft); font-family:var(--sans);}
  .tp-tb-pop-row input[type=color]{width:38px; height:28px; border:1px solid var(--hair); border-radius:6px; padding:2px; background:var(--surface);}
  .tp-tb-auto{border:1px solid var(--hair); background:var(--surface-soft); color:var(--ink); border-radius:8px; padding:5px 10px; font-size:12.5px; cursor:pointer; font-family:var(--sans);}
  .tp-tb-auto:hover{border-color:#3699D466;}
  .tp-preview-col{top:84px;}
  .tp-controls-col{flex:1 1 300px; min-width:280px;}
  .tp-preview-shell{width:15.5cm; height:21.9cm;}
  .tp-preview-shell .titlepage{transform:scale(.738);}
  .tp-preview-caption{max-width:15.5cm;}
  .tp-preview-shell.tp-page-sel{box-shadow:0 0 0 3px var(--accent), 0 24px 46px -20px #00000040;}
  .tp-editing [data-tpk]{outline:2px solid transparent; outline-offset:6px; border-radius:2px; transition:outline-color .12s; cursor:text;}
  .tp-editing [data-tpk="sub"], .tp-editing [data-tpk="by"], .tp-editing [data-tpk="foot"]{cursor:pointer;}
  .tp-editing [data-tpk]:hover{outline-color:#3699D470;}
  .tp-editing [data-tpk].tp-sel, .tp-editing [data-tpk]:focus{outline-color:var(--accent);}
  .tp-editing [data-tpk][contenteditable]:focus{outline-color:var(--accent);}
  .tp-editing .tp-extra-wrap:empty{min-height:1.5em; min-width:9em;}
  .tp-editing .tp-extra-wrap:empty::before, .tp-editing .tp-author-name:empty::before{content:attr(data-ph); opacity:.32;}
  .tp-editing .tp-author-name:empty{min-width:7em; min-height:1.3em;}
  .tp-editing .tp-ph-grp{opacity:.4;}
  /* menu de polices : chaque nom est écrit dans sa propre police */
  .tp-fm-wrap{position:relative;}
  .tp-fm-name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; font-size:15px;}
  .tp-fm-caret{flex:none; font-size:10px; color:var(--ink-soft); font-family:var(--sans);}
  .tp-fm-pop{position:absolute; z-index:70; left:0; top:calc(100% + 8px); width:310px; max-width:calc(100vw - 24px); max-height:400px; display:flex; flex-direction:column; overflow:hidden;
    background:var(--surface); border:1px solid var(--hair); border-radius:12px; box-shadow:0 18px 44px -14px #00000066;}
  .tp-fm-search{margin:10px 10px 8px; padding:8px 10px; border:1px solid var(--hair); border-radius:8px; background:var(--surface-soft); color:var(--ink); font-size:14px; font-family:var(--sans); box-sizing:border-box; width:calc(100% - 20px);}
  .tp-fm-search:focus{outline:none; border-color:var(--accent);}
  .tp-fm-cats{display:flex; flex-wrap:wrap; gap:5px; padding:0 10px 9px;}
  .tp-fm-cat{font-family:var(--sans); font-size:12px; padding:4px 9px; border:1px solid var(--hair); border-radius:99px; cursor:pointer; background:var(--surface-soft); color:var(--ink-soft);}
  .tp-fm-cat.active{border-color:var(--accent); color:var(--accent-2); background:#3699D414; font-weight:600;}
  .tp-fm-list{overflow-y:auto; flex:1; padding:0 5px 6px; border-top:1px solid var(--hair);}
  .tp-fm-grp{position:sticky; top:0; z-index:1; font-family:var(--sans); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); padding:9px 10px 4px; background:var(--surface);}
  .tp-fm-item{display:flex; align-items:baseline; justify-content:space-between; gap:8px; padding:7px 10px; border-radius:7px; cursor:pointer; font-size:17px; line-height:1.25; color:var(--ink); content-visibility:auto; contain-intrinsic-size:auto 34px;}
  .tp-fm-item:hover{background:#3699D40f;}
  .tp-fm-item.active{background:#3699D41f; color:var(--accent-2);}
  .tp-fm-item small{font-family:var(--sans); font-size:11px; color:var(--ink-soft); flex:none;}
  .tp-fm-item.follow{font-family:var(--sans); font-size:13.5px; color:var(--ink-soft);}
  .tp-fm-empty{font-family:var(--sans); font-size:13px; color:var(--ink-soft); padding:14px 10px; text-align:center;}
  /* v52 : section Page de titre plus compacte et plus claire — page ajustée à l'écran, éléments à choisir en un clic,
     réglages rangés en onglets, menu de polices qui reste ouvert (favoris, récentes, recherche, flèches du clavier). */
  .tp-tb-wrap{flex-direction:column; align-items:center; gap:8px; padding:8px 24px 0;}
  .tp-tb{flex-wrap:nowrap; gap:2px;}
  @media (max-width:980px){ .tp-tb{flex-wrap:wrap; justify-content:center;} }
  .tp-tb-font{width:178px;}
  .tp-tb-btn[disabled]{opacity:.36; cursor:default;}
  .tp-tb-btn[disabled]:hover{background:transparent;}
  .tp-tb-size input:disabled{opacity:.36;}
  .tp-pills{pointer-events:auto; display:flex; align-items:center; flex-wrap:wrap; justify-content:center; gap:6px; max-width:100%; font-family:var(--sans);}
  .tp-pills-lbl{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-soft); margin-right:3px;}
  .tp-pill{font-family:var(--sans); font-size:12.5px; line-height:1; padding:7px 12px; border-radius:99px; border:1px solid var(--hair); background:var(--surface); color:var(--ink-soft); cursor:pointer; transition:border-color .12s, color .12s, background .12s;}
  .tp-pill:hover{border-color:#3699D466; color:var(--ink);}
  .tp-pill.on{border-color:var(--accent); background:#3699D41f; color:var(--accent-2); font-weight:600;}
  .tp-design-wrap{gap:30px; padding:14px 24px 60px; max-width:1100px; align-items:flex-start;}
  .tp-preview-col{top:calc(var(--tp-head-h,118px) + 14px); gap:9px;}
  .tp-preview-mat{padding:12px;}
  .tp-preview-shell{width:11cm; height:15.5cm;}
  .tp-preview-shell .titlepage{transform:scale(.52);}
  .tp-preview-caption{font-size:12.5px;}
  .tp-controls-col{display:block; flex:1 1 380px; min-width:300px; max-width:520px;}
  .tp-seg{display:flex; gap:2px; padding:3px; margin-bottom:14px; background:var(--surface-soft); border:1px solid var(--hair); border-radius:10px;}
  .tp-seg-b{flex:1; display:inline-flex; align-items:center; justify-content:center; gap:7px; height:32px; border:0; border-radius:8px; background:transparent; color:var(--ink-soft); font-family:var(--sans); font-size:13px; font-weight:600; cursor:pointer;}
  .tp-seg-b svg{width:15px; height:15px; flex:none;}
  .tp-seg-b:hover{color:var(--ink);}
  .tp-seg-b.on{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px #0000001a, 0 0 0 1px var(--hair);}
  .tp-panes > .tp-panel{display:none;}
  .tp-panes[data-pane="content"] > .tp-panel:nth-child(1), .tp-panes[data-pane="bg"] > .tp-panel:nth-child(2), .tp-panes[data-pane="draw"] > .tp-panel:nth-child(3){display:block;}
  .tp-controls-col .tp-panel-head{display:none;}
  .tp-tip{margin:0 0 4px; padding:10px 12px; font-size:13px; line-height:1.5; color:var(--ink-soft); background:#3699D40d; border:1px solid #3699D426; border-radius:8px;}
  .tp-fm-pop{width:360px; max-height:min(480px, calc(100vh - 190px));}
  .tp-fm-list{position:relative;}
  .tp-fm-cat i{font-style:normal; font-size:10.5px; opacity:.6; margin-left:5px;}
  .tp-fm-item{align-items:center; padding:6px 6px 6px 10px;}
  .tp-fm-nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .tp-fm-item.active .tp-fm-nm::after{content:" ✓"; font-family:var(--sans); font-size:12px; color:var(--accent-2);}
  .tp-fm-item.kb{background:#3699D41a; box-shadow:inset 0 0 0 1.5px #3699D455;}
  .tp-fm-star{flex:none; border:0; background:transparent; cursor:pointer; font-family:var(--sans); font-size:15px; line-height:1; padding:4px 5px; border-radius:6px; color:var(--ink-soft); opacity:0; transition:opacity .1s;}
  .tp-fm-item:hover .tp-fm-star, .tp-fm-item.kb .tp-fm-star, .tp-fm-star.on{opacity:1;}
  .tp-fm-star.on{color:#D9A521;}
  .tp-fm-star:hover{background:#3699D41a;}
  @media (hover:none){ .tp-fm-star{opacity:.65;} }
  .tp-fm-foot{flex:none; display:flex; gap:14px; padding:7px 12px; border-top:1px solid var(--hair); background:var(--surface-soft); font-family:var(--sans); font-size:11.5px; color:var(--ink-soft);}
  /* v52b : section de la hauteur de l'écran, sans défilement de page ; seul le panneau de droite défile au besoin. */
  .tp-root{display:flex; flex-direction:column; min-height:0;}
  .tp-root > .cards-toolbar, .tp-root > .tp-tb-wrap{flex:none;}
  .tp-tb-wrap{position:relative; top:auto; z-index:45;}
  .tp-design-wrap{flex:1 1 0; min-height:0; align-items:stretch; padding:14px 24px 16px; flex-wrap:nowrap;}
  .tp-preview-col{position:static; align-self:flex-start;}
  .tp-controls-col{min-height:0; overflow-y:auto; align-self:stretch; padding-right:4px;}
  @media (max-width:820px){ .tp-root{height:auto !important;} .tp-design-wrap{flex-wrap:wrap; flex:none;} .tp-controls-col{overflow:visible;} }
  /* v54 : section remontée, moins de vide autour, page de titre seule en plein écran. */
  .tp-root > .cards-toolbar{padding:8px 24px 0;}
  .tp-root .pane-title{padding-bottom:5px; margin-bottom:6px;}
  .tp-hd-r{display:flex; align-items:center; gap:14px;}
  .tp-tb-wrap{padding:2px 24px 0; gap:6px;}
  .tp-design-wrap{max-width:1380px; gap:22px; padding:8px 24px 12px;}
  .tp-preview-mat{padding:10px;}
  .tp-controls-col{flex:1 1 420px; max-width:760px;}
  .tp-fs{position:fixed; inset:0; z-index:10000; display:flex; align-items:center; justify-content:center; background:var(--backdrop,#e9edf2);}
  .tp-fs-page{position:relative; flex:none; overflow:hidden; background:#fff; box-shadow:0 30px 80px -24px #00000066, 0 2px 6px #00000026;}
  .tp-fs-exit{position:fixed; top:14px; right:14px; z-index:2; display:inline-flex; align-items:center; gap:6px; padding:9px 15px; border-radius:10px; border:1px solid var(--hair); background:var(--surface); color:var(--ink); font-family:var(--sans); font-size:13px; font-weight:600; cursor:pointer; box-shadow:0 8px 24px -10px #00000055;}
  .tp-fs-exit:hover{border-color:var(--accent); color:var(--accent-2);}
  #tpDrawCanvas{position:absolute; inset:0; width:100%; height:100%; z-index:3; cursor:crosshair;}
  @media (max-width:820px){ .tp-preview-col{position:static;} }

  /* v55 : légende de l'aperçu sous la page, titre de section redescendu, clic hors du texte = page / désélection. */
  .tp-root .pane-title{position:relative; top:19px;}
  .tp-preview-col{align-items:center;}
  .tp-preview-caption{max-width:none !important; width:100%; box-sizing:border-box; display:flex; flex-direction:column; align-items:center; gap:1px; margin:1px 0 0; padding:0 4px; font-size:12px; line-height:1.4; text-align:center;}
  .tp-preview-caption > span{display:block; white-space:nowrap;}
  .tp-preview-caption > span + span{font-size:11.5px; opacity:.85;}

  /* v57 : accueil — petites scènes de tournage animées dans les marges (zone morte), derrière rien : le contenu reste exactement comme avant. */
  #homeView{position:relative;}
  #homeView .wd-set{display:none; position:absolute; left:0; right:0; top:60px; bottom:0; pointer-events:none; overflow:hidden; color:var(--ink-soft);}
  @media (min-width:1500px){
    #homeView .wd-set{display:block;}
    #homeView .wd-set-col{position:absolute; top:0; bottom:0; width:calc((100% - 1180px) / 2); display:flex; flex-direction:column; justify-content:space-around; align-items:center; padding:34px 0 34px;}
    #homeView .wd-set-l{left:0; padding-left:62px; padding-right:16px;}
    #homeView .wd-set-r{right:0; padding-right:62px; padding-left:16px;}
  }
  #homeView .wd-set svg{display:block; width:100%; max-width:124px; height:auto; overflow:visible; opacity:.62;}
  #homeView .wd-set .st{fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
  #homeView .wd-set .ac{stroke:var(--accent);}
  #homeView .wd-set .fl{fill:var(--accent); stroke:none;}
  #homeView .wd-set text{fill:currentColor; stroke:none; font-family:var(--sans); font-weight:700; letter-spacing:.04em;}
  /* pellicule qui défile sur le bord extérieur */
  #homeView .wd-strip{position:absolute; top:0; bottom:0; width:30px; opacity:.5;
    background:
      repeating-linear-gradient(180deg, transparent 0 9px, var(--backdrop) 9px 17px) 4px 0/6px 100% no-repeat,
      repeating-linear-gradient(180deg, transparent 0 9px, var(--backdrop) 9px 17px) 20px 0/6px 100% no-repeat,
      var(--hair);
    border-radius:3px; animation:wdStrip 2.6s linear infinite;
    -webkit-mask-image:linear-gradient(180deg, transparent, #000 12%, #000 88%, transparent); mask-image:linear-gradient(180deg, transparent, #000 12%, #000 88%, transparent);}
  #homeView .wd-set-l .wd-strip{left:18px;}
  #homeView .wd-set-r .wd-strip{right:18px;}
  #homeView .wd-strip::after{content:''; position:absolute; inset:0 9px; background:repeating-linear-gradient(180deg, transparent 0 40px, var(--surface) 40px 42px); opacity:.9;}
  @keyframes wdStrip{to{background-position-y:17px,17px,0;}}
  #homeView .wd-set .fs{fill:var(--surface);}
  #homeView .wd-set .sh{fill:currentColor; stroke:none; opacity:.1;}
  #homeView .wd-set svg{stroke-width:1.75;}
  #homeView .wd-set .st{stroke-width:1.75;}
  #homeView .wd-set .fl2{fill:var(--accent); stroke:none; opacity:.9;}
  /* claquette */
  #homeView .wd-clap{transform-origin:14px 43px; animation:wdClap 6s cubic-bezier(.45,0,.2,1) infinite;}
  @keyframes wdClap{0%,62%{transform:rotate(-26deg);} 70%{transform:rotate(0);} 73%{transform:rotate(-5deg);} 77%,88%{transform:rotate(0);} 96%,100%{transform:rotate(-26deg);}}
  /* caméra : bobines, voyant REC et halo */
  #homeView .wd-reel{transform-box:fill-box; transform-origin:center; animation:wdSpin 3.6s linear infinite;}
  #homeView .wd-reel.r2{animation-duration:2.7s; animation-direction:reverse;}
  @keyframes wdSpin{to{transform:rotate(360deg);}}
  #homeView .wd-rec{fill:#E5484D; stroke:none; animation:wdRec 1.8s ease-in-out infinite;}
  #homeView .wd-rec-h{fill:#E5484D; stroke:none; transform-box:fill-box; transform-origin:center; animation:wdRecH 1.8s ease-out infinite;}
  @keyframes wdRec{0%,50%{opacity:1;} 62%,100%{opacity:.25;}}
  @keyframes wdRecH{0%{transform:scale(.6); opacity:.35;} 60%,100%{transform:scale(1.9); opacity:0;}}
  /* projecteur : le faisceau balaie doucement */
  #homeView .wd-lamp{transform-origin:30px 38px; animation:wdLamp 8s ease-in-out infinite;}
  @keyframes wdLamp{0%,100%{transform:rotate(-10deg);} 50%{transform:rotate(9deg);}}
  #homeView .wd-beam-i{animation:wdBeamO 8s ease-in-out infinite;}
  @keyframes wdBeamO{0%,100%{opacity:.7;} 50%{opacity:1;}}
  /* perche micro */
  #homeView .wd-boom{transform-origin:24px 100px; animation:wdBoom 7s ease-in-out infinite;}
  @keyframes wdBoom{0%,100%{transform:rotate(-3.5deg);} 50%{transform:rotate(4deg);}}
  /* « Action ! » */
  #homeView .wd-act{transform-origin:70px 34px; animation:wdAct 7s cubic-bezier(.3,.9,.3,1.2) infinite;}
  @keyframes wdAct{0%,8%{opacity:0; transform:scale(.4);} 14%{opacity:1; transform:scale(1.06);} 18%,38%{opacity:1; transform:scale(1);} 46%,100%{opacity:0; transform:scale(.92);}}
  /* bobine de film : elle tourne, la pellicule défile */
  #homeView .wd-spool{transform-box:fill-box; transform-origin:center; animation:wdSpin 14s linear infinite;}
  #homeView .wd-tail{animation:wdTail 1.4s linear infinite;}
  @keyframes wdTail{to{stroke-dashoffset:-10.5;}}
  @media (prefers-reduced-motion:reduce){ #homeView .wd-set *{animation:none !important;} #homeView .wd-act{opacity:1 !important;} }

  /* ---------- CARDS ---------- */
  .cards-toolbar{display:flex; align-items:center; justify-content:space-between; padding:16px 24px 0;}
  .cards-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; padding:16px 24px 60px;}
  .card{
    background:var(--surface); border:1px solid var(--hair); border-left:3px solid var(--sc-color,var(--hair)); border-radius:2px; padding:12px 13px 12px 11px; cursor:grab;
    display:flex; flex-direction:column; gap:6px; transition:border-left-color .12s, background .12s;
  }
  .card:not([style*="--sc-color"]):hover{border-left-color:var(--accent-2);}
  .card:hover{background:var(--surface-soft);}
  .card.dragging{opacity:.35; transform:scale(.97);}
  /* Tableau de cartes : repère d'insertion, atterrissage, focus clavier */
  .card{position:relative;}
  .card:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .cards-hint{padding:6px 24px 0; font-size:12.5px; color:var(--ink-soft);}
  .card.drop-before::before, .card.drop-after::after{
    content:''; position:absolute; top:-3px; bottom:-3px; width:4px; background:var(--accent); border-radius:2px; pointer-events:none;}
  .card.drop-before::before{left:-9px;}
  .card.drop-after::after{right:-9px;}
  .card.drop-h.drop-before::before, .card.drop-h.drop-after::after{left:-3px; right:-3px; width:auto; height:4px; top:auto; bottom:auto;}
  .card.drop-h.drop-before::before{top:-9px;}
  .card.drop-h.drop-after::after{bottom:-9px;}
  @keyframes cardLanded{from{box-shadow:0 0 0 3px var(--accent);} to{box-shadow:0 0 0 0 transparent;}}
  .card.just-moved{animation:cardLanded .9s ease-out;}
  @media (prefers-reduced-motion:reduce){ .card.just-moved{animation:none;} .card.dragging{transform:none;} }
  .card-head{display:flex; align-items:baseline; gap:8px;}
  /* Longueur de scène en huitièmes de page — volontairement discrète : on la
     consulte en balayant la vue, elle ne doit pas concurrencer le titre. */
  .scene-len{margin-left:auto; flex:none; font-family:var(--display); font-size:11.5px;
    color:var(--ink-soft); background:var(--hair); border-radius:20px; padding:2px 8px; white-space:nowrap;}
  .flat-row-head .flat-row-title{flex:1 1 auto; min-width:0;}
  .flat-row-head .scene-len{margin-left:0;}
  .card-num{font-family:var(--display); font-weight:700; color:var(--accent); font-size:13px;}
  .card-heading{font-family:var(--mono); font-weight:700; font-size:12.5px; text-transform:uppercase; line-height:1.35;}
  .card-syn{font-size:13.5px; color:var(--ink-soft); line-height:1.4; min-height:32px;}
